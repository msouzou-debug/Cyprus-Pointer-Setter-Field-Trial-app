const COUNTRY = Object.fromEntries(COUNTRIES.map(c=>[c[0], {name:c[1], dial:c[2]}]));
const HOME_COUNTRY = "CY";
/* Η γλώσσα λέει και από πού είναι, τις περισσότερες φορές. Ένας Ιταλός κριτής που
   γυρίζει την εφαρμογή στα ιταλικά και καταχωρεί σκύλο δεν θέλει να διορθώνει
   κάθε φορά «Κύπρος +357» σε «Ιταλία +39». Τα αγγλικά μένουν στην Κύπρο: είναι
   η γλώσσα των επισκεπτών κάθε εθνικότητας, όχι μιας χώρας, και η λέσχη είναι
   κυπριακή. Αυτό ορίζει μόνο την ΠΡΟΕΠΙΛΟΓΗ — αλλάζει με ένα πάτημα. */
const LANG_COUNTRY = { el:"CY", en:"CY", fr:"FR", de:"DE", it:"IT", es:"ES" };
/* Η σημαία δεν είναι πίνακας που συντηρούμε: βγαίνει από τον ίδιο τον κωδικό,
   δύο γράμματα σε δύο regional indicators. Κρατάμε και τα γράμματα δίπλα της
   επίτηδες — σε Windows, σε ασπρόμαυρη φωτοτυπία και σε παλιό τηλέφωνο η
   σημαία μπορεί να μη βγει, τα «IT» βγαίνουν πάντα. */
const flagOf = c => /^[A-Za-z]{2}$/.test(c || "")
  ? String.fromCodePoint(...[...c.toUpperCase()].map(ch => 0x1F1E6 + ch.charCodeAt(0) - 65))
  : "";
const natTag = c => c ? (flagOf(c) + " " + String(c).toUpperCase()).trim() : "";
const defaultCountry = () =>
  LANG_COUNTRY[(DB && DB.settings && DB.settings.lang) || "el"] || HOME_COUNTRY;
/* Τα ονόματα των χωρών δεν μεταφράζονται εδώ. Ο ίδιος ο περιηγητής κουβαλάει το
   CLDR — τον κατάλογο που χρησιμοποιούν λειτουργικά συστήματα και πρότυπα — και
   το Intl.DisplayNames δίνει το επίσημο όνομα σε κάθε γλώσσα. Καμία εικασία, και
   μηδέν επιπλέον βάρος στο αρχείο. Αν λείπει, μένει το ελληνικό της λέσχης. */
let DNAMES = {};
function countryName(c){
  const g = (COUNTRY[c]||{}).name || "";
  const L = (DB && DB.settings && DB.settings.lang) || "el";
  if(L === "el" || !c) return g;
  try{
    if(!DNAMES[L]) DNAMES[L] = new Intl.DisplayNames([L], {type:"region"});
    return DNAMES[L].of(c) || g;
  }catch(e){ return g; }
}
const dialOf       = c => (COUNTRY[c]||{}).dial || "";
/* Most of Europe drops a leading 0 when the number is dialled from abroad.
   Ιταλία does not — +39 06 … keeps it — so it is the one exception here. */
const KEEP_LEADING_0 = { IT:1 };

/* Whatever the sheet wrote in its χώρα column — «Ιταλία», «Italy», «ITA», «IT» —
   comes back as an ISO code, or as "" when it is nothing recognisable. Built once. */
const cKey = x => String(x||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
let COUNTRY_LOOKUP = null;
function countryLookup(){
  if(COUNTRY_LOOKUP) return COUNTRY_LOOKUP;
  const m = {}, put = (k, code)=>{ const key = cKey(k); if(key && !m[key]) m[key] = code; };
  COUNTRIES.forEach(([code, name])=>{
    put(code, code); put(name, code);
    (COUNTRY_ALIAS[code]||"").split(" ").forEach(w=>put(w, code));
  });
  return (COUNTRY_LOOKUP = m);
}
function normCountry(v){
  const L = countryLookup();
  const k = cKey(String(v||"").replace(/[().,\-–]/g," "));
  if(!k) return "";
  if(L[k]) return L[k];
  /* «Italy (ITA)» and «Ιταλία - ITA» both arrive as two words; try each */
  const hit = k.split(/\s+/).map(w=>L[w]).find(Boolean);
  return hit || "";
}

/* The register holds numbers the way they were written down — "00 357 99 677210",
   "99 314100", "99695551" all appear in the club's own list, and an Italian entry
   writes "347 1234567". sms: forgives that; wa.me and viber:// do not, they want
   E.164 and nothing else. The country on the record supplies the missing code.
   Normalise on the way out only: what the μητρώο stores stays as it was typed. */
function phoneE164(p, country){
  let n = phoneClean(p).replace(/(?!^)\+/g, "");
  if(!n) return "";
  if(n.slice(0,2) === "00") n = "+" + n.slice(2);
  if(n.charAt(0) === "+") return n;                  /* ήδη διεθνής */
  const d = dialOf(country);
  if(d){
    if(n.indexOf(d) === 0 && n.length > d.length + 4) return "+" + n;  /* γραμμένος με τον κωδικό */
    if(n.charAt(0) === "0" && !KEEP_LEADING_0[country]) n = n.slice(1);
    return "+" + d + n;
  }
  /* χωρίς χώρα στην καρτέλα: ό,τι ίσχυε πριν — οκτώ ψηφία είναι Κύπρος */
  if(/^357\d{8}$/.test(n)) return "+" + n;
  if(/^\d{8}$/.test(n))    return "+" + dialOf(HOME_COUNTRY) + n;
  return n.length >= 10 ? "+" + n : n;
}
/* A laptop has no messaging app, so an sms: link does nothing and silently
   marks the message sent. The screen offers WhatsApp Web and the clipboard
   there instead, and says why. */
function onPhone(){ return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
  || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform)); }

/* seeded PRNG — the draw must be reproducible from its seed */
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffled(arr, rnd){ const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- 4. Points ---------------------------------------------------- */
function scoreKey(res){ if(!res) return "-"; return (res.award && res.award!=="-") ? res.award : (res.qual||"-"); }
function coefficient(t){
  const brace = t.format === "ΖΕΥΓΗ";
  const wildRelevant = t.wild && (t.type==="Έρευνας Κυνηγίου" || t.type==="Πρακτικού Κυνηγίου");
  if(wildRelevant) return brace ? 4 : 3;   // (2+2) / (2+1)
  return brace ? 2 : 1;
}
function pointsFor(t, res){
  const base = DB.settings.points[scoreKey(res)] ?? 0;
  return base * coefficient(t);
}

/* ---------- 5. Draw engine ---------------------------------------------- */
/* Hard constraints:  H1 same handler never braced · H2 judge never judges his own
   dog's terrain (Άρθρο 49) · H3 Derby breed group · H4 one run per dog per day   */
function judgeConflict(terrain, entry, trial){
  const dog = dogById(entry.dogId) || {};
  return terrain.judgeIds.some(jid=>{
    const j = judById(jid); if(!j) return false;
    return j.personId && (j.personId===entry.handlerId || j.personId===dog.ownerId);
  });
}
function pairConflict(e1, e2, soft){
  if(e1.handlerId && e1.handlerId===e2.handlerId) return true;          // H1
  const d1=dogById(e1.dogId)||{}, d2=dogById(e2.dogId)||{};
  if(soft.avoidOwner  && d1.ownerId && d1.ownerId===d2.ownerId) return true;
  if(soft.avoidKennel && d1.kennel  && d1.kennel===d2.kennel)   return true;
  return false;
}

function runDraw(trial, dayIdx, seedIn, mode){
  const day = trial.days[dayIdx];
  const soft = DB.settings;
  const seed = seedIn || (uid()+Date.now());
  const rnd  = mulberry32(hashStr(seed));
  const active = trial.entries.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ");
  const problems = [];   /* dogs with nowhere to run — these stop the draw */
  const notices  = [];   /* things he must be told, which do not stop it */

  if(!day.terrains.length) return {error:"Δεν έχουν οριστεί τερέν."};
  if(!active.length)       return {error:"Δεν υπάρχουν ενεργές συμμετοχές."};

  /* --- allocation to terrains --- */
  /* only an explicit assignment by the head judge counts as manual; entryIds left
     behind by a previous draw must not leak into the next one, or the draw stops
     being reproducible from its seed */
  const manual = day.terrains.some(t=>t.assigned && t.entryIds && t.entryIds.length);
  if(!manual) day.terrains.forEach(t=>{ t.entryIds = []; });
  const alloc  = {}; day.terrains.forEach(t=>alloc[t.id]=[]);

  if(mode==="ΠΕΡΙΣΤΡΟΦΗ" && dayIdx>0 && trial.days[dayIdx-1].draw){
    const prev = trial.days[dayIdx-1];
    const n = day.terrains.length;
    prev.terrains.forEach((pt,i)=>{
      const target = day.terrains[(i+1)%n];
      (pt.entryIds||[]).forEach(eid=>{
        const e = active.find(x=>x.id===eid); if(e) alloc[target.id].push(e);
      });
    });
    // dogs that were not in the previous day fall through to normal allocation
    const placed = new Set(Object.values(alloc).flat().map(e=>e.id));
    active.filter(e=>!placed.has(e.id)).forEach(e=>{
      const t = eligibleTerrain(e); if(t) alloc[t.id].push(e); else problems.push(dogName(e.dogId));
    });
  } else if(manual){
    /* A hand assignment says where the head judge wants a dog. It does not
       outrank Άρθρο 49 — a judge may not have his own dog in the terrain he
       judges — so an assignment that would break it is refused, the dog falls
       through to normal allocation, and the head judge is told which ones
       moved rather than discovering it on the running order. */
    const refused = [];
    day.terrains.forEach(t=>{
      (t.entryIds||[]).forEach(eid=>{
        const e = active.find(x=>x.id===eid); if(!e) return;
        if(judgeConflict(t, e, trial)){ refused.push(dogName(e.dogId) + " → " + t.name); return; }
        alloc[t.id].push(e);
      });
    });
    if(refused.length) notices.push(
      "Χειροκίνητη ανάθεση σε τερέν όπου ο κριτής έχει δικό του σκύλο (Άρθρο 49). "
      + "Μετακινήθηκαν: " + refused.join(", ") + ".");
    const placed = new Set(Object.values(alloc).flat().map(e=>e.id));
    active.filter(e=>!placed.has(e.id)).forEach(e=>{
      const t = eligibleTerrain(e); if(t) alloc[t.id].push(e); else problems.push(dogName(e.dogId));
    });
  } else {
    shuffled(active, rnd).forEach(e=>{
      const t = eligibleTerrain(e); if(t) alloc[t.id].push(e); else problems.push(dogName(e.dogId));
    });
  }

  function eligibleTerrain(e){
    const dog = dogById(e.dogId) || {};
    const ok = day.terrains.filter(t=>{
      if(t.breedGroup && BREED_GROUP(dog.breed)!==t.breedGroup) return false;  // H3
      if(judgeConflict(t, e, trial)) return false;                             // H2
      return true;
    });
    if(!ok.length) return null;
    /* prefer the terrain where this handler has the fewest dogs, then the emptiest
       terrain — clustering one handler's dogs makes braces impossible to build */
    const mine = tr => alloc[tr.id].filter(x=>x.handlerId===e.handlerId).length;
    ok.sort((a,b)=> (mine(a)-mine(b)) || (alloc[a.id].length-alloc[b.id].length));
    return ok[0];
  }

  if(problems.length)
    return {error:"Δεν βρέθηκε κατάλληλο τερέν για: "+problems.join(", ")+
      ". Ελέγξτε τους κριτές (Άρθρο 49) ή τη φυλή του τερέν."};

  /* --- pairing inside each terrain --- */
  const braceFormat = trial.format === "ΖΕΥΓΗ";
  const warn = [];
  const NONE = {avoidOwner:false, avoidKennel:false};   // hard constraints only

  /* Pair a pool in two phases: first honour the soft preferences, and only if no
     partner qualifies fall back to the hard constraints alone. The same-handler
     rule is never broken unless it is arithmetically impossible. */
  function pairPool(pool, out, terrainName){
    while(pool.length){
      const a = pool.shift();
      if(!pool.length){ out.push({id:uid(),no:out.length+1,a:a.id,b:null,solo:true,status:"ΕΚΚΡΕΜΕΙ"}); break; }
      let cands = pool.map((_,i)=>i).filter(i=>!pairConflict(a,pool[i],soft));
      let relaxed = false, broken = false;
      if(!cands.length){ cands = pool.map((_,i)=>i).filter(i=>!pairConflict(a,pool[i],NONE)); relaxed = true; }
      if(!cands.length){ cands = [0]; broken = true; }
      const b = pool.splice(cands[Math.floor(rnd()*cands.length)],1)[0];
      void broken; void relaxed;   // reported after the repair pass, not here
      out.push({id:uid(),no:out.length+1,a:a.id,b:b.id,solo:false,status:"ΕΚΚΡΕΜΕΙ"});
    }
    return out;
  }

  /* Greedy pairing can corner itself: the last two dogs left over may share a
     handler even though a valid arrangement existed. Repair by swapping partners
     between braces — hard violations first, then the soft preferences. */
  function repair(braces, byId, level, terrainName){
    const bad = b => b.b && pairConflict(byId[b.a], byId[b.b], level);
    const locked = e => soft.seasonLast && e && e.season;   // keep οίστρος at the end
    for(let pass=0; pass<60; pass++){
      let fixed = false;
      for(let i=0;i<braces.length;i++){
        if(!bad(braces[i])) continue;
        for(let j=0;j<braces.length && !fixed;j++){
          if(i===j || !braces[j].b) continue;
          for(const side of ["a","b"]){
            const bi = braces[i], bj = braces[j];
            const keepI = byId[bi.a], moveI = byId[bi.b];
            const keepJ = byId[side==="a" ? bj.b : bj.a], moveJ = byId[side==="a" ? bj.a : bj.b];
            if(locked(moveI) || locked(moveJ)) continue;
            if(!pairConflict(keepI,moveJ,level) && !pairConflict(keepJ,moveI,level)){
              bi.b = moveJ.id;
              if(side==="a"){ bj.a = moveI.id; } else { bj.b = moveI.id; }
              fixed = true; break;
            }
          }
        }
        if(fixed) break;
      }
      if(!fixed) break;
    }
    return braces.filter(bad).length;
  }

  day.terrains.forEach(t=>{
    const list = shuffled(alloc[t.id], rnd);
    let braces = [];
    if(!braceFormat){
      const ordered = soft.seasonLast ? list.filter(e=>!e.season).concat(list.filter(e=>e.season)) : list;
      ordered.forEach((e,i)=>braces.push({id:uid(),no:i+1,a:e.id,b:null,solo:true,status:"ΕΚΚΡΕΜΕΙ"}));
    } else if(soft.seasonLast && list.some(e=>e.season)){
      const season = list.filter(e=>e.season), normal = list.filter(e=>!e.season);
      braces = pairPool(normal.slice(), [], t.name);
      const last = braces[braces.length-1];
      if(last && last.solo && season.length){                 // fill the odd turn
        last.b = season.shift().id; last.solo = false;
      }
      pairPool(season.slice(), braces, t.name);
      braces.forEach((b,i)=>b.no = i+1);
    } else {
      braces = pairPool(list.slice(), [], t.name);
    }
    if(braceFormat){
      const byId = {}; list.forEach(e=>byId[e.id]=e);
      const stillHard = repair(braces, byId, NONE, t.name);   // H1 first
      repair(braces, byId, soft, t.name);                     // then S1/S2
      if(stillHard) warn.push(`«${t.name}»: ${stillHard} ${tx("ζεύγος/η με τον ίδιο κυναγωγό — δεν υπάρχει άλλη δυνατή διάταξη με τους σκύλους αυτού του τερέν.")}`);
    }
    t.braces = braces;
    t.entryIds = braces.flatMap(b=>b.b ? [b.a,b.b] : [b.a]);
    if(braces.length<3) warn.push(`${tx("Το τερέν «")}${t.name}${tx("» έχει")} ${braces.length} ${tx("ζεύγη. Χρειάζονται τουλάχιστον 3 (Άρθρο 40).")}`);
  });

  const hash = hashStr(day.terrains.map(t=>t.id+":"+t.braces.map(b=>b.no+b.a+(b.b||"")).join("|")).join("//")).toString(16);
  day.draw = {seed, at:new Date().toISOString(), hash, mode:mode||"ΚΛΗΡΩΣΗ",
              constraints:{avoidOwner:soft.avoidOwner,avoidKennel:soft.avoidKennel,seasonLast:soft.seasonLast}};
  trial.status = "ΚΛΗΡΩΜΕΝΟΣ";
  return {ok:true, warn: notices.concat(warn)};
}

/* ---------- 6. Router / state ------------------------------------------- */
/* reveal: null shows the whole drawn order; a number is how many braces have
   been read out so far during the draw animation. openBrace is the collapsed
   brace the judge tapped open in the live terrain. */
let S = {view:"trials", trialId:null, tab:"entries", day:0, judgeFilter:"", dogId:null,
         reveal:null, openBrace:null, reorder:false, entryQ:""};

function nav(){
  const tabs = [["trials","Αγώνες"],["registry","Μητρώο"],["stats","Στατιστικά"],
                ["terms","Γλωσσάρι"],["install","Εγκατάσταση"],["settings","Ρυθμίσεις"]]
                .map(([k,l]) => [k, tx(l)]);
  /* The two transfer buttons live in the bar itself, next to Στατιστικά, and are
     on every screen. They were buried three taps inside Ρυθμίσεις, which is the
     last place anyone looks while the κυναγωγοί are waiting. */
  el("nav").innerHTML = `<div class="tabs">${tabs.map(([k,l])=>
    `<button data-nav="${k}" class="${S.view===k||(S.view==="trial"&&k==="trials")?"on":""}">${l}</button>`).join("")}</div>
    <div class="tools noprint">
      <button data-act="backup" title="${tx("Λήψη πλήρους αντιγράφου")}"><b>↓</b><span>${tx("Λήψη")}</span></button>
      <button data-act="restore" title="${tx("Φόρτωση αρχείου από άλλη συσκευή")}"><b>↑</b><span>${tx("Φόρτωση")}</span></button>
    </div>`;
  /* the strip of tabs is narrower than the words on a phone, so bring the open
     one into view instead of leaving it half under the transfer buttons */
  const strip = el("nav").querySelector(".tabs"), on = strip.querySelector("button.on");
  if(on) strip.scrollLeft = Math.max(0, on.offsetLeft - (strip.clientWidth - on.offsetWidth) / 2);
  navFade();
  strip.addEventListener("scroll", navFade, {passive:true});
}
/* Ποια άκρη σβήνει: μόνο εκείνη που έχει πράγματι συνέχεια. Σε οθόνη όπου οι
   έξι καρτέλες χωρούν, δεν σβήνει καμία. */
function navFade(){
  const t = document.querySelector("nav .tabs"); if(!t) return;
  const more = t.scrollWidth - t.clientWidth;
  const l = more > 2 && t.scrollLeft > 4;
  const r = more > 2 && t.scrollLeft < more - 4;
  t.classList.toggle("fade-l",  l && !r);
  t.classList.toggle("fade-r",  r && !l);
  t.classList.toggle("fade-lr", l && r);
}
addEventListener("resize", navFade);
addEventListener("orientationchange", ()=>setTimeout(navFade, 150));

/* The storage bar. It sits under the navigation, it does not scroll away and it
   cannot be dismissed. Losing a day of results is worse than an ugly bar. */
function warnBar(){
  if(storageMode !== "memory") return "";
  return `<div class="nostore noprint"><div class="bang">!</div><div>
    <b>${tx("Τα δεδομένα δεν αποθηκεύονται.")}</b> ${tx("Ανοίξατε το αρχείο απευθείας και ο περιηγητής δεν επιτρέπει αποθήκευση. Ό,τι καταχωρήσετε θα χαθεί μόλις κλείσετε τη σελίδα. Κλείστε το και ανοίξτε την εφαρμογή από τη διεύθυνση του ομίλου, ή κατεβάστε αντίγραφο (Ρυθμίσεις → Μεταφορά) πριν κλείσετε.")}</div></div>`;
}
function render(){
  nav();
  el("warn").innerHTML = warnBar();
  const v = {trials:vTrials, trial:vTrial, registry:vRegistry, stats:vStats,
             settings:vSettings, dog:vDog, install:vInstall, terms:vTerms}[S.view];
  el("app").innerHTML = v ? v() : "";
  el("fab").innerHTML = fabFor();
  document.body.toggleAttribute("data-field", isFieldScreen());
  /* the header chip: no storage outranks the connection, because it is the one
     that loses a season */
  const net = el("net");
  net.textContent = tx(storageMode === "memory" ? "Χωρίς αποθήκευση"
    : (navigator.onLine ? "Συνδεδεμένο" : "Εκτός σύνδεσης"));
  /* Με δύο γλώσσες το κουμπί ήταν διακόπτης και έδειχνε πού πας. Με πέντε αυτό
     δεν στέκει: χρειάζονταν τέσσερα πατήματα για τα ιταλικά, και δεν έλεγε ποτέ σε
     ποια γλώσσα είσαι. Τώρα δείχνει την τρέχουσα και ανοίγει τη λίστα. */
  const cur = LANGS.find(l => l[0] === ((DB.settings||{}).lang || "el")) || LANGS[0];
  el("langBtn").textContent = cur[2];
  el("langBtn").title = cur[1];
  el("clubLine").textContent = clubName() + " · 1992";
  net.className = "offline" + (storageMode === "memory" ? " warn" : "");
  startClocks();
  /* A new screen starts at the top. An edit in place does not: moving a ζεύγος
     or a σκύλος re-renders, and throwing the head judge back to the top of a
     terrain after every move is how a correction gets abandoned half-made. */
  const key = [S.view, S.trialId, S.tab, S.day, S.regTab, S.dogId].join("|");
  if(key !== lastViewKey){ lastViewKey = key; window.scrollTo({top:0}); }
}
let lastViewKey = "";

/* ---------- 7. Views: trials -------------------------------------------- */
/* Cards by season, with the status chip the club uses. */
function vTrials(){
  const head = `<div class="row" style="align-items:flex-end;gap:16px;margin-bottom:18px">
    <div class="grow"><div class="eyebrow">${tx("Κ.Ο.Α.Δ.")}</div><h1 style="margin:0">${tx("Αγώνες")}</h1></div>
    <button class="b-act" data-act="newTrial">${tx("Νέος αγώνας")}</button></div>`;
  /* The commonest first move on a second device is not "make a trial" — it is
     "take the one that was sent to me". That button is now in the bar at the top
     of every screen, so here it is only named, not repeated. */
  if(!DB.trials.length) return head + `<div class="empty"><h2>${tx("Κανένας αγώνας ακόμη")}</h2>
    <p class="muted">${tx("Δημιουργήστε τον πρώτο αγώνα, ή πατήστε")} <b>${tx("↑ Φόρτωση")}</b> ${tx("πάνω δεξιά για αρχείο που σας έστειλαν από άλλη συσκευή.")}</p>
    <div class="row tight" style="justify-content:center;margin-top:16px">
      <button class="b-pri" data-act="newTrial">${tx("Νέος αγώνας")}</button>
      <button class="b-sm" data-act="restorePaste">${tx("Επικόλληση κειμένου")}</button></div>
    <p class="tiny" style="margin-top:16px">${tx("Το μητρώο σκύλων μπορεί να γεμίσει πρώτο, από το Μητρώο ή με εισαγωγή αρχείου Excel.")}</p></div>`;
  const card = t=>{
    const n = t.entries.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ").length;
    const drawn = t.days.some(d=>d.draw);
    const done = t.status === CLOSED;
    return `<div class="card" data-open="${t.id}" style="cursor:pointer">
      <div class="row" style="align-items:flex-start">
        <h3 class="grow" style="margin:0">${esc(t.title)}</h3>
        <span class="chip ${done?"g":drawn?"n":""}">${esc(tx(t.status))}</span></div>
      <div class="muted" style="margin-top:6px">${esc(tx(t.type))} · ${tx(t.format==="ΖΕΥΓΗ"?"Ζεύγη":"Ατομικός").toLowerCase()} · ${esc(tx(t.game||"—"))}${t.award!=="-"?" · "+esc(t.award):""}</div>
      <div class="muted num">${fmtDate(t.dateStart)}${t.time?" · "+esc(t.time):""} · ${esc(t.place||"—")} · ${n} ${tx(n===1?"σκύλος":"σκύλοι")}${
        t.days.length>1?" · "+t.days.length+" ημέρες":""}</div>
    </div>`;
  };
  const sorted = DB.trials.slice().sort((a,b)=>(b.dateStart||"").localeCompare(a.dateStart||""));
  const open = sorted.filter(t=>t.status !== CLOSED);
  const past = sorted.filter(t=>t.status === CLOSED);
  /* Two lists, not one: what is still being run, and the record. A closed trial
     is the club's history and it belongs under its season. */
  const byYear = {};
  past.forEach(t=>{ const y=(t.dateStart||"----").slice(0,4); (byYear[y]=byYear[y]||[]).push(t); });
  return head
    + (open.length ? `<div class="eyebrow">${tx("Σε εξέλιξη")}</div>${open.map(card).join("")}` : "")
    + (past.length ? Object.entries(byYear).map(([y,list])=>`
        <div class="eyebrow" style="margin-top:24px">${tx("Ιστορικό · σεζόν")} ${y}</div>
        ${list.map(card).join("")}`).join("") : "")
    + (past.length ? `<p class="tiny" style="margin-top:18px">${tx("Οι ολοκληρωμένοι αγώνες μένουν στο μητρώο και μετρούν στα Στατιστικά. Ανοίγουν κανονικά για ανάγνωση και εκτύπωση.")}</p>` : "");
}

/* The bottom action bar is field chrome. On Κλήρωση, Τερέν and SMS the primary
   action lives in the bottom third, because the top of a phone is out of reach
   one-handed. The desk screens carry their actions inline instead — the same
   split the design draws. */
function isFieldScreen(){
  return S.view==="trial" && ["draw","braces","sms"].includes(S.tab);
}
function fabFor(){
  if(S.view==="trial"){
    const t = trialById(S.trialId); if(!t) return "";
    const day = t.days[S.day];
    if(S.tab==="draw"){
      const label = tx(S.reveal !== null ? "Κλήρωση…" : day.draw ? "Νέα κλήρωση" : "Κλήρωση");
      return `<button class="b-act" data-act="doDraw">${label}</button>`;
    }
    if(S.tab==="braces"){
      const live = liveBrace(t);
      const up = DB.settings.nextUp !== false && nextUpTarget(t);
      const upBtn = up && nextUpQueue(t, up.tr, up.b).some(x=>x.phone)
        ? `<button data-act="nextUpFab" style="flex:0 0 auto"
             title="${tx("Ειδοποίηση «σειρά σας»")}">SMS ${up.b.no}</button>` : "";
      if(live) return `<button data-act="pauseBrace" style="flex:0 0 auto">${live.b.startedAt?"Παύση":"Συνέχεια"}</button>
        <button data-act="extendBrace" style="flex:0 0 auto">+5′</button>${upBtn}
        <button class="b-act" data-act="nextBrace">${tx("Επόμενο ζεύγος")}</button>`;
      const next = nextPending(t);
      return next ? `<button class="b-act" data-act="nextBrace">${tx("Έναρξη ζεύγους")} ${next.b.no}</button>` : "";
    }
    /* the SMS screen carries its own send button in the selection card, and on a
       phone the bar is worth having as well; on a desk it is the same button twice */
    if(S.tab==="sms" && onPhone())
      return `<button class="b-act" data-act="smsNext">${tx("Άνοιγμα επόμενου μηνύματος")}</button>`;
    return "";
  }
  return "";
}
/* Ποιους αφορά το «σειρά σας»: το πρώτο εκκρεμές ζεύγος μετά από αυτό που
   τρέχει. Αν δεν τρέχει τίποτα, το πρώτο εκκρεμές της ημέρας. */
function nextUpTarget(t){
  const live = liveBrace(t);
  if(live){ const nb = nextUpBrace(live.tr, live.b); if(nb) return {tr:live.tr, b:nb}; }
  const n = nextPending(t);
  return n && (!live || n.b !== live.b) ? {tr:n.tr, b:n.b} : null;
}
/* the brace on the ground right now, and the one after it */
function liveBrace(t){
  const day = t.days[S.day];
  for(const tr of day.terrains||[])
    for(const b of tr.braces||[]) if(b.status==="ΤΡΕΧΕΙ" && (!S.judgeFilter || tr.judgeIds.includes(S.judgeFilter)))
      return {tr, b};
  return null;
}
function nextPending(t){
  const day = t.days[S.day];
  for(const tr of day.terrains||[])
    for(const b of tr.braces||[]) if(b.status==="ΕΚΚΡΕΜΕΙ" && (!S.judgeFilter || tr.judgeIds.includes(S.judgeFilter)))
      return {tr, b};
  return null;
}

/* ---------- 8. Views: trial detail --------------------------------------- */
function vTrial(){
  const t = trialById(S.trialId); if(!t){ S.view="trials"; return vTrials(); }
  const body = {entries:tEntries,terrains:tTerrains,draw:tDraw,braces:tBraces,
                sms:tSms,results:tResults,export:tExport}[S.tab](t);
  return `
  <div class="row noprint" style="margin-bottom:10px">
    <button class="b-sm" data-nav="trials">‹ ${tx("Αγώνες")}</button>
    <span class="chip n">${esc(tx(t.status))}</span>
    <button class="b-sm" data-act="editTrial" style="margin-left:auto">${tx("Επεξεργασία")}</button>
  </div>
  <h1 style="margin-bottom:6px"><button class="h-edit" data-act="editTrial"
    title="${tx("Επεξεργασία αγώνα")}">${esc(t.title)}</button></h1>
  <div class="muted" style="margin-bottom:14px">${esc(tx(t.type))} · ${tx(t.format==="ΖΕΥΓΗ"?"Ζεύγη":"Ατομικός")}
   · ${esc(tx(t.game||"—"))}${t.wild?" ("+tx("άγριο θήραμα")+")":""} · ${fmtDate(t.dateStart)}${
     t.time?" · "+tx("ώρα")+" "+esc(t.time):""} · ${esc(t.place||"")}
   ${tx("· Συντελεστής ×")}${coefficient(t)}</div>
  ${progressStrip(t)}
  ${t.days.length>1?`<div class="row tight noprint" style="margin-bottom:14px">
    ${t.days.map((d,i)=>`<button class="tog ${S.day===i?"on":""}" data-day="${i}">${tx("Ημέρα")} ${i+1} · ${fmtDate(d.date)}</button>`).join("")}
  </div>`:""}
  ${body}`;
}

/* The app has an order of operations — entries, terrains, the draw, the SMS,
   the running, the scoring — and nothing on screen said so. This says it, and
   each step is the way in. It is also the only navigation: a strip of steps
   above a strip of tabs carrying the same six words read as the same buttons
   twice on a phone, which is what it was. Εξαγωγές trails as a plain button —
   it is a destination, not a step, and it never completes. */
function progressStrip(t){
  const day = t.days[S.day];
  const active = t.entries.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ").length;
  const judged = day.terrains.length && day.terrains.every(tr=>tr.judgeIds.length);
  const q = day.draw ? smsQueue(t) : [];
  const sent = q.filter(x=>t.sms[x.key]==="ΕΣΤΑΛΗ").length;
  const scored = t.entries.filter(e=>{ const r = t.results[e.id]; return r && r.qual && r.qual!=="-"; }).length;
  const braces = [];
  day.terrains.forEach(tr=>(tr.braces||[]).forEach(b=>braces.push(b)));
  const ran = braces.filter(b=>b.status==="ΟΛΟΚΛΗΡΩΘΗΚΕ").length;
  const steps = [
    ["entries",  "Συμμετοχές", active >= 6,        active ? active + " " + tx("σκύλοι") : tx("καμία")],
    ["terrains", "Τερέν",      day.terrains.length && judged,
                                                   day.terrains.length ? day.terrains.length + " " + txOne("τερέν") : tx("κανένα")],
    ["draw",     "Κλήρωση",    !!day.draw,         tx(day.draw ? "έγινε" : "εκκρεμεί")],
    ["sms",      "SMS",        q.length > 0 && sent === q.length,
                                                   q.length ? sent + "/" + q.length : "—"],
    ["braces",   "Ζεύγη",      braces.length > 0 && ran === braces.length,
                                                   braces.length ? ran + "/" + braces.length : "—"],
    ["results",  "Βαθμολογία", active > 0 && scored === active,
                                                   scored ? scored + "/" + active : "—"]
  ];
  const firstOpen = steps.findIndex(x=>!x[2]);
  return `<div class="steps noprint">${steps.map(([k,label,done,note],i)=>
    `<button class="step-i ${done?"done":""} ${i===firstOpen?"now":""} ${S.tab===k?"here":""}" data-tab="${k}">
      <span class="mark">${done?"✓":i+1}</span>
      <span class="lbl">${txCap(label)}<span>${esc(note)}</span></span>
    </button>`).join("")}
    <button class="step-i plain ${S.tab==="export"?"here":""}" data-tab="export">
      <span class="lbl">${tx("Εξαγωγές")}<span>${tx("αρχεία και εκτυπώσεις")}</span></span></button></div>`;
}

/* --- 8a. entries --- */
function tEntries(t){
  /* Grouped by handler, because that is who turns up: one man arrives with
     three dogs and the head judge deals with him once, not three times. */
  const groups = new Map();
  t.entries.forEach(e=>{
    const key = e.handlerId || "";
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(e);
  });
  const ordered = [...groups.entries()].sort((x, y)=>{
    if(!x[0]) return 1;                                   /* unassigned last */
    if(!y[0]) return -1;
    return perName(x[0]).localeCompare(perName(y[0]), "el");
  });

  const cards = ordered.map(([hid, list])=>{
    const who = hid ? perName(hid) : "— χωρίς κυναγωγό —";
    const phone = hid ? (perById(hid)||{}).phone : "";
    const running = list.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ").length;
    const dogs = list.slice().sort((p,q)=>dogName(p.dogId).localeCompare(dogName(q.dogId),"el"))
      .map(e=>{
        const d = dogById(e.dogId) || {};
        const find = ((d.name||"") + " " + (d.reg||"") + " " + (d.breed||"") + " " + who).toLowerCase();
        return `<div class="entry-row" data-find="${esc(find)}">
          <div class="who">
            <b>${esc(d.name||"—")}</b>
            <span class="tiny">${esc(breedName(d.breed))}${d.sex?" · "+(d.sex==="Θ"?tx("θηλυκός"):tx("αρσενικός")):""}${
              d.reg?" · "+esc(d.reg):""}</span>
          </div>
          <div class="acts">
            ${e.season?`<span class="chip y">${tx("οίστρος")}</span>`:""}
            ${e.paid?`<span class="chip g">${tx("πληρ.")}</span>`:`<span class="chip r">${tx("απλήρωτο")}</span>`}
            ${e.status!=="ΔΗΛΩΜΕΝΟΣ"?`<span class="chip">${esc(e.status)}</span>`:""}
            <button class="b-sm noprint" data-editentry="${e.id}">${tx("Επεξ.")}</button>
          </div></div>`;
      }).join("");
    return `<div class="card handler" data-group="${esc(who.toLowerCase())}">
      <div class="row" style="align-items:baseline;gap:10px">
        <h3 class="grow" style="margin:0">${esc(who)}</h3>
        <span class="muted num">${running} ${tx(running===1?"σκύλος":"σκύλοι")}</span>
      </div>
      ${phone?`<div class="fingerprint">${esc(phone)}</div>`:""}
      <div style="margin-top:10px">${dogs}</div>
      ${hid?`<div class="row tight noprint" style="margin-top:12px">
        <button class="b-sm" data-batch="${hid}">${tx("Αλλαγή σκύλων")}</button></div>`:""}
    </div>`;
  }).join("");

  const active = t.entries.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ").length;
  const braces = Math.ceil(active/(t.format==="ΖΕΥΓΗ"?2:1));
  const min = active>=6 && braces>=3;
  const handlers = ordered.filter(([hid, l])=>l.some(e=>e.status==="ΔΗΛΩΜΕΝΟΣ")).length;
  return `
  <div class="${min?"note":"err"}">${active} ${tx(active===1?"σκύλος":"σκύλοι")} ${tx("από")} ${handlers}
   ${tx(handlers===1?"κυναγωγό":"κυναγωγούς")} · ${braces} ${tx(t.format==="ΖΕΥΓΗ"?"ζεύγη":"διαδρομές")}.
   ${min ? tx("Πληρούνται τα ελάχιστα: 6 σκύλοι και 3 ζεύγη.")
     : `<b>${tx("Δεν πληρούνται τα ελάχιστα.")}</b> ${tx("Χρειάζονται τουλάχιστον 6 σκύλοι και 3 ζεύγη (ΕΚ Άρθρο 5, Άρθρο 40). Προσθέστε συμμετοχές ή συγχωνεύστε τερέν.")}`}</div>
  <div class="row noprint" style="margin-bottom:14px">
    <div class="grow" style="max-width:340px">
      <input id="entryQ" placeholder="${tx("Αναζήτηση σκύλου ή κυναγωγού")}"
        value="${esc(S.entryQ||"")}" oninput="filterEntries(this.value)"></div>
    <button class="b-act" data-act="addEntry">${tx("Δηλώσεις ημέρας")}</button>
    <button data-act="addOneHandler">${tx("+ Ένας κυναγωγός")}</button>
    <button data-act="importEntries">${tx("Εισαγωγή αρχείου")}</button></div>
  <div id="entryNone" class="empty" style="display:none">${tx("Καμία συμμετοχή δεν ταιριάζει.")}</div>
  ${cards ? `<div class="split top">${cards}</div>`
    : `<div class="empty">${tx("Καμία συμμετοχή ακόμη. Ανοίξτε τις «Δηλώσεις ημέρας» και σημειώστε ποιοι τρέχουν, ή εισαγάγετε αρχείο Excel.")}</div>`}`;
}

/* --- 8b. terrains ---
   How many terrains, then who judges each one. Both are decisions the Πρόεδρος
   Κριτών makes in that order, so the screen asks in that order: a count first,
   then a card per terrain with the judges chosen from the register by name. */
function tTerrains(t){
  const day = t.days[S.day];
  const need = t.format==="ΖΕΥΓΗ"?2:1;
  const cacit = t.award==="CACIT";
  const want = cacit ? 3 : need;

  const count = `<div class="card noprint">
    <div class="eyebrow">${tx("Πόσα τερέν")}</div>
    <div class="row tight" style="margin-top:10px">${[1,2,3,4].map(n=>
      `<button class="tog ${day.terrains.length===n?"on":""}" data-nterrain="${n}"
        style="min-width:56px;justify-content:center">${n}</button>`).join("")}</div>
    <div class="tiny" style="margin-top:10px">${tx("Τα τερέν παίρνουν όνομα Α, Β, Γ, Δ. Μπορείτε να το αλλάξετε από την Επεξεργασία. Η κατανομή των σκύλων γίνεται στην κλήρωση.")}</div>
  </div>`;

  const cards = day.terrains.map(tr=>{
    const slots = judgeSlots(tr, want);
    const bad = tr.judgeIds.length < want;
    const conflicts = t.entries.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ" && (tr.entryIds||[]).includes(e.id)
                       && judgeConflict(tr,e,t)).map(e=>dogName(e.dogId));
    const byName = DB.judges.slice().sort((a,b)=>a.name.localeCompare(b.name,"el"));
    /* One seat per row, named the way the committee is named: the κεντρικός and
       then Κριτής 1, Κριτής 2. A man cannot hold two seats on the same terrain,
       so choosing him for one clears the other. */
    /* A judge stands on one terrain at a time, so anyone already seated on
       another one today is not offered here — except the man in this very seat,
       who must stay visible or the select would show nothing. */
    const elsewhere = new Map();
    day.terrains.forEach(o=>{ if(o.id === tr.id) return;
      (o.judgeIds||[]).forEach(j=>elsewhere.set(j, o.name)); });
    const seat = (jid, i)=>`<div>
      <label>${i===0?tx("Κεντρικός κριτής"):tx("Κριτής")+" "+i}</label>
      <select data-judgeslot="${tr.id}|${i}">
        <option value="">${tx("— κανένας —")}</option>
        ${byName.filter(j=>!elsewhere.has(j.id) || jid===j.id)
          .map(j=>`<option value="${j.id}" ${jid===j.id?"selected":""}>${esc(j.name)}${
            j.me?" · Μ.Ε.":""}</option>`).join("")}
      </select></div>`;
    /* conflicts surface immediately and specifically, with the article and a
       one-tap way to fix them */
    return `<div class="card">
      <h3 style="margin:0">${esc(tr.name)}</h3>
      ${tr.breedGroup?`<div class="muted" style="margin-top:6px">${tx("Φυλή:")} ${
        tr.breedGroup==="POINTER"?"Pointer (F.C.I. 2.1)"
        :tr.breedGroup==="CONT"?"Ηπειρωτικές (F.C.I. Τμήμα 1)":"Σέττερ (F.C.I. 2.2)"}</div>`:""}

      <div class="noprint" style="margin-top:12px;display:grid;gap:12px;max-width:420px">
        ${slots.map(seat).join("")}</div>

      <div class="print-only muted" style="margin-top:8px">${tx("Κεντρικός κριτής:")} ${
        esc((judById(slots[0])||{}).name||"—")}${slots.filter((j,i)=>i>0 && j).length
        ? " · Κριτές: " + slots.filter((j,i)=>i>0 && j)
            .map(j=>esc((judById(j)||{}).name||"?")).join(", ") : ""}</div>

      <div class="muted num" style="margin-top:12px">${(tr.entryIds||[]).length} ${tx("σκύλοι ·")} ${(tr.braces||[]).length} ${tx("ζεύγη")}
        ${tr.assigned?`<span class="chip n" style="margin-right:6px">${tx("ΧΕΙΡΟΚΙΝΗΤΗ ΑΝΑΘΕΣΗ")}</span>`:""}</div>
      ${(tr.entryIds||[]).length ? `<div class="tiny" style="margin-top:6px">${
        (tr.entryIds||[]).map(id=>{
          const e = t.entries.find(x=>x.id===id);
          return e ? esc(dogName(e.dogId)) : "";
        }).filter(Boolean).join(" · ")}</div>` : ""}
      <div class="row tight noprint" style="margin-top:12px">
        <button class="b-sm" data-assign="${tr.id}">${tx("Ανάθεση σκύλων")}</button>
        ${tr.assigned?`<button class="b-sm" data-autoassign="${tr.id}">${tx("Αυτόματη κατανομή")}</button>`:""}
        <button class="b-sm" data-editterrain="${tr.id}">${tx("Όνομα και φυλή")}</button>
      </div>
      ${bad?`<div class="err" style="margin-top:12px;margin-bottom:0">
        <b>${tx("Το")} ${esc(tr.name)} ${tx("έχει")} ${tr.judgeIds.length} ${tr.judgeIds.length===1?"κριτή":"κριτές"}.</b>
        ${tx("Χρειάζονται τουλάχιστον")} ${want} ${tx("(Άρθρο 48")}${cacit?" — για CACIT τρεις, ο ένας Μεγάλης Έρευνας":""}).</div>`:""}
      ${conflicts.length?`<div class="err" style="margin-top:12px;margin-bottom:0">
        <b>${tx("Κριτής με δικό του σκύλο σε αυτό το τερέν (Άρθρο 49):")}</b> ${esc(conflicts.join(", "))}${tx(". Αφαιρέστε τον κριτή ή μεταφέρετε τον σκύλο σε άλλο τερέν.")}</div>`:""}
    </div>`;}).join("");

  return count
    + (cards||`<div class="empty">${tx("Δεν έχουν οριστεί τερέν. Επιλέξτε πόσα χρειάζονται.")}</div>`)
    + `<button class="b-sm noprint" data-act="addTerrain" style="margin-bottom:16px">${tx("+ Προσθήκη τερέν")}</button>`
    + handoff(t);
}
/* The committee on a terrain is an ordered list: seat 0 is the κεντρικός κριτής
   and the rest are Κριτής 1, Κριτής 2. `judgeIds` stays the compacted panel that
   Άρθρο 48 and Άρθρο 49 are checked against; `slots` only remembers which seat a
   man was put in, so clearing the κεντρικός does not silently promote the next
   one into his chair. */
function judgeSlots(tr, want){
  const src = (tr.slots && tr.slots.length) ? tr.slots : (tr.judgeIds||[]);
  const out = src.map(j=>judById(j) ? j : "");
  const n = Math.max(want || 2, 3, out.length);
  while(out.length < n) out.push("");
  return out;
}
function setJudgeSlot(t, trId, idx, jid){
  const day = t.days[S.day];
  const tr = day.terrains.find(x=>x.id===trId); if(!tr) return;
  if(jid){
    const other = day.terrains.find(o=>o.id !== trId && (o.judgeIds||[]).includes(jid));
    if(other){ toast((judById(jid)||{}).name + " κρίνει ήδη στο " + other.name); render(); return; }
  }
  const slots = judgeSlots(tr, t.award==="CACIT" ? 3 : (t.format==="ΖΕΥΓΗ"?2:1));
  if(jid) slots.forEach((v,i)=>{ if(i !== idx && v === jid) slots[i] = ""; });
  slots[idx] = jid;
  tr.slots = slots;
  tr.judgeIds = slots.filter(Boolean);
  tr.headJudgeId = slots[0] || "";
  save(); render();
}

/* Adding terrains is free. Removing one is not: a terrain with braces drawn
   carries the day's work, so the count refuses to swallow it and says which
   one to clear first. */
/* Α, Β, Γ, Δ — the first letter not already taken, rather than one counted off
   the current length. Position-based naming repeats itself the moment a terrain
   is renamed or removed out of order. */
function terrainLetter(day){
  const taken = new Set((day.terrains||[]).map(tr=>(tr.name||"").trim()));
  for(let i = 0; i < 24; i++){
    const nm = "Τερέν " + String.fromCharCode(913 + i);
    if(!taken.has(nm)) return nm;
  }
  return "Τερέν " + ((day.terrains||[]).length + 1);
}
function setTerrainCount(t, n){
  const day = t.days[S.day];
  const have = day.terrains.length;
  if(n === have) return;
  if(n > have){
    while(day.terrains.length < n)
      day.terrains.push({ id: uid(), name: terrainLetter(day),
        breedGroup: "", judgeIds: [], slots: [], headJudgeId: "", entryIds: [], braces: [] });
    save(); render(); return;
  }
  const going = day.terrains.slice(n);
  const busy = going.filter(tr=>(tr.braces||[]).length);
  if(busy.length)
    return alert(busy.map(tr=>tr.name).join(", ") + " — "
      + tx("έχει κληρωμένα ζεύγη. Κάντε νέα κλήρωση ή διαγράψτε το τερέν από την Επεξεργασία του."));
  const pinned = going.filter(tr=>(tr.entryIds||[]).length).map(tr=>tr.name);
  if(pinned.length && !confirmAct(pinned.join(", ") + " — "
      + tx("θα αφαιρεθεί μαζί με τις χειροκίνητες αναθέσεις του. Συνέχεια;"))) return;
  day.terrains.length = n;
  save(); render();
}
/* The setup is done on a laptop and the draw happens on a hillside. Two routes
   out, said here rather than left to be found: carry the day to the phone, or
   draw now and send the order. */
function handoff(t){
  const day = t.days[S.day];
  const active = t.entries.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ").length;
  const want = t.award==="CACIT" ? 3 : (t.format==="ΖΕΥΓΗ"?2:1);
  const ready = active >= 6 && day.terrains.length
    && day.terrains.every(tr=>(tr.judgeIds||[]).length >= want);
  if(!ready) return "";
  return `<div class="card noprint">
    <div class="eyebrow">${tx("Το στήσιμο είναι έτοιμο")}</div>
    <p class="tiny">${active} ${tx("σκύλοι σε")} ${day.terrains.length}
      ${tx("τερέν")}${tx(". Δύο τρόποι να συνεχίσετε:")}</p>
    <div class="row tight" style="margin-top:12px">
      <button class="b-pri" data-tab="draw">${tx("Κλήρωση τώρα")}</button>
      <button data-act="shareTrial">${tx("Αποστολή στο κινητό")}</button>
    </div>
    <div class="tiny" style="margin-top:12px">${tx("Στο τερέν: στείλτε το στήσιμο στο κινητό και κάντε την κλήρωση εκεί, μπροστά σε όλους. Από το σπίτι: κληρώστε τώρα και στείλτε τη σειρά με SMS στους κυναγωγούς· η σειρά παραμένει ενδεικτική (Άρθρο 16).")}</div>
  </div>`;
}

/* --- 8c. draw ---
   The moment this app exists for. One screen, one large button. On tap the
   braces appear one at a time, in order — it mirrors a public draw where names
   are read out one by one and it gives the crowd something to watch. Below,
   small and permanent: seed, time, fingerprint and Άρθρο 16. */
/* Day two: the dogs that ran Τερέν Α go to Τερέν Β and the other way round, so
   nobody is judged twice by the same committee on the same ground. The draw
   engine has always done this — mode ΠΕΡΙΣΤΡΟΦΗ rotates each terrain's dogs one
   place on — but it lived in a dropdown nobody opened. With two terrains a
   rotation is exactly a swap, which is what the club calls it. */
function rotateCard(t){
  if(S.day === 0) return "";
  const prev = t.days[S.day-1];
  const day = t.days[S.day];
  if(!prev || !prev.draw) return `<div class="note" style="margin-top:14px">${tx("Η ημέρα")}
    ${S.day} ${tx("δεν έχει κληρωθεί, οπότε δεν υπάρχει σειρά για να αντιστραφεί.")}</div>`;
  const n = day.terrains.length;
  if(n < 2) return "";
  const moves = prev.terrains.map((pt,i)=>{
    const to = day.terrains[(i+1)%n];
    return esc(pt.name) + " → " + esc(to ? to.name : "—");
  }).join(" · ");
  return `<div class="card noprint" style="margin-top:14px">
    <div class="eyebrow">${n===2?"Αντιστροφή τερέν":"Περιστροφή τερέν"}</div>
    <p class="tiny">${tx("Οι σκύλοι της χθεσινής ημέρας αλλάζουν τερέν:")} ${moves}${tx(". Τα ζεύγη κληρώνονται από την αρχή μέσα σε κάθε τερέν.")}</p>
    <div class="row tight" style="margin-top:12px">
      <button class="b-pri" data-act="rotateDraw">${n===2?"Αντιστροφή τερέν και κλήρωση"
        :"Περιστροφή τερέν και κλήρωση"}</button>
    </div>
  </div>`;
}
/* The code the draw is run from. The club writes it on the board as the type,
   the trial and the date, so the field starts with exactly that and the head
   judge changes it if he wants. Same code + same entries = same order, always. */
const TYPE_CODE = { "Πρακτικού Κυνηγίου":"ΠΚ", "Έρευνας Κυνηγίου":"ΕΚ",
  "Μεγάλης Έρευνας":"ΜΕ", "Κλασικός":"ΚΛ", "Derby":"DB", "Ε.Κ.Ι.":"ΕΚΙ", "Ε.ΦΥ.Π.":"ΕΦΠ" };
function drawCode(t){
  const day = t.days[S.day];
  const code = TYPE_CODE[t.type] || (t.type||"").slice(0,2).toUpperCase();
  /* Greek capitals carry no accents — ΝΈΟ is wrong, ΝΕΟ is right */
  const name = (t.title||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toUpperCase().replace(/\s+/g,"").replace(/[^\p{L}\p{N}]/gu,"");
  const d = (day.date||t.dateStart||"").split("-").reverse().join("");
  return [code, name, d].filter(Boolean).join("-");
}
function tDraw(t){
  const day = t.days[S.day], d = day.draw;
  const active = t.entries.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ").length;
  const rows = [];
  if(d) day.terrains.forEach(tr=>(tr.braces||[]).forEach(b=>{
    const ea = t.entries.find(e=>e.id===b.a), eb = t.entries.find(e=>e.id===b.b);
    /* each name is its own box, so it can be picked up and dropped on another */
    const box = e => e && !(b.trailer && e.id === b.b)
      ? `<span class="dogbox" data-dogbox="${tr.id}|${b.id}|${e.id}">${esc(dogName(e.dogId))}</span>`
      : `<span>${esc(e ? dogName(e.dogId) : tx("ΜΟΝΟΣ"))}</span>`;
    rows.push({no:b.no, terrain:tr.name, tid:tr.id, bid:b.id,
      pair: box(ea) + " / " + box(eb),
      handlers:[ea&&perName(ea.handlerId), eb&&perName(eb.handlerId)].filter(Boolean).join(" · ")});
  }));
  const shown = S.reveal === null ? rows.length : S.reveal;

  return `
  <div class="eyebrow">${tx("Ημέρα")} ${S.day+1} · ${day.terrains.length} ${tx("τερέν ·")} ${active} ${tx("σκύλοι")}</div>
  <h1>${tx("Κλήρωση ζευγών")}</h1>

  <div class="card">
    <div class="row">
      <div class="grow"><label>${tx("Κωδικός κλήρωσης")}</label>
        <input id="seedIn" class="seed" value="${esc(day.draw ? day.draw.seed : drawCode(t))}"
          placeholder="${esc(drawCode(t))}"></div>
      ${S.day>0?`<div class="grow"><label>${tx("Τρόπος")}</label><select id="drawMode">
        <option value="ΠΕΡΙΣΤΡΟΦΗ" selected>${tx("Περιστροφή τερέν (ιταλικό σύστημα)")}</option>
        <option value="ΚΛΗΡΩΣΗ">${tx("Νέα κλήρωση")}</option></select></div>`:""}
    </div>
    ${rotateCard(t)}
    <label style="margin-top:16px">${tx("Προτιμήσεις — τηρούνται όπου γίνεται")}</label>
    <div class="row tight">
      <button class="tog opt ${DB.settings.avoidOwner?"on":""}" data-set="avoidOwner">${tx("Ίδιος ιδιοκτήτης")}</button>
      <button class="tog opt ${DB.settings.avoidKennel?"on":""}" data-set="avoidKennel">${tx("Ίδιο εκτροφείο")}</button>
      <button class="tog opt ${DB.settings.seasonLast?"on":""}" data-set="seasonLast">${tx("Οίστρος τελευταίες")}</button>
    </div>
    <div class="tiny" style="margin-top:12px">${tx("Πάντα ισχύουν: ποτέ δύο σκύλοι του ίδιου κυναγωγού στο ίδιο ζεύγος · κανένας κριτής δεν κρίνει τερέν με δικό του σκύλο (Άρθρο 49). Ο «ίδιος ιδιοκτήτης» πιάνει τους σκύλους που ανήκουν στον ίδιο αλλά τους τρέχουν διαφορετικοί κυναγωγοί. Ο ίδιος κωδικός με τις ίδιες συμμετοχές δίνει πάντα την ίδια σειρά, οπότε η κλήρωση μπορεί να επαναληφθεί και να ελεγχθεί. Αλλάξτε τον ελεύθερα.")}</div>
  </div>

  ${drawCheck(t)}

  ${!d ? `<div class="empty">${tx("Καμία κλήρωση ακόμη για την ημέρα")} ${S.day+1}${tx(". Πατήστε «Κλήρωση» για να κατανεμηθούν οι σκύλοι στα τερέν και να σχηματιστούν τα ζεύγη.")}</div>`
    : `<div class="tiny noprint" style="margin:0 0 12px">${tx("Σύρετε το")} <b>⠿</b> ${tx("για να πάει ένα ζεύγος πάνω ή κάτω μέσα στο τερέν του, ή ένα")} <b>${tx("όνομα σκύλου")}</b> ${tx("πάνω σε άλλο για να αλλάξουν θέσεις. Η αρίθμηση ακολουθεί τη θέση· κάθε μετακίνηση καταγράφεται ως χειροκίνητη αλλαγή και τυπώνεται (Άρθρο 16).")}</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${rows.map((r,i)=>`<div class="card" data-brace-row data-brow="${r.tid}|${r.bid}"
        style="display:flex;align-items:center;gap:12px;margin:0" ${i<shown?"":"hidden"}>
        <button class="grip noprint" data-drag="${r.tid}|${r.bid}"
          title="${tx("Σύρετε, ή ↑ ↓, για να αλλάξετε τη σειρά του ζεύγους")}"
          aria-label="${tx("Μετακίνηση ζεύγους")} ${r.no}">⠿</button>
        <span class="bno" style="font-size:34px;min-width:34px">${r.no}</span>
        <span style="flex:1;min-width:0">
          <span class="eyebrow" style="margin:0">${esc(r.terrain)}</span>
          <b style="display:block;font:600 19px/1.25 var(--f-d);margin-top:5px">${r.pair}</b>
          <span class="muted">${esc(r.handlers)}</span>
        </span></div>`).join("")}
    </div>
    <div style="border-top:1px solid var(--line);margin-top:18px;padding-top:14px">
      <div class="fingerprint">${tx("κωδικός")} ${esc(d.seed)}<br>${new Date(d.at).toLocaleString("el-GR")} · ${esc(d.mode)}<br>${tx("αποτύπωμα")} ${esc(d.hash)}</div>
      <p style="margin-top:8px">${tx("Η σειρά είναι ενδεικτική — Άρθρο 16.")}</p>
      <button class="b-redraw noprint" data-act="doDraw">${tx("Νέα κλήρωση — ακυρώνει την τρέχουσα")}</button>
    </div>
    ${afterDraw(t)}`}`;
}
/* The draw is done. Whoever did it is either standing in the field with a phone
   or sitting at a laptop the night before, and the next move is different for
   each. Both are named here rather than left to be hunted for in Εξαγωγές. */
function afterDraw(t){
  const day = t.days[S.day];
  const q = smsQueue(t);
  const sent = q.filter(x=>t.sms[x.key]==="ΕΣΤΑΛΗ").length;
  return `<div class="card noprint" style="margin-top:18px">
    <div class="eyebrow">${tx("Η κλήρωση έγινε")}</div>
    <div class="row tight" style="margin-top:12px">
      <button class="b-pri" data-tab="sms">${tx("Αποστολή σειράς")}${
        q.length ? " · " + sent + "/" + q.length : ""}</button>
      <button data-act="shareTrial">${tx("Αποστολή στο κινητό")}</button>
      <button data-act="printDraw">${tx("Εκτύπωση λίστας")}</button>
    </div>
    <div class="tiny" style="margin-top:12px">${tx("Η «Αποστολή στο κινητό» στέλνει τον αγώνα μαζί με τα κληρωμένα ζεύγη — φορτώστε τον στο κινητό (Ρυθμίσεις → Φόρτωση αρχείου → Συγχώνευση) και συνεχίστε από εκεί στο τερέν. Τα SMS φεύγουν από όποια συσκευή κρατά τη σειρά.")}</div>
  </div>`;
}

/* --- 8d. braces ---
   The brace card is the one thing this app exists to produce. Two dogs side by
   side, split down the middle, the number very large across the top. The left
   half is the dog drawn first — right of the jury — and the card says so,
   because handlers argue about it. Every state in §5 of the brief is here:
   εκκρεμεί, τρέχει, ολοκληρώθηκε, μονός, με συμπληρωματικό, επανάκληση,
   χειροκίνητη αλλαγή. */

/* Άρθρο 24 — each run lasts 15 minutes. The clock counts that down and keeps
   counting past zero rather than stopping, because the judge decides when the
   run ends, not the timer. */
const RUN_SECS = 15*60;                                  /* Άρθρο 24 */
/* The regulation says fifteen minutes. Some trials run longer and a judge may
   extend a run he wants to see more of, so the length is a trial setting and
   the extension is per brace. */
function runSecs(t, b){
  const base = (t && +t.runMins > 0 ? +t.runMins : 15) * 60;
  return base + ((b && b.extra) || 0);
}
function braceElapsed(b){
  let s = b.elapsed || 0;
  if(b.startedAt) s += Math.floor((Date.now() - b.startedAt)/1000);
  return s;
}
function clockText(secs){
  const over = secs < 0, n = Math.abs(secs);
  return (over?"+":"") + String(Math.floor(n/60)).padStart(2,"0") + ":" + String(n%60).padStart(2,"0");
}
/* one interval for the whole page; the running braces read their own start time */
let clockTimer = null;
function startClocks(){
  clearInterval(clockTimer);
  if(!document.querySelector("[data-clock]")) return;
  const tick = ()=>{
    document.querySelectorAll("[data-clock]").forEach(n=>{
      const left = (+n.dataset.allow || RUN_SECS) - (+n.dataset.elapsed + (n.dataset.running==="1"
        ? Math.floor((Date.now() - +n.dataset.since)/1000) : 0));
      n.textContent = clockText(left);
      n.classList.toggle("over", left < 0);
    });
  };
  tick(); clockTimer = setInterval(tick, 1000);
}
function clockEl(b, big, t){
  const running = !!b.startedAt, allow = runSecs(t, b);
  return `<span class="clock${big?" big":""}" data-clock data-elapsed="${b.elapsed||0}"
    data-running="${running?1:0}" data-since="${b.startedAt||0}" data-allow="${allow}"
    >${clockText(allow - braceElapsed(b))}</span>`;
}

function qualChip(t, id){
  const r = t.results[id];
  if(!r || !r.qual || r.qual==="-") return "";
  const pts = pointsFor(t, r);
  return `<span class="chip o">${esc(tx(r.qual))}${r.award&&r.award!=="-"?" · "+esc(r.award):""}${pts?" · "+pts:""}</span>`;
}

function braceCard(t, tr, b, opts){
  opts = opts || {};
  const ea = t.entries.find(e=>e.id===b.a), eb = t.entries.find(e=>e.id===b.b);
  const running = b.status==="ΤΡΕΧΕΙ", done = b.status==="ΟΛΟΚΛΗΡΩΘΗΚΕ";

  const side = (e,pos,cls)=>{
    if(!e) return `<div class="dog none">
      <div class="pos">${pos}</div>
      <div class="nm">${tx("ΜΟΝΟΣ")}</div>
      <button class="b-sm noprint" style="margin-top:10px" data-trailer="${tr.id}|${b.id}">${tx("+ Συμπληρωματικός")}</button>
    </div>`;
    const d = dogById(e.dogId)||{};
    const isTrailer = b.trailer && e.id===b.b;
    /* Σημειώσεις is the action a judge reaches for on every run, so it sits
       with the dog. The rare ones — επανάκληση, ανταλλαγή — live in the footer
       and keep the halves readable from arm's length. */
    /* The half itself is the dog box: drag it onto another dog anywhere in the
       day and the two change places. Ο συμπληρωματικός stays put — he is
       completing a ζεύγος, not competing in it (Άρθρο 40). */
    const box = isTrailer ? "" : ` dogbox" data-dogbox="${tr.id}|${b.id}|${e.id}`;
    return `<div class="dog ${cls}${box}">
      <div class="pos">${pos}</div>
      ${isTrailer?`<div style="margin-top:6px"><span class="chip">${tx("ΣΥΜΠΛΗΡΩΜΑΤΙΚΟΣ")}</span></div>`:""}
      <div class="nm">${esc(d.name||"—")}</div>
      <div class="mt">${esc(breedName(d.breed))}${d.sex?" · "+d.sex:""}${e.season?" · οίστρος":""}</div>
      <div class="mt">${esc(perName(e.handlerId))}</div>
      ${opts.actions ? (isTrailer
        ? `<div class="tiny" style="margin-top:12px">${tx("Δεν βαθμολογείται.")}</div>`
        : `<button class="b-full noprint" style="margin-top:12px;min-height:48px"
            data-note="${e.id}::${b.id}">${tx("Σημειώσεις")}</button>`) : ""}
    </div>`;
  };

  /* The rare per-dog actions, named by dog so it is clear which one they hit.
     They stay off the running card: at arm's length that one carries the two
     dogs, the clock and nothing else. */
  const extra = [];
  if(opts.actions && !opts.big) [ea, eb].forEach(e=>{
    if(!e) return;
    if(b.trailer && e.id === b.b) return;      /* he is running, not competing */
    const nm = dogName(e.dogId);
    extra.push(`<button class="b-sm" data-recall="${tr.id}|${e.id}">${tx("Επανάκληση")} ${esc(nm)}</button>`);
    extra.push(`<button class="b-sm" data-swap="${tr.id}|${b.id}|${e.id}">${tx("Ανταλλαγή")} ${esc(nm)}</button>`);
  });
  if(opts.actions && !opts.big && b.trailer)
    extra.push(`<button class="b-sm b-warn" data-untrailer="${tr.id}|${b.id}">${tx("Αφαίρεση συμπληρωματικού")}</button>`);
  /* Το ίδιο μήνυμα, χωρίς να περιμένεις να κλείσει το προηγούμενο ζεύγος: ο
     κριτής βλέπει ότι το τερέν προχωρά γρήγορα και τους καλεί νωρίτερα. */
  if(opts.actions && !opts.big && b.status === "ΕΚΚΡΕΜΕΙ" && nextUpQueue(t, tr, b).some(x=>x.phone))
    extra.push(`<button class="b-sm" data-nextup="${tr.id}|${b.id}">${tx("Ειδοποίηση «σειρά σας»")}</button>`);

  /* the state, said once, in the top right */
  let state;
  if(running) state = `<span class="live"><i></i>${tx("ΤΡΕΧΕΙ")}</span>`;
  else if(done) state = `<span class="bstate">${tx("ΟΛΟΚΛΗΡΩΘΗΚΕ")}</span>`;
  else if(b.solo && !b.b) state = `<span class="bstate">${tx("ΜΟΝΟΣ")}</span>`;
  else state = `<span class="bstate">${tx("ΕΚΚΡΕΜΕΙ")}</span>`;

  const foot = [];
  if(b.recall){
    const who = [ea, eb].filter(Boolean).map(e=>esc(dogName(e.dogId)));
    foot.push((who.length > 1
      ? `${tx("Δεύτερη διαδρομή,")} ${who.join(" και ")} ${tx("μαζί")}`
      : `${tx("Δεύτερη διαδρομή του")} ${who[0]||"—"}`) + " (Άρθρο 30). Ξεχωριστό φύλλο σημειώσεων.");
  }
  if(b.trailer) foot.push("Εκτός κλήρωσης. Δεν προσμετράται στα τρία ζεύγη (Άρθρο 40).");
  if(b.manual) foot.push(`${tx("Χειροκίνητη αλλαγή από τον Πρόεδρο Κριτών,")} ${esc(b.manual.at||"")}${tx(". Τυπώνεται στη λίστα.")}`);

  return `<div class="brace ${running?"run":""} ${done?"done":""} ${b.recall?"recall":""}"
    data-brow="${tr.id}|${b.id}">
    <div class="bhead">
      <button class="grip noprint" data-drag="${tr.id}|${b.id}"
        title="${tx("Σύρετε, ή ↑ ↓, για να αλλάξετε τη σειρά του ζεύγους")}"
        aria-label="${tx("Μετακίνηση ζεύγους")} ${b.no}">⠿</button>
      <div class="bno">${b.no}</div>
      ${opts.big&&running?`<div style="margin-left:auto;text-align:right">
          ${state}${clockEl(b,true,t)}
          <div class="tiny" style="color:#ffffffcc;margin-top:4px">${tx("από")} ${clockText(runSecs(t,b))} ${tx("(Άρθρο 24)")}</div></div>`
        :`${b.recall?`<span class="chip y">${tx("ΕΠΑΝΑΚΛΗΣΗ")}</span>`:""}
          ${b.trailer?`<span class="chip n">${tx("ΜΕ ΣΥΜΠΛΗΡΩΜΑΤΙΚΟ")}</span>`:""}
          ${b.manual?`<span class="chip dash">${tx("ΧΕΙΡΟΚΙΝΗΤΗ ΑΛΛΑΓΗ")}</span>`:""}
          ${qualChip(t,b.a)} ${b.b?qualChip(t,b.b):""}
          ${state}${running?clockEl(b,false,t):""}`}
      <button class="b-sm noprint" data-bstat="${tr.id}|${b.id}">${
        b.status==="ΕΚΚΡΕΜΕΙ"?"Έναρξη":running?"Λήξη":"Επαναφορά"}</button>
    </div>
    <div class="bbody">
      ${side(ea,"ΔΕΞΙΑ ΤΗΣ ΕΠΙΤΡΟΠΗΣ","a")}
      <div class="vline"></div>
      ${side(eb,"ΑΡΙΣΤΕΡΑ ΤΗΣ ΕΠΙΤΡΟΠΗΣ","b")}
    </div>
    ${foot.length?`<div class="bfoot">${foot.join("<br>")}</div>`:""}
    ${extra.length?`<div class="bfoot noprint"><div class="row tight">${extra.join("")}</div></div>`:""}</div>`;
}

/* Άρθρο 16: the order may be changed, never silently. Numbering is positional,
   so brace 1 dropped three places down becomes brace 4, and the move is stamped
   on the braces it touched and printed on the draw list. */
function renumberAndMark(t, tr, bs, moved){
  const stamp = {by:"Πρόεδρος Κριτών", at:new Date().toLocaleString("el-GR")};
  bs.forEach((x, k)=>{ x.no = k + 1; });
  moved.manual = stamp;
  save(); render();
}
/* Swapping two dogs between ζεύγη, whichever terrain each is on. Both braces are
   stamped, because both changed. Shared by the drag and by the Ανταλλαγή dialog. */
function swapEntries(t, eid, other){
  if(!eid || !other || eid === other) return false;
  const stamp = {by:"Πρόεδρος Κριτών", at:new Date().toLocaleString("el-GR")};
  (t.days[S.day].terrains||[]).forEach(tr=>(tr.braces||[]).forEach(b=>{
    let touched = false;
    if(b.a===eid){ b.a = other; touched = true; } else if(b.a===other){ b.a = eid; touched = true; }
    if(b.b===eid){ b.b = other; touched = true; } else if(b.b===other){ b.b = eid; touched = true; }
    if(touched) b.manual = stamp;
  }));
  return true;
}

/* Pointer events, so one path covers a mouse and a thumb.

   Only two things on these screens move, and each has its own handle. The ⠿ grip
   drags a ζεύγος up or down inside its τερέν — the row follows the finger and the
   row it would land on is marked. Everything else on the row is a button and
   stays one: a drag that started anywhere on the row meant a tap on Σημειώσεις
   moved the brace instead. */
/* Ένα ζεύγος έξω από το κάδρο ήταν απλησίαστο: το δάχτυλο έφτανε στην άκρη της
   οθόνης και η σελίδα δεν ακολουθούσε, οπότε ο σκύλος δεν πήγαινε ποτέ πιο κάτω
   από ό,τι χωρούσε. Τώρα η σελίδα κυλά όσο το δάχτυλο κρατιέται στην άκρη, και
   σταματά μόλις φύγει. Η πάνω ζώνη ξεκινά κάτω από την επικεφαλίδα και τη μπάρα:
   πιο ψηλά το δάχτυλο είναι πάνω στα σταθερά στοιχεία, όχι στη λίστα. */
function edgeScroll(onTick){
  let vy = 0, raf = 0, ax = 0, ay = 0;
  const tick = ()=>{
    if(!vy){ raf = 0; return; }
    const before = window.scrollY;
    window.scrollBy(0, vy);
    /* Με το δάχτυλο ακίνητο στην άκρη δεν έρχεται άλλο pointermove, οπότε ο
       στόχος θα πάγωνε ενώ η λίστα κυλά από κάτω του. Τον ξαναϋπολογίζουμε. */
    if(window.scrollY !== before && onTick) onTick(ax, ay);
    raf = requestAnimationFrame(tick);
  };
  return {
    move(clientX, clientY){
      ax = clientX; ay = clientY;
      const nav = document.querySelector("nav");
      const top = (nav ? nav.getBoundingClientRect().bottom : 0) + 16;
      /* Η κάτω ζώνη πιο στενή από την πάνω: πάνω την τρώει ούτως ή άλλως η
         σταθερή επικεφαλίδα, ενώ κάτω κάθε pixel της ζώνης είναι ένα pixel όπου
         δεν μπορείς να αφήσεις τον σκύλο χωρίς να φύγει η λίστα. */
      const bot = window.innerHeight - 72;
      const z = 72;
      vy = clientY < top + z ? -Math.max(4, Math.ceil((top + z - clientY) / 5))
         : clientY > bot     ?  Math.max(4, Math.ceil((clientY - bot) / 5)) : 0;
      if(vy && !raf) raf = requestAnimationFrame(tick);
    },
    stop(){ vy = 0; if(raf) cancelAnimationFrame(raf); raf = 0; }
  };
}

function dragReorder(ev){
  const grip = ev.target.closest("[data-drag]");
  if(!grip) return;
  const row = grip.closest("[data-brow]"); if(!row) return;
  const [tid, bid] = grip.dataset.drag.split("|");
  /* only the braces of this τερέν: two terrains render into the same container
     and a brace never moves from one to the other by being dragged */
  const rows = [...document.querySelectorAll("[data-brow]")]
    .filter(r => r.dataset.brow.split("|")[0] === tid);
  const from = rows.indexOf(row); if(from < 0) return;
  /* Η μετατόπιση μετριέται στο έγγραφο, όχι στην οθόνη: όταν η σελίδα κυλά
     μόνη της στην άκρη, η γραμμή δεν πρέπει να ξεφύγει από το δάχτυλο. */
  const startY = ev.clientY, startScroll = window.scrollY;
  let moved = false, to = from, mark = null;
  const es = edgeScroll((x, y)=>onMove({clientX:x, clientY:y, preventDefault(){}}));

  const clear = ()=>{ if(mark) mark.classList.remove("dropto","below"); mark = null; };
  const onMove = e=>{
    const dy = (e.clientY + window.scrollY) - (startY + startScroll);
    if(!moved && Math.abs(dy) < 6) return;
    if(moved) es.move(e.clientX, e.clientY);
    if(!moved){ moved = true; row.classList.add("dragging");
                grip.setPointerCapture && grip.setPointerCapture(e.pointerId);
                document.body.style.userSelect = "none"; }
    e.preventDefault();
    row.style.transform = "translateY(" + dy + "px)";
    /* The landing row is worked out from where the rows actually are, not from
       what is under the finger: the action bar is fixed to the bottom of the
       screen and hit-testing hands back that button instead of the row beneath
       it, so a drop at the foot of a phone screen was being thrown away.
       Rows of unequal height — an open ζεύγος beside collapsed ones — work
       either way, because each row is measured, not assumed. */
    to = from;
    let best = null;
    rows.forEach((r, i)=>{
      if(r === row) return;
      const rc = r.getBoundingClientRect();
      if(e.clientY >= rc.top && e.clientY <= rc.bottom){ best = r; to = i; }
    });
    if(!best){                                   /* πάνω από την πρώτη ή κάτω από την τελευταία */
      const firstR = rows[0].getBoundingClientRect();
      const lastR  = rows[rows.length-1].getBoundingClientRect();
      if(e.clientY < firstR.top && row !== rows[0]){ best = rows[0]; to = 0; }
      else if(e.clientY > lastR.bottom && row !== rows[rows.length-1]){
        best = rows[rows.length-1]; to = rows.length - 1; }
    }
    clear();
    if(best){
      mark = best; best.classList.add("dropto");
      if(to > from) best.classList.add("below");
    } else to = from;
  };
  const onUp = ()=>{
    es.stop();
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    document.body.style.userSelect = "";
    clear();
    row.style.transform = ""; row.classList.remove("dragging");
    if(!moved || to === from) return;
    const t = trialById(S.trialId); if(!t) return;
    const terr = t.days[S.day].terrains.find(x=>x.id === tid); if(!terr) return;
    const bs = terr.braces || [];
    const idx = bs.findIndex(x=>x.id === bid); if(idx < 0) return;
    const [b] = bs.splice(idx, 1);
    bs.splice(to, 0, b);
    renumberAndMark(t, terr, bs, b);
    toast(tx("Το ζεύγος πήγε στη θέση ") + (to + 1));
  };
  document.addEventListener("pointermove", onMove, {passive:false});
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onUp);
}

/* A drag is not the only way in. The grip is a real button, so it takes focus,
   and ↑ ↓ on it step the ζεύγος one place — the same move, the same mark. That
   is the keyboard path, and it is also the cold-morning path for anyone who
   would rather tap twice than drag with a glove on. */
function moveBrace(tid, bid, dir){
  const t = trialById(S.trialId); if(!t) return false;
  const tr = (t.days[S.day].terrains||[]).find(x=>x.id===tid); if(!tr) return false;
  const bs = tr.braces || [];
  const i = bs.findIndex(b=>b.id===bid), j = i + dir;
  if(i < 0 || j < 0 || j >= bs.length) return false;
  const [b] = bs.splice(i, 1);
  bs.splice(j, 0, b);
  renumberAndMark(t, tr, bs, b);
  /* the row was re-rendered under the finger — put the focus back on its grip */
  const again = document.querySelector(`[data-drag="${tid}|${bid}"]`);
  if(again) again.focus();
  return true;
}
document.addEventListener("keydown", ev=>{
  const grip = ev.target.closest && ev.target.closest("[data-drag]");
  if(!grip) return;
  const dir = ev.key === "ArrowUp" ? -1 : ev.key === "ArrowDown" ? 1 : 0;
  if(!dir) return;
  ev.preventDefault();
  const [tid, bid] = grip.dataset.drag.split("|");
  if(moveBrace(tid, bid, dir)) toast(tx("Το ζεύγος μετακινήθηκε"));
});

/* The second gesture: a dog box dragged onto another dog box, and the two change
   places. A copy of the box follows the finger so it is clear what is being
   carried, and the box it is over is outlined so it is clear where it will land. */
function dragDogBox(ev){
  const src = ev.target.closest("[data-dogbox]");
  if(!src || ev.target.closest("button.b-full, button.b-sm")) return;
  const eid = src.dataset.dogbox.split("|")[2];
  const r = src.getBoundingClientRect();
  const offX = ev.clientX - r.left, offY = ev.clientY - r.top;
  const boxes = [...document.querySelectorAll("[data-dogbox]")];
  let moved = false, ghost = null, over = null;
  const es = edgeScroll((x, y)=>onMove({clientX:x, clientY:y, preventDefault(){}}));

  const onMove = e=>{
    if(!moved && Math.abs(e.clientX-ev.clientX) < 6 && Math.abs(e.clientY-ev.clientY) < 6) return;
    if(!moved){
      moved = true;
      src.classList.add("lifting");
      ghost = src.cloneNode(true);
      ghost.removeAttribute("data-dogbox");
      ghost.classList.remove("lifting"); ghost.classList.add("ghost");
      ghost.style.cssText += ";position:fixed;left:0;top:0;margin:0;z-index:60;"
        + "pointer-events:none;width:" + r.width + "px";
      document.body.appendChild(ghost);
      document.body.style.userSelect = "none";
      /* No setPointerCapture here. The moves are listened for on the document and
         the box is an inline span inside the row: capturing on it stopped the
         events arriving at all, so the drag froze after the first few pixels. */
    }
    e.preventDefault();
    es.move(e.clientX, e.clientY);
    ghost.style.transform = "translate(" + (e.clientX-offX) + "px," + (e.clientY-offY) + "px)";
    /* measured, not hit-tested — same reason as the row drag: the fixed action
       bar sits over the bottom of the screen and would take the drop */
    let box = null;
    for(const el3 of boxes){
      if(el3 === src) continue;
      const rc = el3.getBoundingClientRect();
      if(e.clientX >= rc.left && e.clientX <= rc.right
         && e.clientY >= rc.top && e.clientY <= rc.bottom){ box = el3; break; }
    }
    const ok = box && box.dataset.dogbox.split("|")[2] !== eid;
    if(over && over !== box) over.classList.remove("target");
    over = ok ? box : null;
    if(over) over.classList.add("target");
  };
  const onUp = ()=>{
    es.stop();
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    document.body.style.userSelect = "";
    src.classList.remove("lifting");
    if(ghost) ghost.remove();
    const target = over; if(over) over.classList.remove("target");
    if(!moved) return;
    /* A real drag never also opens the brace underneath it. The guard has to
       expire on its own: a drag that ends over a different element fires no
       click at all, and a listener left armed would swallow the next tap. */
    const eatClick = e=>{ e.stopPropagation(); e.preventDefault(); };
    document.addEventListener("click", eatClick, {capture:true, once:true});
    setTimeout(()=>document.removeEventListener("click", eatClick, {capture:true}), 400);
    if(!target) return;
    const t = trialById(S.trialId); if(!t) return;
    const other = target.dataset.dogbox.split("|")[2];
    const a = dogName((t.entries.find(x=>x.id===eid)||{}).dogId);
    const bnm = dogName((t.entries.find(x=>x.id===other)||{}).dogId);
    if(!swapEntries(t, eid, other)) return;
    save(); render();
    toast(a + " ⇄ " + bnm + " — χειροκίνητη αλλαγή");
  };
  document.addEventListener("pointermove", onMove, {passive:false});
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onUp);
}

/* collapsed: a number and two names, which is all you need to know where you are */
function braceBrief(t, tr, b){
  const ea = t.entries.find(e=>e.id===b.a), eb = t.entries.find(e=>e.id===b.b);
  const done = b.status==="ΟΛΟΚΛΗΡΩΘΗΚΕ";
  const names = (ea?dogName(ea.dogId):"—") + " / " + (eb?dogName(eb.dogId):tx("ΜΟΝΟΣ"));
  const who = [ea&&perName(ea.handlerId), eb&&perName(eb.handlerId)].filter(Boolean).join(" · ");
  const box = e => e && !(b.trailer && e.id === b.b)
    ? `<span class="dogbox" data-dogbox="${tr.id}|${b.id}|${e.id}">${esc(dogName(e.dogId))}</span>`
    : `<span>${esc(e ? dogName(e.dogId) : tx("ΜΟΝΟΣ"))}</span>`;
  /* The grip is a button of its own and sits outside the one that opens the
     ζεύγος: a focusable handle inside a button cannot be reached by keyboard,
     and the whole row must not become a drag handle. */
  return `<div class="briefrow" data-brow="${tr.id}|${b.id}">
    <button class="grip noprint" data-drag="${tr.id}|${b.id}"
      title="${tx("Σύρετε, ή ↑ ↓, για να αλλάξετε τη σειρά του ζεύγους")}"
      aria-label="${tx("Μετακίνηση ζεύγους")} ${b.no}">⠿</button>
    <button class="brief ${done?"done":""}" data-openbrace="${b.id}">
    <span class="n">${b.no}</span>
    <span class="who"><b>${box(ea)} / ${box(eb)}</b><span>${esc(who)}</span></span>
    ${done ? qualChip(t,b.a) || `<span class="chip">${tx("ΟΛΟΚΛΗΡΩΘΗΚΕ")}</span>`
      : b.recall ? `<span class="chip y">${tx("ΕΠΑΝΑΚΛΗΣΗ")}</span>`
      : (b.solo&&!b.b) ? `<span class="chip">${tx("ΜΟΝΟΣ")}</span>`
      : `<span class="chip">${tx("ΕΚΚΡΕΜΕΙ")}</span>`}
  </button></div>`;
}
/* Field mode. The live brace is expanded with its countdown; the rest collapse
   to a number and two names, so scrolling a terrain you know where you are
   without reading. Tap a collapsed one to open it. */
function tBraces(t){
  const day = t.days[S.day];
  const jf = S.judgeFilter;
  const terrains = day.terrains.filter(tr=>!jf || tr.judgeIds.includes(jf));
  if(!day.draw) return `<div class="empty">${tx("Δεν έχει γίνει κλήρωση για την ημέρα αυτή. Πηγαίνετε στην καρτέλα «Κλήρωση».")}</div>`;
  const printHd = printHead(t, day, terrains.length===1 ? terrains[0].name : "");
  return `
  ${!navigator.onLine ? `<div class="note noprint" style="display:flex;gap:10px;align-items:center">
    <span style="width:8px;height:8px;border-radius:50%;background:var(--stubble);flex:none"></span>
    ${tx("Εκτός σύνδεσης. Οι αλλαγές αποθηκεύονται στη συσκευή και ταξιδεύουν με τη Μεταφορά.")}</div>` : ""}
  <div class="row noprint" style="margin-bottom:12px">
    <div class="grow"><label>${tx("Προβολή ως κριτής (βλέπει μόνο το τερέν του)")}</label>
    <select data-jfilter><option value="">${tx("Πρόεδρος Κριτών — όλα τα τερέν")}</option>
      ${DB.judges.map(j=>`<option value="${j.id}" ${jf===j.id?"selected":""}>${esc(j.name)}</option>`).join("")}
    </select></div>
    <button class="b-sm" data-act="print" style="align-self:flex-end">${tx("Εκτύπωση / PDF")}</button>
  </div>
  <div class="tiny noprint" style="margin-bottom:12px">${tx("Σύρετε το")} <b>⠿</b> ${tx("για να πάει ένα ζεύγος πάνω ή κάτω, ή ένα")} <b>${tx("όνομα σκύλου")}</b> ${tx("πάνω σε άλλο για να αλλάξουν θέσεις. Καταγράφεται ως χειροκίνητη αλλαγή (Άρθρο 16).")}</div>
  ${printHd}
  ${terrains.map(tr=>{
    const braces = tr.braces||[];
    const live = braces.find(b=>b.status==="ΤΡΕΧΕΙ");
    return `
    <div class="row" style="margin:18px 0 10px;align-items:baseline">
      <h3 class="grow" style="margin:0">${esc(tr.name)}</h3>
      <span class="muted">${braces.length} ${tx(braces.length===1?"ζεύγος":"ζεύγη")}
        ${tr.judgeIds.length?"· "+tr.judgeIds.map(j=>esc((judById(j)||{}).name||"?")).join(", "):""}</span>
    </div>
    ${braces.length ? braces.map(b=>{
            const open = b===live || S.openBrace===b.id;
            return open ? braceCard(t,tr,b,{big:b===live, actions:true}) : braceBrief(t,tr,b);
          }).join("")
      : `<div class="empty">${tx("Χωρίς ζεύγη σε αυτό το τερέν.")}</div>`}`;
  }).join("")}
  <div class="tiny noprint" style="margin-top:16px">${tx("Άρθρο 30: ο κριτής μπορεί να ζητήσει")}
  <b>${txOne("επανάκληση")}</b> ${tx("σκύλου μεγάλης αξίας — προστίθεται νέα διαδρομή στο τέλος του τερέν με δικές της σημειώσεις. Σε μονό αριθμό σκύλων μπορεί να προστεθεί")} <b>${tx("συμπληρωματικός")}</b> ${tx("για να συμπληρωθεί το τελευταίο ζεύγος.")}</div>`;
}

/* What would go wrong if he pressed the button now — said before he presses
   it, not in an alert afterwards. Each line names the article and the fix. */
function drawCheck(t){
  const day = t.days[S.day];
  const active = t.entries.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ");
  const need = t.format==="ΖΕΥΓΗ" ? 2 : 1;
  const cacit = t.award==="CACIT";
  const stop = [], warn = [];

  if(!day.terrains.length)
    stop.push("Δεν έχουν οριστεί τερέν. Προσθέστε τουλάχιστον ένα στην καρτέλα «Τερέν & Κριτές».");
  if(!active.length)
    stop.push("Καμία δηλωμένη συμμετοχή. Προσθέστε συμμετοχές ή εισαγάγετε αρχείο.");

  day.terrains.forEach(tr=>{
    if(tr.judgeIds.length < (cacit?3:need))
      stop.push(`${tx("Το")} ${tr.name} ${tx("έχει")} ${tr.judgeIds.length} ${tr.judgeIds.length===1?"κριτή":"κριτές"}. `
        + `${tx("Χρειάζονται")} ${cacit?3:need} ${tx("(Άρθρο 48")}${cacit?", ο ένας Μεγάλης Έρευνας":""}).`);
    const bad = active.filter(e=>(tr.entryIds||[]).includes(e.id) && judgeConflict(tr,e,t))
      .map(e=>dogName(e.dogId));
    if(bad.length)
      warn.push(`${tx("Στο")} ${tr.name} ${tx("ο κριτής έχει δικό του σκύλο (Άρθρο 49):")} ${bad.join(", ")}. `
        + "Η κλήρωση θα τους μετακινήσει.");
  });

  /* H2 is only as good as the link between a κριτής and his own record in the
     μητρώο κυναγωγών. Unlinked, judgeConflict() returns false for him and the
     draw enforces nothing — silently, which is the part worth saying out loud. */
  const unlinked = [...new Set([].concat(...day.terrains.map(tr=>tr.judgeIds||[])))]
    .map(judById).filter(j=>j && !j.personId);
  if(unlinked.length){
    const sur = n => noTone(String(n||"").split(/\s+/).filter(Boolean).pop());
    const hint = unlinked.map(j=>{
      const same = DB.people.filter(p=>sur(p.name) && sur(p.name)===sur(j.name)).map(p=>p.name);
      return j.name + (same.length ? ` ${tx("(ίδιο επώνυμο:")} ${same.join(", ")})` : "");
    });
    warn.push(`${tx("Χωρίς σύνδεση με το μητρώο κυναγωγών:")} ${hint.join(" · ")}. `
      + "Για αυτούς ο έλεγχος του Άρθρου 49 δεν μπορεί να γίνει — συνδέστε τους στο Μητρώο → Κριτές.");
  }

  const braces = Math.ceil(active.length / need);
  if(active.length && braces < 3)
    warn.push(`${active.length} ${tx("σκύλοι δίνουν")} ${braces} ${tx(braces===1?"ζεύγος":"ζεύγη")}. `
      + "Ο αγώνας μετρά με τουλάχιστον 3 (Άρθρο 40, ΕΚ Άρθρο 5).");
  const assigned = day.terrains.reduce((a,tr)=>a + (tr.assigned ? (tr.entryIds||[]).length : 0), 0);
  if(assigned) warn.push(`${assigned} ${tx("σκύλοι έχουν ανατεθεί χειροκίνητα σε τερέν.")} `
    + "Οι υπόλοιποι κατανέμονται από την κλήρωση.");
  if(day.draw) warn.push(tx("Υπάρχει ήδη κλήρωση για την ημέρα αυτή. Νέα κλήρωση την ακυρώνει."));

  if(!stop.length && !warn.length) return "";
  return `${stop.length?`<div class="err"><b>${tx("Η κλήρωση δεν μπορεί να γίνει ακόμη.")}</b><br>
    ${stop.map(esc).join("<br>")}</div>`:""}
    ${warn.length?`<div class="note">${warn.map(esc).join("<br>")}</div>`:""}`;
}

/* The reveal is not decoration: it reads the braces out one at a time the way
   the draw is read out to the field. prefers-reduced-motion gets all of them at
   once, instantly. */
let revealTimer = null;
function revealBraces(){
  clearInterval(revealTimer);
  const nodes = [...document.querySelectorAll("[data-brace-row]")];
  const finish = ()=>{ S.reveal = null; el("fab").innerHTML = fabFor(); toast(tx("Η κλήρωση ολοκληρώθηκε")); };
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    nodes.forEach(n=>{ n.hidden = false; }); finish(); return;
  }
  let i = 0;
  revealTimer = setInterval(()=>{
    if(i >= nodes.length){ clearInterval(revealTimer); finish(); return; }
    nodes[i].hidden = false; nodes[i].classList.add("reveal");
    S.reveal = ++i; el("fab").innerHTML = fabFor();
  }, 150);
}
