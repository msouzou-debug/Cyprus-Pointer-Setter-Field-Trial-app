<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2B4D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Κ.Ο.Α.Δ.">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/app-icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Cynegeticus — Διαχείριση Αγώνων Κ.Ο.Α.Δ.</title>
<!-- Commissioner and Source Sans 3 both carry full Greek. They are an
     enhancement, never a dependency. Loaded through media="print" so the
     request never blocks the first paint: on a hillside with one bar of signal
     the app must draw immediately and pick the faces up if they arrive. The
     service worker keeps them after the first visit; with no network at all
     the type falls back to a system stack with Greek coverage and works
     through scale and weight instead. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300;400;600;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:wght@600&display=swap">
<style>
/* ==========================================================================
   Κ.Ο.Α.Δ. — design tokens.
   Two registers on one set of tokens: field mode is large, high-contrast and
   thumb-driven; desk mode is the same system at a tighter density. Field mode
   sets the floor — nothing below 15px, no tap target under 48px — and the
   laptop inherits from it, never the other way round.
   ========================================================================== */
:root{
  /* colour — taken from the badge and the ground these dogs work */
  --navy:#1E2B4D;      /* header, brand surfaces */
  --navy-d:#141E36;    /* navigation */
  --navy-l:#E6E9F0;    /* navy chip fill */
  --stone:#EFEAE0;     /* page; limestone, and it reads in sunlight */
  --card:#FFFFFF;
  --sand:#F5F1E9;      /* quiet fill inside cards */
  --ink:#171A21;
  --slate:#4C4B46;     /* secondary text — darkened from the canvas's #6B6A64,
                          which was 4.5:1 on --stone. The field screens' breed
                          and handler lines are read in sunlight, so this holds
                          7:1 against every surface it sits on: 7.3 on stone,
                          8.7 on white, 7.8 on sand (brief §7) */
  --slate-2:#9B968C;   /* third-level text */
  --dim:#8F8B82;       /* finished, spent */
  --setter:#8C3A1E;    /* the single accent: what is happening now */
  --stubble:#C8A24A;   /* warnings, οίστρος, pending SMS */
  --stubble-bg:#F3E4BE;
  --stubble-ink:#5E4813;
  --stubble-soft:#FBF4E3;
  --bad:#B3261E;       /* elimination, data loss */
  --bad-bg:#FDF3F2;
  --bad-line:#E0BEBA;
  --ok:#4A7C3F;        /* sent, paid */
  --ok-bg:#EDF3EB;
  --ok-ink:#2F5427;
  --line:#D9D3C7;      /* hairline */
  --line-s:#C9C2B4;    /* card border */
  --line-f:#E4DED2;    /* faintest rule */

  /* type — Greek coverage is mandatory, so every stack ends in a system face
     that has it. With no font files the type still works through scale and
     weight; that is the offline fallback the brief asks for. */
  --f-d:"Commissioner","Noto Sans","Segoe UI",Roboto,system-ui,sans-serif;
  --f-b:"Source Sans 3","Noto Sans","Segoe UI",Roboto,system-ui,sans-serif;
  --f-m:ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;

  /* rhythm 4 · 8 · 12 · 16 · 24 · 32 · 48 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r-chip:2px; --r:6px; --r-pill:999px;
  /* the wordmark stands apart from the body face on purpose — see LOGO-BRIEF.md */
  --f-w:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --cream:#EFEAE0; --ink-2:#5B5F6A;
  --tap:48px;          /* cold hands, gloves */
  font-synthesis-weight:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--stone); color:var(--ink);
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  font:400 17px/1.5 var(--f-b);
  padding-bottom:var(--s5);
}
body[data-field]{
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
h1,h2,h3{margin:0 0 .4em;font-family:var(--f-d);letter-spacing:-.01em}
h1{font:600 28px/1.15 var(--f-d)}
h2{font:600 22px/1.2 var(--f-d)}
h3{font:600 19px/1.25 var(--f-d)}
p{margin:0 0 .7em}
a{color:var(--setter)}
a:hover{color:#6E2C15}
.num,.tnum,table,input[type=number]{font-variant-numeric:tabular-nums}

/* an eyebrow: small caps in the accent, the canvas uses it above every title */
.eyebrow{font:600 12px/1 var(--f-b);letter-spacing:.14em;color:var(--setter);
  text-transform:uppercase;margin-bottom:var(--s2)}

/* ---------- header ---------- */
header{background:var(--navy);color:#fff;
  padding:calc(8px + env(safe-area-inset-top)) var(--s4) 8px;
  display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:40}
header img{width:40px;height:40px;border-radius:50%;flex:0 0 auto;background:#fff2;object-fit:cover}
/* the app's own mark: a silhouette, not a badge — no disc behind it, no crop */
header img.mark{border-radius:0;background:none;object-fit:contain}
.wm{line-height:1.15;min-width:0}
.wm b{display:block;font:600 20px/1.1 var(--f-w);letter-spacing:.12em;color:var(--cream)}
.wm span{display:block;font:400 12px/1.3 var(--f-b);letter-spacing:.04em;color:#ffffffb0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.offline{margin-left:auto;font:600 12px/1 var(--f-b);letter-spacing:.06em;
  border:1px solid #ffffff59;border-radius:var(--r-chip);padding:6px 8px;white-space:nowrap}
.offline.warn{background:var(--bad);border-color:var(--bad);color:#fff}
/* the language toggle: two letters, next to the connection chip, on every screen */
.lang{margin-left:auto;background:none;color:#fff;font:700 12px/1 var(--f-b);letter-spacing:.06em;
  border:1px solid #ffffff59;border-radius:var(--r-chip);padding:7px 9px;cursor:pointer}
.lang:hover{background:#ffffff1a}
.lang + .offline{margin-left:8px}

/* ---------- the owner card ---------- */
/* Το σήμα μαύρο σε κρεμ, από κάτω το όνομα της εφαρμογής, και μετά ο ιδιοκτήτης:
   το έμβλημα του ομίλου με το όνομά του ολόκληρο. Τα ονόματα δεν μεταφράζονται. */
.owner{background:var(--stone);border:1px solid var(--line);border-radius:var(--r);
  padding:28px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.owner .mark{width:128px;height:128px;object-fit:contain}
.owner .wordmark{font:600 22px/1 var(--f-w);letter-spacing:.12em;color:var(--navy)}
.owner-by{display:flex;align-items:center;gap:12px;text-align:left}
.owner-by img{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:0 0 auto}
.owner-by b{display:block;font:600 13px/1.4 var(--f-b);color:var(--ink)}
.owner-by span{display:block;font:400 11px/1.4 var(--f-b);color:var(--ink-2)}
.owner-note{margin:0;max-width:44ch;font:400 11px/1.6 var(--f-b);color:var(--ink-2)}

/* ---------- nav ---------- */
/* Two parts: the tabs scroll sideways on a phone, the transfer buttons never do.
   Λήψη and Φόρτωση are the two things a head judge hunts for on the morning of
   an αγώνας, so they sit in the bar and stay put. */
nav{display:flex;background:var(--navy-d);
  position:sticky;top:calc(60px + env(safe-area-inset-top));z-index:39}
nav .tabs{display:flex;overflow-x:auto;flex:1 1 auto;min-width:0;scrollbar-width:none}
nav .tabs::-webkit-scrollbar{display:none}
nav .tools{display:flex;flex:0 0 auto;border-left:1px solid #ffffff26;background:var(--navy-d)}
nav button{background:none;border:0;color:#ffffff8c;font:400 16px/1 var(--f-b);
  padding:14px 16px;min-height:var(--tap);white-space:nowrap;
  border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:#fff;font-weight:600;border-bottom-color:var(--setter)}
nav .tools button{color:#fff;font-size:14px;padding:14px 12px;display:flex;align-items:center;gap:6px}
nav .tools button b{font:700 15px/1 var(--f-b)}
/* Σε τηλέφωνο τα δύο κουμπιά μεταφοράς έτρωγαν 173 από τα 412 pixel της μπάρας
   και άφηναν 238 για έξι καρτέλες. Το δάχτυλο έπεφτε στο δεξί μισό, που δεν
   κυλά, και η λωρίδα έμοιαζε κολλημένη. Μένουν στη θέση τους — αυτό ήταν και
   είναι το ζητούμενο — αλλά σκέτα βέλη: το νόημα το κρατούν το title και το
   aria-label, και οι καρτέλες παίρνουν πίσω 90 pixel. */
@media(max-width:520px){
  nav .tools button{padding:14px 12px;font-size:13px}
  /* Όχι display:none — η λέξη φεύγει από την οθόνη, όχι από το προσβάσιμο
     όνομα του κουμπιού. Ένα σκέτο «↓» δεν λέει τίποτα σε αναγνώστη οθόνης. */
  nav .tools button{position:relative}
  nav .tools button span{position:absolute;width:1px;height:1px;overflow:hidden;
    clip-path:inset(50%);white-space:nowrap}
  nav .tools button b{font-size:19px}
}
/* Χωρίς μπάρα κύλισης τίποτα δεν λέει ότι η λωρίδα συνεχίζει. Ένα σβήσιμο στην
   άκρη το λέει, και μόνο προς τη μεριά που πράγματι υπάρχει κι άλλο. */
nav .tabs.fade-r{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent)}
nav .tabs.fade-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 34px);
  mask-image:linear-gradient(90deg,transparent,#000 34px)}
nav .tabs.fade-lr{-webkit-mask-image:linear-gradient(90deg,transparent,#000 34px,#000 calc(100% - 34px),transparent);
  mask-image:linear-gradient(90deg,transparent,#000 34px,#000 calc(100% - 34px),transparent)}

main{padding:var(--s4);max-width:1240px;margin:0 auto}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--s4);margin-bottom:var(--s3)}
.card.quiet{background:var(--sand)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.tight{gap:6px}
/* a phone field is taller than its neighbour by the line that says where the
   message will go, so the pair lines up at the top instead of at the middle */
.row.top{align-items:flex-start}
.grow{flex:1 1 200px;min-width:0}
label{display:block;font:400 15px/1.3 var(--f-b);color:var(--slate);margin:0 0 5px}
input,select,textarea{width:100%;font:400 17px/1.3 var(--f-b);color:var(--ink);background:#fff;
  border:1px solid var(--line-s);border-radius:var(--r);padding:12px;min-height:var(--tap)}
textarea{min-height:92px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus,button:focus-visible,[data-act]:focus-visible{
  outline:3px solid #1E2B4D66;outline-offset:1px}
button,.btn{font:600 17px/1 var(--f-b);border-radius:var(--r);border:1px solid var(--line-s);
  background:#fff;color:var(--ink);padding:14px 16px;min-height:var(--tap);cursor:pointer}
/* an anchor that acts as a button: same chrome, and it centres its own label */
.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
button:active,.btn:active{transform:translateY(1px)}
.b-pri{background:var(--navy);border-color:var(--navy);color:#fff}
.b-act{background:var(--setter);border-color:var(--setter);color:#fff;font-family:var(--f-d);font-weight:800}
.b-sm{min-height:40px;padding:9px 12px;font-size:15px}
.b-warn{color:var(--bad);border-color:var(--bad-line);background:var(--bad-bg)}
.b-full{width:100%}
.muted{color:var(--slate);font-size:15px}
.tiny{color:var(--slate);font-size:15px;line-height:1.45}
code{font:400 15px/1.4 var(--f-m)}

/* chips: 2px corners, quiet by default. One accent only — .chip.a is the
   running brace and the primary action, and nothing else. */
.chip{display:inline-block;font:600 13px/1 var(--f-b);letter-spacing:.06em;
  padding:6px 8px;border-radius:var(--r-chip);background:var(--line-f);color:var(--slate)}
.chip.g{background:var(--ok-bg);color:var(--ok-ink);border:1px solid var(--ok)}
.chip.r{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line)}
.chip.y{background:var(--stubble-bg);color:var(--stubble-ink);border:1px solid var(--stubble)}
.chip.n{background:var(--navy-l);color:var(--navy)}
.chip.o{background:transparent;color:var(--navy);border:1px solid var(--navy)}
.chip.a{background:var(--setter);color:#fff}
.chip.dash{background:transparent;color:var(--navy);border:1px dashed var(--navy)}

table{width:100%;border-collapse:collapse;font-size:16px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line-f)}
td.num{white-space:nowrap}
th{font:600 13px/1 var(--f-b);letter-spacing:.06em;color:var(--slate);text-transform:uppercase;
  background:var(--sand);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
tbody tr:last-child td{border-bottom:0}
.scroll{overflow:auto;max-height:70vh;-webkit-overflow-scrolling:touch}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--s3)}
/* a κυναγωγός with one dog should not be as tall as one with four */
.split.top{align-items:start}
/* the register carries a longer line per dog than the entry list does */
.split.wide{grid-template-columns:repeat(auto-fit,minmax(348px,1fr))}

/* notices: an error states the fact and the fix, so it needs room to say both */
.note{background:var(--stubble-soft);border:1px solid var(--stubble);border-radius:var(--r);
  padding:12px 14px;font-size:16px;line-height:1.5;color:var(--stubble-ink);margin-bottom:var(--s3)}
.err{background:var(--bad-bg);border:1px solid var(--bad-line);border-radius:var(--r);
  padding:12px 14px;font-size:16px;line-height:1.5;color:var(--ink);margin-bottom:var(--s3)}
.err b{color:var(--bad)}
.empty{padding:var(--s6) var(--s4);color:var(--slate);font-size:17px;line-height:1.55;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:var(--s3)}
.empty h2{color:var(--ink);margin-bottom:6px}
hr{border:0;border-top:1px solid var(--line);margin:var(--s4) 0}

/* the storage bar. It cannot be dismissed and it does not scroll away —
   losing a day of results is worse than an ugly bar. */
#warn:not(:empty){position:sticky;top:calc(112px + env(safe-area-inset-top));z-index:38}
.nostore{background:var(--bad);color:#fff;padding:12px var(--s4);
  display:flex;gap:10px;align-items:flex-start;font:400 16px/1.45 var(--f-b)}
.nostore b{font-weight:600}
.nostore .bang{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #fff;
  font:700 14px/18px var(--f-b);text-align:center}

/* ---------- the brace card (signature) ----------
   Two dogs side by side, split down the middle, the number very large across
   the top. Left half is the dog drawn first — right of the jury — and the card
   says so, because handlers argue about it. */
.brace{background:var(--card);border:1px solid var(--line-s);border-radius:var(--r);
  margin-bottom:var(--s3);overflow:hidden}
.bhead{display:flex;align-items:center;gap:10px;padding:12px var(--s4) 8px;flex-wrap:wrap}
.bno{font:800 48px/1 var(--f-d);letter-spacing:-.03em;color:var(--ink);
  font-variant-numeric:tabular-nums;flex:none}
.bstate{font:600 13px/1 var(--f-b);letter-spacing:.1em;color:var(--slate);margin-left:auto}
.bhead .b-sm{margin-left:auto}
.bhead .chip + .b-sm{margin-left:0}
.bbody{display:grid;grid-template-columns:1fr 1px 1fr}
.vline{background:var(--line-s)}
.dog{padding:14px var(--s3) 16px;min-width:0}
/* "ΑΡΙΣΤΕΡΑ ΤΗΣ ΕΠΙΤΡΟΠΗΣ" has to survive half of a 402px phone without
   wrapping or spilling, so it is tracked tight and clipped rather than folded */
.dog .pos{font:600 10.5px/1.3 var(--f-b);letter-spacing:.06em;color:var(--slate);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dog.a .pos{color:var(--setter)}
.dog .nm{font:600 24px/1.15 var(--f-d);color:var(--ink);margin:8px 0 0;overflow-wrap:anywhere}
.dog .mt{font:400 15px/1.4 var(--f-b);color:var(--slate);margin-top:4px}
.bfoot{border-top:1px solid var(--line-f);padding:10px var(--s4);
  font:400 15px/1.4 var(--f-b);color:var(--slate)}

/* running — filled setter, unmistakable from arm's length */
.brace.run{background:var(--setter);border-color:var(--setter)}
.brace.run .bno,.brace.run .bstate,.brace.run .dog .nm{color:#fff}
.brace.run .dog .pos{color:#ffffffbf}
.brace.run .dog .mt{color:#ffffffd1}
.brace.run .bbody,.brace.run .bfoot{border-top-color:#ffffff47}
.brace.run .vline{background:#ffffff59}
.brace.run .b-sm{background:#fff;border-color:#fff;color:var(--setter)}
.brace.run .chip{background:#ffffff2e;color:#fff}
.live{display:inline-flex;align-items:center;gap:8px;color:#fff;
  font:600 13px/1 var(--f-b);letter-spacing:.1em;margin-left:auto}
.live i{width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.clock{font:600 20px/1 var(--f-m);color:#fff;font-variant-numeric:tabular-nums}
.clock.big{font-size:44px}
.clock.over{color:var(--stubble-bg)}

/* finished — dimmed, with the qualification chip */
.brace.done{background:var(--sand);border-color:var(--line)}
.brace.done .bno{color:var(--dim)}
.brace.done .dog .nm{color:var(--slate)}
.brace.done .dog .pos,.brace.done .dog .mt{color:var(--slate-2)}
.brace.done .bstate{color:var(--dim)}

/* solo — one half struck through, the word ΜΟΝΟΣ, and the trailer action */
.dog.none{background:repeating-linear-gradient(135deg,var(--sand) 0 8px,var(--stone) 8px 16px)}
.dog.none .pos{text-decoration:line-through;color:var(--slate-2)}
.dog.none .nm{text-decoration:line-through;color:var(--dim)}
.brace.recall{border-color:var(--stubble)}

/* collapsed brace in the live terrain: a number and two names, nothing else */
.brief{display:flex;align-items:center;gap:14px;background:var(--card);
  border:1px solid var(--line-s);border-radius:var(--r);padding:12px 14px;margin-bottom:var(--s2);
  width:100%;text-align:left;min-height:var(--tap)}
.brief.done{background:var(--sand);border-color:var(--line)}
/* the handle beside the row, not inside it */
.briefrow{display:flex;align-items:center;gap:4px;margin-bottom:var(--s2)}
/* οι τέσσερις γλώσσες δίπλα-δίπλα σε γραφείο, δύο-δύο σε κινητό */
.terms-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:10px 18px;margin-top:12px}
.briefrow .brief{margin-bottom:0}
.brief .n{font:800 30px/1 var(--f-d);color:var(--ink);min-width:32px;
  font-variant-numeric:tabular-nums;flex:none}
.brief.done .n{color:var(--dim)}
.brief .who{flex:1;min-width:0}
.brief .who b{display:block;font:600 19px/1.2 var(--f-d);color:var(--ink);overflow-wrap:anywhere}
.brief.done .who b{color:var(--slate)}
.brief .who span{display:block;font:400 15px/1.3 var(--f-b);color:var(--slate);margin-top:2px}

/* ---------- draw ---------- */
.seed{font:600 17px/1 var(--f-m);letter-spacing:.02em}
.fingerprint{font:400 15px/1.6 var(--f-m);color:var(--slate);font-variant-numeric:tabular-nums}
.reveal{animation:braceIn .22s ease-out both}
@keyframes braceIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .reveal{animation:none}
  .live i{animation:none}
}
/* re-draw is deliberately uncomfortable: it throws away a drawn order */
.b-redraw{background:var(--stubble-soft);border:1px solid var(--stubble);color:var(--stubble-ink);width:100%}

/* ---------- notes (field) ---------- */
.scale{display:flex;gap:6px}
.scale .tog{flex:1;padding:0}
.tog{display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line-s);background:#fff;color:var(--ink);border-radius:var(--r);
  padding:0 14px;min-height:var(--tap);font:600 17px/1 var(--f-b);cursor:pointer}
.tog.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tog.red{border-color:var(--bad-line);background:#fff;font-weight:400;font-size:15px;
  padding:0 10px;min-height:44px}
/* a settings group, not a row of primary actions: same system, quieter weight */
.tog.opt{min-height:44px;font-size:15px;padding:0 12px}
.tog.opt.on{background:var(--navy-l);color:var(--navy);border-color:var(--navy)}
.tog.opt.on::before{content:"✓ ";font-weight:700}
/* one dog inside a handler's card: the name takes the width it needs and the
   marks drop to their own line rather than landing on top of it */
.entry-row{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;
  padding:10px 0;border-top:1px solid var(--line-f)}
.entry-row:first-child{border-top:0}
.entry-row .who{flex:1 1 190px;min-width:0}
.entry-row b{display:block;font:600 17px/1.25 var(--f-b);overflow-wrap:anywhere}
.entry-row .tiny{display:block;margin-top:2px}
.entry-row .acts{display:flex;align-items:center;gap:6px;flex:0 0 auto;margin-left:auto;flex-wrap:wrap;
  justify-content:flex-end}
.card.handler{break-inside:avoid}
/* a file dragged over the window is about to be loaded, so say so */
body.dropping::after{content:"Αφήστε το αρχείο για φόρτωση";position:fixed;inset:0;
  z-index:60;display:flex;align-items:center;justify-content:center;pointer-events:none;
  background:rgba(30,43,77,.86);color:#fff;font:600 22px/1.3 var(--f-d);text-align:center;
  padding:40px}
/* Two gestures on a drawn order, two handles, and nothing else on the screen
   moves: the ⠿ grip drags a ζεύγος up or down the terrain, and a dog box drags
   onto another dog box so the two change places. Everything else is a button. */
/* A handle a gloved thumb can find: the same 44px target the rest of the app uses,
   not the size of the glyph inside it. */
.grip{flex:none;display:inline-flex;align-items:center;justify-content:center;
  width:44px;min-width:44px;height:44px;min-height:44px;padding:0;
  color:var(--slate-2);font:400 22px/1 var(--f-b);cursor:grab;touch-action:none;
  border-radius:8px;background:none;border:0}
.grip:hover{color:var(--ink);background:var(--sand)}
.grip:active{cursor:grabbing}
/* A drawn order is a list you touch, not text you copy. Left selectable, a press
   that misses a handle selects the names instead, and the *next* press starts the
   browser dragging that selection — which eats the pointer events and the box
   never moves. One line here, and both gestures are reliable. */
[data-brow]{transition:transform .12s ease;user-select:none;-webkit-user-select:none}
[data-brow].dragging{transition:none;position:relative;z-index:5;pointer-events:none;
  box-shadow:0 10px 24px rgba(20,30,54,.22);background:#fff;border-radius:var(--r)}
[data-brow].dropto{box-shadow:inset 0 4px 0 var(--setter)}
[data-brow].dropto.below{box-shadow:inset 0 -4px 0 var(--setter)}
/* A dog box is a name, and a name is text: pressing on it and moving starts the
   browser's own text-selection drag, which swallows the pointer events and the
   box never leaves the ground. Selection off, and the drag is ours. */
.dogbox{touch-action:none;cursor:grab;border-radius:8px;
  user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
/* Το κουτί ήταν ψηλό όσο το γράμμα του — 19px — και το δάχτυλο έπρεπε να το
   βρει ακριβώς· ο ⠿ δίπλα του έχει 44. Σε inline στοιχείο το padding μεγαλώνει
   την περιοχή αφής χωρίς να στοιβάξει τη γραμμή, οπότε τίποτα δεν μετακινείται
   και ο στόχος τριπλασιάζεται. */
.briefrow .dogbox{padding:11px 8px}
.dogbox:hover{background:var(--sand)}
.dog.dogbox:hover{background:none;outline:1px solid var(--line-s);outline-offset:-1px}
.dogbox.lifting{opacity:.45}
.dogbox.target{outline:3px solid var(--setter);outline-offset:1px}
.dogbox.ghost{box-shadow:0 10px 24px rgba(20,30,54,.28);background:#fff;
  outline:1px solid var(--line-s);opacity:.95}
/* the tick that says who this message goes to */
.tick{flex:none;width:30px;height:30px;min-height:30px;padding:0;border-radius:8px;
  border:2px solid var(--line-s);background:#fff;color:#fff;cursor:pointer;
  font:700 16px/26px var(--f-b);text-align:center;margin-right:10px}
.tick.on{background:var(--navy);border-color:var(--navy)}
/* the dog's name is how you open him — a button that reads as the heading it is */
.entry-row .open{display:block;width:100%;min-height:0;text-align:left;background:none;border:0;
  padding:0;color:var(--ink);cursor:pointer;font:600 17px/1.25 var(--f-b);overflow-wrap:anywhere;
  text-decoration:underline;text-decoration-color:var(--stubble);text-decoration-thickness:1px;
  text-underline-offset:3px}
.entry-row .open:hover{color:var(--setter);text-decoration-color:currentColor}
/* the trial's name is the obvious place to rename it, so it is the control */
.h-edit{background:none;border:0;padding:0;min-height:0;font:inherit;color:inherit;
  cursor:pointer;text-align:left;text-decoration:underline;
  text-decoration-color:var(--stubble);text-decoration-thickness:2px;text-underline-offset:5px}
.h-edit:hover{color:var(--setter);text-decoration-color:currentColor}
.tog.assign{border-color:var(--line-s);background:#fff;color:var(--ink);font-weight:400}
.tog.assign.on{background:var(--navy-l);border-color:var(--navy);color:var(--ink)}
.tog.assign.on::before{content:"✓";font-weight:700;color:var(--navy);margin-right:10px;flex:none}
button[disabled]{opacity:.4}
.tog.red.on{background:var(--bad);border-color:var(--bad);color:#fff}
.badge-list{display:flex;flex-wrap:wrap;gap:6px}
/* the trial's own tabs: one row that scrolls, so the field screens keep their
   vertical space instead of losing three rows to a wrapped tab bar */
.tabstrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  margin:0 calc(var(--s4) * -1) var(--s4);padding:0 var(--s4) 2px}
.tabstrip::-webkit-scrollbar{display:none}
.tabstrip .tog{flex:none;white-space:nowrap}
/* the progress strip */
.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  margin:0 calc(var(--s4) * -1) var(--s3);padding:0 var(--s4) 2px}
.steps::-webkit-scrollbar{display:none}
.step-i{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 12px;
  border:1px solid var(--line);background:#fff;border-radius:var(--r);cursor:pointer}
.step-i .mark{width:22px;height:22px;border-radius:50%;flex:none;background:var(--line-f);
  color:var(--slate);font:700 12px/22px var(--f-b);text-align:center}
.step-i .lbl{font:600 15px/1.1 var(--f-b);color:var(--ink);white-space:nowrap;text-align:left}
.step-i .lbl span{display:block;font:400 12px/1.3 var(--f-b);color:var(--slate);margin-top:2px}
.step-i.done .mark{background:var(--ok);color:#fff}
.step-i.now{border-color:var(--setter);box-shadow:inset 0 0 0 1px var(--setter)}
.step-i.now .mark{background:var(--setter);color:#fff}
/* which step is open now that the strip is also the navigation */
.step-i.here{background:var(--navy);border-color:var(--navy)}
.step-i.here .lbl,.step-i.here .lbl span{color:#fff}
.step-i.here .mark{background:rgba(255,255,255,.22);color:#fff}
.step-i.plain{align-self:stretch}
@media (min-width:900px){ .steps{margin-left:0;margin-right:0;padding-left:0;padding-right:0} }
@media (min-width:900px){ .tabstrip{margin-left:0;margin-right:0;padding-left:0;padding-right:0;flex-wrap:wrap} }
.step{display:flex;align-items:center;gap:10px}
.step button{width:52px;height:52px;min-height:52px;padding:0;font:600 24px/1 var(--f-b);
  border-color:var(--navy);color:var(--navy)}
.step .val{min-width:30px;text-align:center;font:800 34px/1 var(--f-d);
  font-variant-numeric:tabular-nums}
.danger-zone{background:var(--bad-bg);border:2px solid var(--bad);border-radius:var(--r);
  padding:var(--s4);margin-bottom:var(--s3)}
.danger-zone .eyebrow{color:var(--bad)}
.saved{font:400 15px/1 var(--f-b);color:var(--slate);margin-left:auto}

/* ---------- SMS ---------- */
.sms-row{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--s4);margin-bottom:10px}
.sms-row.sent{border-color:var(--ok)}
.seg{flex:none;font:600 15px/1 var(--f-b);border-radius:var(--r-chip);padding:7px 9px;
  background:var(--line-f);color:var(--slate);font-variant-numeric:tabular-nums}
.seg.hot{background:var(--stubble-bg);color:var(--stubble-ink)}
.preview{white-space:pre-wrap;font:400 15px/1.5 var(--f-b);color:var(--slate);
  background:var(--sand);border-radius:var(--r);padding:10px 12px;margin:10px 0;
  max-height:180px;overflow:auto}
.total{font:800 28px/1 var(--f-d);font-variant-numeric:tabular-nums}
.bar{height:8px;background:#0000000d;border-radius:var(--r-pill);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok)}

/* ---------- stats matrix ----------
   The season at a glance. Rotated column heads, tabular figures, first column
   pinned so a dog's name stays visible while the row is read. */
.matrix{font-size:16px;border-collapse:separate;border-spacing:0}
.matrix th,.matrix td{border-bottom:1px solid var(--line-f);white-space:nowrap}
.matrix th.v{height:178px;vertical-align:bottom;padding:0;background:var(--sand);
  border-bottom:1px solid var(--line);position:relative;min-width:74px;width:74px}
.matrix th.v span{position:absolute;bottom:10px;left:14px;transform:rotate(-60deg);
  transform-origin:left bottom;white-space:nowrap;font:600 14px/1 var(--f-b);
  color:var(--ink);text-transform:none;letter-spacing:0}
.matrix th.first{position:sticky;left:0;z-index:3;min-width:220px;text-align:left;
  vertical-align:bottom;height:178px}
.matrix td.first{position:sticky;left:0;background:var(--card);z-index:2;
  border-right:1px solid var(--line);min-width:220px}
.matrix td.first b{font:600 16px/1.2 var(--f-b)}
.matrix td.first span{display:block;font:400 13px/1.2 var(--f-b);color:var(--slate-2);margin-top:2px}
.matrix td.n{text-align:center;font-variant-numeric:tabular-nums}
.matrix td.z{color:var(--slate-2)}
.matrix .tail{width:104px;min-width:104px;background:none;border:0}
.matrix td.tot{background:var(--sand);font:800 18px/1.2 var(--f-d);text-align:right;
  font-variant-numeric:tabular-nums}
.matrix tr.sum td{background:var(--stone);font-weight:600}
.matrix tr.sum td.tot{background:var(--navy);color:#fff}

/* ---------- dog history ---------- */
.dog-hd{background:var(--navy);color:#fff;border-radius:var(--r);
  padding:var(--s5) var(--s5) var(--s4);margin-bottom:var(--s4);
  display:flex;gap:var(--s4);align-items:flex-start;flex-wrap:wrap}
.dog-hd img{width:56px;height:56px;border-radius:50%;flex:none;object-fit:cover}
.dog-hd .eyebrow{color:#ffffffa6}
.dog-hd h1{color:#fff;margin:0}
.dog-hd .meta{font:400 16px/1.5 var(--f-b);color:#ffffffbf;margin-top:6px}
.dog-hd .score{margin-left:auto;text-align:right}
.dog-hd .score b{display:block;font:800 44px/1 var(--f-d);font-variant-numeric:tabular-nums}
.dog-hd .score span{font:400 15px/1.2 var(--f-b);color:#ffffffb3}
.tl{display:flex;gap:var(--s4);padding-bottom:var(--s5)}
.tl .when{width:104px;flex:none;text-align:right}
.tl .when b{font:600 16px/1.2 var(--f-b);font-variant-numeric:tabular-nums}
.tl .when span{display:block;font:400 14px/1.3 var(--f-b);color:var(--slate-2);margin-top:3px}
.tl .rail{width:1px;background:var(--line);flex:none;position:relative}
.tl .rail i{position:absolute;top:5px;left:-4px;width:9px;height:9px;border-radius:50%;
  background:var(--navy)}
.tl .what{flex:1;min-width:0}
.tl .what h3{margin:0}
.tl .what .meta{font:400 15px/1.5 var(--f-b);color:var(--slate);margin-top:5px}
.tl .said{border-left:2px solid var(--line-f);padding-left:14px;margin-top:10px;
  font:400 16px/1.6 var(--f-b)}
.tl .said cite{display:block;font:400 14px/1.3 var(--f-b);color:var(--slate-2);
  font-style:normal;margin-top:6px}
.tl .pts{width:78px;flex:none;text-align:right}
.tl .pts b{font:800 24px/1 var(--f-d);font-variant-numeric:tabular-nums}
.tl .pts span{display:block;font:400 13px/1.2 var(--f-b);color:var(--slate-2);margin-top:3px}

/* ---------- import mapping ---------- */
.map-row{display:flex;align-items:center;gap:var(--s3);padding:11px 0;
  border-bottom:1px solid var(--line-f)}
.map-row .from{flex:1;min-width:0}
.map-row .from b{font:600 16px/1.2 var(--f-b)}
.map-row .from span{display:block;font:400 14px/1.3 var(--f-b);color:var(--slate-2);margin-top:3px}
.map-row .to{width:240px;flex:none}
.map-row .to select{min-height:44px;padding:10px 12px;font-size:16px}

/* ---------- registry sidebar (desk) ---------- */
.side{display:none}
.side .item{display:block;width:100%;text-align:left;padding:11px var(--s4);
  border:0;border-left:3px solid transparent;background:none;border-radius:0;
  font:400 16px/1 var(--f-b);color:var(--slate);min-height:0}
.side .item.on{background:#fff;color:var(--ink);font-weight:600;border-left-color:var(--setter)}

/* ---------- misc ---------- */
body:not([data-field]) .fab{display:none}
.fab{position:fixed;left:var(--s4);right:var(--s4);bottom:calc(10px + env(safe-area-inset-bottom));
  z-index:35;display:flex;gap:10px;max-width:1208px;margin:0 auto}
.fab:empty{display:none}
.fab button{flex:1;min-height:60px;font-size:19px;box-shadow:0 6px 20px #00000038}
.fab .b-act{font:800 21px/1 var(--f-d)}
dialog{border:0;border-radius:var(--r);padding:0;max-width:640px;width:calc(100% - 20px);
  box-shadow:0 20px 60px #00000059;color:var(--ink);background:var(--card)}
dialog::backdrop{background:#000000a6}
.dlg{padding:var(--s4) var(--s4) var(--s5)}
.dlg h2{margin-bottom:var(--s3)}
/* stacked fields in a dialog: leave room for the focus ring so it never
   crosses the label of the field below */
.dlg .row{margin-bottom:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(84px + env(safe-area-inset-bottom));background:var(--navy);color:#fff;
  padding:12px 16px;border-radius:var(--r);font:400 16px/1.3 var(--f-b);z-index:60;
  box-shadow:0 8px 24px #00000047;max-width:calc(100% - 32px)}

/* ---------- desk mode: same tokens, tighter ---------- */
@media (min-width:900px){
  body{font-size:16px}
  main{padding:var(--s5)}
  .card{padding:var(--s5)}
  table{font-size:15px}
  th,td{padding:10px 14px}
  .muted,.tiny{font-size:14px}
  .map-row .from span{font-size:13px}
  .reg{display:grid;grid-template-columns:210px 1fr;gap:0;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .side{display:block;background:var(--stone);border-right:1px solid var(--line);padding:var(--s5) 0}
  .reg .main{padding:var(--s5);min-width:0}
  .reg-tabs{display:none}
}

/* ---------- print ----------
   A4 portrait, black and white, legible after photocopying. It will be
   photocopied. */
@media print{
  @page{size:A4 portrait;margin:14mm}
  header,nav,.fab,.noprint,button,#warn,.toast{display:none!important}
  body{background:#fff;color:#000;padding:0;font:400 10.5pt/1.35 var(--f-b)}
  main{max-width:none;padding:0}
  .card,.brace,.sms-row{break-inside:avoid;border:1px solid #999;box-shadow:none;
    background:#fff!important;color:#000!important}
  .print-hd{display:flex!important;gap:10px;align-items:flex-start;
    border-bottom:2px solid #000;margin-bottom:10px;padding-bottom:8px}
  .print-hd img{width:44px;height:44px;border-radius:50%;filter:grayscale(1) contrast(1.2)}
  .print-hd .t{flex:1}
  .print-hd b{display:block;font:800 11pt/1.3 var(--f-d);letter-spacing:.08em}
  .print-hd span{display:block;font:400 9.5pt/1.35 var(--f-b);margin-top:2px}
  .print-hd .pg{font:600 9.5pt/1.3 var(--f-b);text-align:right;white-space:nowrap}
  /* Any screen may be sent to the printer, so cards stay legible in black and
     white. The drawn order and the note sheets have their own A4 layouts and
     do not come through here at all. */
  .brace,.brief{border:1px solid #666;page-break-inside:avoid;background:#fff!important}
  .brace.run{background:#fff!important}
  .brace.run .bno,.brace.run .bstate,.brace.run .dog .nm{color:#000!important}
  .brace.run .dog .pos,.brace.run .dog .mt{color:#333!important}
  .live i,.clock{display:none!important}
  .dog .nm{color:#000!important}
  .matrix th.v span{color:#000}
  .empty,.note,.err{border:1px solid #999;background:#fff;color:#000}
  a{color:#000;text-decoration:none}
  .print-only{display:block!important}
}
.print-hd,.print-only{display:none}

/* ---------- the blank judge note sheet ----------
   A4 portrait, black on white, boxes big enough to write in with a pen on a
   knee. It gets photocopied, so nothing here is grey. */
#sheets{display:none}
.sheet{padding:0 0 10mm}
.sheet .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:10px}
.sheet .fld span{font:400 9pt/1 var(--f-b)}
.sheet .fld .line{border-bottom:1px solid #000;height:22px}
.sheet .box{border:1px solid #000;height:26px}
.sheet table{border-collapse:collapse;width:100%;margin-top:6px}
.sheet th,.sheet td{border:1px solid #666;padding:4px;font:400 9pt/1.2 var(--f-b);
  text-align:left;background:none;position:static;text-transform:none;letter-spacing:0;color:#000}
.sheet th{border-color:#000;font-weight:600}
.sheet .rate{display:flex;gap:5px}
.sheet .rate i{width:20px;height:20px;border:1px solid #000;font:400 8.5pt/19px var(--f-b);
  text-align:center;font-style:normal}
/* the mark the judge gave, filled black so it reads across a photocopy */
.sheet .rate i.on{background:#000;color:#fff;font-weight:700}
.sheet h4{font:600 9.5pt/1 var(--f-b);margin:12px 0 4px;border-top:1px solid #000;padding-top:8px}
@media print{
  body.sheets-only main,body.sheets-only .fab{display:none!important}
  body.sheets-only #sheets{display:block}
  .sheet{page-break-after:always}
  .sheet:last-child{page-break-after:auto}
}
</style>

  "Η F.C.I. ορίζει τουλάχιστον δεκαπέντε λεπτά για την πρώτη διαδρομή (ACO II.5).": "The F.C.I. sets at least fifteen minutes for the first run (ACO II.5).",
  "Η «Αποστολή στο κινητό» στέλνει τον αγώνα μαζί με τα κληρωμένα ζεύγη — φορτώστε τον στο κινητό (Ρυθμίσεις → Φόρτωση αρχείου → Συγχώνευση) και συνεχίστε από εκεί στο τερέν. Τα SMS φεύγουν από όποια συσκευή κρατά τη σειρά.": "\"Send to the phone\" sends the trial together with the drawn braces — load it on the phone (Settings → Load file → Merge) and carry on from there in the field. The SMS go out from whichever device holds the running order.",
  "Η Μεγάλη Έρευνα γίνεται πάντα σε ζεύγη (Άρ. 4). Για CACIT χρειάζονται 3 κριτές ανά τερέν (Άρ. 48).": "Grande Quête is always run in braces (Art. 4). For CACIT three judges per terrain are required (Art. 48).",
  "Η άρνηση αποκλείει και στα τέσσερα: ACO II.13 «Refusal to execute a commanded approach leads to elimination»· ENCI art. 11 §16 «Rifiuto di guidare».": "Refusal eliminates in all four: ACO II.13 \"Refusal to execute a commanded approach leads to elimination\"; ENCI art. 11 §16 \"Rifiuto di guidare\".",
  "Η άρνηση αποκλείει: GQ art. 8 «A refusal to back is an eliminating fault»· SCC art. 3 «Le refus de patron … est éliminatoire»· ENCI art. 11 §8.": "Refusal eliminates: GQ art. 8 \"A refusal to back is an eliminating fault\"; SCC art. 3 \"Le refus de patron … est éliminatoire\"; ENCI art. 11 §8.",
  "Η αγγλική στήλη δεν έχει πηγή στα κείμενα που έχουμε — η S.C.C. art. 3 το λέει εξίσου αποκλειστικό με την άρνηση συναίνεσης, αλλά στα γαλλικά.": "The English column has no source in the texts we hold — S.C.C. art. 3 calls it as eliminating as a refusal to back, but in French.",
  "Η αλλαγή καταγράφηκε": "The change is recorded",
  "Η ανατομία του πόντου": "The anatomy of the point",
  "Η αντιγραφή δεν επιτράπηκε": "Copying was not allowed",
  "Η γλώσσα αλλάζει μόνο ό,τι βλέπετε. Στη βάση όλα μένουν ελληνικά — η κατάσταση, η βαθμολογία, η μορφή του αγώνα — ώστε ένα αντίγραφο από αγγλικό κινητό να συγχωνεύεται κανονικά σε ελληνικό υπολογιστή και ο πίνακας πόντων να βρίσκει το κλειδί του.": "The language changes what you see and nothing else. Everything is stored in Greek — status, grading, trial format — so that a backup made on an English phone merges into a Greek laptop and the points table still finds its key.",
  "Η γραμμή επικεφαλίδων εντοπίστηκε αυτόματα. Ελέγξτε κάθε στήλη πριν την εισαγωγή· είναι η μόνη ευκαιρία να πιαστεί λάθος στήλη.": "The header row was found automatically. Check every column before importing; it is the only chance to catch a wrong column.",
  "Η διαδρομή": "The run",
  "Η διαδρομή επεκτάθηκε σε ": "The run was extended to ",
  "Η ενέργεια καταγράφεται στο φύλλο του κριτή. Επιβεβαίωση αποκλεισμού;": "The action is recorded on the judge's sheet. Confirm the elimination?",
  "Η εφαρμογή άνοιξε από αρχείο, όχι από διεύθυνση.": "The app was opened from a file, not from an address.",
  "Η εφαρμογή δεν άνοιξε από διεύθυνση, οπότε δεν υπάρχει ενημέρωση να ελεγχθεί.": "The app was not opened from an address, so there is no update to check for.",
  "Η εφαρμογή δεν κατεβαίνει από κατάστημα. Ανοίγει σε μια διεύθυνση και προστίθεται στην αρχική οθόνη. Μετά την πρώτη φορά δουλεύει χωρίς σήμα, που είναι και το ζητούμενο στο τερέν.": "The app is not downloaded from a store. It opens at an address and is added to the home screen. After the first time it works with no signal, which is the whole point in the field.",
  "Η εφαρμογή είναι λίγα αρχεία —": "The app is a handful of files —",
  "Η εφαρμογή είναι μία σελίδα και λειτουργεί χωρίς σύνδεση. Τα δεδομένα μένουν σε αυτή τη συσκευή και δεν συγχρονίζονται μόνα τους. Δύο κριτές σε δύο κινητά δεν βλέπουν ο ένας τις αλλαγές του άλλου· ανταλλάσσουν αρχείο. Κατάσταση αποθήκευσης:": "The app is a single page and works offline. The data stays on this device and does not synchronise by itself. Two judges on two phones do not see each other's changes; they exchange a file. Storage state:",
  "Η εφαρμογή και ο κώδικάς της ανήκουν στον όμιλο. Τα σήματα, τα δεδομένα των αγώνων και το μητρώο είναι δικά του.": "The app and its code belong to the club. The marks, the trial data and the register are its own.",
  "Η εφαρμογή τρέχει από την κρυφή μνήμη της συσκευής, ώστε να δουλεύει χωρίς σήμα. Αυτό σημαίνει ότι μια διόρθωση φτάνει σε εσάς την επόμενη φορά που θα την ανοίξετε με σύνδεση.": "The app runs from the device's own cache so that it works with no signal. That means a fix reaches you the next time you open it with a connection.",
  "Η ημέρα": "The day",
  "Η κατανομή επιστρέφει στην κλήρωση": "The assignment goes back to the draw",
  "Η κλήρωση έγινε": "The draw was made",
  "Η κλήρωση δεν μπορεί να γίνει ακόμη.": "The draw cannot be made yet.",
  "Η κλήρωση ολοκληρώθηκε": "The draw is complete",
  "Η ορολογία των κριτών γυρίζει σε πέντε γλώσσες, από τους ίδιους τους κανονισμούς. Τα ισπανικά είναι η εξαίρεση: κανένας ισπανικός κανονισμός δεν βρίσκεται στο αποθετήριο, οπότε εκεί και οι όροι είναι επαγγελματική, μη επίσημη μετάφραση — όπως όλη η υπόλοιπη οθόνη σε κάθε γλώσσα. Στη βάση όλα μένουν ελληνικά.": "The judging vocabulary turns in five languages, taken from the regulations themselves. Spanish is the exception: no Spanish regulation is held in the repository, so there the terms too are a professional, non-official translation — as the rest of the screen is in every language. In the database everything stays Greek.",
  "Η ορολογία των κριτών — φέρμα, ποντάρισμα, συναίνεση, τα σφάλματα του Άρθρου 33, οι βαθμολογίες — μπήκε από τους ίδιους τους κανονισμούς και σε πέντε γλώσσες. Κανένας όρος δεν μεταφράστηκε· δείτε τους με την πηγή τους στο Γλωσσάρι. Η υπόλοιπη οθόνη είναι επαγγελματική, μη επίσημη μετάφραση, γιατί γι' αυτήν δεν υπάρχει κανονισμός να την ορίσει. Οι φυλές είναι της F.C.I. και της ENCI, οι χώρες του CLDR. Τα ισπανικά στέκουν αλλιώς: κανένας ισπανικός κανονισμός δεν βρίσκεται στο αποθετήριο, οπότε το Γλωσσάρι δεν έχει ισπανική στήλη και στην ισπανική οθόνη είναι μετάφραση και οι όροι και οι φυλές.": "The judging vocabulary — pointing, commanded approach, backing, the Article 33 faults, the qualifications — was taken from the regulations themselves, in five languages. No term was translated; see each one with its source in the Glossary. The rest of the screen is a professional, non-official translation, since no regulation defines it. The breeds come from the F.C.I. and the ENCI, the countries from CLDR. Spanish stands differently: no Spanish regulation is held in the repository, so the Glossary has no Spanish column and on the Spanish screen both the terms and the breeds are translation.",
  "Η προηγούμενη ημέρα δεν έχει κληρωθεί": "The previous day has not been drawn",
  "Η σειρά είναι ενδεικτική (Άρθρο 16).": "The order is indicative (Article 16).",
  "Η σειρά είναι ενδεικτική (Άρθρο 16). Να είστε στη διάθεση των κριτών.": "The running order is indicative (Article 16). Please be at the judges' disposal.",
  "Η σειρά είναι ενδεικτική — Άρθρο 16.": "The order is indicative — Article 16.",
  "Η σειρά είναι ενδεικτική — Άρθρο 16. Το μήνυμα ανοίγει στην εφαρμογή μηνυμάτων του τηλεφώνου· η αποστολή γίνεται από εκεί.": "The order is indicative — Article 16. The message opens in the phone's messaging app; sending happens from there.",
  "Η συγχώνευση κρατά ό,τι υπάρχει και προσθέτει· η αντικατάσταση σβήνει τη συσκευή. Στο τερέν θέλετε σχεδόν πάντα συγχώνευση.": "Merging keeps what is there and adds; replacing wipes the device. In the field you almost always want merge.",
  "Η τοποθεσία και η ώρα μπαίνουν στο SMS των κυναγωγών και των κριτών.": "The place and the time go into the SMS to the handlers and the judges.",
  "Η τοποθεσία και η ώρα προσέλευσης έρχονται από τον αγώνα (Επεξεργασία αγώνα). Αν δεν τις βάλετε στην επικεφαλίδα, μπαίνουν μόνες τους σε δική τους γραμμή — κανένα μήνυμα δεν φεύγει χωρίς πού και πότε.": "The place and the arrival time come from the trial (Edit trial). If you do not put them in the heading, they are added on a line of their own — no message goes out without a where and a when.",
  "Η υπαγόρευση δεν ξεκίνησε. Χρησιμοποιήστε το μικρόφωνο του πληκτρολογίου.": "Dictation did not start. Use the keyboard's microphone.",
  "Η υπογραφή κλειδώνει τη βαθμολογία και τις σημειώσεις του τερέν. Το ξεκλείδωμα γίνεται από τον Πρόεδρο Κριτών με αιτιολογία, που καταγράφεται.": "Signing locks the scoring and the notes of the terrain. Unlocking is done by the President of the Jury with a reason, which is recorded.",
  "Η χώρα εκτροφής είναι εκείνη του εκτροφείου, όχι του κυναγωγού· από αυτήν βγαίνει και το «κυπριακής εκτροφής» στο μητρώο.": "The country of breeding is the kennel's, not the handler's; it is what produces \"Cyprus-bred\" in the register.",

  "Ο γερμανικός όρος στο ACO II.7 στέκει ως «beim erneuten Aufrufen»· δεν υπάρχει μονολεκτικό ουσιαστικό στα κείμενα που έχουμε.": "The German term stands in ACO II.7 as \"beim erneuten Aufrufen\"; there is no single-word noun in the texts we hold.",

  "Η F.C.I. ορίζει τουλάχιστον δεκαπέντε λεπτά για την πρώτη διαδρομή (ACO II.5).": "La F.C.I. fixe au moins quinze minutes pour le premier parcours (ACO II.5).",
  "Η «Αποστολή στο κινητό» στέλνει τον αγώνα μαζί με τα κληρωμένα ζεύγη — φορτώστε τον στο κινητό (Ρυθμίσεις → Φόρτωση αρχείου → Συγχώνευση) και συνεχίστε από εκεί στο τερέν. Τα SMS φεύγουν από όποια συσκευή κρατά τη σειρά.": "« Envoyer sur le téléphone » envoie l'épreuve avec les couples tirés — chargez-la sur le téléphone (Réglages → Charger un fichier → Fusionner) et continuez de là sur le terrain. Les SMS partent de l'appareil qui détient l'ordre de passage.",
  "Η Μεγάλη Έρευνα γίνεται πάντα σε ζεύγη (Άρ. 4). Για CACIT χρειάζονται 3 κριτές ανά τερέν (Άρ. 48).": "La Grande Quête se court toujours en couple (Art. 4). Pour le CACIT il faut trois juges par terrain (Art. 48).",
  "Η άρνηση αποκλείει και στα τέσσερα: ACO II.13 «Refusal to execute a commanded approach leads to elimination»· ENCI art. 11 §16 «Rifiuto di guidare».": "Le refus élimine dans les quatre : ACO II.13 « Refusal to execute a commanded approach leads to elimination » ; ENCI art. 11 §16 « Rifiuto di guidare ».",
  "Η άρνηση αποκλείει: GQ art. 8 «A refusal to back is an eliminating fault»· SCC art. 3 «Le refus de patron … est éliminatoire»· ENCI art. 11 §8.": "Le refus élimine : GQ art. 8 « A refusal to back is an eliminating fault » ; SCC art. 3 « Le refus de patron … est éliminatoire » ; ENCI art. 11 §8.",
  "Η αγγλική στήλη δεν έχει πηγή στα κείμενα που έχουμε — η S.C.C. art. 3 το λέει εξίσου αποκλειστικό με την άρνηση συναίνεσης, αλλά στα γαλλικά.": "La colonne anglaise n'a pas de source dans les textes dont nous disposons — la S.C.C. art. 3 la dit aussi éliminatoire que le refus de patron, mais en français.",
  "Η αλλαγή καταγράφηκε": "La modification est consignée",
  "Η ανατομία του πόντου": "L'anatomie du point",
  "Η αντιγραφή δεν επιτράπηκε": "La copie n'a pas été autorisée",
  "Η γλώσσα αλλάζει μόνο ό,τι βλέπετε. Στη βάση όλα μένουν ελληνικά — η κατάσταση, η βαθμολογία, η μορφή του αγώνα — ώστε ένα αντίγραφο από αγγλικό κινητό να συγχωνεύεται κανονικά σε ελληνικό υπολογιστή και ο πίνακας πόντων να βρίσκει το κλειδί του.": "La langue ne change que ce que vous voyez. Tout est enregistré en grec — état, qualification, forme de l'épreuve — pour qu'une sauvegarde faite sur un téléphone en anglais fusionne sans peine dans un ordinateur en grec et que le barème retrouve sa clé.",
  "Η γραμμή επικεφαλίδων εντοπίστηκε αυτόματα. Ελέγξτε κάθε στήλη πριν την εισαγωγή· είναι η μόνη ευκαιρία να πιαστεί λάθος στήλη.": "La ligne d'en-têtes a été repérée automatiquement. Vérifiez chaque colonne avant l'importation ; c'est la seule occasion de rattraper une mauvaise colonne.",
  "Η διαδρομή": "Le parcours",
  "Η διαδρομή επεκτάθηκε σε ": "Le parcours a été prolongé à ",
  "Η ενέργεια καταγράφεται στο φύλλο του κριτή. Επιβεβαίωση αποκλεισμού;": "L'action est consignée sur la feuille du juge. Confirmer l'élimination ?",
  "Η εφαρμογή άνοιξε από αρχείο, όχι από διεύθυνση.": "L'application a été ouverte depuis un fichier, non depuis une adresse.",
  "Η εφαρμογή δεν άνοιξε από διεύθυνση, οπότε δεν υπάρχει ενημέρωση να ελεγχθεί.": "L'application n'a pas été ouverte depuis une adresse, il n'y a donc pas de mise à jour à vérifier.",
  "Η εφαρμογή δεν κατεβαίνει από κατάστημα. Ανοίγει σε μια διεύθυνση και προστίθεται στην αρχική οθόνη. Μετά την πρώτη φορά δουλεύει χωρίς σήμα, που είναι και το ζητούμενο στο τερέν.": "L'application ne se télécharge pas depuis un magasin. Elle s'ouvre à une adresse et s'ajoute à l'écran d'accueil. Après la première fois, elle fonctionne sans réseau, ce qui est tout l'intérêt sur le terrain.",
  "Η εφαρμογή είναι λίγα αρχεία —": "L'application, c'est quelques fichiers —",
  "Η εφαρμογή είναι μία σελίδα και λειτουργεί χωρίς σύνδεση. Τα δεδομένα μένουν σε αυτή τη συσκευή και δεν συγχρονίζονται μόνα τους. Δύο κριτές σε δύο κινητά δεν βλέπουν ο ένας τις αλλαγές του άλλου· ανταλλάσσουν αρχείο. Κατάσταση αποθήκευσης:": "L'application est une seule page et fonctionne hors ligne. Les données restent sur cet appareil et ne se synchronisent pas d'elles-mêmes. Deux juges sur deux téléphones ne voient pas les modifications l'un de l'autre ; ils échangent un fichier. État du stockage :",
  "Η εφαρμογή και ο κώδικάς της ανήκουν στον όμιλο. Τα σήματα, τα δεδομένα των αγώνων και το μητρώο είναι δικά του.": "L'application et son code appartiennent au club. Les marques, les données des épreuves et le registre sont les siens.",
  "Η εφαρμογή τρέχει από την κρυφή μνήμη της συσκευής, ώστε να δουλεύει χωρίς σήμα. Αυτό σημαίνει ότι μια διόρθωση φτάνει σε εσάς την επόμενη φορά που θα την ανοίξετε με σύνδεση.": "L'application tourne depuis le cache de l'appareil pour fonctionner sans réseau. Autrement dit, une correction vous parvient la prochaine fois que vous l'ouvrez avec une connexion.",
  "Η ημέρα": "La journée",
  "Η κατανομή επιστρέφει στην κλήρωση": "La répartition revient au tirage",
  "Η κλήρωση έγινε": "Le tirage a été fait",
  "Η κλήρωση δεν μπορεί να γίνει ακόμη.": "Le tirage ne peut pas encore avoir lieu.",
  "Η κλήρωση ολοκληρώθηκε": "Le tirage est terminé",
  "Η ορολογία των κριτών γυρίζει σε πέντε γλώσσες, από τους ίδιους τους κανονισμούς. Τα ισπανικά είναι η εξαίρεση: κανένας ισπανικός κανονισμός δεν βρίσκεται στο αποθετήριο, οπότε εκεί και οι όροι είναι επαγγελματική, μη επίσημη μετάφραση — όπως όλη η υπόλοιπη οθόνη σε κάθε γλώσσα. Στη βάση όλα μένουν ελληνικά.": "Le vocabulaire de jugement tourne en cinq langues, tiré des règlements eux-mêmes. L'espagnol fait exception : aucun règlement espagnol ne figure dans le dépôt, si bien que là les termes aussi sont une traduction professionnelle, non officielle — comme l'est le reste de l'écran dans chaque langue. Dans la base, tout reste en grec.",
  "Η ορολογία των κριτών — φέρμα, ποντάρισμα, συναίνεση, τα σφάλματα του Άρθρου 33, οι βαθμολογίες — μπήκε από τους ίδιους τους κανονισμούς και σε πέντε γλώσσες. Κανένας όρος δεν μεταφράστηκε· δείτε τους με την πηγή τους στο Γλωσσάρι. Η υπόλοιπη οθόνη είναι επαγγελματική, μη επίσημη μετάφραση, γιατί γι' αυτήν δεν υπάρχει κανονισμός να την ορίσει. Οι φυλές είναι της F.C.I. και της ENCI, οι χώρες του CLDR. Τα ισπανικά στέκουν αλλιώς: κανένας ισπανικός κανονισμός δεν βρίσκεται στο αποθετήριο, οπότε το Γλωσσάρι δεν έχει ισπανική στήλη και στην ισπανική οθόνη είναι μετάφραση και οι όροι και οι φυλές.": "Le vocabulaire de jugement — arrêt, coulé à l'ordre, patron, les fautes de l'Article 33, les qualifications — a été pris dans les règlements eux-mêmes, en cinq langues. Aucun terme n'a été traduit ; voyez chacun avec sa source dans le Lexique. Le reste de l'écran est une traduction professionnelle, non officielle, puisqu'aucun règlement ne la fixe. Les races viennent de la F.C.I. et de l'ENCI, les pays du CLDR. L'espagnol se tient autrement : aucun règlement espagnol ne figure dans le dépôt, donc le Lexique n'a pas de colonne espagnole et, sur l'écran espagnol, les termes comme les races sont de la traduction.",
  "Η προηγούμενη ημέρα δεν έχει κληρωθεί": "La journée précédente n'a pas été tirée",
  "Η σειρά είναι ενδεικτική (Άρθρο 16).": "L'ordre est indicatif (Article 16).",
  "Η σειρά είναι ενδεικτική (Άρθρο 16). Να είστε στη διάθεση των κριτών.": "L'ordre de passage est indicatif (Article 16). Tenez-vous à la disposition des juges.",
  "Η σειρά είναι ενδεικτική — Άρθρο 16.": "L'ordre est indicatif — Article 16.",
  "Η σειρά είναι ενδεικτική — Άρθρο 16. Το μήνυμα ανοίγει στην εφαρμογή μηνυμάτων του τηλεφώνου· η αποστολή γίνεται από εκεί.": "L'ordre est indicatif — Article 16. Le message s'ouvre dans l'application de messagerie du téléphone ; l'envoi se fait de là.",
  "Η συγχώνευση κρατά ό,τι υπάρχει και προσθέτει· η αντικατάσταση σβήνει τη συσκευή. Στο τερέν θέλετε σχεδόν πάντα συγχώνευση.": "La fusion garde ce qui existe et ajoute ; le remplacement efface l'appareil. Sur le terrain, c'est presque toujours la fusion qu'il faut.",
  "Η τοποθεσία και η ώρα μπαίνουν στο SMS των κυναγωγών και των κριτών.": "Le lieu et l'heure figurent dans le SMS aux conducteurs et aux juges.",
  "Η τοποθεσία και η ώρα προσέλευσης έρχονται από τον αγώνα (Επεξεργασία αγώνα). Αν δεν τις βάλετε στην επικεφαλίδα, μπαίνουν μόνες τους σε δική τους γραμμή — κανένα μήνυμα δεν φεύγει χωρίς πού και πότε.": "Le lieu et l'heure de convocation viennent de l'épreuve (Modifier l'épreuve). Si vous ne les mettez pas dans l'en-tête, ils s'ajoutent d'eux-mêmes sur une ligne à part — aucun message ne part sans un où et un quand.",
  "Η υπαγόρευση δεν ξεκίνησε. Χρησιμοποιήστε το μικρόφωνο του πληκτρολογίου.": "La dictée n'a pas démarré. Utilisez le microphone du clavier.",
  "Η υπογραφή κλειδώνει τη βαθμολογία και τις σημειώσεις του τερέν. Το ξεκλείδωμα γίνεται από τον Πρόεδρο Κριτών με αιτιολογία, που καταγράφεται.": "La signature verrouille la notation et les notes du terrain. Le déverrouillage est fait par le Président du jury avec un motif, qui est consigné.",
  "Η χώρα εκτροφής είναι εκείνη του εκτροφείου, όχι του κυναγωγού· από αυτήν βγαίνει και το «κυπριακής εκτροφής» στο μητρώο.": "Le pays d'élevage est celui de l'élevage, non du conducteur ; c'est de là que vient « élevage chypriote » dans le registre.",

  "Ο αριθμός σκύλων είναι μονός. Επιλέξτε σκύλο για να συμπληρωθεί το τελευταίο ζεύγος. Ο συμπληρωματικός τρέχει για να ολοκληρωθεί η διαδρομή· δεν μπαίνει στην κλήρωση, δεν προσμετρά στα ελάχιστα ζεύγη και δεν βαθμολογείται.": "Le nombre de chiens est impair. Choisissez un chien pour compléter le dernier couple. Le supplémentaire court pour que le parcours soit complet ; il n'entre pas dans le tirage, ne compte pas dans le minimum de couples et n'est pas noté.",
  "Ο γερμανικός όρος στο ACO II.7 στέκει ως «beim erneuten Aufrufen»· δεν υπάρχει μονολεκτικό ουσιαστικό στα κείμενα που έχουμε.": "Le terme allemand figure dans ACO II.7 sous la forme « beim erneuten Aufrufen » ; il n'existe pas de substantif en un mot dans les textes dont nous disposons.",
  "Ο ιδιοκτήτης του σκύλου, όταν δεν είναι ο ίδιος ο κυναγωγός — που είναι και το συνηθισμένο. Μπαίνει σκέτο όνομα: δεν παίρνει τηλέφωνο και δεν λαμβάνει μηνύματα, γιατί τα SMS της σειράς πάνε στον κυναγωγό.": "Le propriétaire du chien, lorsqu'il n'est pas le conducteur lui-même — ce qui est le cas courant. On met un simple nom : il ne prend pas de téléphone et ne reçoit pas de messages, car les SMS de l'ordre de passage vont au conducteur.",

  "Ο υπολογιστής δεν έχει εφαρμογή μηνυμάτων· τα κουμπιά εδώ ανοίγουν το WhatsApp Web ή αντιγράφουν το κείμενο για να το επικολλήσετε όπου θέλετε. Για κανονικά SMS στείλτε τον αγώνα στο κινητό σας (Εξαγωγές → Αποστολή στο κινητό) και στείλτε τα από εκεί.": "Un ordinateur n'a pas d'application de messagerie ; les boutons ici ouvrent WhatsApp Web ou copient le texte pour que vous le colliez où vous voulez. Pour de vrais SMS, envoyez l'épreuve sur votre téléphone (Exports → Envoyer sur le téléphone) et envoyez-les de là.",

  "Το Excel περιέχει φύλλο «Παράμετροι» με τον πίνακα πόντων. Όλοι οι πόντοι υπολογίζονται με τύπους VLOOKUP/SUMIFS που δείχνουν εκεί — καμία σταθερή τιμή μέσα σε τύπο, ώστε όποιος ανοίξει το αρχείο να μπορεί να ελέγξει την αριθμητική. Ανοίγει σε Excel και LibreOffice. Η εκτύπωση είναι ασπρόμαυρη, για φωτοτυπία.": "Le fichier Excel contient une feuille « Paramètres » avec le barème de points. Tous les points sont calculés par des formules VLOOKUP/SUMIFS qui y renvoient — aucune valeur fixe dans une formule, afin que celui qui ouvre le fichier puisse vérifier le calcul. Il s'ouvre dans Excel et LibreOffice. L'impression est en noir et blanc, pour la photocopie.",

  "Η F.C.I. ορίζει τουλάχιστον δεκαπέντε λεπτά για την πρώτη διαδρομή (ACO II.5).": "Die F.C.I. setzt mindestens fünfzehn Minuten für den ersten Gang an (ACO II.5).",
  "Η «Αποστολή στο κινητό» στέλνει τον αγώνα μαζί με τα κληρωμένα ζεύγη — φορτώστε τον στο κινητό (Ρυθμίσεις → Φόρτωση αρχείου → Συγχώνευση) και συνεχίστε από εκεί στο τερέν. Τα SMS φεύγουν από όποια συσκευή κρατά τη σειρά.": "„Aufs Telefon senden“ schickt die Prüfung samt ausgelosten Paaren — laden Sie sie auf dem Telefon (Einstellungen → Datei laden → Zusammenführen) und machen Sie von dort im Gelände weiter. Die SMS gehen von dem Gerät hinaus, das die Reihenfolge hält.",
  "Η Μεγάλη Έρευνα γίνεται πάντα σε ζεύγη (Άρ. 4). Για CACIT χρειάζονται 3 κριτές ανά τερέν (Άρ. 48).": "Die Grande Quête wird stets im Paar gelaufen (Art. 4). Für das CACIT sind drei Richter je Gelände erforderlich (Art. 48).",
  "Η άρνηση αποκλείει και στα τέσσερα: ACO II.13 «Refusal to execute a commanded approach leads to elimination»· ENCI art. 11 §16 «Rifiuto di guidare».": "Die Verweigerung schließt in allen vieren aus: ACO II.13 „Refusal to execute a commanded approach leads to elimination“; ENCI Art. 11 §16 „Rifiuto di guidare“.",
  "Η άρνηση αποκλείει: GQ art. 8 «A refusal to back is an eliminating fault»· SCC art. 3 «Le refus de patron … est éliminatoire»· ENCI art. 11 §8.": "Die Verweigerung schließt aus: GQ Art. 8 „A refusal to back is an eliminating fault“; SCC Art. 3 „Le refus de patron … est éliminatoire“; ENCI Art. 11 §8.",
  "Η αγγλική στήλη δεν έχει πηγή στα κείμενα που έχουμε — η S.C.C. art. 3 το λέει εξίσου αποκλειστικό με την άρνηση συναίνεσης, αλλά στα γαλλικά.": "Die englische Spalte hat in den vorliegenden Texten keine Quelle — die S.C.C. Art. 3 nennt es ebenso ausschließend wie das Nichtsekundieren, aber auf Französisch.",

  "Η αντιγραφή δεν επιτράπηκε": "Das Kopieren wurde nicht erlaubt",
  "Η γλώσσα αλλάζει μόνο ό,τι βλέπετε. Στη βάση όλα μένουν ελληνικά — η κατάσταση, η βαθμολογία, η μορφή του αγώνα — ώστε ένα αντίγραφο από αγγλικό κινητό να συγχωνεύεται κανονικά σε ελληνικό υπολογιστή και ο πίνακας πόντων να βρίσκει το κλειδί του.": "Die Sprache ändert nur, was Sie sehen. Gespeichert wird alles auf Griechisch — Status, Bewertung, Form der Prüfung — damit eine auf einem englischen Telefon erstellte Sicherung sich in einen griechischen Rechner einfügt und die Punktetabelle ihren Schlüssel wiederfindet.",
  "Η γραμμή επικεφαλίδων εντοπίστηκε αυτόματα. Ελέγξτε κάθε στήλη πριν την εισαγωγή· είναι η μόνη ευκαιρία να πιαστεί λάθος στήλη.": "Die Kopfzeile wurde automatisch erkannt. Prüfen Sie jede Spalte vor dem Import; es ist die einzige Gelegenheit, eine falsche Spalte zu bemerken.",
  "Η διαδρομή": "Der Gang",
  "Η διαδρομή επεκτάθηκε σε ": "Der Gang wurde verlängert auf ",
  "Η ενέργεια καταγράφεται στο φύλλο του κριτή. Επιβεβαίωση αποκλεισμού;": "Die Handlung wird auf dem Blatt des Richters festgehalten. Ausschluss bestätigen?",
  "Η εφαρμογή άνοιξε από αρχείο, όχι από διεύθυνση.": "Die Anwendung wurde aus einer Datei geöffnet, nicht über eine Adresse.",
  "Η εφαρμογή δεν άνοιξε από διεύθυνση, οπότε δεν υπάρχει ενημέρωση να ελεγχθεί.": "Die Anwendung wurde nicht über eine Adresse geöffnet, es gibt also keine Aktualisierung zu prüfen.",
  "Η εφαρμογή δεν κατεβαίνει από κατάστημα. Ανοίγει σε μια διεύθυνση και προστίθεται στην αρχική οθόνη. Μετά την πρώτη φορά δουλεύει χωρίς σήμα, που είναι και το ζητούμενο στο τερέν.": "Die Anwendung wird nicht aus einem Store geladen. Sie öffnet sich unter einer Adresse und wird zum Startbildschirm hinzugefügt. Nach dem ersten Mal läuft sie ohne Netz — genau darum geht es im Gelände.",
  "Η εφαρμογή είναι λίγα αρχεία —": "Die Anwendung besteht aus wenigen Dateien —",
  "Η εφαρμογή είναι μία σελίδα και λειτουργεί χωρίς σύνδεση. Τα δεδομένα μένουν σε αυτή τη συσκευή και δεν συγχρονίζονται μόνα τους. Δύο κριτές σε δύο κινητά δεν βλέπουν ο ένας τις αλλαγές του άλλου· ανταλλάσσουν αρχείο. Κατάσταση αποθήκευσης:": "Die Anwendung ist eine einzige Seite und läuft offline. Die Daten bleiben auf diesem Gerät und gleichen sich nicht von selbst ab. Zwei Richter auf zwei Telefonen sehen die Änderungen des anderen nicht; sie tauschen eine Datei. Speicherzustand:",
  "Η εφαρμογή και ο κώδικάς της ανήκουν στον όμιλο. Τα σήματα, τα δεδομένα των αγώνων και το μητρώο είναι δικά του.": "Die Anwendung und ihr Quelltext gehören dem Klub. Die Zeichen, die Prüfungsdaten und das Zuchtbuch sind sein Eigentum.",
  "Η εφαρμογή τρέχει από την κρυφή μνήμη της συσκευής, ώστε να δουλεύει χωρίς σήμα. Αυτό σημαίνει ότι μια διόρθωση φτάνει σε εσάς την επόμενη φορά που θα την ανοίξετε με σύνδεση.": "Die Anwendung läuft aus dem Zwischenspeicher des Geräts, damit sie ohne Netz funktioniert. Eine Korrektur erreicht Sie also beim nächsten Öffnen mit Verbindung.",
  "Η ημέρα": "Der Tag",
  "Η κατανομή επιστρέφει στην κλήρωση": "Die Zuteilung geht zurück an die Auslosung",
  "Η κλήρωση έγινε": "Die Auslosung erfolgte",
  "Η κλήρωση δεν μπορεί να γίνει ακόμη.": "Die Auslosung ist noch nicht möglich.",
  "Η κλήρωση ολοκληρώθηκε": "Die Auslosung ist abgeschlossen",
  "Η ορολογία των κριτών γυρίζει σε πέντε γλώσσες, από τους ίδιους τους κανονισμούς. Τα ισπανικά είναι η εξαίρεση: κανένας ισπανικός κανονισμός δεν βρίσκεται στο αποθετήριο, οπότε εκεί και οι όροι είναι επαγγελματική, μη επίσημη μετάφραση — όπως όλη η υπόλοιπη οθόνη σε κάθε γλώσσα. Στη βάση όλα μένουν ελληνικά.": "Die Richterterminologie dreht sich in fünf Sprachen, den Regelwerken selbst entnommen. Spanisch ist die Ausnahme: im Repositorium liegt kein spanisches Regelwerk, also sind dort auch die Fachbegriffe eine professionelle, nicht offizielle Übersetzung — wie der übrige Bildschirm in jeder Sprache. In der Datenbank bleibt alles griechisch.",
  "Η ορολογία των κριτών — φέρμα, ποντάρισμα, συναίνεση, τα σφάλματα του Άρθρου 33, οι βαθμολογίες — μπήκε από τους ίδιους τους κανονισμούς και σε πέντε γλώσσες. Κανένας όρος δεν μεταφράστηκε· δείτε τους με την πηγή τους στο Γλωσσάρι. Η υπόλοιπη οθόνη είναι επαγγελματική, μη επίσημη μετάφραση, γιατί γι' αυτήν δεν υπάρχει κανονισμός να την ορίσει. Οι φυλές είναι της F.C.I. και της ENCI, οι χώρες του CLDR. Τα ισπανικά στέκουν αλλιώς: κανένας ισπανικός κανονισμός δεν βρίσκεται στο αποθετήριο, οπότε το Γλωσσάρι δεν έχει ισπανική στήλη και στην ισπανική οθόνη είναι μετάφραση και οι όροι και οι φυλές.": "Die Richterterminologie — Vorstehen, Nachziehen auf Befehl, Sekundieren, die Fehler des Artikels 33, die Bewertungen — wurde den Regelwerken selbst entnommen, in fünf Sprachen. Kein Begriff wurde übersetzt; sehen Sie jeden mit seiner Quelle im Glossar. Der übrige Bildschirm ist eine professionelle, nicht offizielle Übersetzung, denn dafür gibt es kein Regelwerk. Die Rassen stammen von der F.C.I. und der ENCI, die Länder vom CLDR. Spanisch steht anders da: im Repositorium liegt kein spanisches Regelwerk, also hat das Glossar keine spanische Spalte, und auf dem spanischen Bildschirm sind sowohl die Begriffe als auch die Rassen Übersetzung.",
  "Η προηγούμενη ημέρα δεν έχει κληρωθεί": "Der Vortag wurde nicht ausgelost",
  "Η σειρά είναι ενδεικτική (Άρθρο 16).": "Die Reihenfolge ist unverbindlich (Artikel 16).",
  "Η σειρά είναι ενδεικτική (Άρθρο 16). Να είστε στη διάθεση των κριτών.": "Die Reihenfolge ist unverbindlich (Artikel 16). Halten Sie sich den Richtern zur Verfügung.",
  "Η σειρά είναι ενδεικτική — Άρθρο 16.": "Die Reihenfolge ist unverbindlich — Artikel 16.",
  "Η σειρά είναι ενδεικτική — Άρθρο 16. Το μήνυμα ανοίγει στην εφαρμογή μηνυμάτων του τηλεφώνου· η αποστολή γίνεται από εκεί.": "Die Reihenfolge ist unverbindlich — Artikel 16. Die Nachricht öffnet sich in der Nachrichten-App des Telefons; gesendet wird von dort.",
  "Η συγχώνευση κρατά ό,τι υπάρχει και προσθέτει· η αντικατάσταση σβήνει τη συσκευή. Στο τερέν θέλετε σχεδόν πάντα συγχώνευση.": "Zusammenführen behält das Vorhandene und ergänzt; Ersetzen löscht das Gerät. Im Gelände wollen Sie fast immer Zusammenführen.",
  "Η τοποθεσία και η ώρα μπαίνουν στο SMS των κυναγωγών και των κριτών.": "Ort und Uhrzeit stehen in der SMS an Führer und Richter.",
  "Η τοποθεσία και η ώρα προσέλευσης έρχονται από τον αγώνα (Επεξεργασία αγώνα). Αν δεν τις βάλετε στην επικεφαλίδα, μπαίνουν μόνες τους σε δική τους γραμμή — κανένα μήνυμα δεν φεύγει χωρίς πού και πότε.": "Ort und Antrittszeit kommen aus der Prüfung (Prüfung bearbeiten). Setzen Sie sie nicht in die Kopfzeile, werden sie von selbst in eine eigene Zeile gestellt — keine Nachricht geht ohne Wo und Wann hinaus.",
  "Η υπαγόρευση δεν ξεκίνησε. Χρησιμοποιήστε το μικρόφωνο του πληκτρολογίου.": "Das Diktat startete nicht. Nutzen Sie das Mikrofon der Tastatur.",
  "Η υπογραφή κλειδώνει τη βαθμολογία και τις σημειώσεις του τερέν. Το ξεκλείδωμα γίνεται από τον Πρόεδρο Κριτών με αιτιολογία, που καταγράφεται.": "Die Unterschrift sperrt Bewertung und Notizen des Geländes. Entsperrt wird durch den Obmann des Richterkollegiums mit Begründung, die festgehalten wird.",
  "Η χώρα εκτροφής είναι εκείνη του εκτροφείου, όχι του κυναγωγού· από αυτήν βγαίνει και το «κυπριακής εκτροφής» στο μητρώο.": "Das Zuchtland ist das des Zwingers, nicht das des Führers; daraus ergibt sich „zyprische Zucht“ im Register.",

  "Κάθε σκύλος ανήκει σε έναν κυναγωγό — διαλέξτε τον από το μητρώο ή γράψτε το όνομά του εδώ. Έρχεται πρώτος στη λίστα όταν ο σκύλος μπαίνει σε αγώνα, και όνομα, χώρα και τηλέφωνο ενημερώνουν και το μητρώο κυναγωγών.": "Jeder Hund gehört zu einem Führer — wählen Sie ihn aus dem Register oder schreiben Sie seinen Namen hierher. Er steht in der Liste vorn, wenn der Hund zu einer Prüfung gemeldet wird, und Name, Land und Telefon aktualisieren auch das Führerregister.",
  "Κάθε σκύλος θέλει κυναγωγό — επιλέξτε ή γράψτε όνομα": "Jeder Hund braucht einen Führer — wählen Sie einen oder schreiben Sie einen Namen",

  "Και τα τέσσερα κείμενα ζητούν όρθια και τεντωμένη φέρμα. Ξαπλωτή φέρμα δεν αποκλείει, αλλά κόβει το ΕΞΑΙΡΕΤΟΣ (ACO II.13· ENCI art. 11 §12 «Ferma non rigida»).": "Alle vier Texte verlangen festes, straffes Vorstehen im Stand. Liegendes Vorstehen schließt nicht aus, verhindert aber Hervorragend (ACO II.13; ENCI Art. 11 §12 „Ferma non rigida“).",

  "Με τη «Λήξη» ενός ζεύγους, η εφαρμογή ετοιμάζει ένα σύντομο μήνυμα για τους δύο κυναγωγούς του επόμενου και ανοίγει την εφαρμογή μηνυμάτων. Την αποστολή τη δίνετε εσείς — η εφαρμογή δεν στέλνει τίποτα μόνη της, ούτε εδώ ούτε πουθενά αλλού.": "Beim Beenden eines Paares hält die Anwendung eine kurze Nachricht für die beiden Führer des nächsten bereit und öffnet die Nachrichten-App. Abgeschickt wird sie von Ihnen — die Anwendung verschickt nichts von selbst, hier so wenig wie anderswo.",

  "Στα ιταλικά δεν βρέθηκε αντίστοιχος όρος: η ENCI λύνει το ίδιο πρόβλημα με «turni per l'assegnazione del CACIT» και «batterie» (ENCI art. 4), όχι με ξεχωριστή λέξη.": "Im Italienischen fand sich kein entsprechender Begriff: die ENCI löst dasselbe Problem mit „turni per l'assegnazione del CACIT“ und „batterie“ (ENCI Art. 4), nicht mit einem eigenen Wort.",

  "Η F.C.I. ορίζει τουλάχιστον δεκαπέντε λεπτά για την πρώτη διαδρομή (ACO II.5).": "La F.C.I. fissa almeno quindici minuti per il primo turno (ACO II.5).",
  "Η «Αποστολή στο κινητό» στέλνει τον αγώνα μαζί με τα κληρωμένα ζεύγη — φορτώστε τον στο κινητό (Ρυθμίσεις → Φόρτωση αρχείου → Συγχώνευση) και συνεχίστε από εκεί στο τερέν. Τα SMS φεύγουν από όποια συσκευή κρατά τη σειρά.": "«Invia al telefono» manda la prova insieme alle coppie sorteggiate — caricatela sul telefono (Impostazioni → Carica file → Unisci) e proseguite da lì sul terreno. Gli SMS partono dal dispositivo che tiene l'ordine di turno.",
  "Η Μεγάλη Έρευνα γίνεται πάντα σε ζεύγη (Άρ. 4). Για CACIT χρειάζονται 3 κριτές ανά τερέν (Άρ. 48).": "La Grande Quête si corre sempre in coppia (Art. 4). Per il CACIT servono tre giudici per terreno (Art. 48).",
  "Η άρνηση αποκλείει και στα τέσσερα: ACO II.13 «Refusal to execute a commanded approach leads to elimination»· ENCI art. 11 §16 «Rifiuto di guidare».": "Il rifiuto elimina in tutti e quattro: ACO II.13 «Refusal to execute a commanded approach leads to elimination»; ENCI art. 11 §16 «Rifiuto di guidare».",
  "Η άρνηση αποκλείει: GQ art. 8 «A refusal to back is an eliminating fault»· SCC art. 3 «Le refus de patron … est éliminatoire»· ENCI art. 11 §8.": "Il rifiuto elimina: GQ art. 8 «A refusal to back is an eliminating fault»; SCC art. 3 «Le refus de patron … est éliminatoire»; ENCI art. 11 §8.",
  "Η αγγλική στήλη δεν έχει πηγή στα κείμενα που έχουμε — η S.C.C. art. 3 το λέει εξίσου αποκλειστικό με την άρνηση συναίνεσης, αλλά στα γαλλικά.": "La colonna inglese non ha fonte nei testi in nostro possesso — la S.C.C. art. 3 la dice eliminatoria quanto il rifiuto di consenso, ma in francese.",
  "Η αλλαγή καταγράφηκε": "La modifica è registrata",
  "Η ανατομία του πόντου": "L'anatomia del punto",
  "Η αντιγραφή δεν επιτράπηκε": "La copia non è stata consentita",
  "Η γλώσσα αλλάζει μόνο ό,τι βλέπετε. Στη βάση όλα μένουν ελληνικά — η κατάσταση, η βαθμολογία, η μορφή του αγώνα — ώστε ένα αντίγραφο από αγγλικό κινητό να συγχωνεύεται κανονικά σε ελληνικό υπολογιστή και ο πίνακας πόντων να βρίσκει το κλειδί του.": "La lingua cambia solo ciò che vedete. Nella base dati resta tutto in greco — stato, qualifica, forma della prova — così che una copia fatta su un telefono in inglese si unisca senza problemi a un computer in greco e la tabella dei punti ritrovi la sua chiave.",
  "Η γραμμή επικεφαλίδων εντοπίστηκε αυτόματα. Ελέγξτε κάθε στήλη πριν την εισαγωγή· είναι η μόνη ευκαιρία να πιαστεί λάθος στήλη.": "La riga di intestazione è stata individuata automaticamente. Controllate ogni colonna prima dell'importazione; è l'unica occasione per accorgersi di una colonna sbagliata.",
  "Η διαδρομή": "Il turno",
  "Η διαδρομή επεκτάθηκε σε ": "Il turno è stato prolungato a ",
  "Η ενέργεια καταγράφεται στο φύλλο του κριτή. Επιβεβαίωση αποκλεισμού;": "L'azione viene registrata sul foglio del giudice. Confermare l'eliminazione?",
  "Η εφαρμογή άνοιξε από αρχείο, όχι από διεύθυνση.": "L'applicazione è stata aperta da un file, non da un indirizzo.",
  "Η εφαρμογή δεν άνοιξε από διεύθυνση, οπότε δεν υπάρχει ενημέρωση να ελεγχθεί.": "L'applicazione non è stata aperta da un indirizzo, quindi non c'è alcun aggiornamento da controllare.",
  "Η εφαρμογή δεν κατεβαίνει από κατάστημα. Ανοίγει σε μια διεύθυνση και προστίθεται στην αρχική οθόνη. Μετά την πρώτη φορά δουλεύει χωρίς σήμα, που είναι και το ζητούμενο στο τερέν.": "L'applicazione non si scarica da uno store. Si apre a un indirizzo e si aggiunge alla schermata Home. Dopo la prima volta funziona senza segnale, che è poi il punto sul terreno.",
  "Η εφαρμογή είναι λίγα αρχεία —": "L'applicazione sono pochi file —",
  "Η εφαρμογή είναι μία σελίδα και λειτουργεί χωρίς σύνδεση. Τα δεδομένα μένουν σε αυτή τη συσκευή και δεν συγχρονίζονται μόνα τους. Δύο κριτές σε δύο κινητά δεν βλέπουν ο ένας τις αλλαγές του άλλου· ανταλλάσσουν αρχείο. Κατάσταση αποθήκευσης:": "L'applicazione è una sola pagina e funziona fuori linea. I dati restano su questo dispositivo e non si sincronizzano da soli. Due giudici su due telefoni non vedono le modifiche l'uno dell'altro; si scambiano un file. Stato dell'archiviazione:",
  "Η εφαρμογή και ο κώδικάς της ανήκουν στον όμιλο. Τα σήματα, τα δεδομένα των αγώνων και το μητρώο είναι δικά του.": "L'applicazione e il suo codice appartengono al club. I marchi, i dati delle prove e il registro sono suoi.",
  "Η εφαρμογή τρέχει από την κρυφή μνήμη της συσκευής, ώστε να δουλεύει χωρίς σήμα. Αυτό σημαίνει ότι μια διόρθωση φτάνει σε εσάς την επόμενη φορά που θα την ανοίξετε με σύνδεση.": "L'applicazione gira dalla cache del dispositivo, così funziona senza segnale. Vuol dire che una correzione vi arriva la prossima volta che la aprite con una connessione.",
  "Η ημέρα": "La giornata",
  "Η κατανομή επιστρέφει στην κλήρωση": "L'assegnazione torna al sorteggio",
  "Η κλήρωση έγινε": "Il sorteggio è stato fatto",
  "Η κλήρωση δεν μπορεί να γίνει ακόμη.": "Il sorteggio non si può ancora fare.",
  "Η κλήρωση ολοκληρώθηκε": "Il sorteggio è completato",
  "Η ορολογία των κριτών γυρίζει σε πέντε γλώσσες, από τους ίδιους τους κανονισμούς. Τα ισπανικά είναι η εξαίρεση: κανένας ισπανικός κανονισμός δεν βρίσκεται στο αποθετήριο, οπότε εκεί και οι όροι είναι επαγγελματική, μη επίσημη μετάφραση — όπως όλη η υπόλοιπη οθόνη σε κάθε γλώσσα. Στη βάση όλα μένουν ελληνικά.": "La terminologia di giudizio gira in cinque lingue, presa dai regolamenti stessi. Lo spagnolo fa eccezione: nel repository non c'è alcun regolamento spagnolo, quindi lì anche i termini sono una traduzione professionale, non ufficiale — come lo è il resto della schermata in ogni lingua. Nel database tutto resta in greco.",
  "Η ορολογία των κριτών — φέρμα, ποντάρισμα, συναίνεση, τα σφάλματα του Άρθρου 33, οι βαθμολογίες — μπήκε από τους ίδιους τους κανονισμούς και σε πέντε γλώσσες. Κανένας όρος δεν μεταφράστηκε· δείτε τους με την πηγή τους στο Γλωσσάρι. Η υπόλοιπη οθόνη είναι επαγγελματική, μη επίσημη μετάφραση, γιατί γι' αυτήν δεν υπάρχει κανονισμός να την ορίσει. Οι φυλές είναι της F.C.I. και της ENCI, οι χώρες του CLDR. Τα ισπανικά στέκουν αλλιώς: κανένας ισπανικός κανονισμός δεν βρίσκεται στο αποθετήριο, οπότε το Γλωσσάρι δεν έχει ισπανική στήλη και στην ισπανική οθόνη είναι μετάφραση και οι όροι και οι φυλές.": "La terminologia di giudizio — ferma, guidata, consenso, i falli dell'Articolo 33, le qualifiche — è stata presa dai regolamenti stessi, in cinque lingue. Nessun termine è stato tradotto; vedeteli con la loro fonte nel Glossario. Il resto della schermata è una traduzione professionale, non ufficiale, perché per essa non c'è regolamento che la fissi. Le razze sono della F.C.I. e dell'ENCI, i paesi del CLDR. Lo spagnolo sta diversamente: nel repository non c'è alcun regolamento spagnolo, quindi il Glossario non ha una colonna spagnola e sulla schermata spagnola sia i termini sia le razze sono traduzione.",
  "Η προηγούμενη ημέρα δεν έχει κληρωθεί": "La giornata precedente non è stata sorteggiata",
  "Η σειρά είναι ενδεικτική (Άρθρο 16).": "L'ordine è indicativo (Articolo 16).",
  "Η σειρά είναι ενδεικτική (Άρθρο 16). Να είστε στη διάθεση των κριτών.": "L'ordine di turno è indicativo (Articolo 16). Restate a disposizione dei giudici.",
  "Η σειρά είναι ενδεικτική — Άρθρο 16.": "L'ordine è indicativo — Articolo 16.",
  "Η σειρά είναι ενδεικτική — Άρθρο 16. Το μήνυμα ανοίγει στην εφαρμογή μηνυμάτων του τηλεφώνου· η αποστολή γίνεται από εκεί.": "L'ordine è indicativo — Articolo 16. Il messaggio si apre nell'app dei messaggi del telefono; l'invio avviene da lì.",
  "Η συγχώνευση κρατά ό,τι υπάρχει και προσθέτει· η αντικατάσταση σβήνει τη συσκευή. Στο τερέν θέλετε σχεδόν πάντα συγχώνευση.": "L'unione conserva quel che c'è e aggiunge; la sostituzione cancella il dispositivo. Sul terreno serve quasi sempre l'unione.",
  "Η τοποθεσία και η ώρα μπαίνουν στο SMS των κυναγωγών και των κριτών.": "Il luogo e l'ora entrano nell'SMS ai conduttori e ai giudici.",
  "Η τοποθεσία και η ώρα προσέλευσης έρχονται από τον αγώνα (Επεξεργασία αγώνα). Αν δεν τις βάλετε στην επικεφαλίδα, μπαίνουν μόνες τους σε δική τους γραμμή — κανένα μήνυμα δεν φεύγει χωρίς πού και πότε.": "Il luogo e l'ora di ritrovo vengono dalla prova (Modifica la prova). Se non li mettete nell'intestazione, si aggiungono da soli su una riga a parte — nessun messaggio parte senza un dove e un quando.",
  "Η υπαγόρευση δεν ξεκίνησε. Χρησιμοποιήστε το μικρόφωνο του πληκτρολογίου.": "La dettatura non è partita. Usate il microfono della tastiera.",
  "Η υπογραφή κλειδώνει τη βαθμολογία και τις σημειώσεις του τερέν. Το ξεκλείδωμα γίνεται από τον Πρόεδρο Κριτών με αιτιολογία, που καταγράφεται.": "La firma blocca la valutazione e le note del terreno. Lo sblocco lo fa il Presidente di giuria con una motivazione, che viene registrata.",
  "Η χώρα εκτροφής είναι εκείνη του εκτροφείου, όχι του κυναγωγού· από αυτήν βγαίνει και το «κυπριακής εκτροφής» στο μητρώο.": "Il paese di allevamento è quello dell'allevamento, non del conduttore; da lì viene «allevamento cipriota» nel registro.",

  "Κάθε γλώσσα δίνει τον όρο της από τον δικό της κανονισμό": "Ogni lingua dà il proprio termine dal proprio regolamento",
  "Κάθε σκύλος ανήκει σε έναν κυναγωγό — διαλέξτε τον από το μητρώο ή γράψτε το όνομά του εδώ. Έρχεται πρώτος στη λίστα όταν ο σκύλος μπαίνει σε αγώνα, και όνομα, χώρα και τηλέφωνο ενημερώνουν και το μητρώο κυναγωγών.": "Ogni cane appartiene a un conduttore — sceglietelo dal registro o scrivetene qui il nome. Compare per primo nell'elenco quando il cane viene iscritto a una prova, e nome, paese e telefono aggiornano anche il registro dei conduttori.",
  "Κάθε σκύλος θέλει κυναγωγό — επιλέξτε ή γράψτε όνομα": "Ogni cane vuole un conduttore — sceglietelo o scrivete un nome",
  "Κάθε συσκευή κρατά τα δικά της δεδομένα. Η εγκατάσταση δίνει την εφαρμογή, όχι τους αγώνες — αυτοί ταξιδεύουν με τη Μεταφορά (Ρυθμίσεις).": "Ogni dispositivo conserva i propri dati. L'installazione dà l'applicazione, non le prove — quelle viaggiano con il Trasferimento (Impostazioni).",
  "Κάντε πρώτα την κλήρωση": "Fate prima il sorteggio",
  "Κάντε πρώτα την κλήρωση. Η βαθμολογία ακολουθεί τα ζεύγη.": "Fate prima il sorteggio. La valutazione segue le coppie.",
  "Κάντε πρώτα την κλήρωση. Τα μηνύματα συντίθενται από τη σειρά της ημέρας.": "Fate prima il sorteggio. I messaggi si compongono dall'ordine della giornata.",
