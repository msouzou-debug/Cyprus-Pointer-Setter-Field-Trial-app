/* The bottom action bar is field chrome. On Κλήρωση, Τερέν and SMS the primary
   action lives in the bottom third, because the top of a phone is out of reach
   one-handed. The desk screens carry their actions inline instead — the same
   split the design draws. */
function isFieldScreen(){
  return S.view==="trial" && ["draw","braces","sms"].includes(S.tab);
}
function fabFor(){
  if(S.view==="trial"){
    const t = trialById(S.trialId); if(!t) return "";
    const day = t.days[S.day];
    if(S.tab==="draw"){
      const label = S.reveal !== null ? "Κλήρωση…" : day.draw ? "Νέα κλήρωση" : "Κλήρωση";
      return `<button class="b-act" data-act="doDraw">${label}</button>`;
    }
    if(S.tab==="braces"){
      if(S.reorder) return "";
      const live = liveBrace(t);
      if(live) return `<button data-act="pauseBrace" style="flex:0 0 auto">${live.b.startedAt?"Παύση":"Συνέχεια"}</button>
        <button data-act="extendBrace" style="flex:0 0 auto">+5′</button>
        <button class="b-act" data-act="nextBrace">Επόμενο ζεύγος</button>`;
      const next = nextPending(t);
      return next ? `<button class="b-act" data-act="nextBrace">Έναρξη ζεύγους ${next.b.no}</button>` : "";
    }
    if(S.tab==="sms")   return `<button class="b-act" data-act="smsAll">Άνοιγμα επόμενου SMS</button>`;
    return "";
  }
  return "";
}
/* the brace on the ground right now, and the one after it */
function liveBrace(t){
  const day = t.days[S.day];
  for(const tr of day.terrains||[])
    for(const b of tr.braces||[]) if(b.status==="ΤΡΕΧΕΙ" && (!S.judgeFilter || tr.judgeIds.includes(S.judgeFilter)))
      return {tr, b};
  return null;
}
function nextPending(t){
  const day = t.days[S.day];
  for(const tr of day.terrains||[])
    for(const b of tr.braces||[]) if(b.status==="ΕΚΚΡΕΜΕΙ" && (!S.judgeFilter || tr.judgeIds.includes(S.judgeFilter)))
      return {tr, b};
  return null;
}

/* ---------- 8. Views: trial detail --------------------------------------- */
function vTrial(){
  const t = trialById(S.trialId); if(!t){ S.view="trials"; return vTrials(); }
  const body = {entries:tEntries,terrains:tTerrains,draw:tDraw,braces:tBraces,
                sms:tSms,results:tResults,export:tExport}[S.tab](t);
  return `
  <div class="row noprint" style="margin-bottom:10px">
    <button class="b-sm" data-nav="trials">‹ Αγώνες</button>
    <span class="chip n">${esc(t.status)}</span>
    <button class="b-sm" data-act="editTrial" style="margin-left:auto">Επεξεργασία</button>
  </div>
  <h1 style="margin-bottom:6px">${esc(t.title)}</h1>
  <div class="muted" style="margin-bottom:14px">${esc(t.type)} · ${t.format==="ΖΕΥΓΗ"?"Ζεύγη":"Ατομικός"}
   · ${esc(t.game||"—")}${t.wild?" (άγριο θήραμα)":""} · ${fmtDate(t.dateStart)} · ${esc(t.place||"")}
   · Συντελεστής ×${coefficient(t)}</div>
  ${progressStrip(t)}
  ${t.days.length>1?`<div class="row tight noprint" style="margin-bottom:14px">
    ${t.days.map((d,i)=>`<button class="tog ${S.day===i?"on":""}" data-day="${i}">Ημέρα ${i+1} · ${fmtDate(d.date)}</button>`).join("")}
  </div>`:""}
  ${body}`;
}

/* The app has an order of operations — entries, terrains, the draw, the SMS,
   the running, the scoring — and nothing on screen said so. This says it, and
   each step is the way in. It is also the only navigation: a strip of steps
   above a strip of tabs carrying the same six words read as the same buttons
   twice on a phone, which is what it was. Εξαγωγές trails as a plain button —
   it is a destination, not a step, and it never completes. */
function progressStrip(t){
  const day = t.days[S.day];
  const active = t.entries.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ").length;
  const judged = day.terrains.length && day.terrains.every(tr=>tr.judgeIds.length);
  const q = day.draw ? smsQueue(t) : [];
  const sent = q.filter(x=>t.sms[x.entry.id]==="ΕΣΤΑΛΗ").length;
  const scored = t.entries.filter(e=>{ const r = t.results[e.id]; return r && r.qual && r.qual!=="-"; }).length;
  const braces = [];
  day.terrains.forEach(tr=>(tr.braces||[]).forEach(b=>braces.push(b)));
  const ran = braces.filter(b=>b.status==="ΟΛΟΚΛΗΡΩΘΗΚΕ").length;
  const steps = [
    ["entries",  "Συμμετοχές", active >= 6,        active ? active + " σκύλοι" : "καμία"],
    ["terrains", "Τερέν",      day.terrains.length && judged,
                                                   day.terrains.length ? day.terrains.length + " τερέν" : "κανένα"],
    ["draw",     "Κλήρωση",    !!day.draw,         day.draw ? "έγινε" : "εκκρεμεί"],
    ["sms",      "SMS",        q.length > 0 && sent === q.length,
                                                   q.length ? sent + "/" + q.length : "—"],
    ["braces",   "Ζεύγη",      braces.length > 0 && ran === braces.length,
                                                   braces.length ? ran + "/" + braces.length : "—"],
    ["results",  "Βαθμολογία", active > 0 && scored === active,
                                                   scored ? scored + "/" + active : "—"]
  ];
  const firstOpen = steps.findIndex(x=>!x[2]);
  return `<div class="steps noprint">${steps.map(([k,label,done,note],i)=>
    `<button class="step-i ${done?"done":""} ${i===firstOpen?"now":""} ${S.tab===k?"here":""}" data-tab="${k}">
      <span class="mark">${done?"✓":i+1}</span>
      <span class="lbl">${label}<span>${esc(note)}</span></span>
    </button>`).join("")}
    <button class="step-i plain ${S.tab==="export"?"here":""}" data-tab="export">
      <span class="lbl">Εξαγωγές<span>αρχεία και εκτυπώσεις</span></span></button></div>`;
}

/* --- 8a. entries --- */
function tEntries(t){
  /* Grouped by handler, because that is who turns up: one man arrives with
     three dogs and the head judge deals with him once, not three times. */
  const groups = new Map();
  t.entries.forEach(e=>{
    const key = e.handlerId || "";
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(e);
  });
  const ordered = [...groups.entries()].sort((x, y)=>{
    if(!x[0]) return 1;                                   /* unassigned last */
    if(!y[0]) return -1;
    return perName(x[0]).localeCompare(perName(y[0]), "el");
  });

  const cards = ordered.map(([hid, list])=>{
    const who = hid ? perName(hid) : "— χωρίς κυναγωγό —";
    const phone = hid ? (perById(hid)||{}).phone : "";
    const running = list.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ").length;
    const dogs = list.slice().sort((p,q)=>dogName(p.dogId).localeCompare(dogName(q.dogId),"el"))
      .map(e=>{
        const d = dogById(e.dogId) || {};
        const find = ((d.name||"") + " " + (d.reg||"") + " " + (d.breed||"") + " " + who).toLowerCase();
        return `<div class="entry-row" data-find="${esc(find)}">
          <div class="who">
            <b>${esc(d.name||"—")}</b>
            <span class="tiny">${esc(d.breed||"")}${d.sex?" · "+(d.sex==="Θ"?"θηλυκός":"αρσενικός"):""}${
              d.reg?" · "+esc(d.reg):""}</span>
          </div>
          <div class="acts">
            ${e.season?`<span class="chip y">οίστρος</span>`:""}
            ${e.paid?`<span class="chip g">πληρ.</span>`:`<span class="chip r">απλήρωτο</span>`}
            ${e.status!=="ΔΗΛΩΜΕΝΟΣ"?`<span class="chip">${esc(e.status)}</span>`:""}
            <button class="b-sm noprint" data-editentry="${e.id}">Επεξ.</button>
          </div></div>`;
      }).join("");
    return `<div class="card handler" data-group="${esc(who.toLowerCase())}">
      <div class="row" style="align-items:baseline;gap:10px">
        <h3 class="grow" style="margin:0">${esc(who)}</h3>
        <span class="muted num">${running} ${running===1?"σκύλος":"σκύλοι"}</span>
      </div>
      ${phone?`<div class="fingerprint">${esc(phone)}</div>`:""}
      <div style="margin-top:10px">${dogs}</div>
      ${hid?`<div class="row tight noprint" style="margin-top:12px">
        <button class="b-sm" data-batch="${hid}">Αλλαγή σκύλων</button></div>`:""}
    </div>`;
  }).join("");

  const active = t.entries.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ").length;
  const braces = Math.ceil(active/(t.format==="ΖΕΥΓΗ"?2:1));
  const min = active>=6 && braces>=3;
  const handlers = ordered.filter(([hid, l])=>l.some(e=>e.status==="ΔΗΛΩΜΕΝΟΣ")).length;
  return `
  <div class="${min?"note":"err"}">${active} ${active===1?"σκύλος":"σκύλοι"} από ${handlers}
   ${handlers===1?"κυναγωγό":"κυναγωγούς"} · ${braces} ${t.format==="ΖΕΥΓΗ"?"ζεύγη":"διαδρομές"}.
   ${min ? "Πληρούνται τα ελάχιστα: 6 σκύλοι και 3 ζεύγη."
     : `<b>Δεν πληρούνται τα ελάχιστα.</b> Χρειάζονται τουλάχιστον 6 σκύλοι και 3 ζεύγη
        (ΕΚ Άρθρο 5, Άρθρο 40). Προσθέστε συμμετοχές ή συγχωνεύστε τερέν.`}</div>
  <div class="row noprint" style="margin-bottom:14px">
    <div class="grow" style="max-width:340px">
      <input id="entryQ" placeholder="Αναζήτηση σκύλου ή κυναγωγού"
        value="${esc(S.entryQ||"")}" oninput="filterEntries(this.value)"></div>
    <button class="b-act" data-act="addEntry">+ Συμμετοχές</button>
    <button data-act="importEntries">Εισαγωγή αρχείου</button></div>
  <div id="entryNone" class="empty" style="display:none">Καμία συμμετοχή δεν ταιριάζει.</div>
  ${cards ? `<div class="split top">${cards}</div>`
    : `<div class="empty">Καμία συμμετοχή ακόμη. Εισαγάγετε αρχείο Excel ή προσθέστε σκύλο.</div>`}`;
}

/* --- 8b. terrains ---
   How many terrains, then who judges each one. Both are decisions the Πρόεδρος
   Κριτών makes in that order, so the screen asks in that order: a count first,
   then a card per terrain with the judges chosen from the register by name. */
function tTerrains(t){
  const day = t.days[S.day];
  const need = t.format==="ΖΕΥΓΗ"?2:1;
  const cacit = t.award==="CACIT";
  const want = cacit ? 3 : need;

  const count = `<div class="card noprint">
    <div class="eyebrow">Πόσα τερέν</div>
    <div class="row tight" style="margin-top:10px">${[1,2,3,4].map(n=>
      `<button class="tog ${day.terrains.length===n?"on":""}" data-nterrain="${n}"
        style="min-width:56px;justify-content:center">${n}</button>`).join("")}</div>
    <div class="tiny" style="margin-top:10px">Τα τερέν παίρνουν όνομα Α, Β, Γ, Δ. Μπορείτε να
      το αλλάξετε από την Επεξεργασία. Η κατανομή των σκύλων γίνεται στην κλήρωση.</div>
  </div>`;

  const cards = day.terrains.map(tr=>{
    const slots = judgeSlots(tr, want);
    const bad = tr.judgeIds.length < want;
    const conflicts = t.entries.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ" && (tr.entryIds||[]).includes(e.id)
                       && judgeConflict(tr,e,t)).map(e=>dogName(e.dogId));
    const byName = DB.judges.slice().sort((a,b)=>a.name.localeCompare(b.name,"el"));
    /* One seat per row, named the way the committee is named: the κεντρικός and
       then Κριτής 1, Κριτής 2. A man cannot hold two seats on the same terrain,
       so choosing him for one clears the other. */
    const seat = (jid, i)=>`<div>
      <label>${i===0?"Κεντρικός κριτής":"Κριτής "+i}</label>
      <select data-judgeslot="${tr.id}|${i}">
        <option value="">— κανένας —</option>
        ${byName.map(j=>`<option value="${j.id}" ${jid===j.id?"selected":""}>${esc(j.name)}${
          j.me?" · Μ.Ε.":""}</option>`).join("")}
      </select></div>`;
    /* conflicts surface immediately and specifically, with the article and a
       one-tap way to fix them */
    return `<div class="card">
      <h3 style="margin:0">${esc(tr.name)}</h3>
      ${tr.breedGroup?`<div class="muted" style="margin-top:6px">Φυλή: ${
        tr.breedGroup==="POINTER"?"Pointer":"Setter"}</div>`:""}

      <div class="noprint" style="margin-top:12px;display:grid;gap:12px;max-width:420px">
        ${slots.map(seat).join("")}</div>

      <div class="print-only muted" style="margin-top:8px">Κεντρικός κριτής: ${
        esc((judById(slots[0])||{}).name||"—")}${slots.filter((j,i)=>i>0 && j).length
        ? " · Κριτές: " + slots.filter((j,i)=>i>0 && j)
            .map(j=>esc((judById(j)||{}).name||"?")).join(", ") : ""}</div>

      <div class="muted num" style="margin-top:12px">${(tr.entryIds||[]).length} σκύλοι · ${(tr.braces||[]).length} ζεύγη
        ${tr.assigned?`<span class="chip n" style="margin-right:6px">ΧΕΙΡΟΚΙΝΗΤΗ ΑΝΑΘΕΣΗ</span>`:""}</div>
      ${(tr.entryIds||[]).length ? `<div class="tiny" style="margin-top:6px">${
        (tr.entryIds||[]).map(id=>{
          const e = t.entries.find(x=>x.id===id);
          return e ? esc(dogName(e.dogId)) : "";
        }).filter(Boolean).join(" · ")}</div>` : ""}
      <div class="row tight noprint" style="margin-top:12px">
        <button class="b-sm" data-assign="${tr.id}">Ανάθεση σκύλων</button>
        ${tr.assigned?`<button class="b-sm" data-autoassign="${tr.id}">Αυτόματη κατανομή</button>`:""}
        <button class="b-sm" data-editterrain="${tr.id}">Όνομα και φυλή</button>
      </div>
      ${bad?`<div class="err" style="margin-top:12px;margin-bottom:0">
        <b>Το ${esc(tr.name)} έχει ${tr.judgeIds.length} ${tr.judgeIds.length===1?"κριτή":"κριτές"}.</b>
        Χρειάζονται τουλάχιστον ${want} (Άρθρο 48${cacit?" — για CACIT τρεις, ο ένας Μεγάλης Έρευνας":""}).</div>`:""}
      ${conflicts.length?`<div class="err" style="margin-top:12px;margin-bottom:0">
        <b>Κριτής με δικό του σκύλο σε αυτό το τερέν (Άρθρο 49):</b> ${esc(conflicts.join(", "))}.
        Αφαιρέστε τον κριτή ή μεταφέρετε τον σκύλο σε άλλο τερέν.</div>`:""}
    </div>`;}).join("");

  return count
    + (cards||`<div class="empty">Δεν έχουν οριστεί τερέν. Επιλέξτε πόσα χρειάζονται.</div>`)
    + `<button class="b-sm noprint" data-act="addTerrain" style="margin-bottom:16px">+ Προσθήκη τερέν</button>`
    + handoff(t);
}
/* The committee on a terrain is an ordered list: seat 0 is the κεντρικός κριτής
   and the rest are Κριτής 1, Κριτής 2. `judgeIds` stays the compacted panel that
   Άρθρο 48 and Άρθρο 49 are checked against; `slots` only remembers which seat a
   man was put in, so clearing the κεντρικός does not silently promote the next
   one into his chair. */
function judgeSlots(tr, want){
  const src = (tr.slots && tr.slots.length) ? tr.slots : (tr.judgeIds||[]);
  const out = src.map(j=>judById(j) ? j : "");
  const n = Math.max(want || 2, 3, out.length);
  while(out.length < n) out.push("");
  return out;
}
function setJudgeSlot(t, trId, idx, jid){
  const day = t.days[S.day];
  const tr = day.terrains.find(x=>x.id===trId); if(!tr) return;
  const slots = judgeSlots(tr, t.award==="CACIT" ? 3 : (t.format==="ΖΕΥΓΗ"?2:1));
  if(jid) slots.forEach((v,i)=>{ if(i !== idx && v === jid) slots[i] = ""; });
  slots[idx] = jid;
  tr.slots = slots;
  tr.judgeIds = slots.filter(Boolean);
  tr.headJudgeId = slots[0] || "";
  save(); render();
}

/* Adding terrains is free. Removing one is not: a terrain with braces drawn
   carries the day's work, so the count refuses to swallow it and says which
   one to clear first. */
function setTerrainCount(t, n){
  const day = t.days[S.day];
  const have = day.terrains.length;
  if(n === have) return;
  if(n > have){
    while(day.terrains.length < n)
      day.terrains.push({ id: uid(),
        name: "Τερέν " + String.fromCharCode(913 + day.terrains.length),
        breedGroup: "", judgeIds: [], slots: [], headJudgeId: "", entryIds: [], braces: [] });
    save(); render(); return;
  }
  const going = day.terrains.slice(n);
  const busy = going.filter(tr=>(tr.braces||[]).length);
  if(busy.length)
    return alert("Το " + busy.map(tr=>tr.name).join(", ") + " έχει κληρωμένα ζεύγη. "
      + "Κάντε νέα κλήρωση ή διαγράψτε το τερέν από την Επεξεργασία του.");
  const pinned = going.filter(tr=>(tr.entryIds||[]).length).map(tr=>tr.name);
  if(pinned.length && !confirmAct("Θα αφαιρεθεί το " + pinned.join(", ")
      + " μαζί με τις χειροκίνητες αναθέσεις του. Συνέχεια;")) return;
  day.terrains.length = n;
  save(); render();
}
/* The setup is done on a laptop and the draw happens on a hillside. Two routes
   out, said here rather than left to be found: carry the day to the phone, or
   draw now and send the order. */
function handoff(t){
  const day = t.days[S.day];
  const active = t.entries.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ").length;
  const want = t.award==="CACIT" ? 3 : (t.format==="ΖΕΥΓΗ"?2:1);
  const ready = active >= 6 && day.terrains.length
    && day.terrains.every(tr=>(tr.judgeIds||[]).length >= want);
  if(!ready) return "";
  return `<div class="card noprint">
    <div class="eyebrow">Το στήσιμο είναι έτοιμο</div>
    <p class="tiny">${active} σκύλοι σε ${day.terrains.length}
      ${day.terrains.length===1?"τερέν":"τερέν"}. Δύο τρόποι να συνεχίσετε:</p>
    <div class="row tight" style="margin-top:12px">
      <button class="b-pri" data-tab="draw">Κλήρωση τώρα</button>
      <button data-act="shareTrial">Αποστολή στο κινητό</button>
    </div>
    <div class="tiny" style="margin-top:12px">Στο τερέν: στείλτε το στήσιμο στο κινητό και κάντε
      την κλήρωση εκεί, μπροστά σε όλους. Από το σπίτι: κληρώστε τώρα και στείλτε τη σειρά με SMS
      στους κυναγωγούς· η σειρά παραμένει ενδεικτική (Άρθρο 16).</div>
  </div>`;
}

/* --- 8c. draw ---
   The moment this app exists for. One screen, one large button. On tap the
   braces appear one at a time, in order — it mirrors a public draw where names
   are read out one by one and it gives the crowd something to watch. Below,
   small and permanent: seed, time, fingerprint and Άρθρο 16. */
function tDraw(t){
  const day = t.days[S.day], d = day.draw;
  const active = t.entries.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ").length;
  const rows = [];
  if(d) day.terrains.forEach(tr=>(tr.braces||[]).forEach(b=>{
    const ea = t.entries.find(e=>e.id===b.a), eb = t.entries.find(e=>e.id===b.b);
    rows.push({no:b.no, terrain:tr.name,
      pair:(ea?dogName(ea.dogId):"—") + " / " + (eb?dogName(eb.dogId):"ΜΟΝΟΣ"),
      handlers:[ea&&perName(ea.handlerId), eb&&perName(eb.handlerId)].filter(Boolean).join(" · ")});
  }));
  const shown = S.reveal === null ? rows.length : S.reveal;

  return `
  <div class="eyebrow">Ημέρα ${S.day+1} · ${day.terrains.length} τερέν · ${active} σκύλοι</div>
  <h1>Κλήρωση ζευγών</h1>

  <div class="card">
    <div class="row">
      <div class="grow"><label>Σπόρος κλήρωσης — αφήστε κενό για τυχαίο</label>
        <input id="seedIn" class="seed" placeholder="π.χ. ΚΑΤΩΜΟΝΗ-2026-02-14"></div>
      ${S.day>0?`<div class="grow"><label>Τρόπος</label><select id="drawMode">
        <option value="ΠΕΡΙΣΤΡΟΦΗ" selected>Περιστροφή τερέν (ιταλικό σύστημα)</option>
        <option value="ΚΛΗΡΩΣΗ">Νέα κλήρωση</option></select></div>`:""}
    </div>
    <label style="margin-top:16px">Προτιμήσεις — τηρούνται όπου γίνεται</label>
    <div class="row tight">
      <button class="tog opt ${DB.settings.avoidOwner?"on":""}" data-set="avoidOwner">Ίδιος ιδιοκτήτης</button>
      <button class="tog opt ${DB.settings.avoidKennel?"on":""}" data-set="avoidKennel">Ίδιο εκτροφείο</button>
      <button class="tog opt ${DB.settings.seasonLast?"on":""}" data-set="seasonLast">Οίστρος τελευταίες</button>
    </div>
    <div class="tiny" style="margin-top:12px">Πάντα ισχύουν: ποτέ δύο σκύλοι του ίδιου κυναγωγού
      στο ίδιο ζεύγος · κανένας κριτής δεν κρίνει τερέν με δικό του σκύλο (Άρθρο 49).
      Ο «ίδιος ιδιοκτήτης» πιάνει τους σκύλους που ανήκουν στον ίδιο αλλά τους τρέχουν
      διαφορετικοί κυναγωγοί. Ο ίδιος σπόρος με τις ίδιες συμμετοχές δίνει πάντα την ίδια σειρά.</div>
  </div>

  ${drawCheck(t)}

  ${!d ? `<div class="empty">Καμία κλήρωση ακόμη για την ημέρα ${S.day+1}. Πατήστε «Κλήρωση» για
      να κατανεμηθούν οι σκύλοι στα τερέν και να σχηματιστούν τα ζεύγη.</div>`
    : `<div style="display:flex;flex-direction:column;gap:10px">
      ${rows.map((r,i)=>`<div class="card" data-brace-row style="display:flex;align-items:center;gap:14px;margin:0" ${i<shown?"":"hidden"}>
        <span class="bno" style="font-size:34px;min-width:34px">${r.no}</span>
        <span style="flex:1;min-width:0">
          <span class="eyebrow" style="margin:0">${esc(r.terrain)}</span>
          <b style="display:block;font:600 19px/1.25 var(--f-d);margin-top:5px">${esc(r.pair)}</b>
          <span class="muted">${esc(r.handlers)}</span>
        </span></div>`).join("")}
    </div>
    <div style="border-top:1px solid var(--line);margin-top:18px;padding-top:14px">
      <div class="fingerprint">σπόρος ${esc(d.seed)}<br>${new Date(d.at).toLocaleString("el-GR")} · ${esc(d.mode)}<br>αποτύπωμα ${esc(d.hash)}</div>
      <p style="margin-top:8px">Η σειρά είναι ενδεικτική — Άρθρο 16.</p>
      <button class="b-redraw noprint" data-act="doDraw">Νέα κλήρωση — ακυρώνει την τρέχουσα</button>
    </div>`}`;
}

/* --- 8d. braces ---
   The brace card is the one thing this app exists to produce. Two dogs side by
   side, split down the middle, the number very large across the top. The left
   half is the dog drawn first — right of the jury — and the card says so,
   because handlers argue about it. Every state in §5 of the brief is here:
   εκκρεμεί, τρέχει, ολοκληρώθηκε, μονός, με συμπληρωματικό, επανάκληση,
   χειροκίνητη αλλαγή. */

/* Άρθρο 24 — each run lasts 15 minutes. The clock counts that down and keeps
   counting past zero rather than stopping, because the judge decides when the
   run ends, not the timer. */
const RUN_SECS = 15*60;                                  /* Άρθρο 24 */
/* The regulation says fifteen minutes. Some trials run longer and a judge may
   extend a run he wants to see more of, so the length is a trial setting and
   the extension is per brace. */
function runSecs(t, b){
  const base = (t && +t.runMins > 0 ? +t.runMins : 15) * 60;
  return base + ((b && b.extra) || 0);
}
function braceElapsed(b){
  let s = b.elapsed || 0;
  if(b.startedAt) s += Math.floor((Date.now() - b.startedAt)/1000);
  return s;
}
function clockText(secs){
  const over = secs < 0, n = Math.abs(secs);
  return (over?"+":"") + String(Math.floor(n/60)).padStart(2,"0") + ":" + String(n%60).padStart(2,"0");
}
/* one interval for the whole page; the running braces read their own start time */
let clockTimer = null;
function startClocks(){
  clearInterval(clockTimer);
  if(!document.querySelector("[data-clock]")) return;
  const tick = ()=>{
    document.querySelectorAll("[data-clock]").forEach(n=>{
      const left = (+n.dataset.allow || RUN_SECS) - (+n.dataset.elapsed + (n.dataset.running==="1"
        ? Math.floor((Date.now() - +n.dataset.since)/1000) : 0));
      n.textContent = clockText(left);
      n.classList.toggle("over", left < 0);
    });
  };
  tick(); clockTimer = setInterval(tick, 1000);
}
function clockEl(b, big, t){
  const running = !!b.startedAt, allow = runSecs(t, b);
  return `<span class="clock${big?" big":""}" data-clock data-elapsed="${b.elapsed||0}"
    data-running="${running?1:0}" data-since="${b.startedAt||0}" data-allow="${allow}"
    >${clockText(allow - braceElapsed(b))}</span>`;
}

function qualChip(t, id){
  const r = t.results[id];
  if(!r || !r.qual || r.qual==="-") return "";
  const pts = pointsFor(t, r);
  return `<span class="chip o">${esc(r.qual)}${r.award&&r.award!=="-"?" · "+esc(r.award):""}${pts?" · "+pts:""}</span>`;
}

function braceCard(t, tr, b, opts){
  opts = opts || {};
  const ea = t.entries.find(e=>e.id===b.a), eb = t.entries.find(e=>e.id===b.b);
  const running = b.status==="ΤΡΕΧΕΙ", done = b.status==="ΟΛΟΚΛΗΡΩΘΗΚΕ";

  const side = (e,pos,cls)=>{
    if(!e) return `<div class="dog none">
      <div class="pos">${pos}</div>
      <div class="nm">ΜΟΝΟΣ</div>
      <button class="b-sm noprint" style="margin-top:10px" data-trailer="${tr.id}|${b.id}">+ Συμπληρωματικός</button>
    </div>`;
    const d = dogById(e.dogId)||{};
    const isTrailer = b.trailer && e.id===b.b;
    /* Σημειώσεις is the action a judge reaches for on every run, so it sits
       with the dog. The rare ones — επανάκληση, ανταλλαγή — live in the footer
       and keep the halves readable from arm's length. */
    return `<div class="dog ${cls}">
      <div class="pos">${pos}</div>
      ${isTrailer?`<div style="margin-top:6px"><span class="chip">ΣΥΜΠΛΗΡΩΜΑΤΙΚΟΣ</span></div>`:""}
      <div class="nm">${esc(d.name||"—")}</div>
      <div class="mt">${esc(d.breed||"")}${d.sex?" · "+d.sex:""}${e.season?" · οίστρος":""}</div>
      <div class="mt">${esc(perName(e.handlerId))}</div>
      ${opts.actions?`<button class="b-full noprint" style="margin-top:12px;min-height:48px"
        data-note="${e.id}::${b.id}">Σημειώσεις</button>`:""}
    </div>`;
  };

  /* The rare per-dog actions, named by dog so it is clear which one they hit.
     They stay off the running card: at arm's length that one carries the two
     dogs, the clock and nothing else. */
  const extra = [];
  if(opts.actions && !opts.big) [ea, eb].forEach(e=>{
    if(!e) return;
    const nm = dogName(e.dogId);
    extra.push(`<button class="b-sm" data-recall="${tr.id}|${e.id}">Επανάκληση ${esc(nm)}</button>`);
    extra.push(`<button class="b-sm" data-swap="${tr.id}|${b.id}|${e.id}">Ανταλλαγή ${esc(nm)}</button>`);
  });
  if(opts.actions && !opts.big && b.trailer)
    extra.push(`<button class="b-sm b-warn" data-untrailer="${tr.id}|${b.id}">Αφαίρεση συμπληρωματικού</button>`);

  /* the state, said once, in the top right */
  let state;
  if(running) state = `<span class="live"><i></i>ΤΡΕΧΕΙ</span>`;
  else if(done) state = `<span class="bstate">ΟΛΟΚΛΗΡΩΘΗΚΕ</span>`;
  else if(b.solo && !b.b) state = `<span class="bstate">ΜΟΝΟΣ</span>`;
  else state = `<span class="bstate">ΕΚΚΡΕΜΕΙ</span>`;

  const foot = [];
  if(b.recall) foot.push(`Δεύτερη διαδρομή του ${esc(dogName((ea||{}).dogId))} (Άρθρο 30). Ξεχωριστό φύλλο σημειώσεων.`);
  if(b.trailer) foot.push("Εκτός κλήρωσης. Δεν προσμετράται στα τρία ζεύγη (Άρθρο 40).");
  if(b.manual) foot.push(`Χειροκίνητη αλλαγή από τον Πρόεδρο Κριτών, ${esc(b.manual.at||"")}. Τυπώνεται στη λίστα.`);

  return `<div class="brace ${running?"run":""} ${done?"done":""} ${b.recall?"recall":""}">
    <div class="bhead">
      <div class="bno">${b.no}</div>
      ${opts.big&&running?`<div style="margin-left:auto;text-align:right">
          ${state}${clockEl(b,true,t)}
          <div class="tiny" style="color:#ffffffcc;margin-top:4px">από ${clockText(runSecs(t,b))} (Άρθρο 24)</div></div>`
        :`${b.recall?`<span class="chip y">ΕΠΑΝΑΚΛΗΣΗ</span>`:""}
          ${b.trailer?`<span class="chip n">ΜΕ ΣΥΜΠΛΗΡΩΜΑΤΙΚΟ</span>`:""}
          ${b.manual?`<span class="chip dash">ΧΕΙΡΟΚΙΝΗΤΗ ΑΛΛΑΓΗ</span>`:""}
          ${qualChip(t,b.a)} ${b.b?qualChip(t,b.b):""}
          ${state}${running?clockEl(b,false,t):""}`}
      <button class="b-sm noprint" data-bstat="${tr.id}|${b.id}">${
        b.status==="ΕΚΚΡΕΜΕΙ"?"Έναρξη":running?"Λήξη":"Επαναφορά"}</button>
    </div>
    <div class="bbody">
      ${side(ea,"ΔΕΞΙΑ ΤΗΣ ΕΠΙΤΡΟΠΗΣ","a")}
      <div class="vline"></div>
      ${side(eb,"ΑΡΙΣΤΕΡΑ ΤΗΣ ΕΠΙΤΡΟΠΗΣ","b")}
    </div>
    ${foot.length?`<div class="bfoot">${foot.join("<br>")}</div>`:""}
    ${extra.length?`<div class="bfoot noprint"><div class="row tight">${extra.join("")}</div></div>`:""}</div>`;
}

/* reorder mode: the same row with a handle at each end. Deliberately not
   drag-and-drop — a gloved thumb on a hillside wants a target it can hit. */
function braceMove(t, tr, b, i, n){
  const ea = t.entries.find(e=>e.id===b.a), eb = t.entries.find(e=>e.id===b.b);
  const names = (ea?dogName(ea.dogId):"—") + " / " + (eb?dogName(eb.dogId):"ΜΟΝΟΣ");
  return `<div class="brief" style="cursor:default">
    <span class="n">${b.no}</span>
    <span class="who"><b>${esc(names)}</b>
      ${b.manual?`<span class="tiny">χειροκίνητη αλλαγή</span>`:""}</span>
    <span class="row tight" style="flex:none;flex-wrap:nowrap">
      <button class="b-sm" data-bmove="${tr.id}|${b.id}|-1" ${i===0?"disabled":""}
        aria-label="Πάνω" style="width:52px;padding:0">↑</button>
      <button class="b-sm" data-bmove="${tr.id}|${b.id}|1" ${i===n-1?"disabled":""}
        aria-label="Κάτω" style="width:52px;padding:0">↓</button>
    </span>
  </div>`;
}

/* collapsed: a number and two names, which is all you need to know where you are */
function braceBrief(t, tr, b){
  const ea = t.entries.find(e=>e.id===b.a), eb = t.entries.find(e=>e.id===b.b);
  const done = b.status==="ΟΛΟΚΛΗΡΩΘΗΚΕ";
  const names = (ea?dogName(ea.dogId):"—") + " / " + (eb?dogName(eb.dogId):"ΜΟΝΟΣ");
  const who = [ea&&perName(ea.handlerId), eb&&perName(eb.handlerId)].filter(Boolean).join(" · ");
  return `<button class="brief ${done?"done":""}" data-openbrace="${b.id}">
    <span class="n">${b.no}</span>
    <span class="who"><b>${esc(names)}</b><span>${esc(who)}</span></span>
    ${done ? qualChip(t,b.a) || `<span class="chip">ΟΛΟΚΛΗΡΩΘΗΚΕ</span>`
      : b.recall ? `<span class="chip y">ΕΠΑΝΑΚΛΗΣΗ</span>`
      : (b.solo&&!b.b) ? `<span class="chip">ΜΟΝΟΣ</span>`
      : `<span class="chip">ΕΚΚΡΕΜΕΙ</span>`}
  </button>`;
}
/* Field mode. The live brace is expanded with its countdown; the rest collapse
   to a number and two names, so scrolling a terrain you know where you are
   without reading. Tap a collapsed one to open it. */
function tBraces(t){
  const day = t.days[S.day];
  const jf = S.judgeFilter;
  const terrains = day.terrains.filter(tr=>!jf || tr.judgeIds.includes(jf));
  if(!day.draw) return `<div class="empty">Δεν έχει γίνει κλήρωση για την ημέρα αυτή.
    Πηγαίνετε στην καρτέλα «Κλήρωση».</div>`;
  const printHd = printHead(t, day, terrains.length===1 ? terrains[0].name : "");
  return `
  ${!navigator.onLine ? `<div class="note noprint" style="display:flex;gap:10px;align-items:center">
    <span style="width:8px;height:8px;border-radius:50%;background:var(--stubble);flex:none"></span>
    Εκτός σύνδεσης. Οι αλλαγές αποθηκεύονται στη συσκευή και ταξιδεύουν με τη Μεταφορά.</div>` : ""}
  <div class="row noprint" style="margin-bottom:12px">
    <div class="grow"><label>Προβολή ως κριτής (βλέπει μόνο το τερέν του)</label>
    <select data-jfilter><option value="">Πρόεδρος Κριτών — όλα τα τερέν</option>
      ${DB.judges.map(j=>`<option value="${j.id}" ${jf===j.id?"selected":""}>${esc(j.name)}</option>`).join("")}
    </select></div>
    <button class="b-sm" data-act="print" style="align-self:flex-end">Εκτύπωση / PDF</button>
    <button class="b-sm ${S.reorder?"tog on":""}" data-act="toggleReorder"
      style="align-self:flex-end">Αναδιάταξη</button>
  </div>
  ${S.reorder?`<div class="note">Μετακινήστε ένα ζεύγος πάνω ή κάτω. Η αρίθμηση ακολουθεί τη θέση:
    το ζεύγος 1 που κατεβαίνει τρεις θέσεις γίνεται ζεύγος 4. Κάθε μετακίνηση σημειώνεται ως
    χειροκίνητη αλλαγή και τυπώνεται στη λίστα.</div>`:""}
  ${printHd}
  ${terrains.map(tr=>{
    const braces = tr.braces||[];
    const live = braces.find(b=>b.status==="ΤΡΕΧΕΙ");
    return `
    <div class="row" style="margin:18px 0 10px;align-items:baseline">
      <h3 class="grow" style="margin:0">${esc(tr.name)}</h3>
      <span class="muted">${braces.length} ${braces.length===1?"ζεύγος":"ζεύγη"}
        ${tr.judgeIds.length?"· "+tr.judgeIds.map(j=>esc((judById(j)||{}).name||"?")).join(", "):""}</span>
    </div>
    ${braces.length ? (S.reorder
        ? braces.map((b,i)=>braceMove(t,tr,b,i,braces.length)).join("")
        : braces.map(b=>{
            const open = b===live || S.openBrace===b.id;
            return open ? braceCard(t,tr,b,{big:b===live, actions:true}) : braceBrief(t,tr,b);
          }).join(""))
      : `<div class="empty">Χωρίς ζεύγη σε αυτό το τερέν.</div>`}`;
  }).join("")}
  <div class="tiny noprint" style="margin-top:16px">Άρθρο 30: ο κριτής μπορεί να ζητήσει
  <b>επανάκληση</b> σκύλου μεγάλης αξίας — προστίθεται νέα διαδρομή στο τέλος του τερέν με δικές
  της σημειώσεις. Σε μονό αριθμό σκύλων μπορεί να προστεθεί <b>συμπληρωματικός</b> για να
  συμπληρωθεί το τελευταίο ζεύγος.</div>`;
}

/* What would go wrong if he pressed the button now — said before he presses
   it, not in an alert afterwards. Each line names the article and the fix. */
function drawCheck(t){
  const day = t.days[S.day];
  const active = t.entries.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ");
  const need = t.format==="ΖΕΥΓΗ" ? 2 : 1;
  const cacit = t.award==="CACIT";
  const stop = [], warn = [];

  if(!day.terrains.length)
    stop.push("Δεν έχουν οριστεί τερέν. Προσθέστε τουλάχιστον ένα στην καρτέλα «Τερέν & Κριτές».");
  if(!active.length)
    stop.push("Καμία δηλωμένη συμμετοχή. Προσθέστε συμμετοχές ή εισαγάγετε αρχείο.");

  day.terrains.forEach(tr=>{
    if(tr.judgeIds.length < (cacit?3:need))
      stop.push(`Το ${tr.name} έχει ${tr.judgeIds.length} ${tr.judgeIds.length===1?"κριτή":"κριτές"}. `
        + `Χρειάζονται ${cacit?3:need} (Άρθρο 48${cacit?", ο ένας Μεγάλης Έρευνας":""}).`);
    const bad = active.filter(e=>(tr.entryIds||[]).includes(e.id) && judgeConflict(tr,e,t))
      .map(e=>dogName(e.dogId));
    if(bad.length)
      warn.push(`Στο ${tr.name} ο κριτής έχει δικό του σκύλο (Άρθρο 49): ${bad.join(", ")}. `
        + "Η κλήρωση θα τους μετακινήσει.");
  });

  const braces = Math.ceil(active.length / need);
  if(active.length && braces < 3)
    warn.push(`${active.length} σκύλοι δίνουν ${braces} ${braces===1?"ζεύγος":"ζεύγη"}. `
      + "Ο αγώνας μετρά με τουλάχιστον 3 (Άρθρο 40, ΕΚ Άρθρο 5).");
  const assigned = day.terrains.reduce((a,tr)=>a + (tr.assigned ? (tr.entryIds||[]).length : 0), 0);
  if(assigned) warn.push(`${assigned} σκύλοι έχουν ανατεθεί χειροκίνητα σε τερέν. `
    + "Οι υπόλοιποι κατανέμονται από την κλήρωση.");
  if(day.draw) warn.push("Υπάρχει ήδη κλήρωση για την ημέρα αυτή. Νέα κλήρωση την ακυρώνει.");

  if(!stop.length && !warn.length) return "";
  return `${stop.length?`<div class="err"><b>Η κλήρωση δεν μπορεί να γίνει ακόμη.</b><br>
    ${stop.map(esc).join("<br>")}</div>`:""}
    ${warn.length?`<div class="note">${warn.map(esc).join("<br>")}</div>`:""}`;
}

/* The reveal is not decoration: it reads the braces out one at a time the way
   the draw is read out to the field. prefers-reduced-motion gets all of them at
   once, instantly. */
let revealTimer = null;
function revealBraces(){
  clearInterval(revealTimer);
  const nodes = [...document.querySelectorAll("[data-brace-row]")];
  const finish = ()=>{ S.reveal = null; el("fab").innerHTML = fabFor(); toast("Η κλήρωση ολοκληρώθηκε"); };
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    nodes.forEach(n=>{ n.hidden = false; }); finish(); return;
  }
  let i = 0;
  revealTimer = setInterval(()=>{
    if(i >= nodes.length){ clearInterval(revealTimer); finish(); return; }
    nodes[i].hidden = false; nodes[i].classList.add("reveal");
    S.reveal = ++i; el("fab").innerHTML = fabFor();
  }, 150);
}

/* The drawn order, A4 portrait, one sheet per terrain. Black on white with a
   column left blank for the time, because this sheet is pinned up, written on
   and photocopied. */
function drawSheet(t, day, tr){
  const rows = (tr.braces||[]).map(b=>{
    const ea = t.entries.find(e=>e.id===b.a), eb = t.entries.find(e=>e.id===b.b);
    const cell = e => e ? `${esc(dogName(e.dogId))} — ${esc(perName(e.handlerId))}` : "ΜΟΝΟΣ";
    const marks = [b.recall && "επανάκληση", b.trailer && "συμπληρωματικός",
                   b.manual && "χειροκίνητη αλλαγή"].filter(Boolean);
    return `<tr>
      <td style="font-weight:700">${b.no}</td>
      <td>${cell(ea)}</td>
      <td>${cell(eb)}</td>
      <td style="width:16mm"></td>
    </tr>${marks.length?`<tr><td></td><td colspan="3" style="font-size:8pt">${esc(marks.join(" · "))}</td></tr>`:""}`;
  }).join("");
  const judges = (tr.judgeIds||[]).map(j=>esc((judById(j)||{}).name||"?")).join(", ");
  const manual = (tr.braces||[]).filter(b=>b.manual).map(b=>b.no);
  return `<div class="sheet">
    <div class="print-hd" style="display:flex">
      <img src="${BADGE}" alt="">
      <div class="t"><b>ΚΥΠΡΙΑΚΟΣ ΟΜΙΛΟΣ ΑΓΓΛΙΚΩΝ ΔΕΙΚΤΩΝ</b>
        <span>${esc(t.title)}${t.place && t.place!==t.title ? " · "+esc(t.place) : ""} · ${esc(t.type)} · ${fmtDate(day.date)}</span>
        <span>Κριτές: ${judges||"—"}</span></div>
      <div class="pg">${esc(tr.name)}</div>
    </div>
    <table style="margin-top:10px">
      <tr><th style="width:9mm">Ζ.</th><th>Δεξιά της επιτροπής (1ος)</th>
        <th>Αριστερά της επιτροπής (2ος)</th><th>Ώρα</th></tr>
      ${rows || `<tr><td colspan="4">Χωρίς ζεύγη.</td></tr>`}
    </table>
    <p style="font:400 9pt/1.4 var(--f-b);margin-top:10px;border-top:1px solid #000;padding-top:8px">
      Η σειρά είναι ενδεικτική — Άρθρο 16.${manual.length
        ? ` Χειροκίνητη αλλαγή στο ${manual.length===1?"ζεύγος":"ζεύγη"} ${manual.join(", ")}.` : ""}</p>
  </div>`;
}

/* The blank judge note sheet, A4 portrait. The fields follow §7 exactly, in the
   same order as the screen, so a judge who filled one in on paper can type it
   in afterwards without hunting. */
function noteSheet(t, day, tr, b, e, d){
  const rate = ()=>`<span class="rate">${[1,2,3,4,5].map(n=>`<i>${n}</i>`).join("")}</span>`;
  const scales = ["Πάθος","Μεθοδικότητα","Καλπασμός και στυλ φυλής","Επαφή με κυναγωγό"];
  const fld = (label,val)=>`<div class="fld"><span>${label}</span>
    <div class="line">${val?esc(val):""}</div></div>`;
  return `<div class="sheet">
    <div class="print-hd" style="display:flex">
      <img src="${BADGE}" alt="">
      <div class="t"><b>ΦΥΛΛΟ ΣΗΜΕΙΩΣΕΩΝ ΚΡΙΤΗ</b>
        <span>${esc(t.title)}${t.place && t.place!==t.title ? " · "+esc(t.place) : ""} · ${fmtDate(day.date)}</span>
        <span>${esc(t.type)}${t.game?" · "+esc(t.game):""}${t.wild?" (άγριο θήραμα)":""}</span></div>
      <div class="pg">${esc(tr.name)}</div>
    </div>
    <div class="fields">
      ${fld("Σκύλος", d.name)}
      ${fld("Ζεύγος / θέση", "ζεύγος " + b.no + " · " + (b.a===e.id?"δεξιά":"αριστερά") + " της επιτροπής")}
      ${fld("Κυναγωγός", perName(e.handlerId))}
      ${fld("Κ.Ο.Κ.", d.reg)}
      ${fld("Φυλή / φύλο", (d.breed||"") + (d.sex?" · "+d.sex:""))}
      ${fld("Κριτής", "")}
    </div>
    <h4>ΕΡΕΥΝΑ</h4>
    ${scales.map(s=>`<div style="display:flex;align-items:center;gap:10px;padding:5px 0">
      <span style="flex:1;font:400 9.5pt/1.2 var(--f-b)">${s}</span>${rate()}</div>`).join("")}
    <div style="display:flex;align-items:center;gap:10px;padding:5px 0">
      <span style="flex:1;font:400 9.5pt/1.2 var(--f-b)">Πλάτος έρευνας</span>
      <span style="font:400 9pt/1 var(--f-b)">Στενή · Κανονική · Ανοικτή · Πολύ ανοικτή</span></div>
    <h4>ΠΟΝΤΟΙ</h4>
    <table><tr><th style="width:22px">#</th><th>Θήραμα</th><th>Ποιότητα</th>

      <div style="flex:2"><span style="font:400 9pt/1 var(--f-b)">Προτεινόμενη βαθμολογία</span><div class="box"></div></div>

/* the printed head: badge, club, trial, terrain, page — on every sheet */
function printHead(t, day, terrain){
  return `<div class="print-hd">
    <img src="${BADGE}" alt="">
    <div class="t"><b>ΚΥΠΡΙΑΚΟΣ ΟΜΙΛΟΣ ΑΓΓΛΙΚΩΝ ΔΕΙΚΤΩΝ</b>
      <span>${esc(t.title)} · ${esc(t.type)} · ${esc(t.place||"")} · ${fmtDate(day.date)}</span>

    ${terrain?`<div class="pg">${esc(terrain)}</div>`:""}
  </div>`;
}

/* --- 8e. sms --- */
/* The full running order of the day. A handler's own braces are marked so he can
   see where he sits among the others without hunting for his name. */
function orderText(t, handlerId, withJudges){
  const day = t.days[S.day], L = [];
  (day.terrains||[]).forEach(tr=>{
    L.push("▸ " + tr.name + (withJudges && tr.judgeIds.length
      ? " (" + tr.judgeIds.map(j=>(judById(j)||{}).name).filter(Boolean).join(", ") + ")" : ""));
    (tr.braces||[]).forEach(b=>{
      const a = t.entries.find(e=>e.id===b.a), c = t.entries.find(e=>e.id===b.b);
      const mine = handlerId && ((a && a.handlerId===handlerId) || (c && c.handlerId===handlerId));
      L.push((mine ? ">> " : "") + b.no + ". " + (a?dogName(a.dogId):"—") + " / " + (c?dogName(c.dogId):"ΜΟΝΟΣ")
        + (b.recall ? " (επανάκληση)" : "") + (b.trailer ? " (trailer)" : "")
        + (mine ? "  <-- ΕΣΕΙΣ" : ""));
    });
  });
  return L.join("\n");
}
function myRuns(t, handlerId){
  const out = [];
  (t.days[S.day].terrains||[]).forEach(tr=>(tr.braces||[]).forEach(b=>{
    [b.a,b.b].forEach(id=>{ const e = t.entries.find(x=>x.id===id);
      if(e && e.handlerId===handlerId) out.push({dog:dogName(e.dogId), ter:tr.name, no:b.no, recall:b.recall}); });
  }));
  return out;
}
function smsBody(t, entry){
  const st = DB.settings;
  const head = (st.sms||DEFAULT_SMS)
    .replace(/\{ΑΓΩΝΑΣ\}/g, t.title)
    .replace(/\{ΗΜΕΡΟΜΗΝΙΑ\}/g, fmtDate(t.days[S.day].date));
  const mine = myRuns(t, entry.handlerId);
  const L = [head, ""];
  L.push(mine.length===1 ? "Η διαδρομή σας:" : "Οι διαδρομές σας:");
  mine.forEach(m=>L.push("• " + m.dog + " — " + m.ter + ", ζεύγος " + m.no + "ο"
    + (m.recall ? " (επανάκληση)" : "")));
  if(st.smsMode !== "own"){
    L.push("", "ΣΕΙΡΑ ΤΗΣ ΗΜΕΡΑΣ", orderText(t, entry.handlerId, st.smsJudges));
  }
  L.push("", st.smsFoot || DEFAULT_SMS_FOOT);
  return L.join("\n");
}
/* Greek text is sent as UCS-2: 70 characters in one segment, 67 per segment
   after that. The head judge pays for these, so show him the count. */
function smsSegments(text){
  const n = text.length;
  const greek = /[^\x00-\x7F]/.test(text);
  const one = greek ? 70 : 160, more = greek ? 67 : 153;
  return n <= one ? 1 : Math.ceil(n / more);
}
function smsQueue(t){
  const day = t.days[S.day], out = [], seen = new Set();
  (day.terrains||[]).forEach(tr=>(tr.braces||[]).forEach(b=>{
    [b.a,b.b].forEach(id=>{
      const e = t.entries.find(x=>x.id===id); if(!e) return;
      const key = e.handlerId || e.id; if(seen.has(key)) return; seen.add(key);
      out.push({entry:e, phone:phoneClean((perById(e.handlerId)||{}).phone), body:smsBody(t,e)});
    });
  }));
  return out;
}
/* He is paying for these out of his own credit, so the mode switch sits at the
   top of this screen — not in settings — and the total is visible before he
   starts, with each message's own count beside it. */
function tSms(t){
  const day = t.days[S.day];
  if(!day.draw) return `<div class="empty">Κάντε πρώτα την κλήρωση. Τα μηνύματα συντίθενται
    από τη σειρά της ημέρας.</div>`;
  const q = smsQueue(t);
  const sent = q.filter(x=>t.sms[x.entry.id]==="ΕΣΤΑΛΗ").length;
  const segs = q.reduce((a,x)=>a+smsSegments(x.body),0);
  const st = DB.settings;
  return `
  <div class="card">
    <label>Περιεχόμενο μηνύματος</label>
    <div class="row tight noprint">
      <button class="tog ${st.smsMode!=="own"?"on":""}" data-set="smsModeFull">Πλήρης σειρά ημέρας</button>
      <button class="tog ${st.smsMode==="own"?"on":""}" data-set="smsModeOwn">Μόνο τα δικά του ζεύγη</button>
    </div>
    <div class="row" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line-f)">
      <span class="grow">Εκτίμηση συνόλου</span>
      <span class="total">${segs} τμήματα</span>
    </div>
    <div class="tiny">${q.length} μηνύματα, ελληνικά (UCS-2). Πληρώνονται από το δικό σας τηλέφωνο.</div>
    <div class="row tight noprint" style="margin-top:12px">
      <button class="tog ${st.smsJudges?"on":""}" data-set="smsJudges">Ονόματα κριτών στο μήνυμα</button>
    </div>
    <div class="row" style="margin-top:14px">
      <b class="grow">${sent} από ${q.length} στάλθηκαν</b></div>
    <div class="bar"><i style="width:${q.length?Math.round(sent/q.length*100):0}%"></i></div>
  </div>
  ${q.map((x,i)=>{
    const stt = t.sms[x.entry.id]==="ΕΣΤΑΛΗ", sg = smsSegments(x.body);
    return `<div class="sms-row ${stt?"sent":""}">
      <div class="row" style="align-items:flex-start">
        <div class="grow">
          <b style="font:600 19px/1.2 var(--f-d)">${esc(perName(x.entry.handlerId))}</b>
          <div class="fingerprint">${esc(x.phone||"— χωρίς τηλέφωνο —")}</div>
        </div>
        <span class="seg ${sg>6?"hot":""}">${sg} τμ.</span>
      </div>
      <div class="preview">${esc(x.body)}</div>
      <div class="row tight noprint">
        <button class="${stt?"":"b-act"} grow" data-sms="${i}" ${x.phone?"":"disabled"}
          ${stt?'style="background:var(--ok-bg);border-color:var(--ok);color:var(--ok-ink)"':""}>${stt?"Στάλθηκε":"Αποστολή"}</button>
        <button class="b-sm" data-copy="${i}">Αντ.</button>
        <button class="b-sm" data-wa="${i}" ${x.phone?"":"disabled"}>WhatsApp</button>
        <button class="b-sm" data-smsdone="${x.entry.id}">${stt?"Αναίρεση":"Σήμανση"}</button>
      </div></div>`;}).join("")}
  <p class="tiny">Η σειρά είναι ενδεικτική — Άρθρο 16. Το μήνυμα ανοίγει στην εφαρμογή μηνυμάτων
    του τηλεφώνου· η αποστολή γίνεται από εκεί.</p>`;
}

/* --- 8f. results --- */
function tResults(t){
  const day = t.days[S.day];
  const rows = [];
  day.terrains.forEach(tr=>(tr.braces||[]).forEach(b=>[b.a,b.b].forEach(id=>{
    const e = t.entries.find(x=>x.id===id); if(!e) return;
    const r = t.results[e.id] || {};
    /* The app's arithmetic is advice and clearly subordinate: Άρθρο 27 caps are
       shown as a hint, never as a block. The judge always overrides. */
    const locked = !!(t.signoff||{})[tr.id];
    const notes = t.notes[e.id+"::"+b.id] || {};
    const whites = Math.max(0, ...Object.values(notes).map(n=>n.whites||0));
    const faults = [].concat(...Object.values(notes).map(n=>n.faults||[]));
    const hint = faults.length ? `Σφάλμα Άρθρου 33 καταγεγραμμένο: ${esc(faults.join(", "))}.`
      : whites>=3 ? "3 λευκές φέρμες → αποκλεισμός αν είναι σε διαφορετικές κατευθύνσεις (Άρθρο 27)."
      : whites===2 ? "2 λευκές φέρμες → μέγιστο ΠΟΛΥ ΚΑΛΟΣ (Άρθρο 27)."
      : whites===1 ? "1 λευκή φέρμα δεν εμποδίζει CAC (Άρθρο 27)." : "";
    rows.push(`<tr>
      <td><b>${esc(dogName(e.dogId))}</b><div class="tiny">${esc(tr.name)} · ζεύγος ${b.no}${b.recall?" · επανάκληση":""}</div>
        ${hint?`<div class="tiny" style="color:var(--stubble-ink)">${hint}</div>`:""}</td>
      <td><select data-res="${e.id}|qual" ${locked?"disabled":""}>${QUALS.map(q=>`<option ${r.qual===q?"selected":""}>${q}</option>`).join("")}</select></td>
      <td><select data-res="${e.id}|award" ${locked?"disabled":""}>${AWARDS.map(a=>`<option ${r.award===a?"selected":""}>${a}</option>`).join("")}</select></td>
      <td class="num"><b style="font:800 21px/1 var(--f-d)">${pointsFor(t,r)}</b></td>
      <td class="noprint"><button class="b-sm" data-note="${e.id}::${b.id}">${locked?"Προβολή":"Σημειώσεις"}</button></td>
    </tr>`);
  })));
  if(!rows.length) return `<div class="empty">Κάντε πρώτα την κλήρωση. Η βαθμολογία ακολουθεί τα ζεύγη.</div>`;
  const signRows = day.terrains.map(tr=>{
    const sg = (t.signoff||{})[tr.id];
    return `<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line-f)">
      <div class="grow"><b>${esc(tr.name)}</b>
        <div class="tiny">${sg ? "Υπογράφηκε από " + esc(sg.by) + ", " + esc(sg.at)
          : "Ανοικτό για αλλαγές"}</div></div>
      ${sg ? `<span class="chip g">ΚΛΕΙΔΩΜΕΝΟ</span>
             <button class="b-sm b-warn" data-unlock="${tr.id}">Ξεκλείδωμα</button>`
           : `<button class="b-sm b-pri" data-signoff="${tr.id}">Υπογραφή</button>`}
    </div>`;
  }).join("");
  return `<div class="note">Πόντοι = βασικοί πόντοι × συντελεστής ${coefficient(t)}
    (${t.format==="ΖΕΥΓΗ"?"ζεύγη":"ατομικός"}${t.wild&&(t.type==="Έρευνας Κυνηγίου"||t.type==="Πρακτικού Κυνηγίου")?", άγριο θήραμα":""}).
    Ο πίνακας πόντων είναι δεδομένα και αλλάζει από τις Ρυθμίσεις. Ο κριτής αποφασίζει τη
    βαθμολογία· οι υποδείξεις της εφαρμογής είναι ενδεικτικές.</div>
  <div class="card" style="padding:0"><div class="scroll"><table>
    <thead><tr><th>Σκύλος</th><th>Βαθμολογία</th><th>Τίτλος</th><th>Πόντοι</th><th class="noprint"></th></tr></thead>
    <tbody>${rows.join("")}</tbody></table></div></div>
  <div class="card noprint">
    <div class="eyebrow">Υπογραφή κριτή</div>
    <p class="tiny">Η υπογραφή κλειδώνει τη βαθμολογία και τις σημειώσεις του τερέν. Το ξεκλείδωμα
      γίνεται από τον Πρόεδρο Κριτών με αιτιολογία, που καταγράφεται.</p>
    <div style="margin-top:10px">${signRows}</div></div>`;
}

/* --- 8g. export --- */
function tExport(t){
  return `<div class="card">
    <div class="eyebrow">Εξαγωγές αγώνα</div>
    <p class="tiny">Το Excel περιέχει φύλλο «Παράμετροι» με τον πίνακα πόντων. Όλοι οι πόντοι
      υπολογίζονται με τύπους VLOOKUP/SUMIFS που δείχνουν εκεί — καμία σταθερή τιμή μέσα σε τύπο,
      ώστε όποιος ανοίξει το αρχείο να μπορεί να ελέγξει την αριθμητική. Ανοίγει σε Excel και
      LibreOffice. Η εκτύπωση είναι ασπρόμαυρη, για φωτοτυπία.</p>
    <div class="row tight" style="margin-top:12px">
      <button class="b-pri" data-act="xlsTrial">Excel με ζωντανούς τύπους</button>
      <button data-act="docTrial">Word (αποτελέσματα)</button>

      <button data-act="printNotes">Φύλλα σημειώσεων κριτή</button>
    </div></div>

  <div class="card">
    <div class="eyebrow">Αποστολή σειράς ως κείμενο</div>
    <p class="tiny">Για ομάδες WhatsApp ή Viber, την επιτροπή ή τον πίνακα ανακοινώσεων.
      Στέλνει τη σειρά σε απλό κείμενο, όχι αρχείο.</p>
    <div class="row tight" style="margin-top:12px">
      <button class="b-pri" data-act="shareDraw">Κοινή χρήση</button>
      <button data-act="waDraw">WhatsApp</button>
      <button data-act="viberDraw">Viber</button>
      <button data-act="smsDraw">SMS</button>
      <button data-act="mailDraw">Email</button>
    </div></div>

  <div class="card">
    <div class="eyebrow">Μεταφορά σε άλλη συσκευή</div>
    <p class="tiny">Στέλνει μόνο αυτόν τον αγώνα, με τους σκύλους και τους κυναγωγούς του — μικρό αρχείο
      που περνά από κάθε εφαρμογή μηνυμάτων. Στην άλλη συσκευή: Ρυθμίσεις → Φόρτωση αρχείου →
      Συγχώνευση. Κινηθείτε προς μία κατεύθυνση κάθε φορά: αν ο ίδιος αγώνας αλλάξει και στις δύο
      συσκευές, υπερισχύει το αρχείο που φορτώθηκε τελευταίο.</p>
    <div class="row tight" style="margin-top:12px">
      <button class="b-pri" data-act="shareTrial">Αποστολή αγώνα</button>
      <button data-act="backup">Λήψη πλήρους αντιγράφου</button>
      <button data-act="restore">Φόρτωση αρχείου</button>
    </div></div>`;
}
</script>

<script>
/* ---------- 9. Registry -------------------------------------------------- */
/* Desk mode: dense, the same tokens. A sidebar of counts on the left, the
   register in the middle. */
function vRegistry(){
  const tab = S.regTab || "handlers";
  const dogs = DB.dogs.slice().sort((a,b)=>a.name.localeCompare(b.name,"el"));
  const byBreed = {};
  DB.dogs.forEach(d=>{ byBreed[d.breed||"—"] = (byBreed[d.breed||"—"]||0)+1; });

  const side = `<div class="side noprint">
    <button class="item ${tab==="handlers"?"on":""}" data-regtab="handlers">Κυναγωγοί · ${DB.people.length}</button>
    <button class="item ${tab==="dogs"?"on":""}" data-regtab="dogs">Σκύλοι · ${DB.dogs.length}</button>
    <button class="item ${tab==="judges"?"on":""}" data-regtab="judges">Κριτές · ${DB.judges.length}</button>
    <hr style="margin:16px 20px">
    <div class="eyebrow" style="padding:0 20px">Φυλή</div>
    <div class="tiny" style="padding:10px 20px 0;line-height:1.9">${
      Object.entries(byBreed).sort((a,b)=>b[1]-a[1])
        .map(([b,n])=>`${esc(b)} · ${n}`).join("<br>") || "—"}</div>
  </div>`;

  const heading = (eyebrow, title, right)=>`<div class="row" style="align-items:flex-end;gap:16px;margin-bottom:18px">
    <div class="grow"><div class="eyebrow">${eyebrow}</div><h2 style="margin:0">${title}</h2></div>${right||""}</div>`;

  let body;
  if(tab === "judges"){
    body = heading("Μητρώο","Κριτές",
      `<button class="b-act" data-act="newJudge">Νέος κριτής</button>`)
      + (DB.judges.length ? `<div class="card" style="padding:0"><table>
        <thead><tr><th>Ονοματεπώνυμο</th><th>Ιδιότητα</th><th>Μεγάλη Έρευνα</th><th>Κυναγωγός</th><th class="noprint"></th></tr></thead>
        <tbody>${DB.judges.map(j=>`<tr>
          <td><b>${esc(j.name)}</b></td>
          <td>${esc(j.licence||"—")}</td>
          <td>${j.me?"Ναι":"—"}</td>
          <td>${esc(perName(j.personId))}</td>
          <td class="noprint"><button class="b-sm" data-editjudge="${j.id}">Επεξεργασία</button></td>
        </tr>`).join("")}</tbody></table></div>`
      : `<div class="empty">Κανένας κριτής ακόμη. Συνδέστε κάθε κριτή με τον κυναγωγό του ίδιου
          ονόματος, ώστε η κλήρωση να μην βάζει τον σκύλο του στο τερέν που κρίνει (Άρθρο 49).</div>`);
  } else if(tab === "handlers"){
    /* The head judge builds the register from the man down: a κυναγωγός, then
       his dogs under him — the same shape as Συμμετοχές, because it is the same
       job. Handlers stay with the club for years; the dogs change around them. */
    const dogsOf = new Map();
    DB.dogs.forEach(d=>{ const k = d.ownerId||"";
      if(!dogsOf.has(k)) dogsOf.set(k, []); dogsOf.get(k).push(d); });
    const dogRow = (d, who)=>{
      const find = ((d.name||"") + " " + (d.reg||"") + " " + (d.breed||"") + " "
        + (d.kennel||"") + " " + who).toLowerCase();
      return `<div class="entry-row" data-find="${esc(find)}">
        <div class="who">
          <button class="open" data-dog="${d.id}">${esc(d.name||"—")}</button>
          <span class="tiny">${esc(d.breed||"")}${d.sex?" · "+(d.sex==="Θ"?"θηλυκός":"αρσενικός"):""}${
            d.reg?" · "+esc(d.reg):""}</span>
        </div>
        <div class="acts">
          <button class="b-sm noprint" data-editdog="${d.id}">Επεξ.</button>
        </div></div>`;
    };

    const people = DB.people.slice().sort((a,b)=>a.name.localeCompare(b.name,"el"));
    const cards = people.map(p=>{
      const mine = (dogsOf.get(p.id)||[]).slice().sort((a,b)=>a.name.localeCompare(b.name,"el"));
      const bits = [p.phone, p.member ? "μέλος "+p.member : ""].filter(Boolean).join(" · ");
      return `<div class="card handler" data-group="${esc(p.name.toLowerCase())}">
        <div class="row" style="align-items:baseline;gap:10px">
          <h3 class="grow" style="margin:0">${esc(p.name)}</h3>
          ${mine.length?`<span class="muted num">${mine.length} ${
            mine.length===1?"σκύλος":"σκύλοι"}</span>`:""}
        </div>
        ${bits?`<div class="fingerprint">${esc(bits)}</div>`:""}
        <div style="margin-top:10px">${mine.length ? mine.map(d=>dogRow(d, p.name)).join("")
          : `<div class="tiny" style="padding:8px 0">Καταχωρήστε τον πρώτο του σκύλο.</div>`}</div>
        <div class="row tight noprint" style="margin-top:12px">
          <button class="b-sm" data-newdogfor="${p.id}">+ Σκύλος</button>
          <button class="b-sm" data-edithandler="${p.id}">Επεξεργασία στοιχείων</button>
        </div></div>`;
    }).join("");

    const orphans = (dogsOf.get("")||[]).slice().sort((a,b)=>a.name.localeCompare(b.name,"el"));
    const loose = orphans.length ? `<div class="card handler" data-group="χωρίς κυναγωγό">
      <div class="row" style="align-items:baseline;gap:10px">
        <h3 class="grow" style="margin:0">— χωρίς κυναγωγό —</h3>
        <span class="muted num">${orphans.length} ${orphans.length===1?"σκύλος":"σκύλοι"}</span>
      </div>
      <div class="tiny" style="margin-top:4px">Ανοίξτε τον καθένα με το Επεξ. και δώστε του κυναγωγό.</div>
      <div style="margin-top:10px">${orphans.map(d=>dogRow(d, "")).join("")}</div></div>` : "";

    body = heading("Μητρώο","Κυναγωγοί",
      `<button class="b-act" data-act="newHandler">Νέος κυναγωγός</button>`)
      + (DB.people.length || orphans.length ? `
        <div class="row noprint" style="margin-bottom:14px">

/* Filters in place — re-rendering would drop the keyboard mid-word. A κυναγωγός
   whose dogs all fall out of the search disappears with them, unless his own
   name is what was typed: in the register he may have no dogs yet. */
function filterCards(v, noneId){
  const q = (v||"").trim().toLowerCase();
  document.querySelectorAll("[data-find]").forEach(row=>{
    row.style.display = !q || (row.dataset.find||"").includes(q) ? "" : "none";
  });
  let shown = 0;
  document.querySelectorAll("[data-group]").forEach(g=>{
    const any = [...g.querySelectorAll("[data-find]")].some(r=>r.style.display !== "none");
    const self = !q || (g.dataset.group||"").includes(q);
    const on = any || self;
    g.style.display = on ? "" : "none";
    if(on) shown++;
  });
  const none = el(noneId);
  if(none) none.style.display = (q && !shown) ? "" : "none";
}
function filterEntries(v){ S.entryQ = v || ""; filterCards(v, "entryNone"); }
function filterReg(v){ S.regQ = v || ""; filterCards(v, "regNone"); }
function filterDogs(v){
  v = (v||"").toLowerCase();
  document.querySelectorAll("#dogTbl tbody tr").forEach(tr=>{
    tr.style.display = !v || (tr.dataset.name||"").includes(v) ? "" : "none";
  });
}

/* ---------- 10. Dog history --------------------------------------------- */
function vDog(){
  const d = dogById(S.dogId); if(!d){ S.view="registry"; return vRegistry(); }
  const hist = [];
  DB.trials.forEach(t=>{
    const e = t.entries.find(x=>x.dogId===d.id); if(!e) return;
    let ter="—", no="—";
    t.days.forEach(day=>day.terrains.forEach(tr=>(tr.braces||[]).forEach(b=>{
      if(b.a===e.id||b.b===e.id){ ter=tr.name; no=b.no; }})));
    const r = t.results[e.id]||{};
    const notes = {};
    Object.keys(t.notes||{}).forEach(k=>{
      if(k === e.id || k.startsWith(e.id + "::"))
        Object.entries(t.notes[k]).forEach(([jid,n])=>{ notes[jid + "|" + k] = n; });
    });
    hist.push({t, ter, no, r, notes});
  });
  hist.sort((a,b)=>(b.t.dateStart||"").localeCompare(a.t.dateStart||""));
  const total = hist.reduce((s,h)=>s+pointsFor(h.t,h.r),0);
  /* The page breeders will actually use: a quiet chronological timeline,
     newest first, with what each judge wrote. */
  return `
  <button class="b-sm noprint" data-nav="registry" style="margin-bottom:14px">‹ Μητρώο</button>
  <div class="dog-hd">
    <img src="${BADGE}" alt="">
    <div class="grow" style="min-width:200px">
      <div class="eyebrow">Ιστορικό σκύλου</div>
      <h1>${esc(d.name)}</h1>
      <div class="meta num">${esc(d.breed||"")}${d.sex?" · "+(d.sex==="Θ"?"Θηλυκό":"Αρσενικό"):""}${d.dob?" · "+fmtDate(d.dob):""}${d.reg?" · Κ.Ο.Κ. "+esc(d.reg):""}${d.cy?" · κυπριακής εκτροφής":""}
        <br>Κυναγωγός ${esc(perName(d.ownerId))}${d.kennel?" · εκτροφείο «"+esc(d.kennel)+"»":""}</div>
    </div>
    <div class="score"><b>${total}</b><span>πόντοι · ${hist.length} ${hist.length===1?"συμμετοχή":"συμμετοχές"}</span></div>
  </div>
  ${hist.map(h=>{
    const q = h.r.qual && h.r.qual!=="-";
    const chip = h.r.award && h.r.award!=="-"
      ? `<span class="chip n">${esc(h.r.qual||"")} · ${esc(h.r.award)}</span>`
      : q ? `<span class="chip o">${esc(h.r.qual)}</span>`
      : `<span class="chip">χωρίς βαθμολογία</span>`;
    const notes = Object.entries(h.notes);
    return `<div class="tl">
      <div class="when"><b>${fmtDate(h.t.dateStart)}</b><span>${esc(h.t.place||"")}</span></div>
      <div class="rail"><i></i></div>
      <div class="what">
        <div class="row" style="align-items:baseline;gap:10px">
          <h3 style="margin:0">${esc(h.t.type)}${h.ter!=="—"?` · ${esc(h.ter)} · ζεύγος ${h.no}`:" · αδιάθετο"}</h3>${chip}</div>
        <div class="meta">${esc(h.t.title)}${h.t.wild?" · άγριο θήραμα":""} · συντελεστής ×${coefficient(h.t)}</div>
        ${notes.map(([k,n])=>`<div class="said">${noteSummary(n)}
          <cite>${esc((judById(k.split("|")[0])||{}).name||"Κριτής")}</cite></div>`).join("")}
      </div>
      <div class="pts"><b>${pointsFor(h.t,h.r)}</b><span>πόντοι</span></div>
    </div>`;}).join("")
    || `<div class="empty">Καμία συμμετοχή καταγεγραμμένη ακόμη για αυτόν τον σκύλο.</div>`}`;
}
function noteSummary(n){
  const bits=[];
  if(n.passion) bits.push("Πάθος "+n.passion+"/5");
  if(n.method)  bits.push("Μεθοδικότητα "+n.method+"/5");
  if(n.style)   bits.push("Καλπασμός και στυλ "+n.style+"/5");
  if(n.contact) bits.push("Επαφή "+n.contact+"/5");
  if(n.width)   bits.push("Έρευνα "+n.width.toLowerCase());
  if(n.whites)  bits.push("Λευκές φέρμες "+n.whites);
  const pts = (n.points||[]).length ? `<div class="tiny">Πόντοι: ${(n.points||[]).map(p=>
      esc([p.game,p.quality,p.ferma,p.akinF].filter(Boolean).join(" / "))).join(" · ")}</div>` : "";
  const f = (n.faults||[]).length ? `<div class="tiny" style="color:var(--bad)">Σφάλματα αποκλεισμού: ${esc(n.faults.join(", "))}</div>` : "";
  return `${n.text?`<div>${esc(n.text)}</div>`:""}
    <div class="tiny">${esc(bits.join(" · "))||"—"}</div>${pts}${f}`;
}

/* ---------- 11. Stats matrix -------------------------------------------- */
function vStats(){
  const trials = DB.trials.slice().sort((a,b)=>(a.dateStart||"").localeCompare(b.dateStart||""));
  const map = {};                       // dogId -> trialId -> points
  trials.forEach(t=>t.entries.forEach(e=>{
    const r = t.results[e.id]; if(!r) return;
    (map[e.dogId] = map[e.dogId]||{})[t.id] = pointsFor(t,r);
  }));
  const dogIds = Object.keys(map).sort((a,b)=>dogName(a).localeCompare(dogName(b),"el"));
  if(!dogIds.length) return `<div class="empty"><h2>Χωρίς αποτελέσματα ακόμη</h2>
    <p class="muted">Ο πίνακας γεμίζει μόλις βαθμολογηθεί ο πρώτος αγώνας.</p></div>`;
  /* dogs as rows, trials as columns, totals both ways. This is the season at a
     glance and it should look like a record, not a report. */
  const rows = dogIds.map(id=>{
    const tot = trials.reduce((s,t)=>s+(map[id][t.id]||0),0);
    return `<tr><td class="first">${esc(dogName(id))}<span>${esc((dogById(id)||{}).breed||"")}</span></td>
      ${trials.map(t=>{const v=map[id][t.id];
        return `<td class="n ${v?"":"z"}">${v!==undefined&&v!==0?v:"–"}</td>`;}).join("")}
      <td class="tot">${tot}</td><td class="tail"></td></tr>`;
  }).join("");
  const grand = dogIds.reduce((a,id)=>a+trials.reduce((s,t)=>s+(map[id][t.id]||0),0),0);
  const totRow = `<tr class="sum"><td class="first">ΣΥΝΟΛΟ ΑΓΩΝΑ</td>${trials.map(t=>{
      const s = dogIds.reduce((a,id)=>a+(map[id][t.id]||0),0);
      return `<td class="n">${s}</td>`;}).join("")}
      <td class="tot">${grand}</td><td class="tail"></td></tr>`;
  const season = trials.length
    ? (trials[0].dateStart||"").slice(0,4) + "–" + (trials[trials.length-1].dateStart||"").slice(0,4) : "";
  return `
  <div class="row" style="align-items:flex-end;gap:16px;margin-bottom:20px">
    <div class="grow"><div class="eyebrow">Πίνακας σεζόν ${esc(season)}</div>
      <h1 style="margin:0">Στατιστικά</h1></div>
    <div class="tiny" style="text-align:right;max-width:340px">Πόντοι κατά Αξιολόγηση. Ζεύγη ×2,
      άγριο θήραμα ×2. Ο πίνακας πόντων είναι δεδομένα και αλλάζει από τον όμιλο (Ρυθμίσεις).</div>
  </div>
  <div class="card" style="padding:0"><div class="scroll"><table class="matrix">
    <thead><tr><th class="first">Σκύλος</th>
      ${trials.map(t=>`<th class="v"><span>${esc(t.title)} ${fmtDate(t.dateStart).slice(0,5)}</span></th>`).join("")}
      <th class="v"><span>ΣΥΝΟΛΟ</span></th><th class="v tail"></th></tr></thead>
    <tbody>${rows}${totRow}</tbody></table></div></div>
  <div class="row tight noprint" style="margin-top:18px">
    <button data-act="xlsStats">Excel με ζωντανούς τύπους</button>
    <button data-act="print">Εκτύπωση</button></div>`;
}

/* Assigning dogs to a terrain by hand.
   The draw engine has always honoured `terrain.assigned` + `entryIds` — it just
   had no way to be told. Anything left unassigned still falls to the draw, so
   the head judge can pin two or three dogs and let the rest sort themselves. */
function dlgAssign(t, terrainId){
  const day = t.days[S.day];
  const tr = day.terrains.find(x=>x.id===terrainId); if(!tr) return;
  const here = new Set(tr.entryIds||[]);
  const whereElse = {};
  day.terrains.forEach(o=>{ if(o.id!==tr.id) (o.entryIds||[]).forEach(id=>{ whereElse[id] = o.name; }); });
  const active = t.entries.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ");

  const rows = active.map(e=>{
    const d = dogById(e.dogId) || {};
    const conflict = judgeConflict(tr, e, t);
    const taken = whereElse[e.id];
    return `<button class="tog assign ${here.has(e.id)?"on":""}" data-pick="${e.id}"
      style="width:100%;justify-content:flex-start;text-align:left;min-height:52px;margin-bottom:6px">
      <span style="flex:1;min-width:0">
        <b style="display:block;font:600 17px/1.2 var(--f-b)">${esc(d.name||"—")}</b>
        <span class="tiny" style="color:inherit;opacity:.75">${esc(d.breed||"")}${d.sex?" · "+d.sex:""} · ${esc(perName(e.handlerId))}${
          taken?` · τώρα στο ${esc(taken)}`:""}</span>
      </span>
      ${conflict?`<span class="chip r" style="flex:none">ΑΡΘΡΟ 49</span>`:""}
    </button>`;
  }).join("");

  dlg(`<div class="eyebrow">${esc(tr.name)}</div>
  <h2>Ανάθεση σκύλων</h2>
  <p class="muted">Επιλέξτε ποιοι σκύλοι τρέχουν σε αυτό το τερέν. Όσοι δεν ανατεθούν πουθενά
    κατανέμονται από την κλήρωση. Ένας σκύλος ανήκει σε ένα μόνο τερέν.</p>
  ${active.length ? `<div style="max-height:52vh;overflow:auto;margin-top:14px">${rows}</div>`
    : `<div class="empty">Καμία δηλωμένη συμμετοχή. Προσθέστε συμμετοχές πρώτα.</div>`}
  <div class="err" id="assignWarn" style="display:none;margin-top:12px"></div>
  <div class="row" style="margin-top:16px">
    <button class="b-pri grow" data-act="saveAssign" data-id="${tr.id}">Αποθήκευση</button>
    <button class="grow" data-act="close">Άκυρο</button></div>`);
  window._assign = { terrainId: tr.id, picked: new Set(here) };
  assignWarn(t);
}
/* Άρθρο 49 is a hard constraint in the draw, so say so while he is choosing
   rather than letting the draw refuse afterwards. */
function assignWarn(t){
  const A = window._assign; if(!A) return;
  const tr = t.days[S.day].terrains.find(x=>x.id===A.terrainId);
  const bad = [...A.picked].map(id=>t.entries.find(e=>e.id===id))
    .filter(e=>e && judgeConflict(tr, e, t)).map(e=>dogName(e.dogId));
  const w = el("assignWarn"); if(!w) return;
  if(!bad.length){ w.style.display = "none"; return; }
  w.style.display = "";
  w.innerHTML = `<b>Ο κριτής του τερέν έχει δικό του σκύλο εδώ (Άρθρο 49):</b> ${esc(bad.join(", "))}.
    Η κλήρωση θα τους μετακινήσει αλλού.`;
}

function femaleEntry(e){

/* Which dogs belong to a handler: the ones he owns, plus any he has run in a
   previous trial. A handler often brings someone else's dog, and the club's
   handlers outlast the dogs by years — which is why this screen asks for the
   handler first and lets him narrow the list, rather than making the head
   judge find a dog among a hundred and hope the owner comes out right. */
function dogsForHandler(hid){
  const byName = (a,b)=>a.name.localeCompare(b.name,"el");
  if(!hid) return { own: [], rest: DB.dogs.slice().sort(byName) };
  const handled = new Set();
  DB.trials.forEach(t=>t.entries.forEach(en=>{ if(en.handlerId === hid) handled.add(en.dogId); }));
  const own = DB.dogs.filter(d=>d.ownerId === hid || handled.has(d.id)).sort(byName);
  const ownIds = new Set(own.map(d=>d.id));
  return { own, rest: DB.dogs.filter(d=>!ownIds.has(d.id)).sort(byName) };
}
function dogSelect(hid, selId){
  const { own, rest } = dogsForHandler(hid);
  const opt = d => `<option value="${d.id}" ${selId===d.id?"selected":""}>${esc(d.name)}${
    d.breed?" ("+esc(d.breed)+")":""}</option>`;
  return `<select id="e_dog">
    <option value="">— επιλέξτε σκύλο —</option>
    ${own.length?`<optgroup label="Σκύλοι του κυναγωγού">${own.map(opt).join("")}</optgroup>`:""}
    ${rest.length?`<optgroup label="${own.length?"Άλλοι σκύλοι":"Όλοι οι σκύλοι"}">${rest.map(opt).join("")}</optgroup>`:""}
  </select>`;
}
/* If the handler has exactly one dog that is not already entered, that is
   almost certainly the one — offer it rather than making him pick it. */
function dogHint(hid){
  if(!DB.dogs.length) return "Το μητρώο σκύλων είναι άδειο. Προσθέστε τον σκύλο με το + Νέος.";
  if(hid && !dogsForHandler(hid).own.length)
    return "Ο κυναγωγός δεν έχει σκύλο στο μητρώο. Επιλέξτε από τους υπόλοιπους ή προσθέστε νέο.";
  return "Πρώτοι στη λίστα οι σκύλοι που έχει ή έχει τρέξει.";
}

   That is one conversation, so it is one screen: pick the man, tick the dogs.

/* His own dogs, plus any he has run before. A dog already drawn or scored
   cannot be un-ticked here — that is a withdrawal, and it belongs in the
   entry's own form where the status is recorded. */
function batchList(t, hid){
  if(!hid) return `<div class="empty">Επιλέξτε κυναγωγό για να δείτε τους σκύλους του.</div>`;
  const { own } = dogsForHandler(hid);
  const drawn = new Set();
  t.days.forEach(day=>(day.terrains||[]).forEach(tr=>(tr.braces||[]).forEach(b=>{
    if(b.a) drawn.add(b.a); if(b.b) drawn.add(b.b); })));
  const rows = own.map(d=>{
    const en = t.entries.find(x=>x.dogId === d.id);
    const other = en && en.handlerId !== hid;              /* entered under someone else */
    const res = en && t.results[en.id];
    const locked = en && (drawn.has(en.id) || (res && res.qual && res.qual !== "-"));
    const on = !!en && !other;
    return `<button class="tog assign ${on?"on":""}" ${locked||other?"disabled":""}
      data-btick="${d.id}" style="width:100%;justify-content:flex-start;text-align:left;
      min-height:52px;margin-bottom:6px${locked||other?";opacity:.55":""}">
      <span style="flex:1;min-width:0">
        <b style="display:block;font:600 17px/1.2 var(--f-b)">${esc(d.name)}</b>
        <span class="tiny" style="color:inherit;opacity:.75">${esc(d.breed||"")}${
          d.sex?" · "+(d.sex==="Θ"?"θηλυκός":"αρσενικός"):""}${d.reg?" · "+esc(d.reg):""}</span>
      </span>
      ${other?`<span class="chip" style="flex:none">${esc(perName(en.handlerId))}</span>`
        :locked?`<span class="chip n" style="flex:none">ΚΛΗΡΩΜΕΝΟΣ</span>`:""}
    </button>`;
  }).join("");
  return (rows ? `<div style="max-height:46vh;overflow:auto">${rows}</div>`
    : `<div class="empty">Ο κυναγωγός δεν έχει σκύλο στο μητρώο.</div>`)
    + `<button class="b-sm noprint" style="margin-top:8px" data-act="newDogForBatch">+ Σκύλος</button>`;
}
function suggestDog(t, hid, current){
  if(current) return current;
  const { own } = dogsForHandler(hid);
  const free = own.filter(d=>!t.entries.some(en=>en.dogId === d.id));
  return free.length === 1 ? free[0].id : "";
}

/* Structured judge notes — field mode, and the hardest screen. Chips and
   steppers, not dropdowns: a point is three taps. The Άρθρο 33 faults sit
   behind a red border and need a second confirmation, because eliminating a
   dog is serious. */
const WHITE_HINTS = [
  "Καμία λευκή φέρμα.",
  "Μία λευκή δεν εμποδίζει CAC (Άρθρο 27).",
  "Δύο λευκές: μέγιστο ΠΟΛΥ ΚΑΛΟΣ (Άρθρο 27).",
  "Τρεις λευκές σε διαφορετικές κατευθύνσεις: αποκλεισμός (Άρθρο 27)."
];
function dlgNote(t, runKey){
  const entryId = runKey.split("::")[0];
  const jid = S.judgeFilter || (DB.judges[0]||{}).id || "head";
  const n = ((t.notes[runKey]||{})[jid]) || {points:[],faults:[]};
  const entry = t.entries.find(e=>e.id===entryId) || {};

  /* where the dog stands and in which brace — the judge is holding the phone
     next to the dog and needs to know he is writing on the right sheet */
  let where = "";
  (t.days[S.day].terrains||[]).forEach(tr=>(tr.braces||[]).forEach(b=>{
    if(b.id !== runKey.split("::")[1]) return;
    where = `${tr.name} · ζεύγος ${b.no} · ${b.a===entryId?"δεξιά":"αριστερά"} της επιτροπής`
      + (b.recall ? " · επανάκληση" : "");
  }));

  const scale = (k,label,v)=>`<div style="margin-bottom:14px">
    <div style="font-size:17px">${label}</div>
    <div class="scale" style="margin-top:8px">${[1,2,3,4,5].map(i=>
      `<button class="tog ${v===i?"on":""}" data-nset="${k}|${i}">${i}</button>`).join("")}</div></div>`;
  const widths = ["Στενή","Κανονική","Ανοικτή","Πολύ ανοικτή"];
  const w = n.whites||0;

  /* a signed terrain is read-only: the sheet can be read, not rewritten */
  let signedBy = null;
  (t.days[S.day].terrains||[]).forEach(tr=>{
    if((tr.braces||[]).some(b=>b.id === runKey.split("::")[1]) && (t.signoff||{})[tr.id])
      signedBy = (t.signoff||{})[tr.id];
  });
  if(signedBy){
    dlg(`<h2 style="margin-bottom:2px">${esc(dogName(entry.dogId))}</h2>
      <div class="tiny" style="margin-bottom:16px">${esc(where||"")}</div>
      <div class="note"><b>Το τερέν είναι υπογεγραμμένο.</b> Υπογραφή από ${esc(signedBy.by)},
        ${esc(signedBy.at)}. Οι σημειώσεις δεν αλλάζουν χωρίς ξεκλείδωμα από τον Πρόεδρο Κριτών
        (Βαθμολογία → Ξεκλείδωμα).</div>
      <div class="card">${noteSummary(n)}</div>
      <button class="b-full" data-act="close">Κλείσιμο</button>`);
    return;
  }
  dlg(`<h2 style="margin-bottom:2px">${esc(dogName(entry.dogId))}</h2>
  <div class="tiny" style="margin-bottom:16px">${esc(where||"")}${where?" · ":""}${esc(perName(entry.handlerId))}
    <br>Κριτής: ${esc((judById(jid)||{}).name||"Πρόεδρος Κριτών")}</div>

  <div class="card">
    <div class="eyebrow">Έρευνα</div>
    ${scale("passion","Πάθος",n.passion)}
    ${scale("method","Μεθοδικότητα",n.method)}
    ${scale("style","Καλπασμός και στυλ φυλής",n.style)}
    ${scale("contact","Επαφή με κυναγωγό",n.contact)}
    <div style="font-size:17px">Πλάτος έρευνας</div>
    <div class="badge-list" style="margin-top:8px">${widths.map(x=>
      `<button class="tog ${n.width===x?"on":""}" data-nwidth="${x}">${x}</button>`).join("")}</div>
  </div>

  <div class="card">
    <div class="row"><span class="eyebrow grow" style="margin:0">Πόντοι</span>
      <span class="muted" id="ptCount">${(n.points||[]).length} ${(n.points||[]).length===1?"πόντος":"πόντοι"}</span></div>
    <div id="ptList" style="margin-top:12px">${(n.points||[]).map((p,i)=>ptRow(p,i)).join("")
      ||`<div class="muted">Κανένας πόντος καταγεγραμμένος.</div>`}</div>
    <button class="b-full" style="margin-top:12px" data-act="addPoint">+ Πόντος</button>
  </div>

  <div class="card">
