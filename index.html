        ${(n.faults||[]).length?`<p style="margin:2pt 0 0;color:#B3261E">${tx("Σφάλματα αποκλεισμού (Άρθρο 33):")}
          ${esc(n.faults.join(", "))}</p>`:""}
        ${n.text?`<p style="margin:4pt 0 0">«${esc(n.text)}»</p>`:""}`;
    }).join("");
    blocks.push(`<div style="margin:0 0 14pt">
      <p style="margin:0"><b>${esc(dogName(e.dogId))}</b> — ${esc(breedName(d.breed))}${d.sex?" · "+d.sex:""}
        ${d.reg?" · Κ.Ο.Κ. "+esc(d.reg):""}${
        d.natTeam?" · "+tx("Εθνική ομάδα")+" "+esc(natTag(d.natTeam)):""}</p>
      <p style="margin:0;font-size:9pt">${esc(tr.name)} ${tx("· ζεύγος")} ${b.no}${b.recall?" · επανάκληση (Άρθρο 30)":""}
        · ${b.a===e.id?"δεξιά":"αριστερά"} ${tx("της επιτροπής · κυναγωγός")} ${esc(perName(e.handlerId))}
        ${tx("· βαθμολογία")} ${esc(r.qual||"-")}${r.award&&r.award!=="-"?" · "+esc(r.award):""}
        · ${pointsFor(t,r)} ${tx("πόντοι")}</p>
      ${parts}</div>`);
  }))));

  const html = `<html><head><meta charset="utf-8"></head><body style="font-family:Calibri">
    <h2>${tx("ΚΥΠΡΙΑΚΟΣ ΟΜΙΛΟΣ ΑΓΓΛΙΚΩΝ ΔΕΙΚΤΩΝ")}</h2>
    <h3>${esc(t.title)}</h3>
    <p>${esc(t.type)} · ${fmtDate(t.dateStart)} · ${esc(t.place||"")} ${tx("· Θήραμα:")} ${esc(t.game||"")}${
      t.wild?" (άγριο θήραμα)":""} ${tx("· Συντελεστής ×")}${coefficient(t)}</p>
    <table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse;font-size:11pt">
    <tr><th>${tx("Τερέν")}</th><th>${tx("Ζεύγος")}</th><th>${tx("Σκύλος")}</th><th>${tx("Κυναγωγός")}</th><th>${tx("Βαθμολογία")}</th><th>${tx("Τίτλος")}</th><th>${tx("Πόντοι")}</th></tr>
    ${rows.join("")}</table>
    ${blocks.length?`<h3 style="margin-top:18pt">${tx("Σημειώσεις κριτών")}</h3>${blocks.join("")}`:""}
    ${(t.unlocks||[]).length?`<h3 style="margin-top:12pt">${tx("Ξεκλειδώματα")}</h3>
      <ul style="font-size:10pt">${t.unlocks.map(u=>
        `<li>${esc(u.terrain)} — ${esc(u.at)} — ${esc(u.by)} — «${esc(u.why)}»</li>`).join("")}</ul>`:""}
    <p style="font-size:9pt">${tx("Η σειρά είναι ενδεικτική (Άρθρο 16).")}</p></body></html>`;
  download(`KOAD_${t.title.replace(/\s+/g,"_")}.doc`,"application/msword",html);
}

/* ---------- 15. Actions -------------------------------------------------- */
document.addEventListener("click", ev=>{
  const el2 = ev.target.closest("[data-nav],[data-tab],[data-day],[data-act],[data-open],[data-dog],[data-editdog],[data-edithandler],[data-newdogfor],[data-btick],[data-batch],[data-ftick],[data-fall],[data-nterrain],[data-smspick],[data-chan],[data-editjudge],[data-editterrain],[data-editentry],[data-note],[data-res],[data-bstat],[data-trailer],[data-untrailer],[data-recall],[data-recallgo],[data-sms],[data-copy],[data-wa],[data-smsdone],[data-set],[data-nstep],[data-nwidth],[data-nfault],[data-delpt],[data-nset],[data-ptset],[data-openbrace],[data-nextup],[data-nextsend],[data-swap],[data-swapwith],[data-regtab],[data-bsec],[data-regbsec],[data-setlang],[data-assign],[data-autoassign],[data-pick],[data-signoff],[data-unlock]");
  if(!el2) return;
  const d = el2.dataset;
  const t = trialById(S.trialId);

  if(d.nav){ S.view=d.nav; S.trialId=null; closeDlg(); render(); return; }
  if(d.tab){ S.tab=d.tab; render(); return; }
  if(d.day!==undefined && d.day!==""){ S.day=+d.day; render(); return; }
  if(d.open){ S.view="trial"; S.trialId=d.open; S.tab="entries"; S.day=0; render(); return; }
  if(d.dog){ S.view="dog"; S.dogId=d.dog; render(); return; }
  if(d.editdog){ dlgDog(dogById(d.editdog)); return; }
  if(d.edithandler){ dlgHandler(perById(d.edithandler)); return; }
  if(d.newdogfor){ dlgDog({ ownerId: d.newdogfor }); return; }
  if(d.btick){ el2.classList.toggle("on"); return; }
  if(d.ftick !== undefined && el2.hasAttribute("data-ftick")){
    const F = window._field;
    F.has(d.ftick) ? F.delete(d.ftick) : F.add(d.ftick);
    redrawField(t); return; }
  if(d.fall !== undefined && el2.hasAttribute("data-fall")){
    const F = window._field;
    const mine = DB.dogs.filter(x=>(x.ownerId||"") === d.fall);
    const all = mine.length && mine.every(x=>F.has(x.id));
    mine.forEach(x=>all ? F.delete(x.id) : F.add(x.id));
    redrawField(t); return; }
  if(d.batch){ dlgHandlerEntries(t, d.batch); return; }
  if(d.nterrain){ setTerrainCount(t, +d.nterrain); return; }
  if(d.editjudge){ dlgJudge(judById(d.editjudge)); return; }
  if(d.editterrain){ dlgTerrain(t, t.days[S.day].terrains.find(x=>x.id===d.editterrain)); return; }
  if(d.editentry){ dlgEntry(t, t.entries.find(x=>x.id===d.editentry)); return; }
  if(d.note){ dlgNote(t, d.note); return; }

  if(d.set === "smsModeFull"){ DB.settings.smsMode = "full"; save(); render(); return; }
  if(d.set === "smsModeOwn"){  DB.settings.smsMode = "own";  save(); render(); return; }
  if(d.set){ DB.settings[d.set] = !DB.settings[d.set]; save(); render(); return; }
  if(d.nwidth){ document.querySelectorAll("[data-nwidth]").forEach(b=>b.classList.remove("on"));
    el2.classList.add("on"); window._note.width = d.nwidth; autosaveNote(); return; }
  if(d.nfault){ el2.classList.toggle("on");
    const f = window._note.faults || (window._note.faults=[]);
    const i = f.indexOf(d.nfault); i>=0 ? f.splice(i,1) : f.push(d.nfault); autosaveNote(); return; }
  /* the 1–5 scales: one tap sets the value, tapping the same one clears it */
  if(d.nset){ const [k,v] = d.nset.split("|");
    const val = window._note[k]===+v ? 0 : +v;
    window._note[k] = val;
    document.querySelectorAll(`[data-nset^="${k}|"]`).forEach(b=>
      b.classList.toggle("on", +b.dataset.nset.split("|")[1] === val));
    autosaveNote(); return; }
  if(d.nstep){ const [k,delta] = d.nstep.split("|");
    const max = k==="whites" ? 9 : 5;
    window._note[k] = Math.max(0, Math.min(max, (window._note[k]||0) + (+delta)));
    el("v_"+k).textContent = window._note[k];
    /* Άρθρο 27 is advice to the judge, never a block */
    if(k==="whites" && el("whiteHint"))
      el("whiteHint").textContent = tx(WHITE_HINTS[Math.min(window._note.whites,3)]);
    autosaveNote(); return; }
  if(d.ptset){ const [i,f,v] = d.ptset.split("|");
    const p = window._note.points[+i];
    p[f] = p[f]===v ? "" : v;
    redrawPoints(); autosaveNote(); return; }
  if(d.delpt){ window._note.points.splice(+d.delpt,1); redrawPoints(); autosaveNote(); return; }
  if(d.openbrace){ S.openBrace = S.openBrace===d.openbrace ? null : d.openbrace; render(); return; }

  if(d.bstat){ const [tid,bid] = d.bstat.split("|");
    const tr = t.days[S.day].terrains.find(x=>x.id===tid);
    const b = tr.braces.find(x=>x.id===bid);
    if(b){ const closing = b.status==="ΤΡΕΧΕΙ";
      setBraceStatus(b, b.status==="ΕΚΚΡΕΜΕΙ" ? "ΤΡΕΧΕΙ"
      : b.status==="ΤΡΕΧΕΙ" ? "ΟΛΟΚΛΗΡΩΘΗΚΕ" : "ΕΚΚΡΕΜΕΙ");
      save(); render();
      /* Μόνο στη Λήξη, και μόνο αν υπάρχει επόμενο ζεύγος με τηλέφωνο. Η
         «Επαναφορά» δεν ξαναρωτά — ο κριτής διορθώνει, δεν ειδοποιεί. */
      if(closing && DB.settings.nextUp !== false){
        const nb = nextUpBrace(tr, b);
        if(nb && nextUpQueue(t, tr, nb).some(x=>x.phone)) dlgNextUp(t, tr.id, nb.id);
      } }
    return; }
  if(d.nextup){ const [tid,bid] = d.nextup.split("|"); dlgNextUp(t, tid, bid); return; }
  if(d.nextsend){ const [tid,bid,i] = d.nextsend.split("|");
    const tr = t.days[S.day].terrains.find(x=>x.id===tid);
    const b = tr && (tr.braces||[]).find(x=>x.id===bid);
    const x = b && nextUpQueue(t, tr, b)[+i];
    if(x) sendOne(t, x);
    return; }

  /* Άρθρο 16 says the drawn order is an indication, so the head judge may
     change it — but never silently. Both braces are marked and the mark is
     printed. */
  if(d.assign){ dlgAssign(t, d.assign); return; }
  if(d.autoassign){
    const tr = t.days[S.day].terrains.find(x=>x.id===d.autoassign);
    if(tr){ tr.assigned = false; tr.entryIds = []; save(); render();
      toast(tx("Η κατανομή επιστρέφει στην κλήρωση")); }
    return; }
  if(d.pick){
    const A = window._assign; if(!A) return;
    A.picked.has(d.pick) ? A.picked.delete(d.pick) : A.picked.add(d.pick);
    el2.classList.toggle("on");
    assignWarn(t);
    return; }

  /* Άρθρο 16 — the order is an indication, so the head judge may move a brace
     up or down the running order. Numbering is positional, so brace 1 moved
     three places down becomes brace 4. Both the move and the mark are kept. */

  if(d.swap){ dlgSwap(t, d.swap); return; }
  if(d.swapwith){ doSwap(t, el2.dataset.swapwith); return; }
  if(d.regtab){ S.regTab = d.regtab; render(); return; }
  /* the breed picker swaps its own list in place — re-rendering the dialog
     would throw away everything already typed into the form */
  if(d.bsec){
    const wrap = el("d_breedWrap");
    if(wrap) wrap.innerHTML = breedPicker(d.bsec === "1" ? BREEDS_CONT[0] : BREEDS_BRIT[0]);
    return; }
  if(d.setlang){ DB.settings.lang = d.setlang; save(); closeDlg(); render(); return; }
  if(d.regbsec){ S.regSec = S.regSec === d.regbsec ? "" : d.regbsec; S.regBreed = ""; render(); return; }

  /* Sign-off locks the terrain's scores and notes. Unlocking is the head
     judge's call, needs a reason, and the reason is kept on the record. */
  if(d.signoff){
    const tr = t.days[S.day].terrains.find(x=>x.id===d.signoff);
    if(!tr) return;
    if(!confirmAct(`${tx("Υπογραφή του")} ${tr.name}${tx(". Η βαθμολογία και οι σημειώσεις κλειδώνουν. Συνέχεια;")}`)) return;
    t.signoff = t.signoff || {};
    t.signoff[tr.id] = { by: "Πρόεδρος Κριτών", at: new Date().toLocaleString("el-GR") };
    save(); render(); toast(tx("Το τερέν υπογράφηκε"));
    return; }
  if(d.unlock){
    const tr = t.days[S.day].terrains.find(x=>x.id===d.unlock);
    if(!tr) return;
    const why = window.prompt("Αιτιολογία ξεκλειδώματος — καταγράφεται στο φύλλο:", "");
    if(why === null) return;
    if(!why.trim()) return toast(tx("Χρειάζεται αιτιολογία"));
    t.unlocks = t.unlocks || [];
    t.unlocks.push({ terrain: tr.name, why: why.trim(), by: "Πρόεδρος Κριτών",
                     at: new Date().toLocaleString("el-GR") });
    delete (t.signoff||{})[tr.id];
    save(); render(); toast(tx("Ξεκλειδώθηκε· η αιτιολογία καταγράφηκε"));
    return; }

  if(d.trailer){ const [tid,bid] = d.trailer.split("|"); dlgTrailer(t, tid, bid); return; }

  if(d.untrailer){ const [tid,bid] = d.untrailer.split("|");
    const tr = t.days[S.day].terrains.find(x=>x.id===tid);
    const b = tr.braces.find(x=>x.id===bid);
    if(b){ b.b = null; b.solo = true; b.trailer = false; save(); render(); }
    return; }

  if(d.recall){ dlgRecall(t, d.recall); return; }      // Άρθρο 30 — επανάκληση
  if(d.recallgo){ doRecall(t, el2.dataset.recallgo); return; }

  if(d.sms!==undefined && el2.hasAttribute("data-sms")){
    const x = smsQueue(t)[+d.sms]; if(!x) return;
    sendOne(t, x); return; }
  if(d.copy!==undefined && el2.hasAttribute("data-copy")){
    const x = smsQueue(t)[+d.copy];
    navigator.clipboard.writeText(x.body).then(()=>toast(tx("Αντιγράφηκε"))); return; }
  if(d.wa!==undefined && el2.hasAttribute("data-wa")){
    const x = smsQueue(t)[+d.wa]; if(!x) return;
    sendOne(t, x); return; }
  if(d.chan){ DB.settings.channel = d.chan; save(); render(); return; }
  if(d.smspick){
    const sel = S.smsPick instanceof Set ? S.smsPick : (S.smsPick = new Set());
    sel.has(d.smspick) ? sel.delete(d.smspick) : sel.add(d.smspick);
    render(); return; }
  if(d.smsdone){ t.sms[d.smsdone] = t.sms[d.smsdone]==="ΕΣΤΑΛΗ" ? "" : "ΕΣΤΑΛΗ"; save(); render(); return; }

  ACT[d.act] && ACT[d.act](el2, t);
});

  if(ev.button !== undefined && ev.button !== 0) return;
  if(ev.target.closest("[data-drag]")) dragReorder(ev);
  else if(ev.target.closest("[data-dogbox]")) dragDogBox(ev);

document.addEventListener("change", ev=>{
  const sf = ev.target.dataset.statf;
  if(sf){ statFilter()[sf] = ev.target.value; render(); return; }
  if(ev.target.id === "d_breed"){
    const n = el("d_breedFci");
    if(n) n.textContent = (BREED_FCI[ev.target.value]||{}).en || "";
    return; }
  if(ev.target.dataset.regbreed !== undefined){
    S.regBreed = ev.target.value;
    /* picking a breed settles which τμήμα you are in — the buttons follow */
    if(S.regBreed) S.regSec = BREED_SECTION(S.regBreed);
    render(); return; }
  const t = trialById(S.trialId);
  const r = ev.target.dataset.res;
  if(r && t){ const [eid,f] = r.split("|");
    t.results[eid] = t.results[eid] || {qual:"-",award:"-"};
    t.results[eid][f] = ev.target.value; save(); render(); return; }
  const p = ev.target.dataset.pt;
  if(p && p.includes("|") && window._note){ const [i,f] = p.split("|");
    window._note.points[+i][f] = ev.target.value; return; }
  if(ev.target.id==="e_handler"){                   // the handler narrows the dogs
    const t2 = trialById(S.trialId);
    const hid = ev.target.value;
    const wrap = el("e_dogWrap");
    if(wrap && t2){
      const keep = (el("e_dog")||{}).value || "";
      wrap.innerHTML = dogSelect(hid, suggestDog(t2, hid, keep));
      const hint = el("e_dogHint");
      if(hint) hint.textContent = dogHint(hid);
      const dg = dogById((el("e_dog")||{}).value) || {};
      const rowEl = el("e_seasonRow");
      if(rowEl) rowEl.style.display = dg.sex==="Θ" ? "flex" : "none";
    }
    return; }
  if(ev.target.dataset.judgeslot){                   // κεντρικός κριτής, κριτής 1, κριτής 2
    const t2 = trialById(S.trialId);
    const [trid, i] = ev.target.dataset.judgeslot.split("|");
    if(t2) setJudgeSlot(t2, trid, +i, ev.target.value);
    return; }
  if(ev.target.id==="tl_dog"){                      // the dog brings his κυναγωγός
    const t2 = trialById(S.trialId);
    const dg = dogById(ev.target.value);
    const h = el("tl_handler"); if(!h) return;
    if(!dg){ return; }
    /* whoever ran him last, otherwise the man he is registered to */
    let hid = dg.ownerId || "";
    if(t2) (t2.entries||[]).forEach(en=>{ if(en.dogId === dg.id && en.handlerId) hid = en.handlerId; });
    if(hid && [...h.options].some(o=>o.value === hid)) h.value = hid;
    return; }
  if(ev.target.id==="b_handler"){                   // narrow the tick list to his dogs
    const t2 = trialById(S.trialId);
    window._batchH = ev.target.value;
    const wrap = el("b_list");
    if(wrap && t2) wrap.innerHTML = batchList(t2, ev.target.value);
    return; }
  if(ev.target.id==="e_dog"){                       // οίστρος applies to bitches only
    const dg = dogById(ev.target.value) || {};
    const rowEl = el("e_seasonRow"); if(rowEl) rowEl.style.display = dg.sex==="Θ" ? "flex" : "none";
    const h = el("e_handler"); if(h && !h.value && dg.ownerId) h.value = dg.ownerId;
    return; }
  if(ev.target.id==="d_owner"){                     // prefill owner details in the dog screen
    const p = perById(ev.target.value) || {};
    el("d_ownerName").value = p.name || ""; el("d_ownerPhone").value = p.phone || "";
    return; }
  if(ev.target.dataset.jfilter!==undefined){ S.judgeFilter = ev.target.value; render(); return; }
});

function redrawPoints(){
  const pts = window._note.points || [];
  /* a chip tap redraws the list; whatever the judge had open stays open */
  const open = [...document.querySelectorAll("#ptList details")].map(d=>d.open);
  el("ptList").innerHTML = pts.map((p,i)=>ptRow(p,i)).join("")
    || `<div class="muted">${tx("Κανένας πόντος καταγεγραμμένος.")}</div>`;
  document.querySelectorAll("#ptList details").forEach((d,i)=>{ if(open[i] !== undefined) d.open = open[i]; });
  const c = el("ptCount");
  if(c) c.textContent = pts.length + " " + tx(pts.length===1 ? "πόντος" : "πόντοι");
}

/* Autosave, with a quiet acknowledgement and never a modal. The judge is
   walking; he cannot stop to dismiss a dialog. */
let saveTick = null;
function autosaveNote(){
  const t = trialById(S.trialId);
  if(!t || !window._noteKey) return;
  const i = window._noteKey.lastIndexOf("|");
  const key = window._noteKey.slice(0,i), jid = window._noteKey.slice(i+1);
  const ta = el("n_text"); if(ta) window._note.text = ta.value.trim();
  t.notes[key] = t.notes[key] || {};
  t.notes[key][jid] = JSON.parse(JSON.stringify(window._note));
  save();
  const s = el("noteSaved");
  if(s){ s.textContent = "Αποθηκεύτηκε";
    clearTimeout(saveTick); saveTick = setTimeout(()=>{ if(el("noteSaved")) el("noteSaved").textContent = ""; }, 2500); }
}


/* --- «σειρά σας» — Άρθρο 24 τελειώνει ένα ζεύγος, δύο άνθρωποι πρέπει να
   ξεκινήσουν να έρχονται -------------------------------------------------
   Ο κριτής πατά «Λήξη» και οι επόμενοι δύο κυναγωγοί στέκουν στα αυτοκίνητά
   τους, μισό χιλιόμετρο πιο πέρα. Μέχρι να τους βρει κάποιος, το τερέν
   περιμένει.

   Η εφαρμογή ΔΕΝ στέλνει μόνη της. Δεν υπάρχει διακομιστής και δεν υπήρξε
   ποτέ: κάθε μήνυμα εδώ ανοίγει την εφαρμογή μηνυμάτων του τηλεφώνου με τον
   αριθμό και το κείμενο μέσα, και το «αποστολή» το πατά άνθρωπος. Αυτό που
   αλλάζει είναι ότι δεν χρειάζεται να θυμηθεί κανείς να το κάνει, ούτε να
   γράψει τίποτα: με το που κλείνει το ζεύγος, το μήνυμα είναι έτοιμο. */
/* Όχι «nextPending»: αυτό το όνομα το κρατά ήδη η κάτω μπάρα, με άλλη υπογραφή
   και άλλο νόημα (το επόμενο ζεύγος ΟΛΗΣ της ημέρας). Δύο συναρτήσεις με το ίδιο
   όνομα σε ένα αρχείο σημαίνει ότι η δεύτερη σβήνει σιωπηλά την πρώτη. */
function nextUpBrace(tr, after){
  return (tr.braces||[]).slice().sort((x,y)=>x.no-y.no)
    .find(x => x.no > after.no && x.status === "ΕΚΚΡΕΜΕΙ") || null;
}
/* Σύντομο επίτηδες: ο κυναγωγός ξέρει ήδη πού είναι και τι τρέχει — του λείπει
   μόνο το «τώρα». Ένα τμήμα, όχι έξι. */
function nextUpBody(t, tr, b, e){
  const d = dogById(e.dogId) || {};
  return tx("Κ.Ο.Α.Δ. — σειρά σας.") + "\n"
       + braceLabel(b.no) + " · " + (d.name || "—") + " · " + tr.name
       + " · " + tx(e.id === b.a ? "δεξιά" : "αριστερά");
}
function nextUpQueue(t, tr, b){
  const out = [], seen = new Set();
  [b.a, b.b].forEach(id=>{
    const e = t.entries.find(x=>x.id===id); if(!e) return;
    if(b.trailer && id === b.b) return;   /* δεν αγωνίζεται, Άρθρο 40 */
    const h = e.handlerId || e.id;
    if(seen.has(h)) return; seen.add(h);
    const p = perById(e.handlerId) || {};
    out.push({ key:"next:" + b.id + ":" + e.id, name:perName(e.handlerId),
               phone:phoneE164(p.phone, p.country), body:nextUpBody(t, tr, b, e) });
  });
  return out;
}
/* Ανοίγει μόνο του στη Λήξη, και ξανά από το κουμπί του ζεύγους όταν ο κριτής
   το θέλει νωρίτερα. Ποτέ δεν στέλνει χωρίς πάτημα. */
function dlgNextUp(t, tid, bid){
  const tr = (t.days[S.day].terrains||[]).find(x=>x.id===tid); if(!tr) return;
  const b = (tr.braces||[]).find(x=>x.id===bid); if(!b) return;
  const q = nextUpQueue(t, tr, b);
  const rows = q.map((x,i)=>{
    const sent = t.sms[x.key] === "ΕΣΤΑΛΗ";
    return `<div class="card" style="margin:0">
      <div class="row" style="align-items:center;gap:10px">
        <div class="grow" style="min-width:0">
          <b style="font:600 16px/1.2 var(--f-b)">${esc(x.name)}</b>
          <div class="tiny">${x.phone ? esc(x.phone) : tx("Χωρίς τηλέφωνο")}
            · ${smsSegments(x.body)} ${tx("τμ.")}</div>
        </div>
        ${x.phone ? `<button class="b-sm ${sent?"":"b-pri"}" data-nextsend="${esc(tid)}|${esc(bid)}|${i}">${
          sent ? tx("Ξανά") : tx("Αποστολή")}</button>` : ""}
      </div>
      <div class="note" style="margin-top:10px;white-space:pre-wrap">${esc(x.body)}</div>
    </div>`; }).join("");
  dlg(`<h2>${tx("Ακολουθεί το")} ${braceLabel(b.no)}</h2>
  <p class="tiny">${tx("Το μήνυμα ανοίγει στην εφαρμογή μηνυμάτων του τηλεφώνου· την αποστολή τη δίνετε εσείς. Η εφαρμογή δεν στέλνει τίποτα μόνη της.")}</p>
  <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">${
    rows || `<div class="empty">${tx("Κανένας κυναγωγός με τηλέφωνο στο επόμενο ζεύγος.")}</div>`}</div>
  <div class="row tight" style="margin-top:14px">
    <button class="grow" data-act="close">${tx("Κλείσιμο")}</button></div>`);
}

/* Άρθρο 24 — the clock starts when the brace starts and stops when it ends */
function setBraceStatus(b, status){
  if(status==="ΤΡΕΧΕΙ" && b.status!=="ΤΡΕΧΕΙ"){ b.startedAt = Date.now(); }
  if(status!=="ΤΡΕΧΕΙ" && b.status==="ΤΡΕΧΕΙ"){
    b.elapsed = braceElapsed(b); b.startedAt = null;
  }
  if(status==="ΕΚΚΡΕΜΕΙ"){ b.elapsed = 0; b.startedAt = null; b.endedAt = null; }
  if(status==="ΟΛΟΚΛΗΡΩΘΗΚΕ") b.endedAt = Date.now();
  b.status = status;
}

/* --- επανάκληση, Άρθρο 30 ---
   A recall used to add one dog on his own, always, because the button was per
   dog and the code behind it wrote `b:null, solo:true`. Two dogs recalled meant
   two separate solo runs, which is not what the judges asked for: a recall is
   very often two dogs put down together again to be seen against each other.
   The head judge now says who runs — alone, or with a second dog from the same
   τερέν — and gets one ζεύγος either way. */
function dlgRecall(t, spec){
  const [tid, eid] = spec.split("|");
  const tr = (t.days[S.day].terrains||[]).find(x=>x.id===tid);
  if(!tr) return;
  const me = t.entries.find(x=>x.id===eid) || {};
  /* Μια επανάκληση που περιμένει μισή — ένας σκύλος μόνος του, με τη δεύτερη θέση
     κενή. Ο κριτής που καλεί δεύτερο σκύλο τον θέλει σχεδόν πάντα εκεί, δίπλα στον
     πρώτο, όχι σε δικό του ζεύγος. Προσφέρεται πρώτο και είναι το προεπιλεγμένο·
     πριν, κάθε επανάκληση έφτιαχνε καινούριο μονό ζεύγος. */
  const open = (tr.braces||[]).find(b => b.recall && b.a && !b.b && b.a !== eid
                                      && b.status === "ΕΚΚΡΕΜΕΙ");
  const openName = open ? dogName((t.entries.find(x=>x.id===open.a)||{}).dogId) : "";
  /* everyone who ran in this τερέν, himself and the συμπληρωματικοί aside —
     Άρθρο 30 is a second run under the judges of that ground */
  /* a συμπληρωματικός is excluded wherever he appears, not only in the brace he
     completes — once recalled into a second ζεύγος he would otherwise come back */
  const trailers = new Set();
  (tr.braces||[]).forEach(b=>{ if(b.trailer && b.b) trailers.add(b.b); });
  const seen = new Set(), opts = [];
  (tr.braces||[]).forEach(b=>[b.a, b.b].forEach(id=>{
    if(!id || id === eid || seen.has(id) || trailers.has(id)) return;
    if(open && id === open.a) return;          /* προσφέρεται πιο πάνω, ως «δίπλα του» */
    const e = t.entries.find(x=>x.id===id); if(!e) return;
    seen.add(id);
    opts.push({id, label:`${dogName(e.dogId)} — ${perName(e.handlerId)}`});
  }));
  opts.sort((a,b)=>a.label.localeCompare(b.label,"el"));
  const choices = (open ? [["join:" + open.id,
      `${tx("Δίπλα στον")} ${openName} ${tx("— επανάκληση, ζεύγος")} ${open.no}`]] : [])
    .concat([["", open ? "Μόνος του, σε νέο ζεύγος" : "Μόνος του"]])
    .concat(opts.map(o=>[o.id, "Μαζί με " + o.label]));
  dlg(`<h2>${tx("Επανάκληση — Άρθρο 30")}</h2>
  <p class="muted">${tx("Νέα διαδρομή για τον")} <b>${esc(dogName(me.dogId))}</b>${tx(", στο τέλος του")}
    ${esc(tr.name)}${tx(". Ο σκύλος κρατά τη θέση του στη σειρά· αυτή είναι επιπλέον.")}</p>
  ${open?`<div class="note">${tx("Ο")} <b>${esc(openName)}</b> ${tx("περιμένει μόνος του στην επανάκληση, ζεύγος")} ${open.no}${tx(". Αφήστε το ως έχει και οι δύο τρέχουν μαζί.")}</div>`:""}
  <div class="row">${sel("rc_with","Τρέχει", choices, choices[0][0])}</div>
  <div class="tiny">${tx("Δύο σκύλοι σε επανάκληση μπαίνουν στο")} <b>${tx("ίδιο ζεύγος")}</b> ${tx("και κρίνονται μαζί. Κάθε ένας κρατά δικό του φύλλο σημειώσεων.")}</div>
  <div class="row" style="margin-top:14px">
    <button class="b-pri grow" data-recallgo="${tid}|${eid}">${tx("Προσθήκη επανάκλησης")}</button>
    <button class="grow" data-act="close">${tx("Άκυρο")}</button></div>`);
}
function doRecall(t, spec){
  const [tid, eid] = spec.split("|");
  const tr = (t.days[S.day].terrains||[]).find(x=>x.id===tid); if(!tr) return;
  tr.braces = tr.braces || [];
  let other = (el("rc_with")||{}).value || null;
  /* Δύο δρόμοι στην ίδια θέση: είτε ζητήθηκε ρητά το «δίπλα του», είτε επιλέχθηκε
     σκύλος που ήδη περιμένει μόνος του σε επανάκληση. Και στους δύο γεμίζει η κενή
     θέση — αλλιώς ο ίδιος σκύλος θα βρισκόταν σε δύο ζεύγη ταυτόχρονα. */
  let join = null;
  if(other && other.indexOf("join:") === 0){
    join = tr.braces.find(b => b.id === other.slice(5)) || null; other = null;
  } else if(other){
    join = tr.braces.find(b => b.recall && b.a === other && !b.b
                            && b.status === "ΕΚΚΡΕΜΕΙ") || null;
  }
  if(join){
    join.b = eid; join.solo = false;
    save(); closeDlg(); render();
    toast(tx("Μπήκε δίπλα στον ") + dogName((t.entries.find(x=>x.id===join.a)||{}).dogId));
    return;
  }
  tr.braces.push({id:uid(), no:tr.braces.length+1, a:eid, b:other,
                  solo:!other, recall:true, status:"ΕΚΚΡΕΜΕΙ"});
  save(); closeDlg(); render();
  toast(other ? "Προστέθηκε επανάκληση με δύο σκύλους" : "Προστέθηκε επανάκληση");
}

/* --- manual change to a drawn order (Άρθρο 16) --- */
function dlgSwap(t, spec){
  const [tid, bid, eid] = spec.split("|");
  const day = t.days[S.day];
  const opts = [];
  day.terrains.forEach(tr=>(tr.braces||[]).forEach(b=>[b.a,b.b].forEach(id=>{
    if(!id || id===eid) return;
    const e = t.entries.find(x=>x.id===id); if(!e) return;
    opts.push({id, label:`${dogName(e.dogId)} — ${tr.name}${tx(", ζεύγος")} ${b.no}`});
  })));
  const me = t.entries.find(x=>x.id===eid) || {};

  <p class="muted">${tx("Ο")} <b>${esc(dogName(me.dogId))}</b> ${tx("θα πάρει τη θέση του σκύλου που θα επιλέξετε και εκείνος τη δική του. Και τα δύο ζεύγη σημειώνονται ως χειροκίνητη αλλαγή και η σήμανση τυπώνεται στη λίστα.")}</p>
  ${opts.length ? `<div class="row"><div class="grow"><label>${tx("Ανταλλαγή με")}</label>
    <select id="sw_with">${opts.map(o=>`<option value="${o.id}">${esc(o.label)}</option>`).join("")}</select></div></div>
  <div class="row" style="margin-top:14px">
    <button class="b-pri grow" data-swapwith="${tid}|${bid}|${eid}">${tx("Ανταλλαγή")}</button>
    <button class="grow" data-act="close">${tx("Άκυρο")}</button></div>`
  : `<div class="empty">${tx("Δεν υπάρχει άλλος κληρωμένος σκύλος για ανταλλαγή.")}</div>
     <button class="b-full" data-act="close">${tx("Κλείσιμο")}</button>`}`);
}
function doSwap(t, spec){
  const [,, eid] = spec.split("|");
  const other = (el("sw_with")||{}).value;
  if(!other) return;
  if(!confirmAct(tx("Χειροκίνητη αλλαγή στην κληρωμένη σειρά. Καταγράφεται και τυπώνεται. Συνέχεια;"))) return;
  swapEntries(t, eid, other);
  save(); closeDlg(); render(); toast(tx("Η αλλαγή καταγράφηκε"));
}

/* Printing a set of A4 sheets: fill the hidden container, print, put it back. */
function printSheets(html){
  el("sheets").innerHTML = html;
  document.body.classList.add("sheets-only");
  window.print();
  setTimeout(()=>{ document.body.classList.remove("sheets-only"); el("sheets").innerHTML = ""; }, 500);
}

const ACT = {
  close: ()=>closeDlg(),
  /* the drawn order gets its own sheet rather than a squeezed screen */
  print: (btn, t)=>{
    if(!(t && S.view==="trial" && S.tab==="braces")) return window.print();
    const day = t.days[S.day];
    const terrains = day.terrains.filter(tr=>!S.judgeFilter || tr.judgeIds.includes(S.judgeFilter));
    if(!day.draw || !terrains.length) return window.print();
    printSheets(terrains.map(tr=>drawSheet(t, day, tr)).join(""));
  },
  rotateDraw: (btn, t)=>{
    const day = t.days[S.day], prev = t.days[S.day-1];
    if(!prev || !prev.draw) return toast(tx("Η προηγούμενη ημέρα δεν έχει κληρωθεί"));
    const two = day.terrains.length === 2;
    if(day.draw && !confirmAct(tx("Υπάρχει ήδη κλήρωση για την ημέρα αυτή. Θα ακυρωθεί και θα γίνει νέα με")
      + " " + tx(two ? "αντεστραμμένα" : "περιστραμμένα") + " " + tx("τερέν. Συνέχεια;"))) return;
    const seed = (el("seedIn") && el("seedIn").value.trim()) || drawCode(t);
    const r = runDraw(t, S.day, seed, "ΠΕΡΙΣΤΡΟΦΗ");
    if(r.error){ alert(r.error); return; }
    save(); S.reveal = 0; render(); revealBraces(t);
    if(r.warn && r.warn.length) setTimeout(()=>alert(tx("Προσοχή:\n\n")+r.warn.join("\n")), 400);
  },
  printDraw: (btn, t)=>{
    const day = t.days[S.day];
    if(!day.draw) return toast(tx("Δεν έχει γίνει κλήρωση"));
    printSheets(day.terrains.map(tr=>drawSheet(t, day, tr)).join(""));
  },
  newTrial: ()=>dlgTrial(),
  editTrial: (b,t)=>dlgTrial(t),

  /* the bottom bar of the live terrain */
  /* Reordering shows every ζεύγος: the staged reveal of the draw would otherwise
     hide the rows the head judge is trying to move. */
  nextBrace: (btn, t)=>{
    const live = liveBrace(t);
    if(live) setBraceStatus(live.b, "ΟΛΟΚΛΗΡΩΘΗΚΕ");
    const next = nextPending(t);
    if(next) setBraceStatus(next.b, "ΤΡΕΧΕΙ");
    S.openBrace = null;
    save(); render();
    toast(next ? "Ζεύγος " + next.b.no : "Δεν απομένει άλλο ζεύγος");
    /* Η μπάρα κλείνει το ένα ζεύγος και ξεκινά το επόμενο μαζί, οπότε αυτοί που
       πρέπει να ξεκινήσουν να έρχονται δεν είναι οι δύο που μόλις μπήκαν στο
       τερέν — είναι το πρώτο ζεύγος που μένει ακόμη εκκρεμές. Ο διάλογος έρχεται
       μετά το render, ώστε η μπάρα να έχει ήδη κάνει τη δουλειά της αν κλείσει. */
    if(DB.settings.nextUp !== false){
      const up = nextUpTarget(t);
      if(up && nextUpQueue(t, up.tr, up.b).some(x=>x.phone))
        setTimeout(()=>dlgNextUp(t, up.tr.id, up.b.id), 350);
    }
  },
  /* Το ίδιο, χωρίς να χρειάζεται να κλείσει ζεύγος: το κουμπί της μπάρας. */
  nextUpFab: (btn, t)=>{
    const up = nextUpTarget(t); if(!up) return;
    dlgNextUp(t, up.tr.id, up.b.id);
  },
  extendBrace: (btn, t)=>{
    const live = liveBrace(t); if(!live) return;
    live.b.extra = (live.b.extra || 0) + 300;
    save(); render();
    toast(tx("Η διαδρομή επεκτάθηκε σε ") + clockText(runSecs(t, live.b)));
  },
  pauseBrace: (btn, t)=>{
    const live = liveBrace(t); if(!live) return;
    const b = live.b;
    if(b.startedAt){ b.elapsed = braceElapsed(b); b.startedAt = null; }
    else b.startedAt = Date.now();
    save(); render();
  },

  /* Eliminating a dog is serious, so it is stated plainly and asked twice. */
  confirmElim: (btn, t)=>{
    const faults = (window._note.faults||[]);
    if(!faults.length) return toast(tx("Επιλέξτε πρώτα το σφάλμα του Άρθρου 33"));
    const i = window._noteKey.lastIndexOf("|");
    const entryId = window._noteKey.slice(0,i).split("::")[0];
    const name = dogName((t.entries.find(e=>e.id===entryId)||{}).dogId);
    if(!confirmAct(`${tx("Αποκλεισμός του")} ${name} ${tx("για:")} ${faults.join(", ")}.\n\n`
      + "Η διαδρομή τερματίζεται και η βαθμολογία γίνεται ΑΠΟΚΛΕΙΣΜΟΣ.")) return;
    if(!confirmAct(tx("Η ενέργεια καταγράφεται στο φύλλο του κριτή. Επιβεβαίωση αποκλεισμού;"))) return;
    t.results[entryId] = Object.assign({qual:"-",award:"-"}, t.results[entryId], {qual:"ΑΠΟΚΛΕΙΣΜΟΣ"});
    autosaveNote(); save(); closeDlg(); render();
    toast(tx("Ο σκύλος αποκλείστηκε"));
  },

  /* No dictation API on iOS Safari — the keyboard's own microphone is the one
     that works everywhere, so say that instead of failing silently. */
  dictate: ()=>{
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const ta = el("n_text"); if(!ta) return;
    if(!SR){ ta.focus(); toast(tx("Χρησιμοποιήστε το μικρόφωνο του πληκτρολογίου")); return; }
    const r = new SR();
    r.lang = "el-GR"; r.interimResults = false; r.continuous = true;
    r.onresult = ev=>{
      let s = "";
      for(let i=ev.resultIndex;i<ev.results.length;i++) s += ev.results[i][0].transcript;
      ta.value = (ta.value ? ta.value.replace(/\s*$/,"") + " " : "") + s.trim();
      autosaveNote();
    };
    r.onerror = ()=>toast(tx("Η υπαγόρευση δεν ξεκίνησε. Χρησιμοποιήστε το μικρόφωνο του πληκτρολογίου."));
    try{ r.start(); toast(tx("Ακούω…")); }catch(e){ ta.focus(); }
  },
  newDog: ()=>dlgDog(),
  newHandler: ()=>dlgHandler(),
  newJudge: ()=>dlgJudge(),
  addTerrain: (e,t)=>dlgTerrain(t),
  /* An empty registry used to be a dead end with a toast pointing elsewhere.
     Now it opens the dog form, and saving comes straight back here. */
  /* The whole field at once — the usual job at the entry table. */
  addEntry: (e,t)=>{
    if(!DB.people.length){ window._afterHandler = "batch"; return dlgHandler(); }
    if(!DB.dogs.length){ window._afterDog = "field"; return dlgDog(); }
    dlgField(t);
  },
  /* One man at a time — the one who turns up late, or changes his mind. */
  addOneHandler: (e,t)=>{
    if(!DB.people.length){ window._afterHandler = "batch"; return dlgHandler(); }
    dlgHandlerEntries(t);
  },
  /* the batch screen: one κυναγωγός, his dogs ticked */
  newHandlerForBatch: ()=>{ window._afterHandler = "batch"; dlgHandler(); },
  newDogForBatch: ()=>{
    const hid = (el("b_handler")||{}).value || "";
    window._batchH = hid;
    window._afterDog = "batch";
    dlgDog(hid ? { ownerId: hid } : null);
  },
  /* One diff over the whole field: what was ticked becomes an entry, what was
     un-ticked stops being one. A dog that is drawn or scored was locked in the
     list, so he cannot be lost here. */
  saveField: (btn,t)=>{
    const F = window._field; if(!F) return;
    const drawn = new Set();
    t.days.forEach(day=>(day.terrains||[]).forEach(tr=>(tr.braces||[]).forEach(b=>{
      if(b.a) drawn.add(b.a); if(b.b) drawn.add(b.b); })));
    let added = 0, removed = 0;
    DB.dogs.filter(d=>!d.guest).forEach(d=>{
      const en = t.entries.find(x=>x.dogId === d.id);
      if(F.has(d.id)){
        if(!en){ t.entries.push({id:uid(), dogId:d.id, handlerId:d.ownerId||"",
                                 status:"ΔΗΛΩΜΕΝΟΣ", paid:false, season:false}); added++; }
        else if(en.status !== "ΔΗΛΩΜΕΝΟΣ"){ en.status = "ΔΗΛΩΜΕΝΟΣ"; added++; }
      } else if(en){
        const r = t.results[en.id];
        if(drawn.has(en.id) || (r && r.qual && r.qual !== "-")) return;   /* locked */
        t.entries = t.entries.filter(x=>x.id !== en.id);
        delete t.results[en.id]; delete t.sms[en.id];
        removed++;
      }
    });
    save(); closeDlg(); render();
    if(added || removed)
      toast((added?added + (added===1?" συμμετοχή":" συμμετοχές"):"")
        + (added && removed ? " · " : "")
        + (removed?removed + (removed===1?" αφαιρέθηκε":" αφαιρέθηκαν"):""));
  },
  saveBatch: (btn,t)=>{
    const hid = (el("b_handler")||{}).value || "";
    if(!hid) return toast(tx("Επιλέξτε πρώτα κυναγωγό"));
    const wanted = new Set([...document.querySelectorAll("[data-btick].on")]
      .map(b=>b.dataset.btick));
    const { own } = dogsForHandler(hid);
    let added = 0, removed = 0;
    own.forEach(d=>{
      const en = t.entries.find(x=>x.dogId === d.id);
      if(wanted.has(d.id)){

      }

    if(added || removed)
      toast((added?added + (added===1?" συμμετοχή":" συμμετοχές"):"")

    const base = {
      title: el("t_title").value.trim() || "Αγώνας",

      format: el("t_type").value==="Μεγάλης Έρευνας" ? "ΖΕΥΓΗ" : el("t_format").value,

      dateStart: el("t_d1").value,
      time: el("t_time").value,
      runMins: Math.max(1, +el("t_run").value || 15)
    };
    if(!t){
      t = {id:uid(), ...base, status:"ΔΗΛΩΣΕΙΣ", entries:[], results:{}, notes:{}, sms:{}, days:[]};
      DB.trials.push(t);
    } else Object.assign(t, base);
    while(t.days.length < nDays){
      const dt = new Date(base.dateStart); dt.setDate(dt.getDate()+t.days.length);

  /* Closing is the record being made, so it is worth a question when the day is
     not actually finished — and it never destroys anything. */
  closeTrial: (btn, t)=>{
    const active = t.entries.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ").length;
    const scored = t.entries.filter(e=>{ const r = t.results[e.id]; return r && r.qual && r.qual!=="-"; }).length;
    const open = [];
    t.days.forEach((day,i)=>(day.terrains||[]).forEach(tr=>{
      if((tr.braces||[]).length && !(t.signoff||{})[tr.id]) open.push(tr.name
        + (t.days.length>1 ? " (ημέρα " + (i+1) + ")" : "")); }));
    let msg = "Ολοκλήρωση του αγώνα «" + t.title + "»;";
    if(scored < active) msg += "\n\n" + (active - scored) + " σκύλοι δεν έχουν βαθμολογία.";
    if(open.length) msg += "\n\nΔεν έχουν υπογραφεί: " + [...new Set(open)].join(", ") + ".";
    msg += "\n\nΟ αγώνας περνά στο ιστορικό. Τίποτα δεν διαγράφεται και μπορεί να επαναφερθεί.";

    /* A dog nobody has registered can still run to fill a brace. He is kept as

    if(!dogId){
      if(!freeDog) return toast(tx("Επιλέξτε σκύλο ή γράψτε όνομα"));

    } else if(!handlerId && freeMan){ handlerId = ensurePerson(freeMan, ""); }

                 paid:false, season:false}; t.entries.push(e); }
    else if(handlerId) e.handlerId = handlerId;

  /* One A4 sheet per dog of the day, identifying fields filled and everything
     the judge writes left blank. */
  printNotes: (btn, t)=>{
    const day = t.days[S.day];
    const sheets = [];
    (day.terrains||[]).forEach(tr=>(tr.braces||[]).forEach(b=>[b.a,b.b].forEach(id=>{
      const e = t.entries.find(x=>x.id===id); if(!e) return;
      if(b.trailer && b.b === e.id) return;             /* not judged, no sheet */
      const d = dogById(e.dogId) || {};
      const written = t.notes[e.id + "::" + b.id] || {};
      /* one sheet per judge who wrote something, so the file holds each opinion
         separately; a run nobody scored yet gets one blank sheet to write on */
      const jids = (tr.judgeIds||[]).filter(j=>written[j] && Object.keys(written[j]).length > 2);
      if(jids.length)
        jids.forEach(j=>sheets.push(noteSheet(t, day, tr, b, e, d, written[j],
          (judById(j)||{}).name)));
      else
        sheets.push(noteSheet(t, day, tr, b, e, d, null,
          (judById(tr.headJudgeId)||{}).name || ""));
    })));
    if(!sheets.length) return toast(tx("Κάντε πρώτα την κλήρωση"));
    printSheets(sheets.join(""));
  },

  /* Ρωτά τον service worker αν υπάρχει νεότερη έκδοση. Το «updatefound» είναι το
     σήμα που δεν λέει ψέματα: πυροδοτείται μόλις αρχίσει να εγκαθίσταται νέος. */
  checkUpdate: async ()=>{
    if(!navigator.serviceWorker || !location.protocol.startsWith("http"))
      return alert(tx("Η εφαρμογή δεν άνοιξε από διεύθυνση, οπότε δεν υπάρχει ενημέρωση να ελεγχθεί."));
    const reg = await navigator.serviceWorker.getRegistration();
    if(!reg) return alert(tx("Δεν υπάρχει εγκατεστημένος service worker σε αυτή τη συσκευή."));
    let found = !!(reg.waiting || reg.installing);
    reg.addEventListener("updatefound", ()=>{ found = true; });
    try{ await reg.update(); }catch(e){}
    await new Promise(r=>setTimeout(r, 1500));
    await probeBuild();
    if(found || reg.waiting){
      if(confirm(tx("Υπάρχει νέα έκδοση. Επαναφόρτωση τώρα;"))) return location.reload();
      render(); return;
    }
    alert(tx("Έχετε την τελευταία έκδοση: ") + (BUILD || "—"));
    render();
  },

  /* Selection. Everyone is picked to begin with, because the usual job is
     "send it to the lot". */
  smsAll: (b2,t)=>{ S.smsPick = new Set(smsQueue(t).map(x=>x.key)); render(); },
  smsNone: ()=>{ S.smsPick = new Set(); render(); },
  smsHandlers: (b2,t)=>{ S.smsPick = new Set(smsQueue(t).filter(x=>x.kind==="handler").map(x=>x.key)); render(); },
  smsJudgesOnly: (b2,t)=>{ S.smsPick = new Set(smsQueue(t).filter(x=>x.kind==="judge").map(x=>x.key)); render(); },
  /* The phone sends one message at a time — there is no bulk send to hand it.
     So this opens the next one that is picked, unsent and has a number, marks
     it, and the button comes back saying how many are left. */
  /* One common message to everyone picked. Viber takes the whole room in one
     go; SMS can on Android; WhatsApp cannot, so it steps through instead of
     claiming to have sent something it did not. */
  smsBlast: (b2,t)=>{
    const sel = S.smsPick instanceof Set ? S.smsPick : new Set();
    const picked = smsQueue(t).filter(x=>sel.has(x.key) && x.phone);
    if(!picked.length) return toast(tx("Κανένας επιλεγμένος με τηλέφωνο"));
    const ch = channel(), body = commonBody(t);
    try{ navigator.clipboard.writeText(body); }catch(e){}
    if(ch.id === "viber"){
      location.href = "viber://forward?text=" + encodeURIComponent(body);
    } else if(ch.id === "sms"){
      location.href = "sms:" + picked.map(x=>x.phone).join(",") + "?&body=" + encodeURIComponent(body);
    } else {
      return alert(tx("Το WhatsApp δέχεται έναν αριθμό τη φορά.\n\n")
        + tx("Το κοινό μήνυμα αντιγράφηκε — επικολλήστε το σε ομάδα, ή στείλτε έναν-έναν."));
    }
    if(!confirmAct(picked.length + " " + tx("μηνύματα θα σημανθούν ως εσταλμένα, χωρίς να σταλούν. Συνέχεια;"))) return;
    picked.forEach(x=>{ t.sms[x.key] = "ΕΣΤΑΛΗ"; });
    save(); setTimeout(render, 600);
  },
  smsNext: (b2,t)=>{
    const sel = S.smsPick instanceof Set ? S.smsPick : new Set();
    const next = smsQueue(t).find(x=>sel.has(x.key) && x.phone && t.sms[x.key]!=="ΕΣΤΑΛΗ");
    if(!next) return toast(tx("Δεν έμεινε κανένας σε αναμονή"));
    sendOne(t, next);
  },
  smsCopyAll: (b2,t)=>{
    const sel = S.smsPick instanceof Set ? S.smsPick : new Set();
    const picked = smsQueue(t).filter(x=>sel.has(x.key));
    if(!picked.length) return;
    const text = picked.map(x=>"— " + x.name + (x.phone?" ("+x.phone+")":"") + " —\n" + x.body).join("\n\n\n");
    navigator.clipboard.writeText(text)
      .then(()=>toast(picked.length + " μηνύματα αντιγράφηκαν"))
      .catch(()=>toast(tx("Η αντιγραφή δεν επιτράπηκε")));
  },
  smsMarkAll: (b2,t)=>{
    const sel = S.smsPick instanceof Set ? S.smsPick : new Set();
    const picked = smsQueue(t).filter(x=>sel.has(x.key));
    if(!picked.length) return;
    if(!confirmAct(picked.length + " μηνύματα θα σημανθούν ως εσταλμένα, χωρίς να σταλούν. Συνέχεια;")) return;
    picked.forEach(x=>{ t.sms[x.key] = "ΕΣΤΑΛΗ"; });
    save(); render();
  },

  saveSms: ()=>{
    const asDefault = (v, def) => v.trim() === tx(def).trim() ? def : v;
    DB.settings.sms  = asDefault(fieldsIn(el("smsTpl").value), DEFAULT_SMS);
    DB.settings.smsFoot = asDefault(el("smsFoot").value, DEFAULT_SMS_FOOT);
    save(); toast(tx("Αποθηκεύτηκε")); },
  savePoints: ()=>{ document.querySelectorAll("[data-pt]").forEach(i=>{
      if(i.dataset.pt && i.type==="number") DB.settings.points[i.dataset.pt] = +i.value||0; });
    save(); toast(tx("Ο πίνακας βαθμών αποθηκεύτηκε")); },
  resetPoints: ()=>{ DB.settings.points = {...DEFAULT_POINTS}; save(); render(); toast(tx("Επαναφορά κανονισμού")); },

  backup: ()=>download(`KOAD_${today()}.json`,"application/json",JSON.stringify(DB,null,1)),
  backupReg: ()=>download(`KOAD_mitroo_${today()}.json`,"application/json",
    JSON.stringify({v:1, people:DB.people, judges:DB.judges, dogs:DB.dogs, trials:[], settings:DB.settings},null,1)),
  restore: ()=>{
    /* No accept filter. A .json that arrived through WhatsApp or Viber often
       carries no type iOS recognises, and the picker greys it out — better to
       let anything be chosen and say clearly when it is the wrong file. */
    const i = document.createElement("input"); i.type = "file";
    i.onchange = () => { const f = i.files[0]; if(f) readBackup(f); };
    i.click();
  },
  /* The same thing from text, for the phone that will not hand the file over:
     open it in the messaging app, select all, copy, paste here. */
  restorePaste: ()=>{
    dlg(`<h2>${tx("Επικόλληση αντιγράφου")}</h2>
    <p class="muted">${tx("Αν το τηλέφωνο δεν σας αφήνει να διαλέξετε το αρχείο, ανοίξτε το στην εφαρμογή μηνυμάτων, αντιγράψτε όλο το κείμενο και επικολλήστε το εδώ.")}</p>
    <div class="row" style="margin-top:12px"><div class="grow"><label>${tx("Περιεχόμενο αρχείου")}</label>
      <textarea id="pasteIn" style="min-height:160px;font:400 13px/1.4 var(--f-m)"
        placeholder='{"v":1,"people":[…'></textarea></div></div>
    <div class="row" style="margin-top:12px">
      <button class="b-pri grow" data-act="doPaste">${tx("Φόρτωση")}</button>
      <button class="grow" data-act="close">${tx("Άκυρο")}</button></div>`);
  },
  doPaste: ()=>{
    const txt = (el("pasteIn")||{}).value || "";
    if(!txt.trim()) return toast(tx("Επικολλήστε πρώτα το περιεχόμενο"));

    loadBackup(txt);
  },
  wipe: ()=>{ if(!confirmAct(tx("Διαγραφή ΟΛΩΝ των δεδομένων; Δεν αναιρείται."))) return;
    DB = blank(); save(); S={view:"trials",tab:"entries",day:0,judgeFilter:""}; render(); },
  importEntries: null   // replaced by the Excel/Word importer below

/* ---------- 16. CSV import ---------------------------------------------- */
function parseCsv(text){
  return text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(l=>l.trim())
    .map(l => l.split(/[;,\t]/).map(c=>c.trim().replace(/^"|"$/g,"")));
}
function ensurePerson(name, phone, country){
  if(!name) return "";
  let p = DB.people.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!p){ p = {id:uid(), name, phone:phone||"", country:country||HOME_COUNTRY, member:""};
          DB.people.push(p); }
  else { if(phone && !p.phone) p.phone = phone;
         if(country && !p.country) p.country = country; }
  return p.id;
}
/* Merge an incoming backup into the local one: for anything with the same id the
   file wins; anything the file does not mention is left alone. This is what makes
   laptop -> phone -> laptop round trips safe. */
/* A club list often carries the judges in the same sheet, or in one of their own.
   Matched by name, like people are; an existing judge only gains a phone. */
function ensureJudge(name, phone){
  if(!name) return "";
  let j = DB.judges.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!j){ j = {id:uid(), name, phone:phone||"", licence:"ΕΠΙΣΗΜΟΣ", me:false, personId:""};
          DB.judges.push(j); return j.id; }
  if(phone && !j.phone) j.phone = phone;
  return j.id;
}
/* One route in, whether the backup arrived as a file, a drop or a paste. */
function readBackup(file){
  const r = new FileReader();
  r.onload = () => loadBackup(r.result);
  r.onerror = () => alert(tx("Το αρχείο δεν διαβάστηκε."));
  r.readAsText(file);
}
function loadBackup(text){
  let inc;
  try{ inc = JSON.parse(text); }
  catch(e){ return alert(tx("Το αρχείο δεν είναι αντίγραφο της εφαρμογής.\n\n")
    + "Περιμένει ένα αρχείο .json από «Λήψη πλήρους αντιγράφου» ή «Αποστολή αγώνα»."); }
  if(!inc || !Array.isArray(inc.dogs))
    return alert(tx("Το αρχείο δεν είναι αντίγραφο της εφαρμογής."));
  const counts = `${(inc.dogs||[]).length} ${tx("σκύλοι,")} ${(inc.people||[]).length} ${tx("κυναγωγοί,")} `
               + `${(inc.judges||[]).length} ${tx("κριτές,")} ${(inc.trials||[]).length} ${tx("αγώνες")}`;
  const merge = window.confirm(tx("Το αρχείο περιέχει: ") + counts + "\n\n"
    + "ΟΚ = Συγχώνευση (κρατά τα υπάρχοντα, προσθέτει και ενημερώνει)\n"
    + "Άκυρο = Αντικατάσταση όλων (σβήνει ό,τι υπάρχει στη συσκευή)");
  if(!merge && !window.confirm(tx("Σίγουρα αντικατάσταση; Ό,τι υπάρχει σε αυτή τη συσκευή θα χαθεί."))) return;
  if(merge) mergeDB(inc); else DB = inc;
  DB.settings = Object.assign({}, DEFAULT_SETTINGS, DB.settings||{});
  migrate(); save(); S = {view:"trials", tab:"entries", day:0, judgeFilter:""};
  render(); toast(merge ? "Τα δεδομένα συγχωνεύτηκαν" : "Τα δεδομένα αντικαταστάθηκαν");
}
/* Dropping the file on the window works too, which is what a laptop invites. */
addEventListener("dragover", e=>{ e.preventDefault(); document.body.classList.add("dropping"); });
addEventListener("dragleave", e=>{ if(e.relatedTarget) return; document.body.classList.remove("dropping"); });
addEventListener("drop", e=>{
  e.preventDefault(); document.body.classList.remove("dropping");
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(f) readBackup(f);
});

function mergeDB(inc){
  ["people","judges","dogs","trials"].forEach(k=>{
    DB[k] = DB[k] || [];
    (inc[k]||[]).forEach(item=>{
      const i = DB[k].findIndex(x=>x.id===item.id);
      if(i>=0) DB[k][i] = item; else DB[k].push(item);
    });
  });
}
/* data saved before braces had ids — the per-run notes are keyed on them */
function migrate(){
  /* the old settings held one template with {ΣΚΥΛΟΣ}/{ΤΕΡΕΝ}/{ΖΕΥΓΟΣ}; the message
     is now assembled from a header and a footer */
  if(DB.settings && /\{ΣΚΥΛΟΣ\}|\{ΖΕΥΓΟΣ\}/.test(DB.settings.sms||"")){
    DB.settings.sms = DEFAULT_SMS; DB.settings.smsFoot = DEFAULT_SMS_FOOT;
  }
  /* the register follows the F.C.I. nomenclature now — rename, never drop */
  (DB.dogs||[]).forEach(d=>{ if(BREED_RENAMED[d.breed]) d.breed = BREED_RENAMED[d.breed]; });
  /* Χώρα. Everyone on file until now was entered by a Cypriot club for a Cypriot
     trial, so Κύπρος is the only defensible default for a person; the phone codes
     that were already working keep working. A σκύλος had a yes/no «κυπριακής
     εκτροφής» instead, which is the same fact with one bit of resolution: yes
     becomes CY, no becomes blank, because "not Cyprus" does not say where. */
  (DB.people||[]).forEach(p=>{ if(!p.country) p.country = HOME_COUNTRY; });
  (DB.judges||[]).forEach(j=>{ if(!j.country) j.country = HOME_COUNTRY; });
  (DB.dogs||[]).forEach(d=>{
    if(d.country === undefined) d.country = d.cy === false ? "" : HOME_COUNTRY;
    delete d.cy;
  });
  (DB.trials||[]).forEach(t=>{
    t.notes = t.notes || {}; t.results = t.results || {}; t.sms = t.sms || {};
    (t.days||[]).forEach(d=>(d.terrains||[]).forEach(tr=>(tr.braces||[]).forEach(b=>{
      if(!b.id) b.id = uid();
    })));
  });
}
