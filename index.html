  "Ζεύγος / θέση": "Pareja / puesto",
  "Η F.C.I. ορίζει τουλάχιστον δεκαπέντε λεπτά για την πρώτη διαδρομή (ACO II.5).": "La F.C.I. fija al menos quince minutos para el primer turno (ACO II.5).",
  "Η «Αποστολή στο κινητό» στέλνει τον αγώνα μαζί με τα κληρωμένα ζεύγη — φορτώστε τον στο κινητό (Ρυθμίσεις → Φόρτωση αρχείου → Συγχώνευση) και συνεχίστε από εκεί στο τερέν. Τα SMS φεύγουν από όποια συσκευή κρατά τη σειρά.": "«Enviar al teléfono» envía la prueba junto con las parejas sorteadas — cárguela en el teléfono (Ajustes → Cargar archivo → Fusionar) y siga desde ahí en el campo. Los SMS salen desde el dispositivo que tenga el orden de salida.",
  "Η Μεγάλη Έρευνα γίνεται πάντα σε ζεύγη (Άρ. 4). Για CACIT χρειάζονται 3 κριτές ανά τερέν (Άρ. 48).": "La Gran Busca se corre siempre en parejas (Art. 4). Para el CACIT hacen falta 3 jueces por terreno (Art. 48).",
  "Η άρνηση αποκλείει και στα τέσσερα: ACO II.13 «Refusal to execute a commanded approach leads to elimination»· ENCI art. 11 §16 «Rifiuto di guidare».": "El rechazo elimina en los cuatro: ACO II.13 «Refusal to execute a commanded approach leads to elimination»; ENCI art. 11 §16 «Rifiuto di guidare».",
  "Η άρνηση αποκλείει: GQ art. 8 «A refusal to back is an eliminating fault»· SCC art. 3 «Le refus de patron … est éliminatoire»· ENCI art. 11 §8.": "El rechazo elimina: GQ art. 8 «A refusal to back is an eliminating fault»; SCC art. 3 «Le refus de patron … est éliminatoire»; ENCI art. 11 §8.",
  "Η αγγλική στήλη δεν έχει πηγή στα κείμενα που έχουμε — η S.C.C. art. 3 το λέει εξίσου αποκλειστικό με την άρνηση συναίνεσης, αλλά στα γαλλικά.": "La columna inglesa no tiene fuente en los textos que tenemos — la S.C.C. art. 3 lo considera tan eliminatorio como el rechazo del respeto, pero en francés.",
  "Η αλλαγή καταγράφηκε": "El cambio queda registrado",
  "Η ανατομία του πόντου": "La anatomía del punto",
  "Η αντιγραφή δεν επιτράπηκε": "No se permitió copiar",
  "Η γλώσσα αλλάζει μόνο ό,τι βλέπετε. Στη βάση όλα μένουν ελληνικά — η κατάσταση, η βαθμολογία, η μορφή του αγώνα — ώστε ένα αντίγραφο από αγγλικό κινητό να συγχωνεύεται κανονικά σε ελληνικό υπολογιστή και ο πίνακας πόντων να βρίσκει το κλειδί του.": "La lengua cambia lo que usted ve y nada más. En la base todo queda en griego — el estado, la calificación, el formato de la prueba — para que una copia hecha en un teléfono inglés se fusione en un ordenador griego y la tabla de puntos siga encontrando su clave.",
  "Η γραμμή επικεφαλίδων εντοπίστηκε αυτόματα. Ελέγξτε κάθε στήλη πριν την εισαγωγή· είναι η μόνη ευκαιρία να πιαστεί λάθος στήλη.": "La fila de encabezados se ha detectado automáticamente. Compruebe cada columna antes de importar; es la única ocasión de descubrir una columna equivocada.",
  "Η διαδρομή": "El turno",
  "Η διαδρομή επεκτάθηκε σε ": "El turno se prolongó a ",
  "Η ενέργεια καταγράφεται στο φύλλο του κριτή. Επιβεβαίωση αποκλεισμού;": "La acción queda registrada en la hoja del juez. ¿Confirma la eliminación?",
  "Η εφαρμογή άνοιξε από αρχείο, όχι από διεύθυνση.": "La aplicación se abrió desde un archivo, no desde una dirección.",
  "Η εφαρμογή δεν άνοιξε από διεύθυνση, οπότε δεν υπάρχει ενημέρωση να ελεγχθεί.": "La aplicación no se abrió desde una dirección, así que no hay actualización que comprobar.",
  "Η εφαρμογή δεν κατεβαίνει από κατάστημα. Ανοίγει σε μια διεύθυνση και προστίθεται στην αρχική οθόνη. Μετά την πρώτη φορά δουλεύει χωρίς σήμα, που είναι και το ζητούμενο στο τερέν.": "La aplicación no se descarga de una tienda. Se abre en una dirección y se añade a la pantalla de inicio. Después de la primera vez funciona sin señal, que es de lo que se trata en el campo.",
  "Η εφαρμογή είναι λίγα αρχεία —": "La aplicación son unos pocos archivos —",
  "Η εφαρμογή είναι μία σελίδα και λειτουργεί χωρίς σύνδεση. Τα δεδομένα μένουν σε αυτή τη συσκευή και δεν συγχρονίζονται μόνα τους. Δύο κριτές σε δύο κινητά δεν βλέπουν ο ένας τις αλλαγές του άλλου· ανταλλάσσουν αρχείο. Κατάσταση αποθήκευσης:": "La aplicación es una sola página y funciona sin conexión. Los datos quedan en este dispositivo y no se sincronizan solos. Dos jueces en dos teléfonos no ven los cambios del otro; intercambian un archivo. Estado del almacenamiento:",
  "Η εφαρμογή και ο κώδικάς της ανήκουν στον όμιλο. Τα σήματα, τα δεδομένα των αγώνων και το μητρώο είναι δικά του.": "La aplicación y su código pertenecen al club. Las marcas, los datos de las pruebas y el registro son suyos.",
  "Η εφαρμογή τρέχει από την κρυφή μνήμη της συσκευής, ώστε να δουλεύει χωρίς σήμα. Αυτό σημαίνει ότι μια διόρθωση φτάνει σε εσάς την επόμενη φορά που θα την ανοίξετε με σύνδεση.": "La aplicación se ejecuta desde la memoria caché del dispositivo, para que funcione sin señal. Eso significa que una corrección le llega la próxima vez que la abra con conexión.",
  "Η ημέρα": "El día",
  "Η κατανομή επιστρέφει στην κλήρωση": "El reparto vuelve al sorteo",
  "Η κλήρωση έγινε": "El sorteo se ha hecho",
  "Η κλήρωση δεν μπορεί να γίνει ακόμη.": "El sorteo todavía no se puede hacer.",
  "Η κλήρωση ολοκληρώθηκε": "El sorteo está completo",
  "Η ορολογία των κριτών γυρίζει σε πέντε γλώσσες, από τους ίδιους τους κανονισμούς. Τα ισπανικά είναι η εξαίρεση: κανένας ισπανικός κανονισμός δεν βρίσκεται στο αποθετήριο, οπότε εκεί και οι όροι είναι επαγγελματική, μη επίσημη μετάφραση — όπως όλη η υπόλοιπη οθόνη σε κάθε γλώσσα. Στη βάση όλα μένουν ελληνικά.": "La terminología de los jueces gira en cinco lenguas, tomada de los propios reglamentos. El español es la excepción: en el repositorio no hay ningún reglamento español, así que aquí también los términos son traducción profesional, no oficial — como lo es el resto de la pantalla en cualquier lengua. En la base todo queda en griego.",
  "Η ορολογία των κριτών — φέρμα, ποντάρισμα, συναίνεση, τα σφάλματα του Άρθρου 33, οι βαθμολογίες — μπήκε από τους ίδιους τους κανονισμούς και σε πέντε γλώσσες. Κανένας όρος δεν μεταφράστηκε· δείτε τους με την πηγή τους στο Γλωσσάρι. Η υπόλοιπη οθόνη είναι επαγγελματική, μη επίσημη μετάφραση, γιατί γι' αυτήν δεν υπάρχει κανονισμός να την ορίσει. Οι φυλές είναι της F.C.I. και της ENCI, οι χώρες του CLDR. Τα ισπανικά στέκουν αλλιώς: κανένας ισπανικός κανονισμός δεν βρίσκεται στο αποθετήριο, οπότε το Γλωσσάρι δεν έχει ισπανική στήλη και στην ισπανική οθόνη είναι μετάφραση και οι όροι και οι φυλές.": "La terminología de los jueces — muestra, guiada a la orden, respeto, los fallos del Artículo 33, las calificaciones — se tomó de los propios reglamentos, en cinco lenguas. Ningún término se tradujo; véalos con su fuente en el Glosario. El resto de la pantalla es traducción profesional, no oficial, porque para ella no hay reglamento que la fije. Las razas son de la F.C.I. y de la ENCI, los países del CLDR. El español está en otra situación: en el repositorio no hay ningún reglamento español, así que el Glosario no tiene columna española y en la pantalla española tanto los términos como las razas son traducción.",
  "Η προηγούμενη ημέρα δεν έχει κληρωθεί": "El día anterior no se ha sorteado",
  "Η σειρά είναι ενδεικτική (Άρθρο 16).": "El orden es orientativo (Artículo 16).",
  "Η σειρά είναι ενδεικτική (Άρθρο 16). Να είστε στη διάθεση των κριτών.": "El orden de salida es orientativo (Artículo 16). Manténgase a disposición de los jueces.",
  "Η σειρά είναι ενδεικτική — Άρθρο 16.": "El orden es orientativo — Artículo 16.",
  "Η σειρά είναι ενδεικτική — Άρθρο 16. Το μήνυμα ανοίγει στην εφαρμογή μηνυμάτων του τηλεφώνου· η αποστολή γίνεται από εκεί.": "El orden es orientativo — Artículo 16. El mensaje se abre en la aplicación de mensajes del teléfono; el envío se hace desde ahí.",
  "Η συγχώνευση κρατά ό,τι υπάρχει και προσθέτει· η αντικατάσταση σβήνει τη συσκευή. Στο τερέν θέλετε σχεδόν πάντα συγχώνευση.": "Fusionar conserva lo que hay y añade; reemplazar borra el dispositivo. En el campo casi siempre quiere fusionar.",
  "Η τοποθεσία και η ώρα μπαίνουν στο SMS των κυναγωγών και των κριτών.": "El lugar y la hora entran en el SMS de los conductores y de los jueces.",
  "Η τοποθεσία και η ώρα προσέλευσης έρχονται από τον αγώνα (Επεξεργασία αγώνα). Αν δεν τις βάλετε στην επικεφαλίδα, μπαίνουν μόνες τους σε δική τους γραμμή — κανένα μήνυμα δεν φεύγει χωρίς πού και πότε.": "El lugar y la hora de llegada vienen de la prueba (Editar la prueba). Si no los pone en el encabezado, se añaden solos en una línea aparte — ningún mensaje sale sin un dónde y un cuándo.",
  "Η υπαγόρευση δεν ξεκίνησε. Χρησιμοποιήστε το μικρόφωνο του πληκτρολογίου.": "El dictado no se inició. Use el micrófono del teclado.",
  "Η υπογραφή κλειδώνει τη βαθμολογία και τις σημειώσεις του τερέν. Το ξεκλείδωμα γίνεται από τον Πρόεδρο Κριτών με αιτιολογία, που καταγράφεται.": "La firma bloquea la calificación y las notas del terreno. El desbloqueo lo hace el Presidente del Jurado con un motivo, que queda registrado.",
  "Η χώρα εκτροφής είναι εκείνη του εκτροφείου, όχι του κυναγωγού· από αυτήν βγαίνει και το «κυπριακής εκτροφής» στο μητρώο.": "El país de cría es el del criadero, no el del conductor; de él sale el «de cría chipriota» en el registro.",

  "Το Excel περιέχει φύλλο «Παράμετροι» με τον πίνακα πόντων. Όλοι οι πόντοι υπολογίζονται με τύπους VLOOKUP/SUMIFS που δείχνουν εκεί — καμία σταθερή τιμή μέσα σε τύπο, ώστε όποιος ανοίξει το αρχείο να μπορεί να ελέγξει την αριθμητική. Ανοίγει σε Excel και LibreOffice. Η εκτύπωση είναι ασπρόμαυρη, για φωτοτυπία.": "El archivo Excel lleva una hoja «Parámetros» con la tabla de puntos. Todos los puntos se calculan con fórmulas VLOOKUP/SUMIFS que apuntan allí — ningún valor fijo dentro de una fórmula, para que quien abra el archivo pueda comprobar la aritmética. Se abre en Excel y en LibreOffice. La impresión es en blanco y negro, para fotocopiar.",

  "Το γλωσσάρι δεν έχει ισπανική στήλη: κανένας ισπανικός κανονισμός δεν βρίσκεται στο αποθετήριο και τίποτε δεν συμπληρώθηκε με εικασία. Οι ισπανικοί όροι που βλέπετε στην υπόλοιπη εφαρμογή είναι επαγγελματική, μη επίσημη μετάφραση. Στείλτε στη λέσχη το ισπανικό κείμενο της F.C.I. και θα μπει κι αυτό εδώ, με την παραπομπή του.": "El Glosario no tiene columna española: en el repositorio no hay ningún reglamento español y nada se ha rellenado por conjetura. Los términos españoles que ve en el resto de la aplicación son traducción profesional, no oficial. Envíe al club el texto español de la F.C.I. y entrará también aquí, con su cita.",

function tx(s){
  /* Το tx() καλείται και από σταθερές που αρχικοποιούνται πριν υπάρξει η βάση.
     Εκεί δεν υπάρχει γλώσσα να διαβαστεί — και δεν πρέπει να ρίξει την εφαρμογή
     ολόκληρη για μια λέξη. Ελληνικά, και προχωράμε. */
  let L = "el";
  try { L = (DB && DB.settings && DB.settings.lang) || "el"; } catch(e){ return s; }
  if(L === "el") return s;
  /* Δύο πράγματα, με διαφορετική αυθεντία. Η ορολογία των κριτών έρχεται από τους
     ίδιους τους κανονισμούς και υπερισχύει· τα λεκτικά της εφαρμογής — «Νέος
     αγώνας», «Αποθήκευση» — είναι επαγγελματική, μη επίσημη μετάφραση, γιατί
     κανένας κανονισμός δεν τα ορίζει. Όπου λείπει και το δεύτερο, πέφτουμε στα
     αγγλικά· και όπου λείπει κι εκείνο, μένει το ελληνικό. Ποτέ κενό. */
  const d = STR[L];
  if(d && d[s] !== undefined) return d[s];
  const en = STR.en;
  return en && en[s] !== undefined ? en[s] : s;
}
function langNext(){
  const i = LANGS.findIndex(l => l[0] === ((DB.settings||{}).lang || "el"));
  return LANGS[(i + 1) % LANGS.length];
}

/* ---------- 2. Storage --------------------------------------------------- */
/* Safari refuses localStorage on file:// URLs. If the head judge emails himself
   this file and opens it from the Files app on an iPhone, nothing would be saved
   and he would not be told. So probe the store on startup and say so loudly. */
const KEY = "koad_db_v1";
let DB = null, mem = null, storageMode = "memory";

function blank(){ return {v:1, people:[], judges:[], dogs:[], trials:[],
  settings:{...DEFAULT_SETTINGS, points:{...DEFAULT_POINTS}} }; }

/* Ποια έκδοση τρέχει. Το όνομα το λέει η ίδια η κρυφή μνήμη του service worker,
   που είναι και η αλήθεια: η σελίδα σερβίρεται από εκεί. Χωρίς αυτό, «άνοιξέ την
   μια φορά με σύνδεση» είναι οδηγία που δεν μπορεί να επαληθευτεί. */
let BUILD = "";
async function probeBuild(){
  try{
    if(!window.caches) return (BUILD = "");
    const keys = await caches.keys();
    BUILD = keys.filter(k=>/^koad-v/.test(k)).sort().pop() || "";
  }catch(e){ BUILD = ""; }
}

async function probeStorage(){
  try{
    if(window.storage){
      await window.storage.set("__koad_probe","1");
      const r = await window.storage.get("__koad_probe");
      if(r && r.value === "1"){ storageMode = "app"; return; }
    }
  }catch(e){}
  try{
    localStorage.setItem("__koad_probe","1");
    if(localStorage.getItem("__koad_probe") === "1"){
      localStorage.removeItem("__koad_probe"); storageMode = "local"; return;
    }
  }catch(e){}
  storageMode = "memory";
}

async function load(){
  if(storageMode === "app"){
    try{ const r = await window.storage.get(KEY); if(r && r.value) return JSON.parse(r.value); }catch(e){}
  }
  if(storageMode === "local"){
    try{ const s = localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
  }
  return mem || blank();
}
let saveTimer=null;
function save(){
  mem = DB;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ saveTimer = null; writeStore(); }, 250);
}
function writeStore(){
  const s = JSON.stringify(DB);
  if(storageMode === "app"){ try{ window.storage.set(KEY, s); }catch(e){} }
  if(storageMode === "local"){ try{ localStorage.setItem(KEY, s); }catch(e){} }
}
/* The write is debounced so a run of taps does not serialise the database each
   time. That leaves a quarter of a second in which a backgrounded tab — which
   iOS discards without warning — would lose the last thing the judge did, so
   the pending write is flushed the moment the page is hidden or unloaded.
   Synchronous on purpose: a hidden page does not get to await anything. */
function flushStore(){
  if(!saveTimer) return;
  clearTimeout(saveTimer); saveTimer = null;
  writeStore();
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "hidden") flushStore(); });
addEventListener("pagehide", flushStore);   /* pagehide fires at the window */

/* One Greek letter in the filename and Chromium throws the whole name away: the
   file lands as «download», with no extension, and then Excel refuses to open it.
   Every αγώνας has a Greek name, so the name is transliterated before it is
   offered — ΚΑΤΩ ΜΟΝΗ becomes KATO_MONI and the file opens. */
const GR_LAT = {α:"a",β:"v",γ:"g",δ:"d",ε:"e",ζ:"z",η:"i",θ:"th",ι:"i",κ:"k",λ:"l",μ:"m",
  ν:"n",ξ:"x",ο:"o",π:"p",ρ:"r",σ:"s",ς:"s",τ:"t",υ:"y",φ:"f",χ:"ch",ψ:"ps",ω:"o"};
function safeName(name){
  const out = String(name||"").normalize("NFD").replace(/[̀-ͯ]/g,"")
    .split("").map(ch=>{
      const low = ch.toLowerCase(), lat = GR_LAT[low];
      if(lat) return ch === low ? lat : lat.toUpperCase();
      return /[A-Za-z0-9._-]/.test(ch) ? ch : "_";
    }).join("").replace(/_{2,}/g,"_").replace(/^_+/,"");
  return out && out !== "." ? out : "KOAD";
}
function download(name, mime, content){
  /* text gets a charset; a workbook is bytes and must not be labelled as text */
  const binary = content instanceof Uint8Array;
  const b = new Blob([content], {type: binary ? mime : mime + ";charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = safeName(name); a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function phoneClean(p){ return String(p||"").replace(/[^\d+]/g,""); }
