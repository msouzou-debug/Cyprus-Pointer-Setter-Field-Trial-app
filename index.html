<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2B4D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Κ.Ο.Α.Δ.">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="./icon.jpg">
<link rel="icon" href="./icon.jpg">
<link rel="manifest" href="./manifest.webmanifest">
<title>Κ.Ο.Α.Δ. — Διαχείριση Αγώνων</title>
<!-- Commissioner and Source Sans 3 both carry full Greek. They are an
     enhancement, never a dependency. Loaded through media="print" so the
     request never blocks the first paint: on a hillside with one bar of signal
     the app must draw immediately and pick the faces up if they arrive. The
     service worker keeps them after the first visit; with no network at all
     the type falls back to a system stack with Greek coverage and works
     through scale and weight instead. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300;400;600;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* ==========================================================================
   Κ.Ο.Α.Δ. — design tokens.
   Two registers on one set of tokens: field mode is large, high-contrast and
   thumb-driven; desk mode is the same system at a tighter density. Field mode
   sets the floor — nothing below 15px, no tap target under 48px — and the
   laptop inherits from it, never the other way round.
   ========================================================================== */
:root{
  /* colour — taken from the badge and the ground these dogs work */
  --navy:#1E2B4D;      /* header, brand surfaces */
  --navy-d:#141E36;    /* navigation */
  --navy-l:#E6E9F0;    /* navy chip fill */
  --stone:#EFEAE0;     /* page; limestone, and it reads in sunlight */
  --card:#FFFFFF;
  --sand:#F5F1E9;      /* quiet fill inside cards */
  --ink:#171A21;
  --slate:#4C4B46;     /* secondary text — darkened from the canvas's #6B6A64,
                          which was 4.5:1 on --stone. The field screens' breed
                          and handler lines are read in sunlight, so this holds
                          7:1 against every surface it sits on: 7.3 on stone,
                          8.7 on white, 7.8 on sand (brief §7) */
  --slate-2:#9B968C;   /* third-level text */
  --dim:#8F8B82;       /* finished, spent */
  --setter:#8C3A1E;    /* the single accent: what is happening now */
  --stubble:#C8A24A;   /* warnings, οίστρος, pending SMS */
  --stubble-bg:#F3E4BE;
  --stubble-ink:#5E4813;
  --stubble-soft:#FBF4E3;
  --bad:#B3261E;       /* elimination, data loss */
  --bad-bg:#FDF3F2;
  --bad-line:#E0BEBA;
  --ok:#4A7C3F;        /* sent, paid */
  --ok-bg:#EDF3EB;
  --ok-ink:#2F5427;
  --line:#D9D3C7;      /* hairline */
  --line-s:#C9C2B4;    /* card border */
  --line-f:#E4DED2;    /* faintest rule */

  /* type — Greek coverage is mandatory, so every stack ends in a system face
     that has it. With no font files the type still works through scale and
     weight; that is the offline fallback the brief asks for. */
  --f-d:"Commissioner","Noto Sans","Segoe UI",Roboto,system-ui,sans-serif;
  --f-b:"Source Sans 3","Noto Sans","Segoe UI",Roboto,system-ui,sans-serif;
  --f-m:ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;

  /* rhythm 4 · 8 · 12 · 16 · 24 · 32 · 48 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r-chip:2px; --r:6px; --r-pill:999px;
  --tap:48px;          /* cold hands, gloves */
  font-synthesis-weight:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--stone); color:var(--ink);
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  font:400 17px/1.5 var(--f-b);
  padding-bottom:var(--s5);
}
body[data-field]{
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
h1,h2,h3{margin:0 0 .4em;font-family:var(--f-d);letter-spacing:-.01em}
h1{font:600 28px/1.15 var(--f-d)}
h2{font:600 22px/1.2 var(--f-d)}
h3{font:600 19px/1.25 var(--f-d)}
p{margin:0 0 .7em}
a{color:var(--setter)}
a:hover{color:#6E2C15}
.num,.tnum,table,input[type=number]{font-variant-numeric:tabular-nums}

/* an eyebrow: small caps in the accent, the canvas uses it above every title */
.eyebrow{font:600 12px/1 var(--f-b);letter-spacing:.14em;color:var(--setter);
  text-transform:uppercase;margin-bottom:var(--s2)}

/* ---------- header ---------- */
header{background:var(--navy);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) var(--s4) 10px;
  display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:40}
header img{width:40px;height:40px;border-radius:50%;flex:0 0 auto;background:#fff2;object-fit:cover}
.wm{line-height:1.15;min-width:0}
.wm b{display:block;font:800 13px/1.1 var(--f-d);letter-spacing:.14em}
.wm span{display:block;font:400 12px/1.3 var(--f-b);letter-spacing:.04em;color:#ffffffb0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.offline{margin-left:auto;font:600 12px/1 var(--f-b);letter-spacing:.06em;
  border:1px solid #ffffff59;border-radius:var(--r-chip);padding:6px 8px;white-space:nowrap}
.offline.warn{background:var(--bad);border-color:var(--bad);color:#fff}

/* ---------- nav ---------- */
nav{display:flex;overflow-x:auto;background:var(--navy-d);
  position:sticky;top:calc(60px + env(safe-area-inset-top));z-index:39;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:#ffffff8c;font:400 16px/1 var(--f-b);
  padding:14px 16px;min-height:var(--tap);white-space:nowrap;
  border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:#fff;font-weight:600;border-bottom-color:var(--setter)}

main{padding:var(--s4);max-width:1240px;margin:0 auto}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--s4);margin-bottom:var(--s3)}
.card.quiet{background:var(--sand)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.tight{gap:6px}
.grow{flex:1 1 200px;min-width:0}
label{display:block;font:400 15px/1.3 var(--f-b);color:var(--slate);margin:0 0 5px}
input,select,textarea{width:100%;font:400 17px/1.3 var(--f-b);color:var(--ink);background:#fff;
  border:1px solid var(--line-s);border-radius:var(--r);padding:12px;min-height:var(--tap)}
textarea{min-height:92px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus,button:focus-visible,[data-act]:focus-visible{
  outline:3px solid #1E2B4D66;outline-offset:1px}
button,.btn{font:600 17px/1 var(--f-b);border-radius:var(--r);border:1px solid var(--line-s);
  background:#fff;color:var(--ink);padding:14px 16px;min-height:var(--tap);cursor:pointer}
/* an anchor that acts as a button: same chrome, and it centres its own label */
.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
button:active,.btn:active{transform:translateY(1px)}
.b-pri{background:var(--navy);border-color:var(--navy);color:#fff}
.b-act{background:var(--setter);border-color:var(--setter);color:#fff;font-family:var(--f-d);font-weight:800}
.b-sm{min-height:40px;padding:9px 12px;font-size:15px}
.b-warn{color:var(--bad);border-color:var(--bad-line);background:var(--bad-bg)}
.b-full{width:100%}
.muted{color:var(--slate);font-size:15px}
.tiny{color:var(--slate);font-size:15px;line-height:1.45}
code{font:400 15px/1.4 var(--f-m)}

/* chips: 2px corners, quiet by default. One accent only — .chip.a is the
   running brace and the primary action, and nothing else. */
.chip{display:inline-block;font:600 13px/1 var(--f-b);letter-spacing:.06em;
  padding:6px 8px;border-radius:var(--r-chip);background:var(--line-f);color:var(--slate)}
.chip.g{background:var(--ok-bg);color:var(--ok-ink);border:1px solid var(--ok)}
.chip.r{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line)}
.chip.y{background:var(--stubble-bg);color:var(--stubble-ink);border:1px solid var(--stubble)}
.chip.n{background:var(--navy-l);color:var(--navy)}
.chip.o{background:transparent;color:var(--navy);border:1px solid var(--navy)}
.chip.a{background:var(--setter);color:#fff}
.chip.dash{background:transparent;color:var(--navy);border:1px dashed var(--navy)}

table{width:100%;border-collapse:collapse;font-size:16px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line-f)}
td.num{white-space:nowrap}
th{font:600 13px/1 var(--f-b);letter-spacing:.06em;color:var(--slate);text-transform:uppercase;
  background:var(--sand);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
tbody tr:last-child td{border-bottom:0}
.scroll{overflow:auto;max-height:70vh;-webkit-overflow-scrolling:touch}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--s3)}
/* a κυναγωγός with one dog should not be as tall as one with four */
.split.top{align-items:start}
/* the register carries a longer line per dog than the entry list does */
.split.wide{grid-template-columns:repeat(auto-fit,minmax(348px,1fr))}

/* notices: an error states the fact and the fix, so it needs room to say both */
.note{background:var(--stubble-soft);border:1px solid var(--stubble);border-radius:var(--r);
  padding:12px 14px;font-size:16px;line-height:1.5;color:var(--stubble-ink);margin-bottom:var(--s3)}
.err{background:var(--bad-bg);border:1px solid var(--bad-line);border-radius:var(--r);
  padding:12px 14px;font-size:16px;line-height:1.5;color:var(--ink);margin-bottom:var(--s3)}
.err b{color:var(--bad)}
.empty{padding:var(--s6) var(--s4);color:var(--slate);font-size:17px;line-height:1.55;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:var(--s3)}
.empty h2{color:var(--ink);margin-bottom:6px}
hr{border:0;border-top:1px solid var(--line);margin:var(--s4) 0}

/* the storage bar. It cannot be dismissed and it does not scroll away —
   losing a day of results is worse than an ugly bar. */
#warn:not(:empty){position:sticky;top:calc(112px + env(safe-area-inset-top));z-index:38}
.nostore{background:var(--bad);color:#fff;padding:12px var(--s4);
  display:flex;gap:10px;align-items:flex-start;font:400 16px/1.45 var(--f-b)}
.nostore b{font-weight:600}
.nostore .bang{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #fff;
  font:700 14px/18px var(--f-b);text-align:center}

/* ---------- the brace card (signature) ----------
   Two dogs side by side, split down the middle, the number very large across
   the top. Left half is the dog drawn first — right of the jury — and the card
   says so, because handlers argue about it. */
.brace{background:var(--card);border:1px solid var(--line-s);border-radius:var(--r);
  margin-bottom:var(--s3);overflow:hidden}
.bhead{display:flex;align-items:center;gap:10px;padding:12px var(--s4) 8px;flex-wrap:wrap}
.bno{font:800 48px/1 var(--f-d);letter-spacing:-.03em;color:var(--ink);
  font-variant-numeric:tabular-nums;flex:none}
.bstate{font:600 13px/1 var(--f-b);letter-spacing:.1em;color:var(--slate);margin-left:auto}
.bhead .b-sm{margin-left:auto}
.bhead .chip + .b-sm{margin-left:0}
.bbody{display:grid;grid-template-columns:1fr 1px 1fr}
.vline{background:var(--line-s)}
.dog{padding:14px var(--s3) 16px;min-width:0}
/* "ΑΡΙΣΤΕΡΑ ΤΗΣ ΕΠΙΤΡΟΠΗΣ" has to survive half of a 402px phone without
   wrapping or spilling, so it is tracked tight and clipped rather than folded */
.dog .pos{font:600 10.5px/1.3 var(--f-b);letter-spacing:.06em;color:var(--slate);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dog.a .pos{color:var(--setter)}
.dog .nm{font:600 24px/1.15 var(--f-d);color:var(--ink);margin:8px 0 0;overflow-wrap:anywhere}
.dog .mt{font:400 15px/1.4 var(--f-b);color:var(--slate);margin-top:4px}
.bfoot{border-top:1px solid var(--line-f);padding:10px var(--s4);
  font:400 15px/1.4 var(--f-b);color:var(--slate)}

/* running — filled setter, unmistakable from arm's length */
.brace.run{background:var(--setter);border-color:var(--setter)}
.brace.run .bno,.brace.run .bstate,.brace.run .dog .nm{color:#fff}
.brace.run .dog .pos{color:#ffffffbf}
.brace.run .dog .mt{color:#ffffffd1}
.brace.run .bbody,.brace.run .bfoot{border-top-color:#ffffff47}
.brace.run .vline{background:#ffffff59}
.brace.run .b-sm{background:#fff;border-color:#fff;color:var(--setter)}
.brace.run .chip{background:#ffffff2e;color:#fff}
.live{display:inline-flex;align-items:center;gap:8px;color:#fff;
  font:600 13px/1 var(--f-b);letter-spacing:.1em;margin-left:auto}
.live i{width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.clock{font:600 20px/1 var(--f-m);color:#fff;font-variant-numeric:tabular-nums}
.clock.big{font-size:44px}
.clock.over{color:var(--stubble-bg)}

/* finished — dimmed, with the qualification chip */
.brace.done{background:var(--sand);border-color:var(--line)}
.brace.done .bno{color:var(--dim)}
.brace.done .dog .nm{color:var(--slate)}
.brace.done .dog .pos,.brace.done .dog .mt{color:var(--slate-2)}
.brace.done .bstate{color:var(--dim)}

/* solo — one half struck through, the word ΜΟΝΟΣ, and the trailer action */
.dog.none{background:repeating-linear-gradient(135deg,var(--sand) 0 8px,var(--stone) 8px 16px)}
.dog.none .pos{text-decoration:line-through;color:var(--slate-2)}
.dog.none .nm{text-decoration:line-through;color:var(--dim)}
.brace.recall{border-color:var(--stubble)}

/* collapsed brace in the live terrain: a number and two names, nothing else */
.brief{display:flex;align-items:center;gap:14px;background:var(--card);
  border:1px solid var(--line-s);border-radius:var(--r);padding:12px 14px;margin-bottom:var(--s2);
  width:100%;text-align:left;min-height:var(--tap)}
.brief.done{background:var(--sand);border-color:var(--line)}
.brief .n{font:800 30px/1 var(--f-d);color:var(--ink);min-width:32px;
  font-variant-numeric:tabular-nums;flex:none}
.brief.done .n{color:var(--dim)}
.brief .who{flex:1;min-width:0}
.brief .who b{display:block;font:600 19px/1.2 var(--f-d);color:var(--ink);overflow-wrap:anywhere}
.brief.done .who b{color:var(--slate)}
.brief .who span{display:block;font:400 15px/1.3 var(--f-b);color:var(--slate);margin-top:2px}

/* ---------- draw ---------- */
.seed{font:600 17px/1 var(--f-m);letter-spacing:.02em}
.fingerprint{font:400 15px/1.6 var(--f-m);color:var(--slate);font-variant-numeric:tabular-nums}
.reveal{animation:braceIn .22s ease-out both}
@keyframes braceIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .reveal{animation:none}
  .live i{animation:none}
}
/* re-draw is deliberately uncomfortable: it throws away a drawn order */
.b-redraw{background:var(--stubble-soft);border:1px solid var(--stubble);color:var(--stubble-ink);width:100%}

/* ---------- notes (field) ---------- */
.scale{display:flex;gap:6px}
.scale .tog{flex:1;padding:0}
.tog{display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line-s);background:#fff;color:var(--ink);border-radius:var(--r);
  padding:0 14px;min-height:var(--tap);font:600 17px/1 var(--f-b);cursor:pointer}
.tog.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tog.red{border-color:var(--bad-line);background:#fff;font-weight:400;font-size:15px;
  padding:0 10px;min-height:44px}
/* a settings group, not a row of primary actions: same system, quieter weight */
.tog.opt{min-height:44px;font-size:15px;padding:0 12px}
.tog.opt.on{background:var(--navy-l);color:var(--navy);border-color:var(--navy)}
.tog.opt.on::before{content:"✓ ";font-weight:700}
/* one dog inside a handler's card: the name takes the width it needs and the
   marks drop to their own line rather than landing on top of it */
.entry-row{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;
  padding:10px 0;border-top:1px solid var(--line-f)}
.entry-row:first-child{border-top:0}
.entry-row .who{flex:1 1 190px;min-width:0}
.entry-row b{display:block;font:600 17px/1.25 var(--f-b);overflow-wrap:anywhere}
.entry-row .tiny{display:block;margin-top:2px}
.entry-row .acts{display:flex;align-items:center;gap:6px;flex:0 0 auto;margin-left:auto;flex-wrap:wrap;
  justify-content:flex-end}
.card.handler{break-inside:avoid}
/* the dog's name is how you open him — a button that reads as the heading it is */
.entry-row .open{display:block;width:100%;min-height:0;text-align:left;background:none;border:0;
  padding:0;color:var(--ink);cursor:pointer;font:600 17px/1.25 var(--f-b);overflow-wrap:anywhere;
  text-decoration:underline;text-decoration-color:var(--stubble);text-decoration-thickness:1px;
  text-underline-offset:3px}
.entry-row .open:hover{color:var(--setter);text-decoration-color:currentColor}
.tog.assign{border-color:var(--line-s);background:#fff;color:var(--ink);font-weight:400}
.tog.assign.on{background:var(--navy-l);border-color:var(--navy);color:var(--ink)}
.tog.assign.on::before{content:"✓";font-weight:700;color:var(--navy);margin-right:10px;flex:none}
button[disabled]{opacity:.4}
.tog.red.on{background:var(--bad);border-color:var(--bad);color:#fff}
.badge-list{display:flex;flex-wrap:wrap;gap:6px}
/* the trial's own tabs: one row that scrolls, so the field screens keep their
   vertical space instead of losing three rows to a wrapped tab bar */
.tabstrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  margin:0 calc(var(--s4) * -1) var(--s4);padding:0 var(--s4) 2px}
.tabstrip::-webkit-scrollbar{display:none}
.tabstrip .tog{flex:none;white-space:nowrap}
/* the progress strip */
.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  margin:0 calc(var(--s4) * -1) var(--s3);padding:0 var(--s4) 2px}
.steps::-webkit-scrollbar{display:none}
.step-i{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 12px;
  border:1px solid var(--line);background:#fff;border-radius:var(--r);cursor:pointer}
.step-i .mark{width:22px;height:22px;border-radius:50%;flex:none;background:var(--line-f);
  color:var(--slate);font:700 12px/22px var(--f-b);text-align:center}
.step-i .lbl{font:600 15px/1.1 var(--f-b);color:var(--ink);white-space:nowrap;text-align:left}
.step-i .lbl span{display:block;font:400 12px/1.3 var(--f-b);color:var(--slate);margin-top:2px}
.step-i.done .mark{background:var(--ok);color:#fff}
.step-i.now{border-color:var(--setter);box-shadow:inset 0 0 0 1px var(--setter)}
.step-i.now .mark{background:var(--setter);color:#fff}
/* which step is open now that the strip is also the navigation */
.step-i.here{background:var(--navy);border-color:var(--navy)}
.step-i.here .lbl,.step-i.here .lbl span{color:#fff}
.step-i.here .mark{background:rgba(255,255,255,.22);color:#fff}
.step-i.plain{align-self:stretch}
@media (min-width:900px){ .steps{margin-left:0;margin-right:0;padding-left:0;padding-right:0} }
@media (min-width:900px){ .tabstrip{margin-left:0;margin-right:0;padding-left:0;padding-right:0;flex-wrap:wrap} }
.step{display:flex;align-items:center;gap:10px}
.step button{width:52px;height:52px;min-height:52px;padding:0;font:600 24px/1 var(--f-b);
  border-color:var(--navy);color:var(--navy)}
.step .val{min-width:30px;text-align:center;font:800 34px/1 var(--f-d);
  font-variant-numeric:tabular-nums}
.danger-zone{background:var(--bad-bg);border:2px solid var(--bad);border-radius:var(--r);
  padding:var(--s4);margin-bottom:var(--s3)}
.danger-zone .eyebrow{color:var(--bad)}
.saved{font:400 15px/1 var(--f-b);color:var(--slate);margin-left:auto}

/* ---------- SMS ---------- */
.sms-row{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--s4);margin-bottom:10px}
.sms-row.sent{border-color:var(--ok)}
.seg{flex:none;font:600 15px/1 var(--f-b);border-radius:var(--r-chip);padding:7px 9px;
  background:var(--line-f);color:var(--slate);font-variant-numeric:tabular-nums}
.seg.hot{background:var(--stubble-bg);color:var(--stubble-ink)}
.preview{white-space:pre-wrap;font:400 15px/1.5 var(--f-b);color:var(--slate);
  background:var(--sand);border-radius:var(--r);padding:10px 12px;margin:10px 0;
  max-height:180px;overflow:auto}
.total{font:800 28px/1 var(--f-d);font-variant-numeric:tabular-nums}
.bar{height:8px;background:#0000000d;border-radius:var(--r-pill);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok)}

/* ---------- stats matrix ----------
   The season at a glance. Rotated column heads, tabular figures, first column
   pinned so a dog's name stays visible while the row is read. */
.matrix{font-size:16px;border-collapse:separate;border-spacing:0}
.matrix th,.matrix td{border-bottom:1px solid var(--line-f);white-space:nowrap}
.matrix th.v{height:178px;vertical-align:bottom;padding:0;background:var(--sand);
  border-bottom:1px solid var(--line);position:relative;min-width:74px;width:74px}
.matrix th.v span{position:absolute;bottom:10px;left:14px;transform:rotate(-60deg);
  transform-origin:left bottom;white-space:nowrap;font:600 14px/1 var(--f-b);
  color:var(--ink);text-transform:none;letter-spacing:0}
.matrix th.first{position:sticky;left:0;z-index:3;min-width:220px;text-align:left;
  vertical-align:bottom;height:178px}
.matrix td.first{position:sticky;left:0;background:var(--card);z-index:2;
  border-right:1px solid var(--line);min-width:220px}
.matrix td.first b{font:600 16px/1.2 var(--f-b)}
.matrix td.first span{display:block;font:400 13px/1.2 var(--f-b);color:var(--slate-2);margin-top:2px}
.matrix td.n{text-align:center;font-variant-numeric:tabular-nums}
.matrix td.z{color:var(--slate-2)}
.matrix .tail{width:104px;min-width:104px;background:none;border:0}
.matrix td.tot{background:var(--sand);font:800 18px/1.2 var(--f-d);text-align:right;
  font-variant-numeric:tabular-nums}
.matrix tr.sum td{background:var(--stone);font-weight:600}
.matrix tr.sum td.tot{background:var(--navy);color:#fff}

/* ---------- dog history ---------- */
.dog-hd{background:var(--navy);color:#fff;border-radius:var(--r);
  padding:var(--s5) var(--s5) var(--s4);margin-bottom:var(--s4);
  display:flex;gap:var(--s4);align-items:flex-start;flex-wrap:wrap}
.dog-hd img{width:56px;height:56px;border-radius:50%;flex:none;object-fit:cover}
.dog-hd .eyebrow{color:#ffffffa6}
.dog-hd h1{color:#fff;margin:0}
.dog-hd .meta{font:400 16px/1.5 var(--f-b);color:#ffffffbf;margin-top:6px}
.dog-hd .score{margin-left:auto;text-align:right}
.dog-hd .score b{display:block;font:800 44px/1 var(--f-d);font-variant-numeric:tabular-nums}
.dog-hd .score span{font:400 15px/1.2 var(--f-b);color:#ffffffb3}
.tl{display:flex;gap:var(--s4);padding-bottom:var(--s5)}
.tl .when{width:104px;flex:none;text-align:right}
.tl .when b{font:600 16px/1.2 var(--f-b);font-variant-numeric:tabular-nums}
.tl .when span{display:block;font:400 14px/1.3 var(--f-b);color:var(--slate-2);margin-top:3px}
.tl .rail{width:1px;background:var(--line);flex:none;position:relative}
.tl .rail i{position:absolute;top:5px;left:-4px;width:9px;height:9px;border-radius:50%;
  background:var(--navy)}
.tl .what{flex:1;min-width:0}
.tl .what h3{margin:0}
.tl .what .meta{font:400 15px/1.5 var(--f-b);color:var(--slate);margin-top:5px}
.tl .said{border-left:2px solid var(--line-f);padding-left:14px;margin-top:10px;
  font:400 16px/1.6 var(--f-b)}
.tl .said cite{display:block;font:400 14px/1.3 var(--f-b);color:var(--slate-2);
  font-style:normal;margin-top:6px}
.tl .pts{width:78px;flex:none;text-align:right}
.tl .pts b{font:800 24px/1 var(--f-d);font-variant-numeric:tabular-nums}
.tl .pts span{display:block;font:400 13px/1.2 var(--f-b);color:var(--slate-2);margin-top:3px}

/* ---------- import mapping ---------- */
.map-row{display:flex;align-items:center;gap:var(--s3);padding:11px 0;
  border-bottom:1px solid var(--line-f)}
.map-row .from{flex:1;min-width:0}
.map-row .from b{font:600 16px/1.2 var(--f-b)}
.map-row .from span{display:block;font:400 14px/1.3 var(--f-b);color:var(--slate-2);margin-top:3px}
.map-row .to{width:240px;flex:none}
.map-row .to select{min-height:44px;padding:10px 12px;font-size:16px}

/* ---------- registry sidebar (desk) ---------- */
.side{display:none}
.side .item{display:block;width:100%;text-align:left;padding:11px var(--s4);
  border:0;border-left:3px solid transparent;background:none;border-radius:0;
  font:400 16px/1 var(--f-b);color:var(--slate);min-height:0}
.side .item.on{background:#fff;color:var(--ink);font-weight:600;border-left-color:var(--setter)}

/* ---------- misc ---------- */
body:not([data-field]) .fab{display:none}
.fab{position:fixed;left:var(--s4);right:var(--s4);bottom:calc(10px + env(safe-area-inset-bottom));
  z-index:35;display:flex;gap:10px;max-width:1208px;margin:0 auto}
.fab:empty{display:none}
.fab button{flex:1;min-height:60px;font-size:19px;box-shadow:0 6px 20px #00000038}
.fab .b-act{font:800 21px/1 var(--f-d)}
dialog{border:0;border-radius:var(--r);padding:0;max-width:640px;width:calc(100% - 20px);
  box-shadow:0 20px 60px #00000059;color:var(--ink);background:var(--card)}
dialog::backdrop{background:#000000a6}
.dlg{padding:var(--s4) var(--s4) var(--s5)}
.dlg h2{margin-bottom:var(--s3)}
/* stacked fields in a dialog: leave room for the focus ring so it never
   crosses the label of the field below */
.dlg .row{margin-bottom:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(84px + env(safe-area-inset-bottom));background:var(--navy);color:#fff;
  padding:12px 16px;border-radius:var(--r);font:400 16px/1.3 var(--f-b);z-index:60;
  box-shadow:0 8px 24px #00000047;max-width:calc(100% - 32px)}

/* ---------- desk mode: same tokens, tighter ---------- */
@media (min-width:900px){
  body{font-size:16px}
  main{padding:var(--s5)}
  .card{padding:var(--s5)}
  table{font-size:15px}
  th,td{padding:10px 14px}
  .muted,.tiny{font-size:14px}
  .map-row .from span{font-size:13px}
  .reg{display:grid;grid-template-columns:210px 1fr;gap:0;
    background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .side{display:block;background:var(--stone);border-right:1px solid var(--line);padding:var(--s5) 0}
  .reg .main{padding:var(--s5);min-width:0}
  .reg-tabs{display:none}
}

/* ---------- print ----------
   A4 portrait, black and white, legible after photocopying. It will be
   photocopied. */
@media print{
  @page{size:A4 portrait;margin:14mm}
  header,nav,.fab,.noprint,button,#warn,.toast{display:none!important}
  body{background:#fff;color:#000;padding:0;font:400 10.5pt/1.35 var(--f-b)}
  main{max-width:none;padding:0}
  .card,.brace,.sms-row{break-inside:avoid;border:1px solid #999;box-shadow:none;
    background:#fff!important;color:#000!important}
  .print-hd{display:flex!important;gap:10px;align-items:flex-start;
    border-bottom:2px solid #000;margin-bottom:10px;padding-bottom:8px}
  .print-hd img{width:44px;height:44px;border-radius:50%;filter:grayscale(1) contrast(1.2)}
  .print-hd .t{flex:1}
  .print-hd b{display:block;font:800 11pt/1.3 var(--f-d);letter-spacing:.08em}
  .print-hd span{display:block;font:400 9.5pt/1.35 var(--f-b);margin-top:2px}
  .print-hd .pg{font:600 9.5pt/1.3 var(--f-b);text-align:right;white-space:nowrap}
  /* Any screen may be sent to the printer, so cards stay legible in black and
     white. The drawn order and the note sheets have their own A4 layouts and
     do not come through here at all. */
  .brace,.brief{border:1px solid #666;page-break-inside:avoid;background:#fff!important}
  .brace.run{background:#fff!important}
  .brace.run .bno,.brace.run .bstate,.brace.run .dog .nm{color:#000!important}
  .brace.run .dog .pos,.brace.run .dog .mt{color:#333!important}
  .live i,.clock{display:none!important}
  .dog .nm{color:#000!important}
  .matrix th.v span{color:#000}
  .empty,.note,.err{border:1px solid #999;background:#fff;color:#000}
  a{color:#000;text-decoration:none}
  .print-only{display:block!important}
}
.print-hd,.print-only{display:none}

/* ---------- the blank judge note sheet ----------
   A4 portrait, black on white, boxes big enough to write in with a pen on a
   knee. It gets photocopied, so nothing here is grey. */
#sheets{display:none}
.sheet{padding:0 0 10mm}
.sheet .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:10px}
.sheet .fld span{font:400 9pt/1 var(--f-b)}
.sheet .fld .line{border-bottom:1px solid #000;height:22px}
.sheet .box{border:1px solid #000;height:26px}
.sheet table{border-collapse:collapse;width:100%;margin-top:6px}
.sheet th,.sheet td{border:1px solid #666;padding:4px;font:400 9pt/1.2 var(--f-b);
  text-align:left;background:none;position:static;text-transform:none;letter-spacing:0;color:#000}
.sheet th{border-color:#000;font-weight:600}
.sheet .rate{display:flex;gap:5px}
.sheet .rate i{width:20px;height:20px;border:1px solid #000;font:400 8.5pt/19px var(--f-b);
  text-align:center;font-style:normal}
.sheet h4{font:600 9.5pt/1 var(--f-b);margin:12px 0 4px;border-top:1px solid #000;padding-top:8px}
@media print{
  body.sheets-only main,body.sheets-only .fab{display:none!important}
  body.sheets-only #sheets{display:block}
  .sheet{page-break-after:always}
  .sheet:last-child{page-break-after:auto}
}
</style>

/* ---------- 2. Storage --------------------------------------------------- */
/* Safari refuses localStorage on file:// URLs. If the head judge emails himself
   this file and opens it from the Files app on an iPhone, nothing would be saved
   and he would not be told. So probe the store on startup and say so loudly. */
const KEY = "koad_db_v1";
let DB = null, mem = null, storageMode = "memory";

function blank(){ return {v:1, people:[], judges:[], dogs:[], trials:[],
  settings:{...DEFAULT_SETTINGS, points:{...DEFAULT_POINTS}} }; }

async function probeStorage(){
  try{
    if(window.storage){
      await window.storage.set("__koad_probe","1");
      const r = await window.storage.get("__koad_probe");
      if(r && r.value === "1"){ storageMode = "app"; return; }
    }
  }catch(e){}
  try{
    localStorage.setItem("__koad_probe","1");
    if(localStorage.getItem("__koad_probe") === "1"){
      localStorage.removeItem("__koad_probe"); storageMode = "local"; return;
    }
  }catch(e){}
  storageMode = "memory";
}

async function load(){
  if(storageMode === "app"){
    try{ const r = await window.storage.get(KEY); if(r && r.value) return JSON.parse(r.value); }catch(e){}
  }
  if(storageMode === "local"){
    try{ const s = localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
  }
  return mem || blank();
}
let saveTimer=null;
function save(){
  mem = DB;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ saveTimer = null; writeStore(); }, 250);
}
function writeStore(){
  const s = JSON.stringify(DB);
  if(storageMode === "app"){ try{ window.storage.set(KEY, s); }catch(e){} }
  if(storageMode === "local"){ try{ localStorage.setItem(KEY, s); }catch(e){} }
}
/* The write is debounced so a run of taps does not serialise the database each
   time. That leaves a quarter of a second in which a backgrounded tab — which
   iOS discards without warning — would lose the last thing the judge did, so
   the pending write is flushed the moment the page is hidden or unloaded.
   Synchronous on purpose: a hidden page does not get to await anything. */
function flushStore(){
  if(!saveTimer) return;
  clearTimeout(saveTimer); saveTimer = null;
  writeStore();
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "hidden") flushStore(); });
addEventListener("pagehide", flushStore);   /* pagehide fires at the window */

/* ---------- 3. Helpers --------------------------------------------------- */
const $  = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const el  = id => document.getElementById(id);
const dogById = id => DB.dogs.find(d=>d.id===id);
const perById = id => DB.people.find(p=>p.id===id);
const judById = id => DB.judges.find(j=>j.id===id);
const trialById = id => DB.trials.find(t=>t.id===id);
const dogName = id => (dogById(id)||{}).name || "—";
const perName = id => (perById(id)||{}).name || "—";
const fmtDate = d => d ? d.split("-").reverse().join("/") : "—";
const today = () => new Date().toISOString().slice(0,10);

function toast(msg){
  const n=document.createElement("div");
  n.className="toast"; n.textContent=msg;
  document.body.appendChild(n); setTimeout(()=>n.remove(),2200);
}
/* the badge, once, so the dog page and the printed sheets can carry it too */
const BADGE = document.querySelector("header img").getAttribute("src");
function confirmAct(msg){ return window.confirm(msg); }
function download(name, mime, content){
  /* text gets a charset; a workbook is bytes and must not be labelled as text */
  const binary = content instanceof Uint8Array;
  const b = new Blob([content], {type: binary ? mime : mime + ";charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function phoneClean(p){ return String(p||"").replace(/[^\d+]/g,""); }

/* seeded PRNG — the draw must be reproducible from its seed */
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffled(arr, rnd){ const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- 4. Points ---------------------------------------------------- */
function scoreKey(res){ if(!res) return "-"; return (res.award && res.award!=="-") ? res.award : (res.qual||"-"); }
function coefficient(t){
  const brace = t.format === "ΖΕΥΓΗ";
  const wildRelevant = t.wild && (t.type==="Έρευνας Κυνηγίου" || t.type==="Πρακτικού Κυνηγίου");
  if(wildRelevant) return brace ? 4 : 3;   // (2+2) / (2+1)
  return brace ? 2 : 1;
}
function pointsFor(t, res){
  const base = DB.settings.points[scoreKey(res)] ?? 0;
  return base * coefficient(t);
}

/* ---------- 5. Draw engine ---------------------------------------------- */
/* Hard constraints:  H1 same handler never braced · H2 judge never judges his own
   dog's terrain (Άρθρο 49) · H3 Derby breed group · H4 one run per dog per day   */
function judgeConflict(terrain, entry, trial){
  const dog = dogById(entry.dogId) || {};
  return terrain.judgeIds.some(jid=>{
    const j = judById(jid); if(!j) return false;
    return j.personId && (j.personId===entry.handlerId || j.personId===dog.ownerId);
  });
}
function pairConflict(e1, e2, soft){
  if(e1.handlerId && e1.handlerId===e2.handlerId) return true;          // H1
  const d1=dogById(e1.dogId)||{}, d2=dogById(e2.dogId)||{};
  if(soft.avoidOwner  && d1.ownerId && d1.ownerId===d2.ownerId) return true;
  if(soft.avoidKennel && d1.kennel  && d1.kennel===d2.kennel)   return true;
  return false;
}

function runDraw(trial, dayIdx, seedIn, mode){
  const day = trial.days[dayIdx];
  const soft = DB.settings;
  const seed = seedIn || (uid()+Date.now());
  const rnd  = mulberry32(hashStr(seed));
  const active = trial.entries.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ");
  const problems = [];   /* dogs with nowhere to run — these stop the draw */
  const notices  = [];   /* things he must be told, which do not stop it */

  if(!day.terrains.length) return {error:"Δεν έχουν οριστεί τερέν."};
  if(!active.length)       return {error:"Δεν υπάρχουν ενεργές συμμετοχές."};

  /* --- allocation to terrains --- */
  /* only an explicit assignment by the head judge counts as manual; entryIds left
     behind by a previous draw must not leak into the next one, or the draw stops
     being reproducible from its seed */
  const manual = day.terrains.some(t=>t.assigned && t.entryIds && t.entryIds.length);
  if(!manual) day.terrains.forEach(t=>{ t.entryIds = []; });
  const alloc  = {}; day.terrains.forEach(t=>alloc[t.id]=[]);

  if(mode==="ΠΕΡΙΣΤΡΟΦΗ" && dayIdx>0 && trial.days[dayIdx-1].draw){
    const prev = trial.days[dayIdx-1];
    const n = day.terrains.length;
    prev.terrains.forEach((pt,i)=>{
      const target = day.terrains[(i+1)%n];
      (pt.entryIds||[]).forEach(eid=>{
        const e = active.find(x=>x.id===eid); if(e) alloc[target.id].push(e);
      });
    });
    // dogs that were not in the previous day fall through to normal allocation
    const placed = new Set(Object.values(alloc).flat().map(e=>e.id));
    active.filter(e=>!placed.has(e.id)).forEach(e=>{
      const t = eligibleTerrain(e); if(t) alloc[t.id].push(e); else problems.push(dogName(e.dogId));
    });
  } else if(manual){
    /* A hand assignment says where the head judge wants a dog. It does not
       outrank Άρθρο 49 — a judge may not have his own dog in the terrain he
       judges — so an assignment that would break it is refused, the dog falls
       through to normal allocation, and the head judge is told which ones
       moved rather than discovering it on the running order. */
    const refused = [];
    day.terrains.forEach(t=>{
      (t.entryIds||[]).forEach(eid=>{
        const e = active.find(x=>x.id===eid); if(!e) return;
        if(judgeConflict(t, e, trial)){ refused.push(dogName(e.dogId) + " → " + t.name); return; }
        alloc[t.id].push(e);
      });
    });
    if(refused.length) notices.push(
      "Χειροκίνητη ανάθεση σε τερέν όπου ο κριτής έχει δικό του σκύλο (Άρθρο 49). "
      + "Μετακινήθηκαν: " + refused.join(", ") + ".");
    const placed = new Set(Object.values(alloc).flat().map(e=>e.id));
    active.filter(e=>!placed.has(e.id)).forEach(e=>{
      const t = eligibleTerrain(e); if(t) alloc[t.id].push(e); else problems.push(dogName(e.dogId));
    });
  } else {
    shuffled(active, rnd).forEach(e=>{
      const t = eligibleTerrain(e); if(t) alloc[t.id].push(e); else problems.push(dogName(e.dogId));
    });
  }

  function eligibleTerrain(e){
    const dog = dogById(e.dogId) || {};
    const ok = day.terrains.filter(t=>{
      if(t.breedGroup && BREED_GROUP(dog.breed)!==t.breedGroup) return false;  // H3
      if(judgeConflict(t, e, trial)) return false;                             // H2
      return true;
    });
    if(!ok.length) return null;
    /* prefer the terrain where this handler has the fewest dogs, then the emptiest
       terrain — clustering one handler's dogs makes braces impossible to build */
    const mine = tr => alloc[tr.id].filter(x=>x.handlerId===e.handlerId).length;
    ok.sort((a,b)=> (mine(a)-mine(b)) || (alloc[a.id].length-alloc[b.id].length));
    return ok[0];
  }

  if(problems.length)
    return {error:"Δεν βρέθηκε κατάλληλο τερέν για: "+problems.join(", ")+
      ". Ελέγξτε τους κριτές (Άρθρο 49) ή τη φυλή του τερέν."};

  /* --- pairing inside each terrain --- */
  const braceFormat = trial.format === "ΖΕΥΓΗ";
  const warn = [];
  const NONE = {avoidOwner:false, avoidKennel:false};   // hard constraints only

  /* Pair a pool in two phases: first honour the soft preferences, and only if no
     partner qualifies fall back to the hard constraints alone. The same-handler
     rule is never broken unless it is arithmetically impossible. */
  function pairPool(pool, out, terrainName){
    while(pool.length){
      const a = pool.shift();
      if(!pool.length){ out.push({id:uid(),no:out.length+1,a:a.id,b:null,solo:true,status:"ΕΚΚΡΕΜΕΙ"}); break; }
      let cands = pool.map((_,i)=>i).filter(i=>!pairConflict(a,pool[i],soft));
      let relaxed = false, broken = false;
      if(!cands.length){ cands = pool.map((_,i)=>i).filter(i=>!pairConflict(a,pool[i],NONE)); relaxed = true; }
      if(!cands.length){ cands = [0]; broken = true; }
      const b = pool.splice(cands[Math.floor(rnd()*cands.length)],1)[0];
      void broken; void relaxed;   // reported after the repair pass, not here
      out.push({id:uid(),no:out.length+1,a:a.id,b:b.id,solo:false,status:"ΕΚΚΡΕΜΕΙ"});
    }
    return out;
  }

  /* Greedy pairing can corner itself: the last two dogs left over may share a
     handler even though a valid arrangement existed. Repair by swapping partners
     between braces — hard violations first, then the soft preferences. */
  function repair(braces, byId, level, terrainName){
    const bad = b => b.b && pairConflict(byId[b.a], byId[b.b], level);
    const locked = e => soft.seasonLast && e && e.season;   // keep οίστρος at the end
    for(let pass=0; pass<60; pass++){
      let fixed = false;
      for(let i=0;i<braces.length;i++){
        if(!bad(braces[i])) continue;
        for(let j=0;j<braces.length && !fixed;j++){
          if(i===j || !braces[j].b) continue;
          for(const side of ["a","b"]){
            const bi = braces[i], bj = braces[j];
            const keepI = byId[bi.a], moveI = byId[bi.b];
            const keepJ = byId[side==="a" ? bj.b : bj.a], moveJ = byId[side==="a" ? bj.a : bj.b];
            if(locked(moveI) || locked(moveJ)) continue;
            if(!pairConflict(keepI,moveJ,level) && !pairConflict(keepJ,moveI,level)){
              bi.b = moveJ.id;
              if(side==="a"){ bj.a = moveI.id; } else { bj.b = moveI.id; }
              fixed = true; break;
            }
          }
        }
        if(fixed) break;
      }
      if(!fixed) break;
    }
    return braces.filter(bad).length;
  }

  day.terrains.forEach(t=>{
    const list = shuffled(alloc[t.id], rnd);
    let braces = [];
    if(!braceFormat){
      const ordered = soft.seasonLast ? list.filter(e=>!e.season).concat(list.filter(e=>e.season)) : list;
      ordered.forEach((e,i)=>braces.push({id:uid(),no:i+1,a:e.id,b:null,solo:true,status:"ΕΚΚΡΕΜΕΙ"}));
    } else if(soft.seasonLast && list.some(e=>e.season)){
      const season = list.filter(e=>e.season), normal = list.filter(e=>!e.season);
      braces = pairPool(normal.slice(), [], t.name);
      const last = braces[braces.length-1];
      if(last && last.solo && season.length){                 // fill the odd turn
        last.b = season.shift().id; last.solo = false;
      }
      pairPool(season.slice(), braces, t.name);
      braces.forEach((b,i)=>b.no = i+1);
    } else {
      braces = pairPool(list.slice(), [], t.name);
    }
    if(braceFormat){
      const byId = {}; list.forEach(e=>byId[e.id]=e);
      const stillHard = repair(braces, byId, NONE, t.name);   // H1 first
      repair(braces, byId, soft, t.name);                     // then S1/S2
      if(stillHard) warn.push(`«${t.name}»: ${stillHard} ζεύγος/η με τον ίδιο κυναγωγό — δεν υπάρχει άλλη δυνατή διάταξη με τους σκύλους αυτού του τερέν.`);
    }
    t.braces = braces;
    t.entryIds = braces.flatMap(b=>b.b ? [b.a,b.b] : [b.a]);
    if(braces.length<3) warn.push(`Το τερέν «${t.name}» έχει ${braces.length} ζεύγη. Χρειάζονται τουλάχιστον 3 (Άρθρο 40).`);
  });

  const hash = hashStr(day.terrains.map(t=>t.id+":"+t.braces.map(b=>b.no+b.a+(b.b||"")).join("|")).join("//")).toString(16);
  day.draw = {seed, at:new Date().toISOString(), hash, mode:mode||"ΚΛΗΡΩΣΗ",
              constraints:{avoidOwner:soft.avoidOwner,avoidKennel:soft.avoidKennel,seasonLast:soft.seasonLast}};
  trial.status = "ΚΛΗΡΩΜΕΝΟΣ";
  return {ok:true, warn: notices.concat(warn)};
}
