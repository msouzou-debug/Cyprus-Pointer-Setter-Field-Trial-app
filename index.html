/* --- 8e. sms --- */
/* The full running order of the day. A handler's own braces are marked so he can
   see where he sits among the others without hunting for his name. */
function orderText(t, handlerId, withJudges){
  const day = t.days[S.day], L = [];
  (day.terrains||[]).forEach(tr=>{
    L.push(tr.name + (withJudges && tr.judgeIds.length
      ? " — " + tr.judgeIds.map(j=>(judById(j)||{}).name).filter(Boolean).join(", ") : ""));
    (tr.braces||[]).forEach(b=>{
      const a = t.entries.find(e=>e.id===b.a), c = t.entries.find(e=>e.id===b.b);
      const mine = handlerId && ((a && a.handlerId===handlerId) || (c && c.handlerId===handlerId));
      /* Ένα σύμβολο σε όλο το μήνυμα, και σημαδεύει μία φορά. Το κενό μπροστά
         στις υπόλοιπες γραμμές κρατά τους αριθμούς στην ίδια στήλη. */
      L.push((mine ? "▸ " : "  ") + b.no + ". " + (a?dogName(a.dogId):"—") + " / " + (c?dogName(c.dogId):tx("ΜΟΝΟΣ"))
        + (b.recall ? " (" + txOne("επανάκληση") + ")" : "") + (b.trailer ? " (trailer)" : ""));
    });
  });
  return L.join("\n");
}
function myRuns(t, handlerId){
  const out = [];
  (t.days[S.day].terrains||[]).forEach(tr=>(tr.braces||[]).forEach(b=>{
    [b.a,b.b].forEach(id=>{ const e = t.entries.find(x=>x.id===id);
      if(e && e.handlerId===handlerId) out.push({dog:dogName(e.dogId), ter:tr.name, no:b.no,
        recall:b.recall, side: id===b.a ? "δεξιά" : "αριστερά"}); });
  }));
  return out;
}
/* The header of every message. Πού and πότε are the two things a κυναγωγός needs
   at six in the morning, so if the club's template does not name them the app
   adds the line itself instead of sending a message that leaves them out. */
/* Το πρότυπο του μηνύματος είναι δεδομένο των Ρυθμίσεων: ο γραμματέας το γράφει
   και μένει όπως το έγραψε. Όσο όμως δεν το έχει πειράξει, ακολουθεί τη γλώσσα
   της οθόνης — αλλιώς ένας Ιταλός γραμματέας βλέπει ελληνικά σε ένα πεδίο που
   υποτίθεται πως συμπληρώνει ο ίδιος. Τα πεδία {ΑΓΩΝΑΣ} {ΗΜΕΡΟΜΗΝΙΑ}
   {ΤΟΠΟΘΕΣΙΑ} {ΩΡΑ} μένουν ελληνικά σε κάθε γλώσσα: είναι κλειδιά, όχι κείμενο. */
/* Τα πεδία του προτύπου ήταν ελληνικά σε κάθε γλώσσα, γιατί είναι κλειδιά
   αντικατάστασης. Ένας Ιταλός γραμματέας όμως πρέπει να τα διαβάζει για να τα
   βάλει στη θέση τους. Λύση ίδια με το θήραμα: διαβάζονται στη γλώσσα της
   οθόνης, γράφονται ελληνικά στη βάση. Η αντικατάσταση δέχεται και τις δύο
   μορφές, ώστε ένα πρότυπο γραμμένο στα ιταλικά να δουλεύει και σε ελληνικό
   κινητό μετά από συγχώνευση. */
const SMS_FIELDS = [
  ["{ΑΓΩΝΑΣ}",     {en:"{TRIAL}", fr:"{EPREUVE}", de:"{PRUEFUNG}", it:"{PROVA}", es:"{PRUEBA}"}],
  ["{ΗΜΕΡΟΜΗΝΙΑ}", {en:"{DATE}",  fr:"{DATE}",    de:"{DATUM}",    it:"{DATA}",  es:"{FECHA}"}],
  ["{ΤΟΠΟΘΕΣΙΑ}",  {en:"{PLACE}", fr:"{LIEU}",    de:"{ORT}",      it:"{LUOGO}", es:"{LUGAR}"}],
  ["{ΩΡΑ}",        {en:"{TIME}",  fr:"{HEURE}",   de:"{ZEIT}",     it:"{ORA}",   es:"{HORA}"}]
];
const smsLang = () => (DB && DB.settings && DB.settings.lang) || "el";
/* ελληνικά → γλώσσα οθόνης, για να διαβαστεί */
function fieldsOut(t){
  const L = smsLang();
  if(L === "el") return t;
  SMS_FIELDS.forEach(([gr, m]) => { if(m[L]) t = t.split(gr).join(m[L]); });
  return t;
}
/* οποιαδήποτε γλώσσα → ελληνικά, για να γραφτεί και να αντικατασταθεί */
function fieldsIn(t){
  SMS_FIELDS.forEach(([gr, m]) => Object.keys(m).forEach(L =>
    { t = t.split(m[L]).join(gr); }));
  return t;
}
const isDefaultSms = v => !v || v === DEFAULT_SMS || SMS_WAS.includes(v);
const smsTpl  = () => { const v = DB.settings.sms;
  return isDefaultSms(v) ? tx(DEFAULT_SMS) : v; };
const smsFootTxt = () => { const v = DB.settings.smsFoot;
  return !v || v === DEFAULT_SMS_FOOT ? tx(DEFAULT_SMS_FOOT) : v; };
/* «ζεύγος 1ο» στα ελληνικά, «coppia 1» στις άλλες: το τακτικό είναι ελληνικός
   τύπος και δεν μεταφέρεται. Ο αριθμός μένει αριθμός σε κάθε γλώσσα. */
/* «1ο ζεύγος» είναι ελληνική σειρά. Στα ιταλικά το ίδιο σχήμα βγάζει «1 coppia»,
   που δεν είναι γλώσσα — εκεί ο αριθμός πάει πίσω: «coppia 1». */
const braceLabel = n => ((DB && DB.settings && DB.settings.lang) || "el") === "el"
  ? braceNo(n) + " " + txOne("ζεύγος")
  : txCap("ζεύγος") + " " + n;
const braceNo = n => n + ((DB && DB.settings && DB.settings.lang || "el") === "el" ? "ο" : "");
function smsHead(t, day){
  const tpl = fieldsIn(smsTpl());
  /* Οι μισοί αγώνες παίρνουν το όνομα του τόπου τους. Τότε η τοποθεσία δεν
     προσθέτει τίποτα και βγαίνει — μια επικεφαλίδα που λέει δύο φορές «Κάτω
     Μονή» διαβάζεται ως λάθος, όχι ως έμφαση. */
  const same = (a,b) => String(a||"").trim().toLowerCase() === String(b||"").trim().toLowerCase();
  const val = { "{ΑΓΩΝΑΣ}": t.title || "",
                "{ΗΜΕΡΟΜΗΝΙΑ}": fmtDate((day||{}).date || t.dateStart),
                "{ΤΟΠΟΘΕΣΙΑ}": same(t.place, t.title) ? "" : (t.place || ""),
                "{ΩΡΑ}": t.time || "" };
  /* A segment goes away whole when its field is empty: «{ΤΟΠΟΘΕΣΙΑ} · ώρα {ΩΡΑ}»
     with no ώρα set must not go out reading «Κάτω Μονή · ώρα». */
  const seg = s => {
    const holes = s.match(/\{[^}]+\}/g) || [];
    if(holes.some(h => val[h] !== undefined && !val[h])) return "";
    return s.replace(/\{[^}]+\}/g, m => val[m] !== undefined ? val[m] : m)
            .replace(/\s{2,}/g," ").trim();
  };
  const lines = tpl.split("\n")
    .map(l => l.split("·").map(seg).filter(Boolean).join(" · ").trim())
    .filter(Boolean);
  if(!/\{ΤΟΠΟΘΕΣΙΑ\}|\{ΩΡΑ\}/.test(tpl)){
    const bits = [];
    if(val["{ΤΟΠΟΘΕΣΙΑ}"]) bits.push(val["{ΤΟΠΟΘΕΣΙΑ}"]);
    if(t.time)  bits.push(tx("προσέλευση") + " " + t.time);
    if(bits.length) lines.push(bits.join(" · "));
  }
  return lines.join("\n");
}
/* Ο κυναγωγός διαβάζει αυτό στις έξι το πρωί, όρθιος, με το ένα χέρι. Τρεις
   ερωτήσεις έχει και με αυτή τη σειρά: πού πάω, πότε τρέχω, ποιος είναι μπροστά
   μου. Άρα τρία μπλοκ, ένα σύμβολο, καμία λέξη δύο φορές — και μια λεζάντα στο
   τέλος αντί για επεξήγηση σε κάθε γραμμή, γιατί το μήνυμα πληρώνεται ανά 67
   χαρακτήρες και ο όμιλος το πληρώνει σαράντα φορές. */
function smsBody(t, entry){
  const st = DB.settings;
  const head = smsHead(t, t.days[S.day]);
  const mine = myRuns(t, entry.handlerId);
  const L = [head, ""];
  L.push(tx(mine.length === 1 ? "ΤΟ ΖΕΥΓΟΣ ΣΑΣ" : "ΤΑ ΖΕΥΓΗ ΣΑΣ"));
  /* Πρώτα ο αριθμός του ζεύγους, γιατί με αυτόν βρίσκει τη γραμμή του πιο κάτω
     και με αυτόν τον φωνάζουν. Μετά ο σκύλος, το τερέν, η πλευρά. */
  mine.forEach(m=>L.push(braceLabel(m.no) + " · " + m.dog
    + " · " + m.ter + " · " + tx(m.side)
    + (m.recall ? " · " + txOne("επανάκληση") : "")));
  if(st.smsMode !== "own"){
    L.push("", tx("ΣΕΙΡΑ ΤΗΣ ΗΜΕΡΑΣ"), orderText(t, entry.handlerId, st.smsJudges));
    L.push("", "▸ " + tx("τα δικά σας ζεύγη") + " · "
             + tx("δεξιά/αριστερά ως προς την επιτροπή"));
  } else {
    L.push("", tx("δεξιά/αριστερά ως προς την επιτροπή"));
  }
  L.push(smsFootTxt());
  return L.join("\n");
}
/* Greek text is sent as UCS-2: 70 characters in one segment, 67 per segment
   after that. The head judge pays for these, so show him the count. */
function smsSegments(text){
  const n = text.length;
  const greek = /[^\x00-\x7F]/.test(text);
  const one = greek ? 70 : 160, more = greek ? 67 : 153;
  return n <= one ? 1 : Math.ceil(n / more);
}
/* The judges get the order too. They stand in the field with the same app open
   and score from it, so the message names their terrain, their committee and
   the braces they will judge — not the whole day's list. */
function judgeSmsBody(t, judge){
  const day = t.days[S.day], st = DB.settings;
  const head = smsHead(t, day);
  const L = [head, ""];
  (day.terrains||[]).forEach(tr=>{
    if(!(tr.judgeIds||[]).includes(judge.id)) return;
    const seat = tr.headJudgeId === judge.id ? tx("κεντρικός κριτής")
      : tx("κριτής") + " " + Math.max(1, (tr.slots||tr.judgeIds||[]).indexOf(judge.id));
    /* Όχι κεφαλαία: στα ελληνικά ο τόνος πέφτει στα κεφαλαία και το
       toUpperCase() δεν το ξέρει — «Τερέν» γίνεται «ΤΕΡΈΝ». */
    L.push(tr.name + " — " + seat);
    const with_ = (tr.judgeIds||[]).filter(j=>j!==judge.id)
      .map(j=>(judById(j)||{}).name).filter(Boolean);
    if(with_.length) L.push(tx("Μαζί:") + " " + with_.join(", "));
    (tr.braces||[]).forEach(b=>{
      const a = t.entries.find(e=>e.id===b.a), c = t.entries.find(e=>e.id===b.b);
      L.push("  " + b.no + ". " + (a?dogName(a.dogId):"—") + " / " + (c?dogName(c.dogId):tx("ΜΟΝΟΣ"))
        + (b.recall ? " (" + txOne("επανάκληση") + ")" : "") + (b.trailer ? " (trailer)" : ""));
    });
    L.push("");
  });
  L.push(smsFootTxt());
  return L.join("\n").replace(/\n{3,}/g, "\n\n");
}
/* What each channel can actually do, checked rather than assumed:

   SMS       phone only — a laptop has no messaging app. Several recipients in
             one sms: link works on Android; iOS commonly takes only the first,
             so the app says so instead of pretending.
   WhatsApp  wa.me works on both (Web on a laptop), but only one number at a
             time — there is no documented way to address several.
   Viber     viber://forward?text=… opens Viber with the message ready and lets
             the sender pick the recipients himself, which is a real send-to-all.
             viber://chat?number=… reaches one person.
   Messenger not possible. m.me needs a Facebook user or page id; a phone number
             cannot address a Messenger thread, so there is no button for it.  */
const CHANNELS = [
  { id:"sms",  name:"SMS",      phoneOnly:true,  bulk:"maybe" },
  { id:"wa",   name:"WhatsApp", phoneOnly:false, bulk:"no"    },
  { id:"viber",name:"Viber",    phoneOnly:false, bulk:"yes"   }
];
function channel(){
  const c = CHANNELS.find(x=>x.id === (DB.settings.channel || "sms"));
  if(c && c.phoneOnly && !onPhone()) return CHANNELS.find(x=>x.id === "wa");
  return c || CHANNELS[0];
}
function channelLink(ch, phone, body){
  const n = String(phone||"").replace(/\D/g,"");
  if(ch.id === "wa")    return "https://wa.me/" + n + "?text=" + encodeURIComponent(body);
  if(ch.id === "viber") return "viber://chat?number=%2B" + n + "&text=" + encodeURIComponent(body);
  return "sms:" + phone + "?&body=" + encodeURIComponent(body);
}
/* One message for everyone: the day's order with nobody's own braces marked,
   because a group message has no "you". */
function commonBody(t){
  const st = DB.settings, day = t.days[S.day];
  const head = smsHead(t, day);
  return [head, "", "ΣΕΙΡΑ ΤΗΣ ΗΜΕΡΑΣ", orderText(t, "", st.smsJudges), "",
          smsFootTxt()].join("\n");
}
/* On a phone this opens the messaging app with the number and the text in it;
   on a laptop there is nothing to open, so it goes to WhatsApp Web and copies
   the text as well. Either way the message is only marked sent once something
   was actually opened. */
function sendOne(t, x){
  if(!x.phone) return toast(tx("Δεν υπάρχει τηλέφωνο για ") + x.name);
  const ch = channel();
  const url = channelLink(ch, x.phone, x.body);
  try{ navigator.clipboard.writeText(x.body); }catch(e){}
  if(ch.id === "sms" || ch.id === "viber"){ location.href = url; }
  else {
    const w = window.open(url, "_blank");
    if(!w) return toast(tx("Ο περιηγητής μπλόκαρε το παράθυρο. Το κείμενο αντιγράφηκε."));
  }
  t.sms[x.key] = "ΕΣΤΑΛΗ"; save(); setTimeout(render, 600);
}
/* One message per κυναγωγός, then one per judge who has a terrain today. The
   key is what `t.sms` is filed under, so a judge does not collide with an entry. */
function smsQueue(t){
  const day = t.days[S.day], out = [], seen = new Set();
  (day.terrains||[]).forEach(tr=>(tr.braces||[]).forEach(b=>{
    [b.a,b.b].forEach(id=>{
      const e = t.entries.find(x=>x.id===id); if(!e) return;
      const key = e.handlerId || e.id; if(seen.has(key)) return; seen.add(key);
      out.push({kind:"handler", key:e.id, name:perName(e.handlerId), entry:e,
                phone:phoneE164((perById(e.handlerId)||{}).phone, (perById(e.handlerId)||{}).country), body:smsBody(t,e)});
    });
  }));
  const judged = new Set();
  (day.terrains||[]).forEach(tr=>(tr.judgeIds||[]).forEach(j=>{
    if(!(tr.braces||[]).length || judged.has(j)) return;
    judged.add(j);
    const jg = judById(j); if(!jg) return;
    out.push({kind:"judge", key:"j:"+j, name:jg.name, judge:jg,
              phone:phoneE164(jg.phone, jg.country), body:judgeSmsBody(t, jg)});
  }));
  return out;
}

function tResults(t){
  const day = t.days[S.day];
  const rows = [];
  day.terrains.forEach(tr=>(tr.braces||[]).forEach(b=>[b.a,b.b].forEach(id=>{
    const e = t.entries.find(x=>x.id===id); if(!e) return;
    /* Άρθρο 40: the συμπληρωματικός runs to complete the brace. He is not in the
       draw, he takes no place and no judge scores him — so he is not on this
       screen, gets no sheet, and never reaches the standings. */
    if(isTrailerEntry(t, e.id)) return;
    const r = t.results[e.id] || {};
    /* The app's arithmetic is advice and clearly subordinate: Άρθρο 27 caps are
       shown as a hint, never as a block. The judge always overrides. */
    const locked = !!(t.signoff||{})[tr.id];
    const notes = t.notes[e.id+"::"+b.id] || {};
    const whites = Math.max(0, ...Object.values(notes).map(n=>n.whites||0));
    const faults = [].concat(...Object.values(notes).map(n=>n.faults||[]));
    const hint = faults.length ? `${tx("Σφάλμα Άρθρου 33 καταγεγραμμένο:")} ${esc(faults.join(", "))}.`
      : whites>=3 ? "3 λευκές φέρμες → αποκλεισμός αν είναι σε διαφορετικές κατευθύνσεις (Άρθρο 27)."
      : whites===2 ? "2 λευκές φέρμες → μέγιστο ΠΟΛΥ ΚΑΛΟΣ (Άρθρο 27)."
      : whites===1 ? "1 λευκή φέρμα δεν εμποδίζει CAC (Άρθρο 27)." : "";
    rows.push(`<tr>
      <td><b>${esc(dogName(e.dogId))}</b><div class="tiny">${esc(tr.name)} ${tx("· ζεύγος")} ${b.no}${b.recall?" · "+txOne("επανάκληση"):""}</div>
        ${hint?`<div class="tiny" style="color:var(--stubble-ink)">${hint}</div>`:""}</td>
      <td><select data-res="${e.id}|qual" ${locked?"disabled":""}>${QUALS.map(q=>
        /* το value μένει ελληνικό: είναι το κλειδί του πίνακα πόντων και ό,τι
           γράφεται στη βάση. Χωρίς αυτό, μια αλλαγή γλώσσας θα αποθήκευε

      <td><select data-res="${e.id}|award" ${locked?"disabled":""}>${AWARDS.map(a=>
        `<option value="${esc(a)}" ${r.award===a?"selected":""}>${esc(a)}</option>`).join("")}</select></td>

      <td class="noprint"><button class="b-sm" data-note="${e.id}::${b.id}">${locked?tx("Προβολή"):tx("Σημειώσεις")}</button></td>
    </tr>`);
  })));
  if(!rows.length) return `<div class="empty">${tx("Κάντε πρώτα την κλήρωση. Η βαθμολογία ακολουθεί τα ζεύγη.")}</div>`;
  const signRows = day.terrains.map(tr=>{
    const sg = (t.signoff||{})[tr.id];
    return `<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line-f)">

    </div>`;
  }).join("");
  return `<div class="note">${tx("Πόντοι = βασικοί πόντοι × συντελεστής")} ${coefficient(t)}
    (${tx(t.format==="ΖΕΥΓΗ"?"ζεύγη":"ατομικός")}${t.wild&&(t.type==="Έρευνας Κυνηγίου"||t.type==="Πρακτικού Κυνηγίου")?", "+tx("άγριο θήραμα"):""}${tx("). Ο πίνακας πόντων είναι δεδομένα και αλλάζει από τις Ρυθμίσεις. Ο κριτής αποφασίζει τη βαθμολογία· οι υποδείξεις της εφαρμογής είναι ενδεικτικές.")}</div>
  <div class="card" style="padding:0"><div class="scroll"><table>

/* The trial ends. Closing it is what moves it from the working list into the

function closeCard(t){
  const done = t.status === CLOSED;
  const scored = t.entries.filter(e=>{ const r = t.results[e.id]; return r && r.qual && r.qual!=="-"; }).length;
  const active = t.entries.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ").length;
  const pts = t.entries.reduce((a,e)=>a + (t.results[e.id] ? pointsFor(t, t.results[e.id]) : 0), 0);
  if(done) return `<div class="card">
    <div class="eyebrow">${tx("Ολοκληρωμένος")}</div>
    <p class="tiny">${tx("Κλείστηκε")} ${esc(t.closedAt||"")}${tx(". Ο αγώνας είναι στο ιστορικό και μετρά στα Στατιστικά:")} ${scored} ${tx("βαθμολογημένοι σκύλοι,")} ${pts} ${tx("πόντοι. Ανοίγει κανονικά για ανάγνωση, εκτύπωση και εξαγωγή.")}</p>
    <div class="row tight" style="margin-top:12px">
      <button data-act="statsFromTrial">${tx("Στατιστικά")}</button>
      <button class="b-warn" data-act="reopenTrial">${tx("Επαναφορά σε εξέλιξη")}</button>
    </div></div>`;
  return `<div class="card">
    <div class="eyebrow">${tx("Ολοκλήρωση")}</div>
    <p class="tiny">${tx("Όταν τελειώσει ο αγώνας, κλείστε τον: περνά στο ιστορικό και τα αποτελέσματά του μένουν στα Στατιστικά.")} ${scored} ${tx("από")} ${active} ${tx("σκύλοι έχουν βαθμολογία.")}</p>
    <div class="row tight" style="margin-top:12px">
      <button class="b-pri" data-act="closeTrial">${tx("Ολοκλήρωση αγώνα")}</button>
    </div></div>`;
}
</script>

<script>
/* ---------- 9. Registry -------------------------------------------------- */
/* Desk mode: dense, the same tokens. A sidebar of counts on the left, the
   register in the middle. */
function vRegistry(){
  const tab = S.regTab || "handlers";
  const dogs = DB.dogs.slice().sort((a,b)=>a.name.localeCompare(b.name,"el"));
  const byBreed = {};
  DB.dogs.forEach(d=>{ byBreed[d.breed||"—"] = (byBreed[d.breed||"—"]||0)+1; });

  const side = `<div class="side noprint">
    <button class="item ${tab==="handlers"?"on":""}" data-regtab="handlers">${tx("Κυναγωγοί")} · ${DB.people.length}</button>
    <button class="item ${tab==="dogs"?"on":""}" data-regtab="dogs">${tx("Σκύλοι")} · ${DB.dogs.length}</button>
    <button class="item ${tab==="judges"?"on":""}" data-regtab="judges">${tx("Κριτές")} · ${DB.judges.length}</button>
    <hr style="margin:16px 20px">
    ${BREED_SECTIONS.map(([k,l])=>{
      /* only the breeds the club actually owns, plus the five αγγλικές always,
         because an empty club still knows which five it is for */
      const list = (k==="2" ? BREEDS_BRIT : BREEDS_CONT).filter(b=>k==="2" || byBreed[b]);
      if(!list.length) return "";
      return `<div class="eyebrow" style="padding:0 20px;margin-top:14px">${tx(l)}</div>
      <div class="tiny" style="padding:8px 20px 0;line-height:1.9">${
        list.map(b=>`${esc(breedName(b))} · ${byBreed[b]||0}`).join("<br>")}</div>`;}).join("")}
    ${(()=>{ const odd = Object.keys(byBreed).filter(b=>b!=="—" && !BREED_FCI[b]);
      return odd.length ? `<div class="eyebrow" style="padding:0 20px;margin-top:14px">${tx("Εκτός καταλόγου")}</div>
        <div class="tiny" style="padding:8px 20px 0;line-height:1.9">${
          odd.map(b=>`${esc(breedName(b))} · ${byBreed[b]}`).join("<br>")}</div>` : ""; })()}
    <div class="tiny" style="padding:12px 20px 0;color:var(--dim)">${tx("Ονοματολογία F.C.I., Ομάδα 7")}</div>
  </div>`;

  const heading = (eyebrow, title, right)=>`<div class="row" style="align-items:flex-end;gap:16px;margin-bottom:18px">
    <div class="grow"><div class="eyebrow">${eyebrow}</div><h2 style="margin:0">${title}</h2></div>${right||""}</div>`;

  let body;
  if(tab === "judges"){
    body = heading(tx("Μητρώο"),tx("Κριτές"),
      `<button class="b-act" data-act="newJudge">${tx("Νέος κριτής")}</button>`)
      + (DB.judges.length ? `<div class="card" style="padding:0"><table>
        <thead><tr><th>${tx("Ονοματεπώνυμο")}</th><th>${tx("Χώρα")}</th><th>${tx("Κινητό")}</th><th>${tx("Ιδιότητα")}</th><th>${tx("Μεγάλη Έρευνα")}</th><th>${tx("Κυναγωγός")}</th><th class="noprint"></th></tr></thead>
        <tbody>${DB.judges.map(j=>`<tr>
          <td><b>${esc(j.name)}</b></td>
          <td>${esc(countryName(j.country)||"—")}</td>
          <td class="num">${esc(phoneE164(j.phone, j.country)||"—")}</td>
          <td>${esc(tx(j.licence||"—"))}</td>
          <td>${j.me?tx("Ναι"):"—"}</td>
          <td>${esc(perName(j.personId))}</td>
          <td class="noprint"><button class="b-sm" data-editjudge="${j.id}">${tx("Επεξεργασία")}</button></td>
        </tr>`).join("")}</tbody></table></div>`
      : `<div class="empty">${tx("Κανένας κριτής ακόμη. Συνδέστε κάθε κριτή με τον κυναγωγό του ίδιου ονόματος, ώστε η κλήρωση να μην βάζει τον σκύλο του στο τερέν που κρίνει (Άρθρο 49).")}</div>`);
  } else if(tab === "handlers"){
    /* The head judge builds the register from the man down: a κυναγωγός, then
       his dogs under him — the same shape as Συμμετοχές, because it is the same
       job. Handlers stay with the club for years; the dogs change around them. */
    const dogsOf = new Map();
    DB.dogs.forEach(d=>{ const k = d.ownerId||"";
      if(!dogsOf.has(k)) dogsOf.set(k, []); dogsOf.get(k).push(d); });
    const dogRow = (d, who)=>{
      const find = ((d.name||"") + " " + (d.reg||"") + " " + (d.breed||"") + " "
        + (d.kennel||"") + " " + who).toLowerCase();
      return `<div class="entry-row" data-find="${esc(find)}">
        <div class="who">
          <button class="open" data-dog="${d.id}">${esc(d.name||"—")}</button>
          <span class="tiny">${esc(breedName(d.breed))}${d.sex?" · "+(d.sex==="Θ"?tx("θηλυκός"):tx("αρσενικός")):""}${
            d.reg?" · "+esc(d.reg):""}</span>
        </div>
        <div class="acts">
          <button class="b-sm noprint" data-editdog="${d.id}">${tx("Επεξ.")}</button>
        </div></div>`;
    };

    const people = DB.people.slice().sort((a,b)=>a.name.localeCompare(b.name,"el"));
    const cards = people.map(p=>{
      const mine = (dogsOf.get(p.id)||[]).slice().sort((a,b)=>a.name.localeCompare(b.name,"el"));
      const bits = [phoneE164(p.phone, p.country) || p.phone,
        p.country && p.country !== HOME_COUNTRY ? countryName(p.country) : "",
        p.member ? tx("μέλος")+" "+p.member : ""].filter(Boolean).join(" · ");
      return `<div class="card handler" data-group="${esc(p.name.toLowerCase())}">
        <div class="row" style="align-items:baseline;gap:10px">
          <h3 class="grow" style="margin:0">${esc(p.name)}</h3>
          ${mine.length?`<span class="muted num">${mine.length} ${
            tx(mine.length===1?"σκύλος":"σκύλοι")}</span>`:""}
        </div>
        ${bits?`<div class="fingerprint">${esc(bits)}</div>`:""}
        <div style="margin-top:10px">${mine.length ? mine.map(d=>dogRow(d, p.name)).join("")
          : `<div class="tiny" style="padding:8px 0">${tx("Καταχωρήστε τον πρώτο του σκύλο.")}</div>`}</div>
        <div class="row tight noprint" style="margin-top:12px">
          <button class="b-sm" data-newdogfor="${p.id}">${tx("+ Σκύλος")}</button>
          <button class="b-sm" data-edithandler="${p.id}">${tx("Επεξεργασία στοιχείων")}</button>
        </div></div>`;
    }).join("");

    const orphans = (dogsOf.get("")||[]).slice().sort((a,b)=>a.name.localeCompare(b.name,"el"));
    const loose = orphans.length ? `<div class="card handler" data-group="χωρίς κυναγωγό">
      <div class="row" style="align-items:baseline;gap:10px">
        <h3 class="grow" style="margin:0">${tx("— χωρίς κυναγωγό —")}</h3>
        <span class="muted num">${orphans.length} ${tx(orphans.length===1?"σκύλος":"σκύλοι")}</span>
      </div>
      <div class="tiny" style="margin-top:4px">${tx("Ανοίξτε τον καθένα με το Επεξ. και δώστε του κυναγωγό.")}</div>
      <div style="margin-top:10px">${orphans.map(d=>dogRow(d, "")).join("")}</div></div>` : "";

    body = heading(tx("Μητρώο"),tx("Κυναγωγοί"),
      `<button class="b-act" data-act="newHandler">${tx("Νέος κυναγωγός")}</button>`)
      + (DB.people.length || orphans.length ? `
        <div class="row noprint" style="margin-bottom:14px">
          <div class="grow" style="max-width:340px">
            <input id="regQ" placeholder="${tx("Αναζήτηση κυναγωγού ή σκύλου")}"
              value="${esc(S.regQ||"")}" oninput="filterReg(this.value)"></div></div>
        <div id="regNone" class="empty" style="display:none">${tx("Κανείς δεν ταιριάζει.")}</div>
        <div class="split wide top">${cards}${loose}</div>`
      : `<div class="empty">${tx("Κανένας κυναγωγός ακόμη. Καταχωρήστε πρώτα τον κυναγωγό και μετά τους σκύλους του, ή εισαγάγετε αρχείο από την καρτέλα Σκύλοι.")}</div>`);
  } else {
    /* Το μητρώο κόβεται πρώτα σε τμήμα και μετά σε φυλή: «δείξε μου τους
       ηπειρωτικούς» είναι η ερώτηση που γίνεται πριν από «δείξε μου τα Βίζλα». */
    const secList = S.regSec === "1" ? BREEDS_CONT : S.regSec === "2" ? BREEDS_BRIT : BREEDS;
    const shown = dogs.filter(d=>
      (!S.regSec || BREED_SECTION(d.breed) === S.regSec) &&
      (!S.regBreed || d.breed === S.regBreed));
    const breedBar = `<div class="row noprint" style="margin:-4px 0 16px;align-items:flex-end">
      <div class="row tight">${BREED_SECTIONS.map(([k,l])=>
        `<button class="tog ${S.regSec===k?"on":""}" data-regbsec="${k}">${tx(l)}</button>`).join("")}</div>
      <div style="flex:1 1 240px;max-width:340px"><label>${tx("Φυλή")}</label>
        <select data-regbreed>${[["",tx("Όλες οι φυλές")]].concat(secList.map(b=>
          [b, breedLabel(b) + " · " + (byBreed[b]||0)])).map(([v,l])=>
          `<option value="${esc(v)}" ${S.regBreed===v?"selected":""}>${esc(l)}</option>`).join("")}</select></div>
      ${(S.regSec||S.regBreed)?`<button class="b-sm" data-act="regClear">${tx("Καθαρισμός")}</button>
        <div class="tiny">${shown.length} ${tx("από")} ${dogs.length}</div>`:""}
    </div>`;
    body = heading(tx("Μητρώο"),tx("Σκύλοι"),
      `<div style="width:300px;max-width:100%"><input id="q" placeholder="${tx("Αναζήτηση ονόματος ή Κ.Ο.Κ.")}"
        oninput="filterDogs(this.value)"></div>
       <button class="b-act" data-act="newDog">${tx("Νέος σκύλος")}</button>`)
      + breedBar
      + (shown.length ? `<div class="card" style="padding:0"><div class="scroll"><table id="dogTbl">
        <thead><tr><th>${tx("Όνομα")}</th><th>${tx("Κ.Ο.Κ.")}</th><th>${tx("Φύλο")}</th><th>${tx("Έτος")}</th><th>${tx("Φυλή")}</th>
          <th>${tx("Χώρα")}</th><th>${tx("Κυναγωγός")}</th><th>${tx("Αγώνες")}</th><th class="noprint"></th></tr></thead>
        <tbody>${shown.map(d=>{
          const n = DB.trials.filter(t=>t.entries.some(e=>e.dogId===d.id)).length;
          return `<tr data-name="${esc((d.name+" "+(d.reg||"")+" "+(d.kennel||"")).toLowerCase())}">
          <td><b>${esc(d.name)}</b>${d.guest?`<span class="chip" style="margin-left:6px">${tx("ΕΠΙΣΚΕΠΤΗΣ")}</span>`:""}${
            /* Λίγοι σκύλοι τρέχουν με εθνική, οπότε σήμα στο όνομα και όχι δική
               της στήλη: μια στήλη με τριάντα παύλες δεν λέει τίποτα. */
            d.natTeam?`<span class="chip y" style="margin-left:6px" title="${esc(countryName(d.natTeam))}">${esc(natTag(d.natTeam))}</span>`:""}${
            d.kennel?`<div class="tiny">${esc(d.kennel)}</div>`:""}</td>
          <td class="num">${esc(d.reg||"—")}</td>
          <td>${esc(sexShort(d.sex)||"—")}</td>
          <td class="num">${d.dob?d.dob.slice(0,4):"—"}</td>
          <td>${esc(breedName(d.breed)||"—")}</td>
          <td>${esc(countryName(d.country)||"—")}</td>
          <td>${d.ownerId ? esc(perName(d.ownerId))
            : `<span class="chip y">${tx("χωρίς κυναγωγό")}</span>`}${
            /* Ο ιδιοκτήτης μπαίνει μόνο όταν είναι άλλος άνθρωπος — αλλιώς η
               στήλη θα έγραφε δύο φορές το ίδιο όνομα σε κάθε γραμμή. */
            d.owner && d.owner !== perName(d.ownerId)
              ? `<div class="tiny">${tx("ιδιοκτήτης")} ${esc(d.owner)}</div>` : ""}</td>
          <td class="num">${n}</td>
          <td class="noprint"><button class="b-sm" data-dog="${d.id}">${tx("Ιστορικό")}</button>
            <button class="b-sm" data-editdog="${d.id}">${tx("Επεξ.")}</button></td></tr>`;}).join("")}
        </tbody></table></div></div>`
      : dogs.length
      ? `<div class="empty">${tx("Κανένας σκύλος με αυτή τη φυλή. Αλλάξτε ή καθαρίστε το φίλτρο.")}</div>`
      : `<div class="empty">${tx("Κανένας σκύλος στο μητρώο. Εισαγάγετε αρχείο Excel ή προσθέστε σκύλο.")}</div>`)
      + `<div class="card">
        <div class="eyebrow">${tx("Εισαγωγή")}</div>
        <p class="tiny">${tx("Excel (.xlsx), Word (.docx, από πίνακα) και CSV. Θα αντιστοιχίσετε μόνοι σας ποια στήλη είναι τι· δεν χρειάζεται συγκεκριμένη σειρά στηλών. Οι σκύλοι που υπάρχουν ήδη ενημερώνονται αντί να διπλογραφούν.")}</p>
        <button class="b-pri" data-act="importDogs">${tx("Επιλογή αρχείου Excel / Word / CSV")}</button></div>`;
  }
  /* the sidebar is a desk affordance; on a phone the same three live in a row */
  const phoneTabs = `<div class="badge-list reg-tabs noprint" style="margin-bottom:16px">
    <button class="tog ${tab==="handlers"?"on":""}" data-regtab="handlers">${tx("Κυναγωγοί")} · ${DB.people.length}</button>
    <button class="tog ${tab==="dogs"?"on":""}" data-regtab="dogs">${tx("Σκύλοι")} · ${DB.dogs.length}</button>
    <button class="tog ${tab==="judges"?"on":""}" data-regtab="judges">${tx("Κριτές")} · ${DB.judges.length}</button>
  </div>`;
  return `<div class="reg">${side}<div class="main">${phoneTabs}${body}</div></div>`;
}
/* Filters in place — re-rendering would drop the keyboard mid-word. A κυναγωγός
   whose dogs all fall out of the search disappears with them, unless his own
   name is what was typed: in the register he may have no dogs yet. */
function filterCards(v, noneId){
  const q = (v||"").trim().toLowerCase();
  document.querySelectorAll("[data-find]").forEach(row=>{
    row.style.display = !q || (row.dataset.find||"").includes(q) ? "" : "none";
  });
  let shown = 0;
  document.querySelectorAll("[data-group]").forEach(g=>{
    const any = [...g.querySelectorAll("[data-find]")].some(r=>r.style.display !== "none");
    const self = !q || (g.dataset.group||"").includes(q);
    const on = any || self;
    g.style.display = on ? "" : "none";
    if(on) shown++;
  });
  const none = el(noneId);
  if(none) none.style.display = (q && !shown) ? "" : "none";
}
function filterEntries(v){ S.entryQ = v || ""; filterCards(v, "entryNone"); }
function filterReg(v){ S.regQ = v || ""; filterCards(v, "regNone"); }
function filterDogs(v){
  v = (v||"").toLowerCase();
  document.querySelectorAll("#dogTbl tbody tr").forEach(tr=>{
    tr.style.display = !v || (tr.dataset.name||"").includes(v) ? "" : "none";
  });
}

/* ---------- 10. Dog history --------------------------------------------- */
function vDog(){
  const d = dogById(S.dogId); if(!d){ S.view="registry"; return vRegistry(); }
  const hist = [];
  DB.trials.forEach(t=>{
    const e = t.entries.find(x=>x.dogId===d.id); if(!e) return;
    let ter="—", no="—";
    t.days.forEach(day=>day.terrains.forEach(tr=>(tr.braces||[]).forEach(b=>{
      if(b.a===e.id||b.b===e.id){ ter=tr.name; no=b.no; }})));
    const r = t.results[e.id]||{};
    const notes = {};
    Object.keys(t.notes||{}).forEach(k=>{
      if(k === e.id || k.startsWith(e.id + "::"))
        Object.entries(t.notes[k]).forEach(([jid,n])=>{ notes[jid + "|" + k] = n; });
    });
    hist.push({t, ter, no, r, notes});
  });
  hist.sort((a,b)=>(b.t.dateStart||"").localeCompare(a.t.dateStart||""));
  const total = hist.reduce((s,h)=>s+pointsFor(h.t,h.r),0);
  /* The page breeders will actually use: a quiet chronological timeline,
     newest first, with what each judge wrote. */
  return `
  <button class="b-sm noprint" data-nav="registry" style="margin-bottom:14px">${tx("‹ Μητρώο")}</button>
  <div class="dog-hd">
    <img src="${BADGE}" alt="">
    <div class="grow" style="min-width:200px">
      <div class="eyebrow">${tx("Ιστορικό σκύλου")}</div>
      <h1>${esc(d.name)}${d.natTeam
        ? ` <span class="chip y" style="vertical-align:middle" title="${esc(countryName(d.natTeam))}">${tx("Εθνική ομάδα")} ${esc(natTag(d.natTeam))}</span>`
        : ""}</h1>
      <div class="meta num">${esc(breedName(d.breed))}${d.sex?" · "+(d.sex==="Θ"?tx("Θηλυκό"):tx("Αρσενικό")):""}${d.dob?" · "+fmtDate(d.dob):""}${d.reg?" · Κ.Ο.Κ. "+esc(d.reg):""}${d.country?" · "+esc(d.country===HOME_COUNTRY?tx("κυπριακής εκτροφής"):countryName(d.country)):""}
        <br>${tx("Κυναγωγός")} ${esc(perName(d.ownerId))}${
          d.owner && d.owner !== perName(d.ownerId) ? " · " + tx("ιδιοκτήτης") + " " + esc(d.owner) : ""}${
          d.kennel?" · εκτροφείο «"+esc(d.kennel)+"»":""}</div>
    </div>
    <div class="score"><b>${total}</b><span>${tx("πόντοι ·")} ${hist.length} ${tx(hist.length===1?"συμμετοχή":"συμμετοχές")}</span></div>
  </div>
  ${hist.map(h=>{
    const q = h.r.qual && h.r.qual!=="-";
    const chip = h.r.award && h.r.award!=="-"
      ? `<span class="chip n">${esc(tx(h.r.qual||""))} · ${esc(h.r.award)}</span>`
      : q ? `<span class="chip o">${esc(tx(h.r.qual))}</span>`
      : `<span class="chip">${tx("χωρίς βαθμολογία")}</span>`;
    const notes = Object.entries(h.notes);
    return `<div class="tl">
      <div class="when"><b>${fmtDate(h.t.dateStart)}</b><span>${esc(h.t.place||"")}</span></div>
      <div class="rail"><i></i></div>
      <div class="what">
        <div class="row" style="align-items:baseline;gap:10px">
          <h3 style="margin:0">${esc(tx(h.t.type))}${h.ter!=="—"?` · ${esc(h.ter)} ${tx("· ζεύγος")} ${h.no}`:" · "+tx("αδιάθετο")}</h3>${chip}</div>
        <div class="meta">${esc(h.t.title)}${h.t.wild?" · άγριο θήραμα":""} ${tx("· συντελεστής ×")}${coefficient(h.t)}</div>
        ${notes.map(([k,n])=>`<div class="said">${noteSummary(n)}
          <cite>${esc((judById(k.split("|")[0])||{}).name||tx("Κριτής"))}</cite></div>`).join("")}
      </div>
      <div class="pts"><b>${pointsFor(h.t,h.r)}</b><span>${tx("πόντοι")}</span></div>
    </div>`;}).join("")
    || `<div class="empty">${tx("Καμία συμμετοχή καταγεγραμμένη ακόμη για αυτόν τον σκύλο.")}</div>`}`;
}
function noteSummary(n){
  const bits=[];
  if(n.passion) bits.push("Πάθος "+n.passion+"/5");
  if(n.method)  bits.push("Μεθοδικότητα "+n.method+"/5");
  if(n.style)   bits.push("Καλπασμός και στυλ "+n.style+"/5");
  if(n.contact) bits.push("Επαφή "+n.contact+"/5");
  if(n.width)   bits.push("Έρευνα "+n.width.toLowerCase());
  if(n.whites)  bits.push("Λευκές φέρμες "+n.whites);
  const pts = (n.points||[]).length ? `<div class="tiny">${tx("Πόντοι:")} ${(n.points||[]).map(p=>
      esc([p.game,p.quality,p.ferma,p.akinF].filter(Boolean).join(" / "))).join(" · ")}</div>` : "";
  const f = (n.faults||[]).length ? `<div class="tiny" style="color:var(--bad)">${tx("Σφάλματα αποκλεισμού:")} ${esc(n.faults.join(", "))}</div>` : "";
  return `${n.text?`<div>${esc(n.text)}</div>`:""}
    <div class="tiny">${esc(bits.join(" · "))||"—"}</div>${pts}${f}`;
}

/* ---------- 11. Stats matrix -------------------------------------------- */
const MONTHS = ["Ιανουάριος","Φεβρουάριος","Μάρτιος","Απρίλιος","Μάιος","Ιούνιος",
                "Ιούλιος","Αύγουστος","Σεπτέμβριος","Οκτώβριος","Νοέμβριος","Δεκέμβριος"];

function statFilter(){ return (S.stat = S.stat || {year:"",month:"",type:"",handler:"",dog:""}); }
function statFilterOn(){ const f = statFilter();
  return !!(f.year || f.month || f.type || f.handler || f.dog); }

/* One slice of the record, cut by the filters and used by both the table and the
   Excel file — what you export is what you are looking at. A trial that ends up
   with nothing in it drops its column instead of standing there empty. */
function statsSlice(){
  const f = statFilter();
  const inScope = DB.trials.slice()
    .filter(t => !f.year  || (t.dateStart||"").slice(0,4) === f.year)
    .filter(t => !f.month || (t.dateStart||"").slice(5,7) === f.month)
    .filter(t => !f.type  || t.type === f.type)
    .sort((a,b)=>(a.dateStart||"").localeCompare(b.dateStart||""));
  const keep = (t,e) => (!f.handler || e.handlerId === f.handler)
                     && (!f.dog     || e.dogId === f.dog);
  const map = {};                       // dogId -> trialId -> points
  inScope.forEach(t=>t.entries.forEach(e=>{
    const r = t.results[e.id]; if(!r || !keep(t,e)) return;
    (map[e.dogId] = map[e.dogId]||{})[t.id] = pointsFor(t,r);
  }));
  const dogIds = Object.keys(map).sort((a,b)=>dogName(a).localeCompare(dogName(b),"el"));
  const trials = inScope.filter(t => dogIds.some(id => map[id][t.id] !== undefined));
  return {trials, map, dogIds, keep, f};
}

/* The dropdowns only offer what is actually in the record — a month with no
   αγώνας in it is not a choice, it is a dead end. */
function statsOptions(){
  const years = [], months = [], types = [], dogs = [], handlers = [];
  DB.trials.forEach(t=>{
    const y = (t.dateStart||"").slice(0,4), m = (t.dateStart||"").slice(5,7);
    if(y && !years.includes(y)) years.push(y);
    if(m && !months.includes(m)) months.push(m);
    if(t.type && !types.includes(t.type)) types.push(t.type);
    t.entries.forEach(e=>{
      if(!t.results[e.id]) return;
      if(e.dogId && !dogs.includes(e.dogId)) dogs.push(e.dogId);
      if(e.handlerId && !handlers.includes(e.handlerId)) handlers.push(e.handlerId);
    });
  });
  years.sort().reverse(); months.sort();
  dogs.sort((a,b)=>dogName(a).localeCompare(dogName(b),"el"));
  handlers.sort((a,b)=>perName(a).localeCompare(perName(b),"el"));
  return {years, months, types, dogs, handlers};
}

/* The filter written out, for the screen and for the Excel sheet that records
   which slice produced the file. */
function statsFilterText(){
  const f = statFilter(), b = [];
  if(f.year)    b.push("έτος " + f.year);
  if(f.month)   b.push(tx(MONTHS[+f.month-1] || f.month));
  if(f.type)    b.push(f.type);
  if(f.handler) b.push("κυναγωγός " + perName(f.handler));
  if(f.dog)     b.push("σκύλος " + dogName(f.dog));
  return b.join(" · ") || "χωρίς φίλτρο";
}

/* Από εδώ περνούν σχεδόν όλες οι ετικέτες και οι λίστες της εφαρμογής, οπότε εδώ
   μπαίνει η μετάφραση μια φορά αντί για εκατό. Η ΤΙΜΗ της επιλογής δεν αγγίζεται
   ποτέ: αυτή γράφεται στη βάση και πάνω της στέκουν ο πίνακας πόντων, τα φίλτρα
   και οι εξαγωγές. Αλλάζει μόνο το κείμενο που διαβάζεται. Ονόματα σκύλων και
   ανθρώπων περνούν κι αυτά, δεν βρίσκονται στο λεξικό, και βγαίνουν όπως μπήκαν. */
/* Το γλωσσάρι δίνει κάθε παραλλαγή που στέκει στον κανονισμό — «richiamo, turno
   di richiamo», «brace, couple». Σε πίνακα και σε λεξικό αυτό είναι σωστό. Μέσα
   σε πρόταση διαβάζεται σαν λάθος, οπότε εκεί μπαίνει η πρώτη, που είναι εξίσου
   αυθεντική. Και ένα κεφαλαίο αρχικό όπου ο όρος στέκει ως επικεφαλίδα: αλλαγή
   τυπογραφική, όχι μεταφραστική. */
const txOne = s => tx(s).split(", ")[0];
const txCap = s => { const v = txOne(s); return v.charAt(0).toUpperCase() + v.slice(1); };
/* Το θήραμα είναι ελεύθερο κείμενο — ο γραμματέας μπορεί να γράψει ό,τι πέταξε
   εκείνη τη μέρα. Τα πέντε συνηθισμένα όμως τα ξέρουμε, οπότε διαβάζονται στη
   γλώσσα της οθόνης και ξαναγράφονται ελληνικά στη βάση. Ό,τι δεν αναγνωρίζεται
   μένει όπως γράφτηκε. */
const GAMES = ["Πέρδικα","Φραγκολίνα","Μπεκάτσα","Ορτύκι","Άλλο"];
function gameToGreek(v){
  const t = String(v||"").trim();
  if(!t) return t;
  const k = t.toLowerCase();
  for(const g of GAMES){
    if(g.toLowerCase() === k) return g;
    for(const L of ["en","fr","de","it","es"]){
      const x = STR[L] && STR[L][g];
      if(x && x.toLowerCase() === k) return g;
    }
  }
  return t;
}

/* Χώρα and κινητό belong side by side: the country is what tells the app which
   code to put in front of a number nobody writes a code on. `data-dial` lets the

   σκύλος the same list is just a country and «Ιταλία +39» reads as noise. */
/* Οι χώρες των γλωσσών που μιλά η εφαρμογή. Μία ανά γλώσσα — και δύο για τα
   ελληνικά, γιατί δύο χώρες τα μιλούν και ο όμιλος δουλεύει και με τις δύο.
   Ό,τι γλώσσα προστεθεί στο LANGS θέλει και μια γραμμή εδώ, αλλιώς η χώρα της
   πέφτει σιωπηλά στον υπόλοιπο κόσμο. */
const LANG_HOME = { el:["CY","GR"], en:["GB"], fr:["FR"], de:["DE"], it:["IT"], es:["ES"] };
const APP_COUNTRIES = new Set([].concat(...LANGS.map(([k]) => LANG_HOME[k] || [])));
function countryPicker(id, val, label, noDial){
  /* Δύο ομάδες. Πάνω οι χώρες των γλωσσών της εφαρμογής — από εκεί έρχονται οι
     κυναγωγοί που ταξιδεύουν σε αγώνα του ομίλου. Κάτω ο υπόλοιπος κόσμος. Και
     οι δύο αλφαβητικά στη γλώσσα που διαβάζεται: ο Ιταλός ψάχνει τη Germania
     στο G, ο Έλληνας τη Γερμανία στο Γ. */
  const L = (DB.settings||{}).lang || "el";
  const named = COUNTRIES.map(c=>[c[0], countryName(c[0]) || c[1], c[2]]);
  const byName = (a,b)=>a[1].localeCompare(b[1], L);
  const head = named.filter(c=>APP_COUNTRIES.has(c[0])).sort(byName);
  const rest = named.filter(c=>!APP_COUNTRIES.has(c[0])).sort(byName);
  /* undefined is a record that predates the field, or a new one — Κύπρος.
     An empty string is a deliberate "not stated" and stays that way. */
  const cur = val === undefined ? defaultCountry() : val;
  /* Η σημαία μπροστά, το όνομα από πίσω — και η ΣΕΙΡΑ μένει στο όνομα: αν
     ταξινομούσαμε το κείμενο όπως φαίνεται, θα ταξινομούσαμε τις σημαίες.
     Όπου η σημαία δεν αποδίδεται (Windows) μένει το όνομα, που είναι και η
     πληροφορία. */
  const opt = c => `<option value="${esc(c[0])}" ${String(cur)===String(c[0])?"selected":""}>${
    esc([flagOf(c[0]), noDial ? c[1] : c[1] + " +" + c[2]].filter(Boolean).join(" "))}</option>`;
  const group = (lbl, list) => list.length
    ? `<optgroup label="${esc(tx(lbl))}">${list.map(opt).join("")}</optgroup>` : "";
  return `<div class="grow"><label>${esc(tx(label || "Χώρα"))}</label>
    <select id="${id}" data-dial="${id}">
      <option value="" ${cur?"":"selected"}>—</option>
      ${group("Με γλώσσα της εφαρμογής", head)}
      ${group("Υπόλοιπος κόσμος", rest)}
    </select></div>`;
}
function phoneField(id, val, countryId, label){
  return `<div class="grow"><label>${label || tx("Κινητό")}</label>
    <input id="${id}" type="tel" value="${esc(val??"")}" data-phone="${countryId}">
    <div class="tiny" id="${id}_hint"></div></div>`;
}
/* Runs after the dialog is in the DOM: fills every hint, and keeps it in step. */
function wireCountry(root){
  (root || document).querySelectorAll("[data-phone]").forEach(inp=>{
    const cs = el(inp.dataset.phone), hint = el(inp.id + "_hint");
    if(!cs || !hint) return;
    const paint = ()=>{
      const d = dialOf(cs.value);
      const shown = phoneE164(inp.value, cs.value);
      hint.textContent = inp.value.trim()
        ? tx("Αποστολή προς") + " " + (shown || "—")
        : (d ? tx("Τοπικός αριθμός· θα σταλεί ως") + " +" + d + "…" : tx("Γράψτε τον αριθμό με +"));
    };
    inp.addEventListener("input", paint);
    cs.addEventListener("change", paint);
    paint();
  });
}

/* Assigning dogs to a terrain by hand.
   The draw engine has always honoured `terrain.assigned` + `entryIds` — it just
   had no way to be told. Anything left unassigned still falls to the draw, so
   the head judge can pin two or three dogs and let the rest sort themselves. */
function dlgAssign(t, terrainId){
  const day = t.days[S.day];
  const tr = day.terrains.find(x=>x.id===terrainId); if(!tr) return;
  const here = new Set(tr.entryIds||[]);
  const whereElse = {};
  day.terrains.forEach(o=>{ if(o.id!==tr.id) (o.entryIds||[]).forEach(id=>{ whereElse[id] = o.name; }); });
  const active = t.entries.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ");

  /* A dog runs on one terrain. One already on another is shown but cannot be
     taken from here — the head judge frees him there first, so a dog is never
     quietly pulled out of a terrain he was put in on purpose. */
  const rows = active.map(e=>{
    const d = dogById(e.dogId) || {};
    const conflict = judgeConflict(tr, e, t);
    const taken = whereElse[e.id];
    return `<button class="tog assign ${here.has(e.id)?"on":""}" data-pick="${e.id}"
      ${taken?"disabled":""}
      style="width:100%;justify-content:flex-start;text-align:left;min-height:52px;margin-bottom:6px${
        taken?";opacity:.5":""}">
      <span style="flex:1;min-width:0">
        <b style="display:block;font:600 17px/1.2 var(--f-b)">${esc(d.name||"—")}</b>
        <span class="tiny" style="color:inherit;opacity:.75">${esc(breedName(d.breed))}${d.sex?" · "+d.sex:""} · ${esc(perName(e.handlerId))}</span>
      </span>
      ${taken?`<span class="chip n" style="flex:none">${esc(taken)}</span>`:""}
      ${conflict?`<span class="chip r" style="flex:none">${tx("ΑΡΘΡΟ 49")}</span>`:""}
    </button>`;
  }).join("");
  const elsewhereN = active.filter(e=>whereElse[e.id]).length;

  dlg(`<div class="eyebrow">${esc(tr.name)}</div>
  <h2>${tx("Ανάθεση σκύλων")}</h2>
  <p class="muted">${tx("Επιλέξτε ποιοι σκύλοι τρέχουν σε αυτό το τερέν. Όσοι δεν ανατεθούν πουθενά κατανέμονται από την κλήρωση.")}</p>
  ${elsewhereN?`<div class="note" style="margin-top:12px">${tx("Ένας σκύλος τρέχει σε ένα μόνο τερέν.")}
    ${elsewhereN} ${elsewhereN===1?"σκύλος είναι":"σκύλοι είναι"} ${tx("ήδη σε άλλο τερέν και")}
    ${elsewhereN===1?"εμφανίζεται":"εμφανίζονται"} ${tx("κλειδωμένοι· βγάλτε τους από εκεί πρώτα.")}</div>`:""}
  ${active.length ? `<div style="max-height:52vh;overflow:auto;margin-top:14px">${rows}</div>`
    : `<div class="empty">${tx("Καμία δηλωμένη συμμετοχή. Προσθέστε συμμετοχές πρώτα.")}</div>`}
  <div class="err" id="assignWarn" style="display:none;margin-top:12px"></div>
  <div class="row" style="margin-top:16px">
    <button class="b-pri grow" data-act="saveAssign" data-id="${tr.id}">${tx("Αποθήκευση")}</button>
    <button class="grow" data-act="close">${tx("Άκυρο")}</button></div>`);
  window._assign = { terrainId: tr.id, picked: new Set(here) };
  assignWarn(t);
}
/* Άρθρο 49 is a hard constraint in the draw, so say so while he is choosing
   rather than letting the draw refuse afterwards. */
function assignWarn(t){
  const A = window._assign; if(!A) return;
  const tr = t.days[S.day].terrains.find(x=>x.id===A.terrainId);
  const bad = [...A.picked].map(id=>t.entries.find(e=>e.id===id))
    .filter(e=>e && judgeConflict(tr, e, t)).map(e=>dogName(e.dogId));
  const w = el("assignWarn"); if(!w) return;
  if(!bad.length){ w.style.display = "none"; return; }
  w.style.display = "";
  w.innerHTML = `<b>${tx("Ο κριτής του τερέν έχει δικό του σκύλο εδώ (Άρθρο 49):")}</b> ${esc(bad.join(", "))}${tx(". Η κλήρωση θα τους μετακινήσει αλλού.")}`;
}

/* True for the dog filling out a brace as a συμπληρωματικός. Checked by entry
   id across every day, because the same dog may be a real entry elsewhere. */
function isTrailerEntry(t, entryId){
  return (t.days||[]).some(day=>(day.terrains||[]).some(tr=>(tr.braces||[])
    .some(b=>b.trailer && b.b === entryId)));
}
function femaleEntry(e){
  const d = dogById(e && e.dogId ? e.dogId : (DB.dogs[0]||{}).id);
  return d && d.sex === "Θ";
}
/* Which dogs belong to a handler: the ones he owns, plus any he has run in a
   previous trial. A handler often brings someone else's dog, and the club's
   handlers outlast the dogs by years — which is why this screen asks for the
   handler first and lets him narrow the list, rather than making the head
   judge find a dog among a hundred and hope the owner comes out right. */
function dogsForHandler(hid){
  const byName = (a,b)=>a.name.localeCompare(b.name,"el");
  if(!hid) return { own: [], rest: DB.dogs.filter(d=>!d.guest).sort(byName) };
  const handled = new Set();
  DB.trials.forEach(t=>t.entries.forEach(en=>{ if(en.handlerId === hid) handled.add(en.dogId); }));
  const own = DB.dogs.filter(d=>!d.guest && (d.ownerId === hid || handled.has(d.id))).sort(byName);
  const ownIds = new Set(own.map(d=>d.id));
  return { own, rest: DB.dogs.filter(d=>!d.guest && !ownIds.has(d.id)).sort(byName) };
}
function dogSelect(hid, selId){
  const { own, rest } = dogsForHandler(hid);
  const opt = d => `<option value="${d.id}" ${selId===d.id?"selected":""}>${esc(d.name)}${
    d.breed?" ("+esc(breedName(d.breed))+")":""}</option>`;
  return `<select id="e_dog">
    <option value="">${tx("— επιλέξτε σκύλο —")}</option>
    ${own.length?`<optgroup label="Σκύλοι του κυναγωγού">${own.map(opt).join("")}</optgroup>`:""}
    ${rest.length?`<optgroup label="${tx(own.length?"Άλλοι σκύλοι":"Όλοι οι σκύλοι")}">${rest.map(opt).join("")}</optgroup>`:""}
  </select>`;
}
/* If the handler has exactly one dog that is not already entered, that is
   almost certainly the one — offer it rather than making him pick it. */
function dogHint(hid){
  if(!DB.dogs.length) return "Το μητρώο σκύλων είναι άδειο. Προσθέστε τον σκύλο με το + Νέος.";
  if(hid && !dogsForHandler(hid).own.length)
    return "Ο κυναγωγός δεν έχει σκύλο στο μητρώο. Επιλέξτε από τους υπόλοιπους ή προσθέστε νέο.";
  return tx("Πρώτοι στη λίστα οι σκύλοι που έχει ή έχει τρέξει.");
}
/* The whole field in one table. The head judge has the entry list in front of
   him — a sheet, a WhatsApp thread, a queue of men at a table — and works down
   it, so the screen is the same shape: every κυναγωγός in the club with his dogs
   under him, a tick against each. One pass, one save, and the draw can run.
   The per-κυναγωγός screen stays for the man who turns up late. */
function dlgField(t){
  window._field = new Set(t.entries.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ").map(e=>e.dogId));
  window._fieldHandler = {};
  t.entries.forEach(e=>{ window._fieldHandler[e.dogId] = e.handlerId || ""; });
  dlg(`<h2>${tx("Δηλώσεις ημέρας")}</h2>
  <p class="muted">${tx("Σημειώστε ποιοι σκύλοι τρέχουν σήμερα. Κάθε σκύλος μπαίνει με τον κυναγωγό κάτω από τον οποίο βρίσκεται.")}</p>
  <div class="row noprint" style="margin-top:14px">
    <div class="grow"><input id="fieldQ" placeholder="${tx("Αναζήτηση κυναγωγού ή σκύλου")}"
      oninput="filterCards(this.value, 'fieldNone')"></div></div>
  <div id="fieldNone" class="empty" style="display:none;margin-top:8px">${tx("Κανείς δεν ταιριάζει.")}</div>
  <div id="fieldList" style="max-height:52vh;overflow:auto;margin-top:10px">${fieldList(t)}</div>
  <div id="fieldSum" class="note" style="margin-top:12px">${fieldSummary(t)}</div>
  <div class="row" style="margin-top:14px">
    <button class="b-pri grow" data-act="saveField">${tx("Αποθήκευση")}</button>
    <button class="grow" data-act="close">${tx("Άκυρο")}</button></div>`);
}
/* Every κυναγωγός with dogs, plus any dog with none, in one list. A dog already
   drawn or scored is locked — taking him out is a withdrawal and belongs in the
   entry's own form, where the status is recorded. */
function fieldList(t){
  const picked = window._field;
  const drawn = new Set();
  t.days.forEach(day=>(day.terrains||[]).forEach(tr=>(tr.braces||[]).forEach(b=>{
    if(b.a) drawn.add(b.a); if(b.b) drawn.add(b.b); })));
  const locked = new Set();
  t.entries.forEach(e=>{
    const r = t.results[e.id];
    if(drawn.has(e.id) || (r && r.qual && r.qual !== "-")) locked.add(e.dogId);
  });

  const byName = (a,b)=>a.name.localeCompare(b.name,"el");
  const dogsOf = new Map();
  /* a guest came in only to fill somebody's brace, so he is not on offer here */
  DB.dogs.filter(d=>!d.guest).forEach(d=>{ const k = d.ownerId||"";
    if(!dogsOf.has(k)) dogsOf.set(k,[]); dogsOf.get(k).push(d); });
  const groups = DB.people.slice().sort(byName)
    .map(p=>({ id:p.id, name:p.name, dogs:(dogsOf.get(p.id)||[]).slice().sort(byName) }))
    .filter(g=>g.dogs.length);
  if((dogsOf.get("")||[]).length)
    groups.push({ id:"", name:"— χωρίς κυναγωγό —", dogs:(dogsOf.get("")||[]).slice().sort(byName) });
  if(!groups.length) return `<div class="empty">${tx("Το μητρώο είναι άδειο. Καταχωρήστε πρώτα κυναγωγούς και σκύλους, ή εισαγάγετε αρχείο.")}</div>`;

  return groups.map(g=>{
    const on = g.dogs.filter(d=>picked.has(d.id)).length;
    const all = g.dogs.every(d=>picked.has(d.id));
    const rows = g.dogs.map(d=>{
      const yes = picked.has(d.id), lock = locked.has(d.id);
      const find = ((d.name||"") + " " + (d.reg||"") + " " + (d.breed||"") + " " + g.name).toLowerCase();
      return `<div class="entry-row" data-find="${esc(find)}">
        <button class="tick ${yes?"on":""}" ${lock?"disabled":""}
          data-ftick="${d.id}" aria-label="${tx("Επιλογή")}">${yes?"✓":""}</button>
        <div class="who">
          <b>${esc(d.name)}</b>
          <span class="tiny">${esc(breedName(d.breed))}${d.sex?" · "+(d.sex==="Θ"?tx("θηλυκός"):tx("αρσενικός")):""}${
            d.reg?" · "+esc(d.reg):""}</span>
        </div>
        ${lock?`<div class="acts"><span class="chip n">${tx("ΚΛΗΡΩΜΕΝΟΣ")}</span></div>`:""}
      </div>`;
    }).join("");
    return `<div class="card handler" data-group="${esc(g.name.toLowerCase())}" style="margin-bottom:10px">
      <div class="row" style="align-items:center;gap:10px">
        <button class="tick ${all?"on":""}" data-fall="${g.id}"
          aria-label="${tx("Όλοι του")}">${all?"✓":""}</button>
        <h3 class="grow" style="margin:0">${esc(g.name)}</h3>
        <span class="muted num">${on}/${g.dogs.length}</span>
      </div>
      <div style="margin-top:8px">${rows}</div>
    </div>`;
  }).join("");
}
/* The two minimums are the reason this screen exists, so they are on it. */
function fieldSummary(t){
  const n = window._field.size;
  const braces = Math.ceil(n/(t.format==="ΖΕΥΓΗ"?2:1));
  const men = new Set([...window._field]
    .map(id=>window._fieldHandler[id] || (dogById(id)||{}).ownerId || "")).size;
  const ok = n >= 6 && braces >= 3;
  return `<b>${n} ${tx(n===1?"σκύλος":"σκύλοι")} ${tx("από")} ${men} ${tx(men===1?"κυναγωγό":"κυναγωγούς")}</b>
    · ${braces} ${tx(t.format==="ΖΕΥΓΗ"?"ζεύγη":"διαδρομές")}.
    ${ok ? tx("Πληρούνται τα ελάχιστα: 6 σκύλοι και 3 ζεύγη.")
         : "Χρειάζονται τουλάχιστον 6 σκύλοι και 3 ζεύγη (ΕΚ Άρθρο 5, Άρθρο 40)."}`;
}

/* A κυναγωγός turns up with three dogs and says which two are running today.
   That is one conversation, so it is one screen: pick the man, tick the dogs.
   The one-at-a-time form stays for editing a single entry — status, πληρωμή,
   οίστρος — which is a different job. */
function dlgHandlerEntries(t, hid){
  hid = hid || window._batchH || "";
  window._batchH = hid;
  dlg(`<h2>${tx("Συμμετοχές κυναγωγού")}</h2>
  <p class="muted">${tx("Επιλέξτε τον κυναγωγό και σημειώστε ποιοι σκύλοι του τρέχουν σήμερα.")}</p>
  <div class="row" style="margin-top:14px">
    <div class="grow"><label>${tx("Κυναγωγός")}</label>
      <select id="b_handler">
        <option value="">${tx("— επιλέξτε κυναγωγό —")}</option>
        ${DB.people.slice().sort((a,b)=>a.name.localeCompare(b.name,"el"))
          .map(p=>`<option value="${p.id}" ${hid===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}
      </select></div>
    <button class="b-sm" style="align-self:flex-end" data-act="newHandlerForBatch">${tx("+ Νέος")}</button></div>
  <div id="b_list" style="margin-top:14px">${batchList(t, hid)}</div>
  <div class="row" style="margin-top:16px">
    <button class="b-pri grow" data-act="saveBatch">${tx("Αποθήκευση")}</button>
    <button class="grow" data-act="close">${tx("Άκυρο")}</button></div>`);
}
/* His own dogs, plus any he has run before. A dog already drawn or scored
   cannot be un-ticked here — that is a withdrawal, and it belongs in the
   entry's own form where the status is recorded. */
function batchList(t, hid){
  if(!hid) return `<div class="empty">${tx("Επιλέξτε κυναγωγό για να δείτε τους σκύλους του.")}</div>`;
  const { own } = dogsForHandler(hid);
  const drawn = new Set();
  t.days.forEach(day=>(day.terrains||[]).forEach(tr=>(tr.braces||[]).forEach(b=>{
    if(b.a) drawn.add(b.a); if(b.b) drawn.add(b.b); })));
  const rows = own.map(d=>{
    const en = t.entries.find(x=>x.dogId === d.id);
    const other = en && en.handlerId !== hid;              /* entered under someone else */
    const res = en && t.results[en.id];
    const locked = en && (drawn.has(en.id) || (res && res.qual && res.qual !== "-"));
    const on = !!en && !other;
    return `<button class="tog assign ${on?"on":""}" ${locked||other?"disabled":""}
      data-btick="${d.id}" style="width:100%;justify-content:flex-start;text-align:left;
      min-height:52px;margin-bottom:6px${locked||other?";opacity:.55":""}">
      <span style="flex:1;min-width:0">
        <b style="display:block;font:600 17px/1.2 var(--f-b)">${esc(d.name)}</b>
        <span class="tiny" style="color:inherit;opacity:.75">${esc(breedName(d.breed))}${
          d.sex?" · "+(d.sex==="Θ"?tx("θηλυκός"):tx("αρσενικός")):""}${d.reg?" · "+esc(d.reg):""}</span>
      </span>
      ${other?`<span class="chip" style="flex:none">${esc(perName(en.handlerId))}</span>`
        :locked?`<span class="chip n" style="flex:none">${tx("ΚΛΗΡΩΜΕΝΟΣ")}</span>`:""}
    </button>`;
  }).join("");
  return (rows ? `<div style="max-height:46vh;overflow:auto">${rows}</div>`
    : `<div class="empty">${tx("Ο κυναγωγός δεν έχει σκύλο στο μητρώο.")}</div>`)
    + `<button class="b-sm noprint" style="margin-top:8px" data-act="newDogForBatch">${tx("+ Σκύλος")}</button>`;
}
/* Redrawn in place: a render() would close the dialog, and the head judge is
   halfway down a list of eighty dogs with a search term typed. */
function redrawField(t){
  const list = el("fieldList"), sum = el("fieldSum"), q = el("fieldQ");
  if(!list) return;
  list.innerHTML = fieldList(t);
  if(sum) sum.innerHTML = fieldSummary(t);
  if(q && q.value) filterCards(q.value, "fieldNone");
}
function suggestDog(t, hid, current){
  if(current) return current;
  const { own } = dogsForHandler(hid);
  const free = own.filter(d=>!t.entries.some(en=>en.dogId === d.id));
  return free.length === 1 ? free[0].id : "";
}
function dlgEntry(t, e){
  e = e || {};
  const draft = window._entryDraft || {};
  const hid = e.handlerId || draft.handlerId || "";
  const did = e.dogId || draft.dogId || suggestDog(t, hid, "");
  window._entryDraft = null;
  dlg(`<h2>${e.id?tx("Επεξεργασία συμμετοχής"):tx("Νέα συμμετοχή")}</h2>
  <p class="muted">${tx("Πρώτα ο κυναγωγός, μετά ο σκύλος: οι κυναγωγοί μένουν χρόνια, οι σκύλοι αλλάζουν.")}</p>
  <div class="row" style="margin-top:14px">
    <div class="grow"><label>${tx("Κυναγωγός")}</label>
      <select id="e_handler">
        <option value="">${tx("— επιλέξτε κυναγωγό —")}</option>
        ${DB.people.slice().sort((a,b)=>a.name.localeCompare(b.name,"el"))
          .map(p=>`<option value="${p.id}" ${hid===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}
      </select></div>
    <button class="b-sm" style="align-self:flex-end" data-act="newHandlerForEntry">${tx("+ Νέος")}</button></div>
  <div class="row">
    <div class="grow"><label>${tx("Σκύλος")}</label><span id="e_dogWrap">${dogSelect(hid, did)}</span></div>
    <button class="b-sm" style="align-self:flex-end" data-act="newDogForEntry">${tx("+ Νέος")}</button></div>
  <div class="tiny" id="e_dogHint">${dogHint(hid)}</div>
  <div class="row" style="margin-top:14px">${sel("e_status","Κατάσταση",["ΔΗΛΩΜΕΝΟΣ","ΑΠΟΣΥΡΘΗΚΕ","ΑΠΩΝ","ΣΥΜΠΛΗΡΩΜΑΤΙΚΟΣ"],e.status||"ΔΗΛΩΜΕΝΟΣ")}
    ${sel("e_paid","Πληρωμένο",[["1","Ναι"],["0","Όχι"]],e.paid?"1":"0")}</div>
  <div class="row" id="e_seasonRow" style="display:${femaleEntry({dogId:did})?"flex":"none"}">
    ${sel("e_season","Σε οίστρο (Άρθρο 9)",[["0","Όχι"],["1","Ναι"]],e.season?"1":"0")}</div>
  <div class="row" style="margin-top:14px">
    <button class="b-pri grow" data-act="saveEntry" data-id="${e.id||""}">${tx("Αποθήκευση")}</button>
    <button class="grow" data-act="close">${tx("Άκυρο")}</button>
    ${e.id?`<button class="b-warn" data-act="delEntry" data-id="${e.id}">${tx("Διαγραφή")}</button>`:""}</div>`);
}

function dlgTrailer(t, terrainId, braceId){
  const drawn = new Set();
  t.days[S.day].terrains.forEach(tr=>(tr.braces||[]).forEach(b=>{ drawn.add(b.a); if(b.b) drawn.add(b.b); }));
  const opts = DB.dogs.slice().sort((a,b)=>a.name.localeCompare(b.name,"el"))
    .map(d=>{ const e = t.entries.find(x=>x.dogId===d.id);
      const used = e && drawn.has(e.id);
      return [d.id, d.name + " (" + breedName(d.breed) + ")" + (used ? " — τρέχει ήδη" : e ? " — δηλωμένος" : "")]; });
  dlg(`<h2>${tx("Προσθήκη συμπληρωματικού")}</h2>
  <p class="muted">${tx("Ο αριθμός σκύλων είναι μονός. Επιλέξτε σκύλο για να συμπληρωθεί το τελευταίο ζεύγος. Ο συμπληρωματικός τρέχει για να ολοκληρωθεί η διαδρομή· δεν μπαίνει στην κλήρωση, δεν προσμετρά στα ελάχιστα ζεύγη και δεν βαθμολογείται.")}</p>
  <div class="row">${sel("tl_dog","Σκύλος από το μητρώο",
    [["","— εκτός μητρώου —"]].concat(opts))}</div>
  <div class="row">${sel("tl_handler","Κυναγωγός",
    [["","—"]].concat(DB.people.slice().sort((a,b)=>a.name.localeCompare(b.name,"el"))
      .map(p=>[p.id,p.name])))}</div>
  <hr><div class="tiny">${tx("Ένας σκύλος που δεν είναι στο μητρώο ούτε δηλωμένος σήμερα μπορεί να τρέξει ως συμπληρωματικός. Γράψτε το όνομά του εδώ και αφήστε το πεδίο πιο πάνω κενό.")}</div>
  <div class="row" style="margin-top:10px">${fld("tl_name","Όνομα σκύλου εκτός μητρώου")}
    ${fld("tl_hname","Κυναγωγός (αν δεν είναι στη λίστα)")}</div>
  <div class="row" style="margin-top:12px">
    <button class="b-pri grow" data-act="saveTrailer" data-id="${terrainId}|${braceId}">${tx("Προσθήκη")}</button>
    <button class="grow" data-act="close">${tx("Άκυρο")}</button></div>`);
}

/* Structured judge notes — field mode, and the hardest screen. Chips and
   steppers, not dropdowns: a point is three taps. The Άρθρο 33 faults sit
   behind a red border and need a second confirmation, because eliminating a
   dog is serious. */
const WHITE_HINTS = [
  "Καμία λευκή φέρμα.",
  "Μία λευκή δεν εμποδίζει CAC (Άρθρο 27).",
  "Δύο λευκές: μέγιστο ΠΟΛΥ ΚΑΛΟΣ (Άρθρο 27).",
  "Τρεις λευκές σε διαφορετικές κατευθύνσεις: αποκλεισμός (Άρθρο 27)."
];
function dlgNote(t, runKey){
  const entryId = runKey.split("::")[0];
  if(isTrailerEntry(t, entryId))
    return alert(tx("Ο συμπληρωματικός τρέχει για να ολοκληρωθεί το ζεύγος. ")
      + "Δεν βαθμολογείται και δεν κρατούνται σημειώσεις γι' αυτόν (Άρθρο 40).");
  const jid = S.judgeFilter || (DB.judges[0]||{}).id || "head";
  const n = ((t.notes[runKey]||{})[jid]) || {points:[],faults:[]};
  const entry = t.entries.find(e=>e.id===entryId) || {};

  /* where the dog stands and in which brace — the judge is holding the phone
     next to the dog and needs to know he is writing on the right sheet */
  let where = "";
  (t.days[S.day].terrains||[]).forEach(tr=>(tr.braces||[]).forEach(b=>{
    if(b.id !== runKey.split("::")[1]) return;
    where = `${tr.name} ${tx("· ζεύγος")} ${b.no} · ${b.a===entryId?"δεξιά":"αριστερά"} ${tx("της επιτροπής")}`
      + (b.recall ? " · επανάκληση" : "");
  }));

  const scale = (k,label,v)=>`<div style="margin-bottom:14px">
    <div style="font-size:17px">${label}</div>
    <div class="scale" style="margin-top:8px">${[1,2,3,4,5].map(i=>
      `<button class="tog ${v===i?"on":""}" data-nset="${k}|${i}">${i}</button>`).join("")}</div></div>`;
  const widths = ["Στενή","Κανονική","Ανοικτή","Πολύ ανοικτή"];
  const w = n.whites||0;

  /* a signed terrain is read-only: the sheet can be read, not rewritten */
  let signedBy = null;
  (t.days[S.day].terrains||[]).forEach(tr=>{
    if((tr.braces||[]).some(b=>b.id === runKey.split("::")[1]) && (t.signoff||{})[tr.id])
      signedBy = (t.signoff||{})[tr.id];
  });
  if(signedBy){
    dlg(`<h2 style="margin-bottom:2px">${esc(dogName(entry.dogId))}</h2>
      <div class="tiny" style="margin-bottom:16px">${esc(where||"")}</div>
      <div class="note"><b>${tx("Το τερέν είναι υπογεγραμμένο.")}</b> ${tx("Υπογραφή από")} ${esc(signedBy.by)},
        ${esc(signedBy.at)}${tx(". Οι σημειώσεις δεν αλλάζουν χωρίς ξεκλείδωμα από τον Πρόεδρο Κριτών (Βαθμολογία → Ξεκλείδωμα).")}</div>
      <div class="card">${noteSummary(n)}</div>
      <button class="b-full" data-act="close">${tx("Κλείσιμο")}</button>`);
    return;
  }
  dlg(`<h2 style="margin-bottom:2px">${esc(dogName(entry.dogId))}</h2>
  <div class="tiny" style="margin-bottom:16px">${esc(where||"")}${where?" · ":""}${esc(perName(entry.handlerId))}
    <br>${tx("Κριτής")}: ${esc((judById(jid)||{}).name||tx("Πρόεδρος Κριτών"))}</div>

  <div class="card">
    <div class="eyebrow">${tx("Έρευνα")}</div>
    ${scale("passion",tx("Πάθος"),n.passion)}
    ${scale("method",tx("Μεθοδικότητα"),n.method)}
    ${scale("style",tx("Καλπασμός και στυλ φυλής"),n.style)}
    ${scale("contact",tx("Επαφή με κυναγωγό"),n.contact)}
    <div style="font-size:17px">${tx("Πλάτος έρευνας")}</div>
    <div class="badge-list" style="margin-top:8px">${widths.map(x=>
      `<button class="tog ${n.width===x?"on":""}" data-nwidth="${esc(x)}">${esc(tx(x))}</button>`).join("")}</div>
  </div>

  <div class="card">
    <div class="row"><span class="eyebrow grow" style="margin:0">${tx("Πόντοι")}</span>
      <span class="muted" id="ptCount">${(n.points||[]).length} ${
        tx((n.points||[]).length===1?"πόντος":"πόντοι")}</span></div>
    <div id="ptList" style="margin-top:12px">${(n.points||[]).map((p,i)=>ptRow(p,i)).join("")
      ||`<div class="muted">${tx("Κανένας πόντος καταγεγραμμένος.")}</div>`}</div>
    <button class="b-full" style="margin-top:12px" data-act="addPoint">${tx("+ Πόντος")}</button>
  </div>

  <div class="card">
    <div class="row" style="align-items:flex-start;gap:14px">
      <div class="grow">
        <div class="eyebrow">${tx("Λευκές φέρμες")}</div>
        <div class="tiny" id="whiteHint" style="max-width:230px">${tx(WHITE_HINTS[Math.min(w,3)])}</div>
      </div>
      <div class="step">
        <button data-nstep="whites|-1" aria-label="${tx("Μείωση")}">−</button>
        <span class="val" id="v_whites">${w}</span>
        <button data-nstep="whites|1" aria-label="${tx("Αύξηση")}">+</button>
      </div>
    </div>
  </div>

  <div class="danger-zone">
    <div class="eyebrow">${tx("Σφάλματα αποκλεισμού")} · ${tx("Άρθρο 33")}</div>
    <p style="font-size:16px">${tx("Ο αποκλεισμός τερματίζει τη διαδρομή. Επιλέξτε το σφάλμα και επιβεβαιώστε· η ενέργεια καταγράφεται.")}</p>
    <div class="badge-list">${FAULTS.map(f=>
      `<button class="tog red ${(n.faults||[]).includes(f)?"on":""}" data-nfault="${esc(f)}">${esc(tx(f))}</button>`).join("")}</div>
    <button class="b-full" id="elimBtn" style="margin-top:14px;background:var(--bad);border-color:var(--bad);color:#fff"
      data-act="confirmElim">${tx("Αποκλεισμός σκύλου")}</button>
  </div>

  <div class="card">
    <div class="eyebrow">${tx("Ελεύθερο σχόλιο")}</div>
    <textarea id="n_text" placeholder="${tx("Ό,τι δεν χωράει στα παραπάνω.")}">${esc(n.text||"")}</textarea>
    <div class="row" style="margin-top:12px">
      <button data-act="dictate" style="min-height:56px;padding:0 18px">🎙 ${tx("Υπαγόρευση")}</button>

/* ---------- 14. Exports --------------------------------------------------
   A real Office Open XML workbook — a ZIP of XML parts — written here rather
   than with a library, like everything else in this build. The previous export
   was SpreadsheetML 2003 saved as .xls, which Excel greets with "the file
   format and extension don't match" and which declared formula cells as empty
   numbers; this opens without a word anywhere.

   Entries are stored uncompressed. A trial workbook is a few kilobytes and
   DEFLATE would cost another two hundred lines for nothing.
   ------------------------------------------------------------------------- */
const CRC_TABLE = (()=>{
  const t = new Uint32Array(256);
  for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[i]=c>>>0; }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  const enc = new TextEncoder();
  const u16 = n => [n & 255, (n>>8) & 255];
  const u32 = n => [n & 255, (n>>8) & 255, (n>>16) & 255, (n>>>24) & 255];
  const parts = [], central = [];
  let offset = 0;
  files.forEach(f=>{
    const name = enc.encode(f.name);
    const data = typeof f.data === "string" ? enc.encode(f.data) : f.data;
    const crc = crc32(data), len = data.length;
    const lh = new Uint8Array([].concat(
      [0x50,0x4b,0x03,0x04], u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(len), u32(len), u16(name.length), u16(0)));
    parts.push(lh, name, data);
    central.push({name, crc, len, offset});
    offset += lh.length + name.length + len;
  });
  const cdStart = offset, cd = [];
  central.forEach(c=>{
    const h = new Uint8Array([].concat(
      [0x50,0x4b,0x01,0x02], u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(c.crc), u32(c.len), u32(c.len), u16(c.name.length),
      u16(0), u16(0), u16(0), u16(0), u32(0), u32(c.offset)));
    cd.push(h, c.name);
    offset += h.length + c.name.length;
  });
  const eocd = new Uint8Array([].concat(
    [0x50,0x4b,0x05,0x06], u16(0), u16(0), u16(files.length), u16(files.length),
    u32(offset - cdStart), u32(cdStart), u16(0)));
  const all = parts.concat(cd, [eocd]);
  const out = new Uint8Array(all.reduce((a,x)=>a+x.length,0));
  let p = 0; all.forEach(x=>{ out.set(x, p); p += x.length; });
  return out;
}

/* --- cells --- */
const xmlEsc = s => esc(s);
function colName(n){                                   /* 1 -> A, 27 -> AA */
  let s = "";
  while(n > 0){ const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = (n - 1 - r) / 26; }
  return s;
}
/* A cell is {v} for a value, {f} for a formula, str:true when a formula
   returns text. Excel refuses a formula typed as a number that returns text —
   that was one of the defects in the old export. */
const txt = v => ({ v: String(v ?? ""), t: "s" });
const num = v => ({ v: Number(v) || 0, t: "n" });
const fml = (f, str) => ({ f, t: str ? "fs" : "fn" });
function cellXml(c, ref, styled){
  const s = styled ? ' s="1"' : "";
  if(c.t === "fn") return `<c r="${ref}"${s}><f>${xmlEsc(c.f)}</f></c>`;
  if(c.t === "fs") return `<c r="${ref}"${s} t="str"><f>${xmlEsc(c.f)}</f></c>`;
  if(c.t === "n")  return `<c r="${ref}"${s}><v>${c.v}</v></c>`;
  return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(c.v)}</t></is></c>`;
}
function sheetXml(rows){
  const body = rows.map((cells, ri)=>{
    const r = ri + 1;
    return `<row r="${r}">` + cells.map((c, ci)=>
      cellXml(c, colName(ci+1) + r, ri === 0)).join("") + `</row>`;
  }).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${body}</sheetData></worksheet>`;
}
/* sheets: [{name, rows}] */
function xlsx(sheets){
  const rel = i => "rId" + (i + 1);
  const files = [
    { name: "[Content_Types].xml", data:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
</Types>` },
    { name: "_rels/.rels", data:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>` },
    { name: "xl/workbook.xml", data:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"
 xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${sheets.map((s,i)=>`<sheet name="${xmlEsc(s.name)}" sheetId="${i+1}" r:id="${rel(i)}"/>`).join("")}</sheets>
</workbook>` },
    { name: "xl/_rels/workbook.xml.rels", data:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${sheets.map((_,i)=>`<Relationship Id="${rel(i)}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}
<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>` },
    { name: "xl/styles.xml", data:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>
<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>
<borders count="1"><border/></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>
</styleSheet>` }
  ];
  sheets.forEach((s,i)=> files.push({ name: `xl/worksheets/sheet${i+1}.xml`, data: sheetXml(s.rows) }));
  return zipStore(files);
}

/* --- the four sheets ---
   No constant is ever baked into a formula: the points come from Παράμετροι by
   VLOOKUP and the standings add up Δεδομένα with SUMIFS, so anyone who opens
   the workbook can audit the arithmetic and change the club's scoring without
   touching the app. */
const SH_PAR = "Παράμετροι", SH_DATA = "Δεδομένα", SH_STATS = "Στατιστικά", SH_BR = "Ζεύγη";
const qname = n => "'" + n + "'";

function parSheet(){
  const keys = Object.keys(DB.settings.points).filter(k=>k!=="-");
  return { name: SH_PAR, rows: [[txt("Κλειδί"), txt("Βασικοί πόντοι")]]
    .concat(keys.map(k=>[txt(k), num(DB.settings.points[k])])) };
}
function dataSheet(trials, keep){
  const rows = [[txt("Σκύλος"),txt("Φυλή"),txt("Αγώνας"),txt("Ημερομηνία"),txt("Είδος"),
                 txt("Βαθμολογία"),txt("Τίτλος"),txt("Κλειδί"),txt("Συντελεστής"),txt("Πόντοι")]];
  trials.forEach(t=>t.entries.forEach(e=>{
    const r = t.results[e.id]; if(!r || (keep && !keep(t,e))) return;
    const d = dogById(e.dogId) || {};
    const n = rows.length + 1;
    rows.push([txt(d.name||""), txt(d.breed||""), txt(t.title), txt(fmtDate(t.dateStart)), txt(t.type),
      txt(r.qual||"-"), txt(r.award||"-"),
      fml(`IF(G${n}<>"-",G${n},F${n})`, true),
      num(coefficient(t)),
      fml(`IFERROR(VLOOKUP(H${n},${qname(SH_PAR)}!$A$2:$B$40,2,FALSE)*I${n},0)`)]);
  }));
  return { name: SH_DATA, rows };
}
function statsSheet(trials, keep){
  const dogIds = [];
  trials.forEach(t=>t.entries.forEach(e=>{
    if(t.results[e.id] && (!keep || keep(t,e)) && !dogIds.includes(e.dogId)) dogIds.push(e.dogId); }));
  const rows = [[txt("Σκύλος")].concat(trials.map(t=>txt(t.title))).concat([txt("ΣΥΝΟΛΟ")])];
  dogIds.forEach(id=>{
    const n = rows.length + 1;
    const cells = [txt(dogName(id))];
    trials.forEach((_, i)=>{
      const c = colName(i + 2);
      cells.push(fml(`SUMIFS(${qname(SH_DATA)}!$J:$J,${qname(SH_DATA)}!$A:$A,$A${n},${qname(SH_DATA)}!$C:$C,${c}$1)`));
    });
    cells.push(fml(`SUM(B${n}:${colName(trials.length + 1)}${n})`));
    rows.push(cells);
  });
  const last = rows.length;
  const tot = [txt("ΣΥΝΟΛΟ ΑΓΩΝΑ")];
  for(let i = 0; i < trials.length + 1; i++){
    const c = colName(i + 2);
    tot.push(fml(last > 1 ? `SUM(${c}2:${c}${last})` : "0"));
  }
  rows.push(tot);
  return { name: SH_STATS, rows };
}
function bracesSheet(t){
  const rows = [[txt("Τερέν"),txt("Ζεύγος"),txt("Σκύλος δεξιά"),txt("Σκύλος αριστερά"),
                 txt("Κυναγωγός δεξιά"),txt("Κυναγωγός αριστερά"),txt("Κριτές"),txt("Σημείωση")]];
  t.days.forEach(day=>day.terrains.forEach(tr=>(tr.braces||[]).forEach(b=>{
    const ea = t.entries.find(e=>e.id===b.a), eb = t.entries.find(e=>e.id===b.b);
    const marks = [b.recall && "επανάκληση", b.trailer && "συμπληρωματικός",
                   b.manual && "χειροκίνητη αλλαγή"].filter(Boolean).join(" · ");
    rows.push([txt(tr.name), num(b.no), txt(ea?dogName(ea.dogId):""), txt(eb?dogName(eb.dogId):"ΜΟΝΟΣ"),
      txt(ea?perName(ea.handlerId):""), txt(eb?perName(eb.handlerId):""),
      txt(tr.judgeIds.map(j=>(judById(j)||{}).name).filter(Boolean).join(", ")), txt(marks)]);
  })));
  return { name: SH_BR, rows };
}

/* Who has paid and who has not. The treasurer asks for this list on the morning
   of the αγώνας and it was nowhere — only a chip next to each name. */
function exportPaidXls(t){
  const rows = [[txt("Κυναγωγός"),txt("Χώρα"),txt("Τηλέφωνο"),txt("Σκύλος"),txt("Φυλή"),
                 txt("Αρ. Κ.Ο.Κ."),txt("Κατάσταση"),txt("Πληρωμή")]];
  const sorted = t.entries.slice().sort((a,b)=>
    perName(a.handlerId).localeCompare(perName(b.handlerId),"el")
    || dogName(a.dogId).localeCompare(dogName(b.dogId),"el"));
  sorted.forEach(e=>{
    const d = dogById(e.dogId) || {}, p = perById(e.handlerId) || {};
    rows.push([txt(p.name||"—"), txt(countryName(p.country)), txt(phoneE164(p.phone, p.country)),
      txt(d.name||""), txt(d.breed||""), txt(d.reg||""),
      txt(e.status||""), txt(e.paid ? "ΠΛΗΡΩΜΕΝΟ" : "ΑΠΛΗΡΩΤΟ")]);
  });
  const last = rows.length;
  rows.push([]);
  rows.push([txt("Πληρωμένοι"), fml(`COUNTIF(H2:H${last},\"ΠΛΗΡΩΜΕΝΟ\")`)]);
  rows.push([txt("Απλήρωτοι"),  fml(`COUNTIF(H2:H${last},\"ΑΠΛΗΡΩΤΟ\")`)]);
  rows.push([txt("Σύνολο"),     num(sorted.length)]);
  /* Ο ταμίας τηλεφωνεί από αυτό το φύλλο, άρα ο αριθμός βγαίνει έτοιμος να κληθεί. */
  const unpaid = [[txt("Κυναγωγός"),txt("Χώρα"),txt("Τηλέφωνο"),txt("Σκύλος"),txt("Κατάσταση")]];
  sorted.filter(e=>!e.paid).forEach(e=>{
    const p = perById(e.handlerId) || {};
    unpaid.push([txt(p.name||"—"), txt(countryName(p.country)), txt(phoneE164(p.phone, p.country)),
      txt(dogName(e.dogId)), txt(e.status||"")]);
  });
  download(`KOAD_Pliromes_${t.title.replace(/\s+/g,"_")}.xlsx`,
    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
    xlsx([{name:"Πληρωμές", rows}, {name:"Απλήρωτοι", rows:unpaid}]));
  toast(tx("Το αρχείο πληρωμών κατέβηκε"));
}
