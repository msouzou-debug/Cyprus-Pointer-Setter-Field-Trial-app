      r.onload = () => {
        let inc; try{ inc = JSON.parse(r.result); }catch(e){ return alert("Μη έγκυρο αρχείο."); }
        if(!inc || !Array.isArray(inc.dogs)) return alert("Το αρχείο δεν είναι αντίγραφο της εφαρμογής.");
        const counts = `${(inc.dogs||[]).length} σκύλοι, ${(inc.people||[]).length} πρόσωπα, `
                     + `${(inc.judges||[]).length} κριτές, ${(inc.trials||[]).length} αγώνες`;
        const merge = window.confirm(
          "Το αρχείο περιέχει: " + counts + "\n\n"
          + "ΟΚ = Συγχώνευση (κρατά τα υπάρχοντα, προσθέτει και ενημερώνει)\n"
          + "Άκυρο = Αντικατάσταση όλων (σβήνει ό,τι υπάρχει στη συσκευή)");
        if(!merge && !window.confirm("Σίγουρα αντικατάσταση; Ό,τι υπάρχει σε αυτή τη συσκευή θα χαθεί.")) return;
        if(merge) mergeDB(inc); else DB = inc;
        DB.settings = Object.assign({}, DEFAULT_SETTINGS, DB.settings||{});
        migrate(); save(); S={view:"trials",tab:"entries",day:0,judgeFilter:""};
        render(); toast(merge ? "Τα δεδομένα συγχωνεύτηκαν" : "Τα δεδομένα αντικαταστάθηκαν");
      };
      r.readAsText(f); };
    i.click();
  },
  wipe: ()=>{ if(!confirmAct("Διαγραφή ΟΛΩΝ των δεδομένων; Δεν αναιρείται.")) return;
    DB = blank(); save(); S={view:"trials",tab:"entries",day:0,judgeFilter:""}; render(); },
  importEntries: null   // replaced by the Excel/Word importer below
};

/* ---------- 16. CSV import ---------------------------------------------- */
function parseCsv(text){
  return text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(l=>l.trim())
    .map(l => l.split(/[;,\t]/).map(c=>c.trim().replace(/^"|"$/g,"")));
}
function ensurePerson(name, phone){
  if(!name) return "";
  let p = DB.people.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!p){ p = {id:uid(), name, phone:phone||"", member:""}; DB.people.push(p); }
  else if(phone && !p.phone) p.phone = phone;
  return p.id;
}
/* Merge an incoming backup into the local one: for anything with the same id the
   file wins; anything the file does not mention is left alone. This is what makes
   laptop -> phone -> laptop round trips safe. */
function mergeDB(inc){
  ["people","judges","dogs","trials"].forEach(k=>{
    DB[k] = DB[k] || [];
    (inc[k]||[]).forEach(item=>{
      const i = DB[k].findIndex(x=>x.id===item.id);
      if(i>=0) DB[k][i] = item; else DB[k].push(item);
    });
  });
}
/* data saved before braces had ids — the per-run notes are keyed on them */
function migrate(){
  /* the old settings held one template with {ΣΚΥΛΟΣ}/{ΤΕΡΕΝ}/{ΖΕΥΓΟΣ}; the message
     is now assembled from a header and a footer */
  if(DB.settings && /\{ΣΚΥΛΟΣ\}|\{ΖΕΥΓΟΣ\}/.test(DB.settings.sms||"")){
    DB.settings.sms = DEFAULT_SMS; DB.settings.smsFoot = DEFAULT_SMS_FOOT;
  }
  (DB.trials||[]).forEach(t=>{
    t.notes = t.notes || {}; t.results = t.results || {}; t.sms = t.sms || {};
    (t.days||[]).forEach(d=>(d.terrains||[]).forEach(tr=>(tr.braces||[]).forEach(b=>{
      if(!b.id) b.id = uid();
    })));
  });
}

/* ---------- 17. Init ----------------------------------------------------- */
window.addEventListener("online", render);
window.addEventListener("offline", render);
(async function(){
  await probeStorage();
  DB = await load();
  DB.settings = Object.assign({}, DEFAULT_SETTINGS, DB.settings||{});
  migrate();
  render();
})();
</script>

<script>
/* ==========================================================================
   18. Εισαγωγή από Excel (.xlsx) / Word (.docx) / CSV
   .xlsx and .docx are ZIP containers. The browser can inflate them natively
   with DecompressionStream, so no external library is needed and the app
   keeps working with no internet connection.
   ========================================================================== */

/* ---- minimal ZIP reader ---- */
async function unzip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for(let i = u8.length - 22; i >= 0 && i > u8.length - 66000; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error("Το αρχείο δεν είναι έγκυρο ZIP/Office αρχείο.");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const files = {};
  for(let n = 0; n < count; n++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method  = dv.getUint16(p + 10, true);
    const csize   = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen= dv.getUint16(p + 30, true);
    const cmtLen  = dv.getUint16(p + 32, true);
    const lho     = dv.getUint32(p + 42, true);
    const name    = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nameLen));
    const lNameLen  = dv.getUint16(lho + 26, true);
    const lExtraLen = dv.getUint16(lho + 28, true);
    const start = lho + 30 + lNameLen + lExtraLen;
    files[name] = {method, data: u8.subarray(start, start + csize)};
    p += 46 + nameLen + extraLen + cmtLen;
  }
  return {
    async text(name){
      const f = files[name]; if(!f) return null;
      if(f.method === 0) return new TextDecoder("utf-8").decode(f.data);
      if(typeof DecompressionStream === "undefined")
        throw new Error("Ο περιηγητής δεν υποστηρίζει αποσυμπίεση. Δοκιμάστε Chrome, Edge ή Safari 17+, ή αποθηκεύστε το αρχείο ως CSV.");
      const st = new Blob([f.data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return new TextDecoder("utf-8").decode(await new Response(st).arrayBuffer());
    },
    names: Object.keys(files)
  };
}

/* ---- .xlsx ---- */
const colIndex = ref => { let n = 0; for(const ch of ref.replace(/\d+/g,"")) n = n*26 + (ch.charCodeAt(0)-64); return n-1; };
function xmlTexts(xml, tag){
  const out = []; const re = new RegExp(`<${tag}[^>]*>([\\s\\S]*?)</${tag}>|<${tag}[^>]*/>`, "g");
  let m; while((m = re.exec(xml))) out.push(m[1] ?? ""); return out;
}
const unxml = s => String(s).replace(/<[^>]+>/g,"")
  .replace(/&#x([0-9a-fA-F]+);/g, (_,h)=>String.fromCodePoint(parseInt(h,16)))
  .replace(/&#(\d+);/g,           (_,d)=>String.fromCodePoint(parseInt(d,10)))
  .replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,"&");

async function readXlsx(buf){
  const z = await unzip(buf);
  /* shared strings */
  const ssXml = await z.text("xl/sharedStrings.xml");
  const shared = ssXml ? xmlTexts(ssXml,"si").map(si => xmlTexts(si,"t").map(unxml).join("")) : [];

  /* sheet order and names, straight from the workbook */
  const wbXml = await z.text("xl/workbook.xml") || "";
  const relXml = await z.text("xl/_rels/workbook.xml.rels") || "";
  const rels = {};
  (relXml.match(/<Relationship[^>]*>/g)||[]).forEach(r=>{
    const id = (r.match(/Id="([^"]+)"/)||[])[1], tg = (r.match(/Target="([^"]+)"/)||[])[1];
    if(id && tg) rels[id] = tg.replace(/^\/?xl\//,"").replace(/^\.\.\//,"");
  });
  let sheets = (wbXml.match(/<sheet[^>]*\/>/g)||[]).map(s=>({
    name: unxml((s.match(/name="([^"]+)"/)||[])[1] || "Φύλλο"),
    path: "xl/" + (rels[(s.match(/r:id="([^"]+)"/)||[])[1]] || "")
  })).filter(s => z.names.includes(s.path));
  if(!sheets.length)
    sheets = z.names.filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()
             .map((p,i)=>({name:"Φύλλο "+(i+1), path:p}));
  if(!sheets.length) throw new Error("Δεν βρέθηκε φύλλο εργασίας.");

  const readSheet = async path => {
    const xml = await z.text(path); if(!xml) return [];
    const rows = [];
    (xml.match(/<row[^>]*>[\s\S]*?<\/row>|<row[^>]*\/>/g)||[]).forEach(rx=>{
      const cells = [];
      (rx.match(/<c[^>]*>[\s\S]*?<\/c>|<c[^>]*\/>/g)||[]).forEach(cx=>{
        const ref = (cx.match(/r="([A-Z]+\d+)"/)||[])[1];
        const type = (cx.match(/t="([^"]+)"/)||[])[1];
        let v = "";
        if(type === "inlineStr")      v = xmlTexts(cx,"t").map(unxml).join("");
        else { const m = cx.match(/<v>([\s\S]*?)<\/v>/); const raw = m ? unxml(m[1]) : "";
               v = (type === "s") ? (shared[+raw] ?? "") : raw; }
        const i = ref ? colIndex(ref) : cells.length;
        while(cells.length < i) cells.push("");
        cells[i] = v;
      });
      rows.push(cells);
    });
    return rows;
  };
  const data = {};
  for(const s of sheets) data[s.name] = await readSheet(s.path);
  return {sheets: sheets.map(s=>s.name), data};
}

/* ---- .docx: first (or largest) table, else tab-separated paragraphs ---- */
async function readDocx(buf){
  const z = await unzip(buf);
  const xml = await z.text("word/document.xml");
  if(!xml) throw new Error("Δεν βρέθηκε περιεχόμενο εγγράφου Word.");
  const tables = (xml.match(/<w:tbl>[\s\S]*?<\/w:tbl>/g)||[]);
  if(tables.length){
    const tbl = tables.sort((a,b)=>b.length-a.length)[0];
    const rows = (tbl.match(/<w:tr[^>]*>[\s\S]*?<\/w:tr>/g)||[]).map(tr=>
      (tr.match(/<w:tc>[\s\S]*?<\/w:tc>/g)||[]).map(tc=>
        xmlTexts(tc,"w:t").map(unxml).join("").trim()));
    return {sheets:["Πίνακας Word"], data:{"Πίνακας Word":rows}};
  }
  const paras = (xml.match(/<w:p[ >][\s\S]*?<\/w:p>/g)||[]).map(p=>
    xmlTexts(p,"w:t").map(unxml).join("").trim()).filter(Boolean);
  const rows = paras.map(l => l.split(/\t|\s{2,}|;/).map(c=>c.trim()));
  return {sheets:["Κείμενο Word"], data:{"Κείμενο Word":rows}};
}

async function readAnyFile(file){
  const ext = (file.name.split(".").pop()||"").toLowerCase();
  if(ext === "csv" || ext === "txt"){
    const txt = await file.text();
    return {sheets:["CSV"], data:{CSV: parseCsv(txt)}};
  }
  const buf = await file.arrayBuffer();
  if(ext === "xlsx" || ext === "xlsm") return readXlsx(buf);
  if(ext === "docx") return readDocx(buf);
  if(ext === "xls" || ext === "doc")
    throw new Error("Οι παλιές μορφές .xls και .doc δεν υποστηρίζονται. Αποθηκεύστε το αρχείο ως .xlsx, .docx ή .csv.");
  throw new Error("Άγνωστος τύπος αρχείου: ." + ext);
}

/* ---- normalisation ---- */
const IMPORT_FIELDS = [["","— παράλειψη —"],["name","Όνομα σκύλου"],["breed","Φυλή"],["sex","Φύλο"],
  ["reg","Αρ. Κ.Ο.Κ."],["chip","Τσιπ / δερματοστιξία"],["book","Βιβλιάριο εργασίας"],
  ["dob","Ημ. γέννησης"],["kennel","Εκτροφείο"],["owner","Ιδιοκτήτης"],["ownerPhone","Τηλέφωνο ιδιοκτήτη"],
  ["handler","Κυναγωγός"],["handlerPhone","Τηλέφωνο κυναγωγού"]];

const GUESS = {
  name:["όνομα σκύλου","ονομα σκυλου","σκύλος","σκυλος","dog","name","όνομα","ονομα"],
  breed:["φυλή","φυλη","ράτσα","ratsa","breed"],
  sex:["φύλο","φυλο","sex","gender"],
  reg:["κ.ο.κ","κοκ","αρ. εγγρ","μητρώο","μητρωο","reg","pedigree","lof"],
  chip:["τσιπ","chip","microchip","δερματ","tattoo"],
  book:["βιβλιάριο","βιβλιαριο","work book","βιβλιο εργασιας"],
  dob:["γέννησ","γεννησ","ημ. γεν","dob","birth","ηλικία"],
  kennel:["εκτροφ","kennel","affix"],
  owner:["ιδιοκτ","owner"],
  ownerPhone:["τηλ. ιδιοκτ","τηλέφωνο ιδιοκτ","owner phone"],
  handler:["κυναγωγ","χειριστ","handler","conductor"],
  handlerPhone:["τηλ","τηλέφωνο","τηλεφωνο","phone","mobile","κινητό","κινητο"]
};
function guessField(header){
  const h = String(header||"").toLowerCase().trim();
  if(!h) return "";
  for(const [f,keys] of Object.entries(GUESS))
    if(keys.some(k=>h.includes(k))) return f;
  return "";
}
function normBreed(v){
  const s = String(v||"").toLowerCase();
  if(!s) return null;
  if(s.includes("point") || s.includes("πόιντ") || s.includes("ποιντ")) return "Pointer";
  if(s.includes("irish") || s.includes("ιρλαν")) return "Ιρλανδικό Σέττερ";
  if(s.includes("gordon")|| s.includes("σκωτ") || s.includes("scot")) return "Σκωτικό Σέττερ";
  if(s.includes("sett")  || s.includes("σέττ") || s.includes("σετ"))  return "Αγγλικό Σέττερ";
  return null;
}
function normSex(v){
  const s = String(v||"").toLowerCase().trim();
  return (s.startsWith("θ") || s.startsWith("f") || s.includes("θηλ")) ? "Θ" : "Α";
}
function normDate(v){
  if(v === "" || v == null) return "";
  const s = String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if(/^\d+(\.\d+)?$/.test(s)){                       // Excel serial number
    const n = parseFloat(s);
    if(n > 1000 && n < 80000){
      const d = new Date(Date.UTC(1899,11,30) + Math.round(n)*86400000);
      return d.toISOString().slice(0,10);
    }
  }
  const m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if(m){ let [_,d,mo,y] = m; if(y.length===2) y = "20"+y;
    return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
  return "";
}

/* ---- import dialog ---- */
async function startImport(file, trial){
  let parsed;
  try{ parsed = await readAnyFile(file); }
  catch(e){ alert("Δεν ήταν δυνατή η ανάγνωση του αρχείου.\n\n" + e.message); return; }
  const sheet = parsed.sheets[0];
  if(!parsed.data[sheet] || !parsed.data[sheet].length){ alert("Το αρχείο δεν περιέχει δεδομένα."); return; }
  window._imp = {parsed, sheet, header:0, map:{}, trial: trial||null, entries: !!trial};
  window._imp.header = detectHeader(parsed.data[sheet]);
  autoMap();
  renderImport();
}
function impRows(){ return window._imp.parsed.data[window._imp.sheet] || []; }
/* The real header is rarely row 1 — club files start with a title and a blank
   line. Take the first row where at least two columns look like known fields. */
function detectHeader(rows){
  for(let i=0;i<Math.min(rows.length,15);i++){
    const hits = (rows[i]||[]).filter(c=>guessField(c)).length;
    if(hits >= 2) return i;
  }
  return 0;
}
function autoMap(){
  const I = window._imp, rows = impRows(), hdr = rows[I.header] || [];
  I.map = {};
  let lastPerson = "";
  hdr.forEach((h,i)=>{
    let f = guessField(h);
    /* a bare "Τηλέφωνο"/"Κινητό" belongs to whichever person column precedes it */
    if(f === "handlerPhone" && lastPerson === "owner") f = "ownerPhone";
    if(f === "owner" || f === "handler") lastPerson = f;
    if(f && !Object.values(I.map).includes(f)) I.map[i] = f;
  });
  if(!Object.values(I.map).includes("name") && hdr.length) I.map[0] = "name";   // first column fallback
}
function renderImport(){
  const I = window._imp, rows = impRows(), hdr = rows[I.header] || [];
  const preview = rows.slice(I.header+1, I.header+4);
  const nCols = Math.max(hdr.length, ...rows.slice(0,10).map(r=>r.length));
  const cols = [];
  for(let i=0;i<nCols;i++){
    cols.push(`<div class="row" style="margin-bottom:6px;align-items:center">
      <div class="grow" style="min-width:120px"><b>${esc(hdr[i]||"Στήλη "+(i+1))}</b>
        <div class="tiny">${esc((preview[0]||[])[i]||"")}</div></div>
      <div class="grow"><select data-impmap="${i}">
        ${IMPORT_FIELDS.map(([v,l])=>`<option value="${v}" ${I.map[i]===v?"selected":""}>${l}</option>`).join("")}
      </select></div></div>`);
  }
  const nData = Math.max(0, rows.length - I.header - 1);
  dlg(`<h2>Εισαγωγή σκύλων</h2>
  <div class="row">
    ${I.parsed.sheets.length>1?`<div class="grow"><label>Φύλλο</label><select data-impsheet>
      ${I.parsed.sheets.map(s=>`<option ${s===I.sheet?"selected":""}>${esc(s)}</option>`).join("")}</select></div>`:""}
    <div class="grow"><label>Γραμμή κεφαλίδων</label>
      <input type="number" min="1" value="${I.header+1}" data-imphdr></div>
  </div>
  <div class="note">Βρέθηκαν <b>${nData}</b> γραμμές δεδομένων. Αντιστοιχίστε κάθε στήλη του αρχείου σας
    με ένα πεδίο. Ό,τι αφήσετε σε «παράλειψη» αγνοείται.</div>
  <h3>Αντιστοίχιση στηλών</h3>
  ${cols.join("")}
  ${I.trial?`<div class="row" style="margin-top:10px"><label style="display:flex;gap:8px;align-items:center;font-size:15px">
    <input type="checkbox" data-impentries ${I.entries?"checked":""} style="width:22px;height:22px;min-height:0">
    Δημιουργία συμμετοχών στον αγώνα «${esc(I.trial.title)}»</label></div>`:""}
  <div class="row" style="margin-top:14px">
    <button class="b-pri grow" data-act="doImport">Εισαγωγή ${nData} γραμμών</button>
    <button class="grow" data-act="close">Άκυρο</button></div>
  <p class="tiny">Οι σκύλοι που υπάρχουν ήδη (ίδιος αρ. Κ.Ο.Κ. ή ίδιο όνομα) ενημερώνονται
    αντί να διπλογραφούν.</p>`);
}
function doImport(){
  const I = window._imp, rows = impRows();
  const get = (r, f) => { const i = Object.keys(I.map).find(k=>I.map[k]===f);
                          return i===undefined ? "" : String(r[i]??"").trim(); };
  let added=0, updated=0, entries=0, skipped=0, breedGuessed=0;
  for(let n = I.header+1; n < rows.length; n++){
    const r = rows[n];
    const name = get(r,"name");
    if(!name){ skipped++; continue; }
    const reg = get(r,"reg");
    let dog = (reg && DB.dogs.find(d=>d.reg && d.reg.toLowerCase()===reg.toLowerCase()))
           || DB.dogs.find(d=>d.name.toLowerCase()===name.toLowerCase());
    const breed = normBreed(get(r,"breed"));
    if(!breed && get(r,"breed")==="" ) breedGuessed++;
    const ownerId   = get(r,"owner")   ? ensurePerson(get(r,"owner"),   get(r,"ownerPhone"))   : "";
    const handlerId = get(r,"handler") ? ensurePerson(get(r,"handler"), get(r,"handlerPhone")) : ownerId;
    const fields = {
      name, breed: breed || (dog && dog.breed) || BREEDS[0],
      sex: get(r,"sex") ? normSex(get(r,"sex")) : (dog ? dog.sex : "Α"),
      reg: reg || (dog&&dog.reg) || "", chip: get(r,"chip") || (dog&&dog.chip) || "",
      book: get(r,"book") || (dog&&dog.book) || "", dob: normDate(get(r,"dob")) || (dog&&dog.dob) || "",
      kennel: get(r,"kennel") || (dog&&dog.kennel) || "",
      ownerId: ownerId || (dog&&dog.ownerId) || ""
    };
    if(dog){ Object.assign(dog, fields); updated++; }
    else { dog = {id:uid(), cy:true, ...fields}; DB.dogs.push(dog); added++; }

    if(I.trial && I.entries && !I.trial.entries.some(e=>e.dogId===dog.id)){
      I.trial.entries.push({id:uid(), dogId:dog.id, handlerId: handlerId || dog.ownerId || "",
                            status:"ΔΗΛΩΜΕΝΟΣ", paid:false, season:false});
      entries++;
    }
  }
  save(); closeDlg(); render();
  alert(`Εισαγωγή ολοκληρώθηκε.\n\n`
    + `Νέοι σκύλοι: ${added}\nΕνημερώθηκαν: ${updated}\n`
    + (I.trial ? `Νέες συμμετοχές: ${entries}\n` : "")
    + (skipped ? `Γραμμές χωρίς όνομα (αγνοήθηκαν): ${skipped}\n` : "")
    + (breedGuessed ? `\nΠροσοχή: ${breedGuessed} σκύλοι δεν είχαν φυλή και καταχωρήθηκαν ως «${BREEDS[0]}». Διορθώστε τους από το Μητρώο.` : ""));
}

/* ---- wiring ---- */
document.addEventListener("change", ev=>{
  const I = window._imp;
  if(!I) return;
  if(ev.target.dataset.impsheet!==undefined){ I.sheet = ev.target.value;
    I.header = detectHeader(impRows()); autoMap(); renderImport(); return; }
  if(ev.target.dataset.imphdr!==undefined){ I.header = Math.max(0,(+ev.target.value||1)-1); autoMap(); renderImport(); return; }
  if(ev.target.dataset.impmap!==undefined){
    const i = ev.target.dataset.impmap, v = ev.target.value;
    if(v) Object.keys(I.map).forEach(k=>{ if(I.map[k]===v && k!==i) delete I.map[k]; });
    v ? I.map[i]=v : delete I.map[i];
    return;
  }
  if(ev.target.dataset.impentries!==undefined){ I.entries = ev.target.checked; return; }
});

ACT.doImport = () => doImport();
ACT.importDogs = () => pickFile(null);
ACT.importEntries = (b,t) => pickFile(t);
function pickFile(trial){
  const i = document.createElement("input");
  i.type = "file"; i.accept = ".xlsx,.xlsm,.docx,.csv,.txt";
  i.onchange = () => { if(i.files[0]) startImport(i.files[0], trial); };
  i.click();
}
</script>

<script>
/* ==========================================================================
   19. Αποστολή / μεταφορά — WhatsApp, Viber, Messenger, email, SMS
   Files go through the phone's own share sheet (navigator.share), which is what
   puts WhatsApp, Viber, Messenger and Mail in the list. On a laptop that sheet
   usually does not exist, so we fall back to a download plus a pre-written email.
   ========================================================================== */

async function shareFile(filename, mime, content, note){
  try{
    if(navigator.canShare && typeof File !== "undefined"){
      let f = new File([content], filename, {type:mime});
      /* some apps refuse application/json — offer the same bytes as .txt */
      if(!navigator.canShare({files:[f]}))
        f = new File([content], filename.replace(/\.json$/,".txt"), {type:"text/plain"});
      if(navigator.canShare({files:[f]})){
        await navigator.share({files:[f], title:filename, text:note||""});
        return "shared";
      }
    }
  }catch(e){
    if(e && e.name === "AbortError") return "cancelled";
  }
  download(filename, mime, content);
  return "downloaded";
}

async function shareOrCopy(text, subject){
  try{
    if(navigator.share){ await navigator.share({text, title:subject||"Κ.Ο.Α.Δ."}); return; }
  }catch(e){ if(e && e.name === "AbortError") return; }
  try{ await navigator.clipboard.writeText(text); toast("Αντιγράφηκε — επικολλήστε στην εφαρμογή σας"); }
  catch(e){ alert(text); }
}

/* one trial plus only the people and dogs it references — a small file to send */
function trialPacket(t){
  const dogIds = new Set(t.entries.map(e=>e.dogId));
  const dogs   = DB.dogs.filter(d=>dogIds.has(d.id));
  const perIds = new Set();
  t.entries.forEach(e=>{ if(e.handlerId) perIds.add(e.handlerId); if(e.ownerId) perIds.add(e.ownerId); });
  dogs.forEach(d=>{ if(d.ownerId) perIds.add(d.ownerId); });
  const judgeIds = new Set();
  (t.days||[]).forEach(d=>(d.terrains||[]).forEach(tr=>(tr.judgeIds||[]).forEach(j=>judgeIds.add(j))));
  const judges = DB.judges.filter(j=>judgeIds.has(j.id));
  judges.forEach(j=>{ if(j.personId) perIds.add(j.personId); });
  return JSON.stringify({v:1, people:DB.people.filter(p=>perIds.has(p.id)),
    judges, dogs, trials:[t], settings:DB.settings}, null, 1);
}

/* the running order as plain text — short enough for WhatsApp, Viber or SMS */
function drawText(t){
  const day = t.days[S.day];
  return [`Κ.Ο.Α.Δ. – ${t.title}`, fmtDate(day.date), "", "ΣΕΙΡΑ ΖΕΥΓΩΝ", "",
          orderText(t, null, DB.settings.smsJudges), "",
          DB.settings.smsFoot || DEFAULT_SMS_FOOT].join("\n");
}

function mailWith(subject, body){
  location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

/* ---- actions ---- */
Object.assign(ACT, {
  shareAll: async ()=>{
    const r = await shareFile(`KOAD_${today()}.json`, "application/json", JSON.stringify(DB,null,1),
      "Αντίγραφο Κ.Ο.Α.Δ. — ανοίξτε το στην εφαρμογή με «Φόρτωση αρχείου».");
    if(r === "downloaded") afterDownload(`KOAD_${today()}.json`);
  },
  shareReg: async ()=>{
    const c = JSON.stringify({v:1, people:DB.people, judges:DB.judges, dogs:DB.dogs,
                              trials:[], settings:DB.settings}, null, 1);
    const r = await shareFile(`KOAD_mitroo_${today()}.json`, "application/json", c,
      "Μητρώο σκύλων Κ.Ο.Α.Δ.");
    if(r === "downloaded") afterDownload(`KOAD_mitroo_${today()}.json`);
  },
  shareTrial: async (b,t)=>{
    const name = `KOAD_${t.title.replace(/\s+/g,"_")}.json`;
    const r = await shareFile(name, "application/json", trialPacket(t),
      `Αγώνας: ${t.title} — φορτώστε το αρχείο στην εφαρμογή.`);
    if(r === "downloaded") afterDownload(name);
  },
  mailBackup: ()=>{
    const name = `KOAD_${today()}.json`;
    download(name, "application/json", JSON.stringify(DB,null,1));
    setTimeout(()=>mailWith("Αντίγραφο Κ.Ο.Α.Δ. " + today(),
      `Επισυνάψτε το αρχείο ${name} που μόλις κατέβηκε.\n\n`
      + `Στην άλλη συσκευή: ανοίξτε την εφαρμογή, Ρυθμίσεις → Φόρτωση αρχείου → Συγχώνευση.`), 700);
  },

  /* the running order as text */
  shareDraw:  (b,t)=>shareOrCopy(drawText(t), t.title),
  waDraw:     (b,t)=>window.open("https://wa.me/?text=" + encodeURIComponent(drawText(t)), "_blank"),
  viberDraw:  (b,t)=>{ location.href = "viber://forward?text=" + encodeURIComponent(drawText(t)); },
  smsDraw:    (b,t)=>{ location.href = "sms:?&body=" + encodeURIComponent(drawText(t)); },
  mailDraw:   (b,t)=>mailWith(`${t.title} — σειρά ζευγών`, drawText(t))
});

/* Installable, fully offline app — only possible when served over http(s).
   Opened straight from a file the registration is skipped without complaint. */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}

function afterDownload(name){
  toast("Το αρχείο κατέβηκε: " + name);
}
</script>
