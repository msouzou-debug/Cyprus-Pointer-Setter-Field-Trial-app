<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2B4D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Κ.Ο.Α.Δ. — Διαχείριση Αγώνων</title>
<style>
:root{
  --navy:#1E2B4D; --navy-d:#141E36; --navy-l:#33447048;
  --stone:#EFEAE0; --card:#FFFFFF; --ink:#171A21; --slate:#6B6A64;
  --setter:#8C3A1E; --stubble:#C8A24A; --scrub:#3F4A32; --line:#D8D1C4;
  --ok:#2E6B45; --bad:#9B2222;
  --r:10px; --sp:14px;
  font-synthesis-weight:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--stone); color:var(--ink);
  -webkit-text-size-adjust:100%;
  font:400 17px/1.45 "Segoe UI",Roboto,"Noto Sans","Helvetica Neue",system-ui,sans-serif;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
h1,h2,h3{margin:0 0 .4em;font-weight:700;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:19px} h3{font-size:16px}
p{margin:0 0 .7em}
a{color:var(--setter)}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;gap:12px;align-items:center;
  position:sticky;top:0;z-index:40;box-shadow:0 2px 10px #0003}
header img{width:46px;height:46px;border-radius:50%;flex:0 0 auto;background:#fff2}
.wm{line-height:1.15}
.wm b{display:block;font-size:14px;letter-spacing:.03em}
.wm span{display:block;font-size:10.5px;letter-spacing:.16em;color:#ffffffaa}
.offline{margin-left:auto;font-size:11px;background:#ffffff1f;padding:4px 8px;border-radius:20px;white-space:nowrap}

/* ---------- nav ---------- */
nav{display:flex;overflow-x:auto;background:var(--navy-d);position:sticky;top:calc(66px + env(safe-area-inset-top));z-index:39;
  scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:#ffffffb0;font:600 14px/1 inherit;padding:13px 15px;
  white-space:nowrap;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:#fff;border-bottom-color:var(--stubble)}

main{padding:var(--sp);max-width:1180px;margin:0 auto}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.tight{gap:6px}
.grow{flex:1 1 180px;min-width:0}
label{display:block;font-size:12.5px;font-weight:600;color:var(--slate);margin:0 0 4px;letter-spacing:.02em}
input,select,textarea{width:100%;font:400 16px/1.3 inherit;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:8px;padding:11px 10px;min-height:46px}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #1E2B4D55;outline-offset:1px}
button{font:600 16px/1 inherit;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);
  padding:13px 16px;min-height:48px;cursor:pointer}
button:active{transform:translateY(1px)}
.b-pri{background:var(--navy);border-color:var(--navy);color:#fff}
.b-act{background:var(--setter);border-color:var(--setter);color:#fff}
.b-sm{min-height:38px;padding:8px 11px;font-size:14px}
.b-warn{color:var(--bad);border-color:#e2c3c3}
.b-full{width:100%}
.muted{color:var(--slate);font-size:13.5px}
.tiny{font-size:12px;color:var(--slate)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;
  background:#0000000d;color:var(--slate);letter-spacing:.02em}
.chip.g{background:#2E6B4518;color:var(--ok)}
.chip.r{background:#9B222218;color:var(--bad)}
.chip.y{background:#C8A24A28;color:#7a6216}
.chip.n{background:var(--navy-l);color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:right;padding:8px 9px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--slate);text-transform:uppercase;letter-spacing:.05em;
   position:sticky;top:0;background:var(--card)}
th:first-child,td:first-child{text-align:right}
.scroll{overflow:auto;max-height:70vh;-webkit-overflow-scrolling:touch}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.note{background:#C8A24A1a;border-right:4px solid var(--stubble);padding:10px 12px;border-radius:8px;
  font-size:13.5px;margin-bottom:12px}
.err{background:#9B22221a;border-right:4px solid var(--bad);padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:12px}
.empty{text-align:center;padding:34px 16px;color:var(--slate)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* ---------- brace card (signature) ---------- */
.brace{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.brace.run{border-color:var(--setter);box-shadow:0 0 0 2px #8C3A1E33}
.brace.done{opacity:.62}
.bhead{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#00000006;border-bottom:1px solid var(--line)}
.bno{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--navy);font-variant-numeric:tabular-nums}
.brace.run .bno{color:var(--setter)}
.bhead .chip{margin-right:auto}
.bbody{display:grid;grid-template-columns:1fr 1px 1fr}
.dog{padding:11px 12px;min-width:0}
.dog .pos{font-size:10.5px;letter-spacing:.14em;color:var(--slate);font-weight:700}
.dog .nm{font-size:19px;font-weight:700;line-height:1.2;margin:2px 0;overflow-wrap:anywhere}
.dog .mt{font-size:13px;color:var(--slate)}
.vline{background:var(--line)}
.solo .dog.b{opacity:.5}
.dog.b.none .nm{text-decoration:line-through;color:var(--slate);font-weight:600}

/* ---------- stats matrix ---------- */
.matrix{font-size:13px}
.matrix th.v{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;height:150px;
  vertical-align:bottom;padding:6px 4px;font-size:11.5px}
.matrix td.z{color:#c9c4b8}
.matrix td.tot{font-weight:800;background:#00000008}
.matrix td.n{text-align:center}

/* ---------- misc ---------- */
.fab{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:35;display:flex;gap:8px;max-width:1152px;margin:0 auto}
.fab button{flex:1;box-shadow:0 6px 20px #0003}
dialog{border:0;border-radius:14px;padding:0;max-width:620px;width:calc(100% - 24px);
  box-shadow:0 20px 60px #0005}
dialog::backdrop{background:#0009}
.dlg{padding:16px}
.dlg h2{margin-bottom:10px}
.badge-list{display:flex;flex-wrap:wrap;gap:6px}
.tog{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 12px;font-size:14px;
  min-height:0;font-weight:600}
.tog.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tog.on.red{background:var(--bad);border-color:var(--bad)}
.step{display:flex;align-items:center;gap:8px}
.step button{width:44px;padding:0;min-height:44px;font-size:20px;font-weight:700}
.step .val{min-width:34px;text-align:center;font-size:19px;font-weight:700}

@media print{
  header,nav,.fab,.noprint,button{display:none!important}
  body{background:#fff;padding:0;font-size:12pt}
  main{max-width:none;padding:0}
  .card,.brace{break-inside:avoid;border:1px solid #999;box-shadow:none}
  .print-hd{display:block!important;border-bottom:2px solid #000;margin-bottom:10px;padding-bottom:6px}
}
.print-hd{display:none}
</style>
</head>

/* ---------- 2. Storage --------------------------------------------------- */
/* Safari refuses localStorage on file:// URLs. If the head judge emails himself
   this file and opens it from the Files app on an iPhone, nothing would be saved
   and he would not be told. So probe the store on startup and say so loudly. */
const KEY = "koad_db_v1";
let DB = null, mem = null, storageMode = "memory";

function blank(){ return {v:1, people:[], judges:[], dogs:[], trials:[],
  settings:{...DEFAULT_SETTINGS, points:{...DEFAULT_POINTS}} }; }

async function probeStorage(){
  try{
    if(window.storage){
      await window.storage.set("__koad_probe","1");
      const r = await window.storage.get("__koad_probe");
      if(r && r.value === "1"){ storageMode = "app"; return; }
    }
  }catch(e){}
  try{
    localStorage.setItem("__koad_probe","1");
    if(localStorage.getItem("__koad_probe") === "1"){
      localStorage.removeItem("__koad_probe"); storageMode = "local"; return;
    }
  }catch(e){}
  storageMode = "memory";
}

async function load(){
  if(storageMode === "app"){
    try{ const r = await window.storage.get(KEY); if(r && r.value) return JSON.parse(r.value); }catch(e){}
  }
  if(storageMode === "local"){
    try{ const s = localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
  }
  return mem || blank();
}
let saveTimer=null;
function save(){
  mem = DB;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    const s = JSON.stringify(DB);
    if(storageMode === "app"){ try{ await window.storage.set(KEY, s); }catch(e){} }
    if(storageMode === "local"){ try{ localStorage.setItem(KEY, s); }catch(e){} }
  }, 250);
}

/* ---------- 3. Helpers --------------------------------------------------- */
const $  = s => document.querySelector(s);

const dogName = id => (dogById(id)||{}).name || "—";

const fmtDate = d => d ? d.split("-").reverse().join("/") : "—";
const today = () => new Date().toISOString().slice(0,10);

function toast(msg){

  n.style.cssText="position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#171A21;color:#fff;padding:11px 16px;border-radius:24px;font-size:14px;z-index:99;box-shadow:0 6px 20px #0004";
  document.body.appendChild(n); setTimeout(()=>n.remove(),2200);
}
function confirmAct(msg){ return window.confirm(msg); }
function download(name, mime, content){
  const b = new Blob([content], {type:mime+";charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function phoneClean(p){ return String(p||"").replace(/[^\d+]/g,""); }

/* seeded PRNG — the draw must be reproducible from its seed */
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffled(arr, rnd){ const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- 4. Points ---------------------------------------------------- */
function scoreKey(res){ if(!res) return "-"; return (res.award && res.award!=="-") ? res.award : (res.qual||"-"); }
function coefficient(t){
  const brace = t.format === "ΖΕΥΓΗ";
  const wildRelevant = t.wild && (t.type==="Έρευνας Κυνηγίου" || t.type==="Πρακτικού Κυνηγίου");
  if(wildRelevant) return brace ? 4 : 3;   // (2+2) / (2+1)
  return brace ? 2 : 1;
}
function pointsFor(t, res){
  const base = DB.settings.points[scoreKey(res)] ?? 0;
  return base * coefficient(t);
}

/* ---------- 5. Draw engine ---------------------------------------------- */
/* Hard constraints:  H1 same handler never braced · H2 judge never judges his own
   dog's terrain (Άρθρο 49) · H3 Derby breed group · H4 one run per dog per day   */
function judgeConflict(terrain, entry, trial){
  const dog = dogById(entry.dogId) || {};
  return terrain.judgeIds.some(jid=>{
    const j = judById(jid); if(!j) return false;
    return j.personId && (j.personId===entry.handlerId || j.personId===dog.ownerId);
  });
}
function pairConflict(e1, e2, soft){
  if(e1.handlerId && e1.handlerId===e2.handlerId) return true;          // H1
  const d1=dogById(e1.dogId)||{}, d2=dogById(e2.dogId)||{};
  if(soft.avoidOwner  && d1.ownerId && d1.ownerId===d2.ownerId) return true;
  if(soft.avoidKennel && d1.kennel  && d1.kennel===d2.kennel)   return true;
  return false;
}

function runDraw(trial, dayIdx, seedIn, mode){
  const day = trial.days[dayIdx];
  const soft = DB.settings;
  const seed = seedIn || (uid()+Date.now());
  const rnd  = mulberry32(hashStr(seed));
  const active = trial.entries.filter(e=>e.status==="ΔΗΛΩΜΕΝΟΣ");
  const problems = [];

  if(!day.terrains.length) return {error:"Δεν έχουν οριστεί τερέν."};
  if(!active.length)       return {error:"Δεν υπάρχουν ενεργές συμμετοχές."};

  /* --- allocation to terrains --- */
  /* only an explicit assignment by the head judge counts as manual; entryIds left
     behind by a previous draw must not leak into the next one, or the draw stops
     being reproducible from its seed */
  const manual = day.terrains.some(t=>t.assigned && t.entryIds && t.entryIds.length);
  if(!manual) day.terrains.forEach(t=>{ t.entryIds = []; });
  const alloc  = {}; day.terrains.forEach(t=>alloc[t.id]=[]);

  if(mode==="ΠΕΡΙΣΤΡΟΦΗ" && dayIdx>0 && trial.days[dayIdx-1].draw){
    const prev = trial.days[dayIdx-1];
    const n = day.terrains.length;
    prev.terrains.forEach((pt,i)=>{
      const target = day.terrains[(i+1)%n];
      (pt.entryIds||[]).forEach(eid=>{
        const e = active.find(x=>x.id===eid); if(e) alloc[target.id].push(e);
      });
    });
    // dogs that were not in the previous day fall through to normal allocation
    const placed = new Set(Object.values(alloc).flat().map(e=>e.id));
    active.filter(e=>!placed.has(e.id)).forEach(e=>{
      const t = eligibleTerrain(e); if(t) alloc[t.id].push(e); else problems.push(dogName(e.dogId));
    });
  } else if(manual){
    day.terrains.forEach(t=>{
      (t.entryIds||[]).forEach(eid=>{
        const e = active.find(x=>x.id===eid); if(e) alloc[t.id].push(e);
      });
    });
    const placed = new Set(Object.values(alloc).flat().map(e=>e.id));
    active.filter(e=>!placed.has(e.id)).forEach(e=>{
      const t = eligibleTerrain(e); if(t) alloc[t.id].push(e); else problems.push(dogName(e.dogId));
    });
  } else {
    shuffled(active, rnd).forEach(e=>{
      const t = eligibleTerrain(e); if(t) alloc[t.id].push(e); else problems.push(dogName(e.dogId));
    });
  }

  function eligibleTerrain(e){
    const dog = dogById(e.dogId) || {};
    const ok = day.terrains.filter(t=>{
      if(t.breedGroup && BREED_GROUP(dog.breed)!==t.breedGroup) return false;  // H3
      if(judgeConflict(t, e, trial)) return false;                             // H2
      return true;
    });
    if(!ok.length) return null;
    /* prefer the terrain where this handler has the fewest dogs, then the emptiest
       terrain — clustering one handler's dogs makes braces impossible to build */
    const mine = tr => alloc[tr.id].filter(x=>x.handlerId===e.handlerId).length;
    ok.sort((a,b)=> (mine(a)-mine(b)) || (alloc[a.id].length-alloc[b.id].length));
    return ok[0];
  }

  if(problems.length)
    return {error:"Δεν βρέθηκε κατάλληλο τερέν για: "+problems.join(", ")+
      ". Ελέγξτε τους κριτές (Άρθρο 49) ή τη φυλή του τερέν."};

  /* --- pairing inside each terrain --- */
  const braceFormat = trial.format === "ΖΕΥΓΗ";
  const warn = [];
  const NONE = {avoidOwner:false, avoidKennel:false};   // hard constraints only

  /* Pair a pool in two phases: first honour the soft preferences, and only if no
     partner qualifies fall back to the hard constraints alone. The same-handler
     rule is never broken unless it is arithmetically impossible. */
  function pairPool(pool, out, terrainName){
    while(pool.length){
      const a = pool.shift();
      if(!pool.length){ out.push({id:uid(),no:out.length+1,a:a.id,b:null,solo:true,status:"ΕΚΚΡΕΜΕΙ"}); break; }
      let cands = pool.map((_,i)=>i).filter(i=>!pairConflict(a,pool[i],soft));
      let relaxed = false, broken = false;
      if(!cands.length){ cands = pool.map((_,i)=>i).filter(i=>!pairConflict(a,pool[i],NONE)); relaxed = true; }
      if(!cands.length){ cands = [0]; broken = true; }
      const b = pool.splice(cands[Math.floor(rnd()*cands.length)],1)[0];
      void broken; void relaxed;   // reported after the repair pass, not here
      out.push({id:uid(),no:out.length+1,a:a.id,b:b.id,solo:false,status:"ΕΚΚΡΕΜΕΙ"});
    }
    return out;
  }

  /* Greedy pairing can corner itself: the last two dogs left over may share a
     handler even though a valid arrangement existed. Repair by swapping partners
     between braces — hard violations first, then the soft preferences. */
  function repair(braces, byId, level, terrainName){
    const bad = b => b.b && pairConflict(byId[b.a], byId[b.b], level);
    const locked = e => soft.seasonLast && e && e.season;   // keep οίστρος at the end
    for(let pass=0; pass<60; pass++){
      let fixed = false;
      for(let i=0;i<braces.length;i++){
        if(!bad(braces[i])) continue;
        for(let j=0;j<braces.length && !fixed;j++){
          if(i===j || !braces[j].b) continue;
          for(const side of ["a","b"]){
            const bi = braces[i], bj = braces[j];
            const keepI = byId[bi.a], moveI = byId[bi.b];
            const keepJ = byId[side==="a" ? bj.b : bj.a], moveJ = byId[side==="a" ? bj.a : bj.b];
            if(locked(moveI) || locked(moveJ)) continue;
            if(!pairConflict(keepI,moveJ,level) && !pairConflict(keepJ,moveI,level)){
              bi.b = moveJ.id;
              if(side==="a"){ bj.a = moveI.id; } else { bj.b = moveI.id; }
              fixed = true; break;
            }
          }
        }
        if(fixed) break;
      }
      if(!fixed) break;
    }
    return braces.filter(bad).length;
  }

  day.terrains.forEach(t=>{
    const list = shuffled(alloc[t.id], rnd);
    let braces = [];
    if(!braceFormat){
      const ordered = soft.seasonLast ? list.filter(e=>!e.season).concat(list.filter(e=>e.season)) : list;
      ordered.forEach((e,i)=>braces.push({id:uid(),no:i+1,a:e.id,b:null,solo:true,status:"ΕΚΚΡΕΜΕΙ"}));
    } else if(soft.seasonLast && list.some(e=>e.season)){
      const season = list.filter(e=>e.season), normal = list.filter(e=>!e.season);
      braces = pairPool(normal.slice(), [], t.name);
      const last = braces[braces.length-1];
      if(last && last.solo && season.length){                 // fill the odd turn
        last.b = season.shift().id; last.solo = false;
      }
      pairPool(season.slice(), braces, t.name);
      braces.forEach((b,i)=>b.no = i+1);
    } else {
      braces = pairPool(list.slice(), [], t.name);
    }
    if(braceFormat){
      const byId = {}; list.forEach(e=>byId[e.id]=e);
      const stillHard = repair(braces, byId, NONE, t.name);   // H1 first
      repair(braces, byId, soft, t.name);                     // then S1/S2
      if(stillHard) warn.push(`«${t.name}»: ${stillHard} ζεύγος/η με τον ίδιο κυναγωγό — δεν υπάρχει άλλη δυνατή διάταξη με τους σκύλους αυτού του τερέν.`);
    }
    t.braces = braces;
    t.entryIds = braces.flatMap(b=>b.b ? [b.a,b.b] : [b.a]);
    if(braces.length<3) warn.push(`Το τερέν «${t.name}» έχει ${braces.length} ζεύγη. Χρειάζονται τουλάχιστον 3 (Άρθρο 40).`);
  });

  const hash = hashStr(day.terrains.map(t=>t.id+":"+t.braces.map(b=>b.no+b.a+(b.b||"")).join("|")).join("//")).toString(16);
  day.draw = {seed, at:new Date().toISOString(), hash, mode:mode||"ΚΛΗΡΩΣΗ",
              constraints:{avoidOwner:soft.avoidOwner,avoidKennel:soft.avoidKennel,seasonLast:soft.seasonLast}};
  trial.status = "ΚΛΗΡΩΜΕΝΟΣ";
  return {ok:true, warn};
}

      κανένας κριτής δεν κρίνει τερέν με δικό του σκύλο (Άρθρο 49).</div>
  </div>
  ${d?`<div class="card">
      <h3>Τρέχουσα κλήρωση</h3>
      <table>
        <tr><th style="position:static">Σπόρος</th><td style="text-align:left"><code>${esc(d.seed)}</code></td></tr>
        <tr><th style="position:static">Ώρα</th><td style="text-align:left">${new Date(d.at).toLocaleString("el-GR")}</td></tr>
        <tr><th style="position:static">Αποτύπωμα</th><td style="text-align:left"><code>${esc(d.hash)}</code></td></tr>
        <tr><th style="position:static">Τρόπος</th><td style="text-align:left">${esc(d.mode)}</td></tr>
      </table>
      <div class="tiny" style="margin-top:8px">Η σειρά είναι ενδεικτική (Άρθρο 16).</div>
    </div>`:`<div class="empty">Δεν έχει γίνει κλήρωση για την ημέρα αυτή.</div>`}`;
}

/* --- 8d. braces --- */
function braceCard(t, tr, b){
  const ea = t.entries.find(e=>e.id===b.a), eb = t.entries.find(e=>e.id===b.b);
  const side = (e,pos,cls)=>{
    if(!e) return `<div class="dog b none"><div class="pos">${pos}</div><div class="nm">ΜΟΝΟΣ</div>
      <button class="b-sm noprint" style="margin-top:6px" data-trailer="${tr.id}|${b.id}">+ Trailer</button></div>`;
    const d = dogById(e.dogId)||{};
    const isTrailer = b.trailer && e.id===b.b;
    return `<div class="dog ${cls}">
      <div class="pos">${pos}${isTrailer?" · TRAILER":""}</div>
      <div class="nm">${esc(d.name||"—")}</div>
      <div class="mt">${esc(d.breed||"")}${d.sex?" · "+d.sex:""}</div>
      <div class="mt">${esc(perName(e.handlerId))}</div>
      <div class="row tight noprint" style="margin-top:6px">
        <button class="b-sm" data-note="${e.id}::${b.id}">Σημειώσεις</button>
        <button class="b-sm" data-recall="${tr.id}|${e.id}">Επανάκληση</button>
        ${isTrailer?`<button class="b-sm b-warn" data-untrailer="${tr.id}|${b.id}">Αφαίρεση</button>`:""}
      </div></div>`;
  };
  const res = (id)=>{ const r=t.results[id]; return r&&r.qual&&r.qual!=="-"
      ? `<span class="chip g">${esc(r.qual)}${r.award&&r.award!=="-"?" · "+esc(r.award):""}</span>` : ""; };
  return `<div class="brace ${b.status==="ΤΡΕΧΕΙ"?"run":""} ${b.status==="ΟΛΟΚΛΗΡΩΘΗΚΕ"?"done":""} ${b.solo?"solo":""}">
    <div class="bhead">
      <div class="bno">${b.no}</div>
      <span class="chip">${esc(tr.name)}</span>
      ${b.recall?`<span class="chip y">ΕΠΑΝΑΚΛΗΣΗ</span>`:""}
      ${b.trailer?`<span class="chip n">με trailer</span>`:""}
      ${res(b.a)} ${b.b?res(b.b):""}
      <button class="b-sm noprint" data-bstat="${tr.id}|${b.id}">${b.status==="ΕΚΚΡΕΜΕΙ"?"Έναρξη":b.status==="ΤΡΕΧΕΙ"?"Λήξη":"Επαναφορά"}</button>
    </div>
    <div class="bbody">
      ${side(ea,"ΔΕΞΙΑ ΤΗΣ ΕΠΙΤΡΟΠΗΣ","a")}
      <div class="vline"></div>
      ${side(eb,"ΑΡΙΣΤΕΡΑ ΤΗΣ ΕΠΙΤΡΟΠΗΣ","b")}
    </div></div>`;
}
function tBraces(t){
  const day = t.days[S.day];
  const jf = S.judgeFilter;
  const terrains = day.terrains.filter(tr=>!jf || tr.judgeIds.includes(jf));
  if(!day.draw) return `<div class="empty">Δεν έχει γίνει κλήρωση. Πηγαίνετε στην καρτέλα «Κλήρωση».</div>`;
  return `
  <div class="row noprint" style="margin-bottom:10px">
    <div class="grow"><label>Προβολή ως κριτής (βλέπει μόνο το τερέν του)</label>
    <select data-jfilter><option value="">Πρόεδρος Κριτών — όλα τα τερέν</option>
      ${DB.judges.map(j=>`<option value="${j.id}" ${jf===j.id?"selected":""}>${esc(j.name)}</option>`).join("")}
    </select></div>
    <button class="b-sm" data-act="print" style="align-self:end">Εκτύπωση / PDF</button>
  </div>
  <div class="print-hd"><b>${esc(t.title)}</b> — ${fmtDate(day.date)} — Η σειρά είναι ενδεικτική (Άρθρο 16)</div>
  ${terrains.map(tr=>`<h3 style="margin-top:14px">${esc(tr.name)}
      <span class="muted" style="font-weight:400">· ${tr.judgeIds.map(j=>esc((judById(j)||{}).name||"?")).join(", ")}</span></h3>
    ${(tr.braces||[]).map(b=>braceCard(t,tr,b)).join("")||`<div class="empty">Χωρίς ζεύγη.</div>`}`).join("")}
  <div class="tiny" style="margin-top:12px">Άρθρο 30: ο κριτής μπορεί να ζητήσει <b>επανάκληση</b> σκύλου μεγάλης αξίας —
  προστίθεται νέα διαδρομή στο τέλος του τερέν με δικές της σημειώσεις.
  Σε μονό τουρνουά μπορεί να προστεθεί σκύλος <b>trailer</b> για να συμπληρωθεί το ζεύγος.</div>`;
}

/* --- 8e. sms --- */
/* The full running order of the day. A handler's own braces are marked so he can
   see where he sits among the others without hunting for his name. */
function orderText(t, handlerId, withJudges){
  const day = t.days[S.day], L = [];
  (day.terrains||[]).forEach(tr=>{
    L.push("▸ " + tr.name + (withJudges && tr.judgeIds.length
      ? " (" + tr.judgeIds.map(j=>(judById(j)||{}).name).filter(Boolean).join(", ") + ")" : ""));
    (tr.braces||[]).forEach(b=>{
      const a = t.entries.find(e=>e.id===b.a), c = t.entries.find(e=>e.id===b.b);
      const mine = handlerId && ((a && a.handlerId===handlerId) || (c && c.handlerId===handlerId));
      L.push((mine ? ">> " : "") + b.no + ". " + (a?dogName(a.dogId):"—") + " / " + (c?dogName(c.dogId):"ΜΟΝΟΣ")
        + (b.recall ? " (επανάκληση)" : "") + (b.trailer ? " (trailer)" : "")
        + (mine ? "  <-- ΕΣΕΙΣ" : ""));
    });
  });
  return L.join("\n");
}
function myRuns(t, handlerId){
  const out = [];
  (t.days[S.day].terrains||[]).forEach(tr=>(tr.braces||[]).forEach(b=>{
    [b.a,b.b].forEach(id=>{ const e = t.entries.find(x=>x.id===id);
      if(e && e.handlerId===handlerId) out.push({dog:dogName(e.dogId), ter:tr.name, no:b.no, recall:b.recall}); });
  }));
  return out;
}
function smsBody(t, entry){
  const st = DB.settings;
  const head = (st.sms||DEFAULT_SMS)
    .replace(/\{ΑΓΩΝΑΣ\}/g, t.title)
    .replace(/\{ΗΜΕΡΟΜΗΝΙΑ\}/g, fmtDate(t.days[S.day].date));
  const mine = myRuns(t, entry.handlerId);
  const L = [head, ""];
  L.push(mine.length===1 ? "Η διαδρομή σας:" : "Οι διαδρομές σας:");
  mine.forEach(m=>L.push("• " + m.dog + " — " + m.ter + ", ζεύγος " + m.no + "ο"
    + (m.recall ? " (επανάκληση)" : "")));
  if(st.smsMode !== "own"){
    L.push("", "ΣΕΙΡΑ ΤΗΣ ΗΜΕΡΑΣ", orderText(t, entry.handlerId, st.smsJudges));
  }
  L.push("", st.smsFoot || DEFAULT_SMS_FOOT);
  return L.join("\n");
}
/* Greek text is sent as UCS-2: 70 characters in one segment, 67 per segment
   after that. The head judge pays for these, so show him the count. */
function smsSegments(text){
  const n = text.length;
  const greek = /[^\x00-\x7F]/.test(text);
  const one = greek ? 70 : 160, more = greek ? 67 : 153;
  return n <= one ? 1 : Math.ceil(n / more);
}
function smsQueue(t){
  const day = t.days[S.day], out = [], seen = new Set();
  (day.terrains||[]).forEach(tr=>(tr.braces||[]).forEach(b=>{
    [b.a,b.b].forEach(id=>{
      const e = t.entries.find(x=>x.id===id); if(!e) return;
      const key = e.handlerId || e.id; if(seen.has(key)) return; seen.add(key);
      out.push({entry:e, phone:phoneClean((perById(e.handlerId)||{}).phone), body:smsBody(t,e)});
    });
  }));
  return out;
}
function tSms(t){
  const day = t.days[S.day];
  if(!day.draw) return `<div class="empty">Κάντε πρώτα την κλήρωση.</div>`;
  const q = smsQueue(t);
  const sent = q.filter(x=>t.sms[x.entry.id]==="ΕΣΤΑΛΗ").length;
  const segs = q.reduce((a,x)=>a+smsSegments(x.body),0);
  const st = DB.settings;
  return `
  <div class="note">Τα SMS στέλνονται από το κινητό του Προέδρου Κριτών, με τη δική του χρέωση.
   Κάθε κυναγωγός λαμβάνει ένα μήνυμα με όλες τις διαδρομές του και ολόκληρη τη σειρά της ημέρας,
   με τα δικά του ζεύγη σημειωμένα.</div>
  <div class="card">
    <div class="row tight noprint" style="margin-bottom:10px">
      <button class="tog ${st.smsMode!=="own"?"on":""}" data-set="smsModeFull">Πλήρης σειρά ημέρας</button>
      <button class="tog ${st.smsMode==="own"?"on":""}" data-set="smsModeOwn">Μόνο τα δικά του ζεύγη</button>
      <button class="tog ${st.smsJudges?"on":""}" data-set="smsJudges">Ονόματα κριτών</button>
    </div>
    <b>${sent} από ${q.length} απεσταλμένα</b>
    <div style="height:8px;background:#0000000d;border-radius:6px;margin-top:8px;overflow:hidden">
      <div style="height:100%;width:${q.length?Math.round(sent/q.length*100):0}%;background:var(--ok)"></div></div>
    <div class="tiny" style="margin-top:8px">Εκτίμηση χρέωσης: <b>${segs}</b> τμήματα SMS συνολικά
      για ${q.length} μηνύματα. ${st.smsMode!=="own"?"Η πλήρης σειρά κάνει τα μηνύματα μεγάλα — αν το κόστος είναι θέμα, επιλέξτε «Μόνο τα δικά του ζεύγη».":""}</div>
  </div>
  ${q.map((x,i)=>{
    const stt = t.sms[x.entry.id], sg = smsSegments(x.body);
    return `<div class="card">
      <div class="row"><b class="grow">${esc(perName(x.entry.handlerId))}</b>
        <span class="chip ${sg>6?"y":""}">${sg} τμήμα${sg>1?"τα":""}</span>
        ${stt==="ΕΣΤΑΛΗ"?'<span class="chip g">εστάλη</span>':'<span class="chip">εκκρεμεί</span>'}</div>
      <div class="tiny">${esc(x.phone||"— χωρίς τηλέφωνο —")}</div>
      <pre style="white-space:pre-wrap;font:400 13px/1.4 inherit;background:#00000006;padding:9px;border-radius:8px;margin:8px 0">${esc(x.body)}</pre>
      <div class="row tight noprint">
        <button class="b-act b-sm" data-sms="${i}" ${x.phone?"":"disabled"}>Αποστολή</button>
        <button class="b-sm" data-copy="${i}">Αντιγραφή</button>
        <button class="b-sm" data-wa="${i}" ${x.phone?"":"disabled"}>WhatsApp</button>
        <button class="b-sm" data-smsdone="${x.entry.id}">${stt==="ΕΣΤΑΛΗ"?"Αναίρεση":"Σήμανση ως εστάλη"}</button>
      </div></div>`;}).join("")}`;
}

/* --- 8f. results --- */
function tResults(t){
  const day = t.days[S.day];
  const rows = [];
  day.terrains.forEach(tr=>(tr.braces||[]).forEach(b=>[b.a,b.b].forEach(id=>{
    const e = t.entries.find(x=>x.id===id); if(!e) return;
    const r = t.results[e.id] || {};
    rows.push(`<tr>
      <td>${esc(dogName(e.dogId))}<div class="tiny">${esc(tr.name)} · ζεύγος ${b.no}</div></td>
      <td><select data-res="${e.id}|qual">${QUALS.map(q=>`<option ${r.qual===q?"selected":""}>${q}</option>`).join("")}</select></td>
      <td><select data-res="${e.id}|award">${AWARDS.map(a=>`<option ${r.award===a?"selected":""}>${a}</option>`).join("")}</select></td>
      <td class="num"><b>${pointsFor(t,r)}</b></td>
      <td class="noprint"><button class="b-sm" data-note="${e.id}::${b.id}">Σημειώσεις</button></td>
    </tr>`);
  })));
  if(!rows.length) return `<div class="empty">Κάντε πρώτα την κλήρωση.</div>`;
  return `<div class="note">Βάθμοι = βασικοί βαθμοί × συντελεστής ${coefficient(t)}
    (${t.format==="ΖΕΥΓΗ"?"ζεύγη":"ατομικός"}${t.wild&&(t.type==="Έρευνας Κυνηγίου"||t.type==="Πρακτικού Κυνηγίου")?", άγριο θήραμα":""}).
    Ο πίνακας βαθμών αλλάζει από τις Ρυθμίσεις.</div>
  <div class="card"><div class="scroll"><table>
    <thead><tr><th>Σκύλος</th><th>Βαθμολογία</th><th>Τίτλος</th><th>Βάθμοι</th><th class="noprint"></th></tr></thead>
    <tbody>${rows.join("")}</tbody></table></div></div>`;
}

/* --- 8g. export --- */
function tExport(t){
  return `<div class="card"><h3>Εξαγωγές αγώνα</h3>
    <div class="row tight">
      <button data-act="xlsTrial">Excel (ζωντανοί τύποι)</button>
      <button data-act="csvTrial">CSV ζευγών</button>
      <button data-act="docTrial">Word (αποτελέσματα)</button>
      <button data-act="print">Εκτύπωση / PDF</button>
    </div>
    <p class="tiny" style="margin-top:10px">Το αρχείο Excel περιέχει φύλλο «Παραμετροι» με τον πίνακα βαθμών.
      Όλοι οι βαθμοί υπολογίζονται με τύπους VLOOKUP/SUMIFS που δείχνουν εκεί — καμία σταθερή τιμή.
      Ανοίγει σε Excel και LibreOffice.</p></div>
  <div class="card"><h3>Αποστολή σειράς ζευγών ως κείμενο</h3>
    <p class="tiny">Για ομάδες WhatsApp ή Viber, την επιτροπή ή τον πίνακα ανακοινώσεων.
      Στέλνει τη σειρά σε απλό κείμενο, όχι αρχείο.</p>
    <div class="row tight">
      <button class="b-pri" data-act="shareDraw">Κοινή χρήση</button>
      <button data-act="waDraw">WhatsApp</button>
      <button data-act="viberDraw">Viber</button>
      <button data-act="smsDraw">SMS</button>
      <button data-act="mailDraw">Email</button>
    </div></div>

  <div class="card"><h3>Αποστολή αγώνα σε άλλη συσκευή</h3>
    <p class="tiny">Στέλνει μόνο αυτόν τον αγώνα, με τους σκύλους και τα πρόσωπά του — μικρό αρχείο.
      Στην άλλη συσκευή: Ρυθμίσεις → Φόρτωση αρχείου → Συγχώνευση.</p>
    <div class="row tight">
      <button class="b-pri" data-act="shareTrial">Αποστολή αγώνα</button>
      <button data-act="backup">Λήψη πλήρους αντιγράφου</button>
      <button data-act="restore">Φόρτωση αρχείου</button>
    </div></div>`;
}
</script>

<script>
/* ---------- 9. Registry -------------------------------------------------- */
function vRegistry(){
  const dogs = DB.dogs.slice().sort((a,b)=>a.name.localeCompare(b.name,"el"));
  return `
  <div class="row" style="margin-bottom:10px">
    <div class="grow"><label>Αναζήτηση σκύλου</label><input id="q" placeholder="όνομα, αρ. Κ.Ο.Κ., εκτροφείο" oninput="filterDogs(this.value)"></div>
  </div>
  <div class="card"><div class="scroll"><table id="dogTbl">
    <thead><tr><th>Σκύλος</th><th>Φυλή</th><th>Ιδιοκτήτης</th><th class="noprint"></th></tr></thead>
    <tbody>${dogs.map(d=>`<tr data-name="${esc((d.name+" "+(d.reg||"")+" "+(d.kennel||"")).toLowerCase())}">
      <td>${esc(d.name)}<div class="tiny">${esc(d.reg||"")} ${d.sex?"· "+d.sex:""} ${d.cy?"· κυπριακής εκτροφής":""}</div></td>

        <button class="b-sm" data-editdog="${d.id}">Επεξ.</button></td></tr>`).join("")
      || `<tr><td colspan="4" class="empty">Κανένας σκύλος στο μητρώο.</td></tr>`}
    </tbody></table></div></div>

  <div class="split">
    <div class="card"><h3>Πρόσωπα (ιδιοκτήτες / κυναγωγοί)</h3>
      ${DB.people.map(p=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)">
        <div class="grow"><b>${esc(p.name)}</b><div class="tiny">${esc(p.phone||"— χωρίς τηλέφωνο —")}</div></div>
        <button class="b-sm" data-editperson="${p.id}">Επεξ.</button></div>`).join("")||`<div class="muted">Κανένα.</div>`}</div>
    <div class="card"><h3>Κριτές</h3>
      ${DB.judges.map(j=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)">

        <button class="b-sm" data-editjudge="${j.id}">Επεξ.</button></div>`).join("")||`<div class="muted">Κανένας.</div>`}</div>
  </div>
  <div class="card"><h3>Εισαγωγή μητρώου σκύλων</h3>
    <p class="tiny">Δεκτά αρχεία: Excel (.xlsx), Word (.docx, από πίνακα) και CSV. Μετά την επιλογή
      του αρχείου θα αντιστοιχίσετε μόνοι σας ποια στήλη είναι τι — δεν χρειάζεται συγκεκριμένη σειρά
      στηλών. Οι σκύλοι που υπάρχουν ήδη ενημερώνονται αντί να διπλογραφούν.</p>
    <button class="b-pri" data-act="importDogs">Επιλογή αρχείου Excel / Word / CSV</button></div>`;
}
function filterDogs(v){
  v = (v||"").toLowerCase();
  document.querySelectorAll("#dogTbl tbody tr").forEach(tr=>{
    tr.style.display = !v || (tr.dataset.name||"").includes(v) ? "" : "none";
  });
}

/* ---------- 10. Dog history --------------------------------------------- */
function vDog(){
  const d = dogById(S.dogId); if(!d){ S.view="registry"; return vRegistry(); }
  const hist = [];
  DB.trials.forEach(t=>{
    const e = t.entries.find(x=>x.dogId===d.id); if(!e) return;
    let ter="—", no="—";
    t.days.forEach(day=>day.terrains.forEach(tr=>(tr.braces||[]).forEach(b=>{
      if(b.a===e.id||b.b===e.id){ ter=tr.name; no=b.no; }})));
    const r = t.results[e.id]||{};
    const notes = {};
    Object.keys(t.notes||{}).forEach(k=>{
      if(k === e.id || k.startsWith(e.id + "::"))
        Object.entries(t.notes[k]).forEach(([jid,n])=>{ notes[jid + "|" + k] = n; });
    });
    hist.push({t, ter, no, r, notes});
  });
  hist.sort((a,b)=>(b.t.dateStart||"").localeCompare(a.t.dateStart||""));
  const total = hist.reduce((s,h)=>s+pointsFor(h.t,h.r),0);
  return `
  <button class="b-sm noprint" data-nav="registry">‹ Μητρώο</button>
  <h1 style="margin-top:8px">${esc(d.name)}</h1>
  <div class="muted">${esc(d.breed||"")} ${d.sex?"· "+d.sex:""} ${d.dob?"· γενν. "+fmtDate(d.dob):""}
    ${d.reg?"· Κ.Ο.Κ. "+esc(d.reg):""}${d.kennel?" · "+esc(d.kennel):""}</div>
  <div class="muted">Ιδιοκτήτης: ${esc(perName(d.ownerId))}${d.cy?" · κυπριακής εκτροφής":""}</div>
  <div class="card" style="margin-top:12px"><b>${hist.length}</b> συμμετοχές · <b class="num">${total}</b> συνολικοί βάθμοι</div>
  ${hist.map(h=>`<div class="card">
    <div class="row"><b class="grow">${esc(h.t.title)}</b><span class="chip n">${fmtDate(h.t.dateStart)}</span></div>
    <div class="muted">${esc(h.t.type)} · ${esc(h.ter)} · ζεύγος ${h.no}</div>
    <div class="row tight" style="margin-top:6px">
      ${h.r.qual&&h.r.qual!=="-"?`<span class="chip g">${esc(h.r.qual)}</span>`:`<span class="chip">χωρίς βαθμολογία</span>`}
      ${h.r.award&&h.r.award!=="-"?`<span class="chip y">${esc(h.r.award)}</span>`:""}
      <span class="chip num">${pointsFor(h.t,h.r)} βάθμοι</span></div>
    ${Object.entries(h.notes).map(([k,n])=>`<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">
      <div class="tiny"><b>${esc((judById(k.split("|")[0])||{}).name||"Κριτής")}</b></div>
      ${noteSummary(n)}</div>`).join("")}
  </div>`).join("")||`<div class="empty">Καμία συμμετοχή καταγεγραμμένη.</div>`}`;
}
function noteSummary(n){
  const bits=[];
  if(n.passion) bits.push("Πάθος "+n.passion+"/5");
  if(n.width)   bits.push("Έρευνα: "+n.width);
  if(n.method)  bits.push("Μεθοδικότητα "+n.method+"/5");
  if(n.style)   bits.push("Στυλ "+n.style+"/5");
  if(n.contact) bits.push("Επαφή "+n.contact+"/5");
  if(n.whites)  bits.push("Λευκές φέρμες: "+n.whites);
  const pts = (n.points||[]).length ? `<div class="tiny">Πόντοι: ${(n.points||[]).map(p=>
      esc([p.game,p.quality,p.ferma,p.akinF].filter(Boolean).join(" / "))).join(" · ")}</div>` : "";
  const f = (n.faults||[]).length ? `<div class="tiny" style="color:var(--bad)">Σφάλματα: ${esc(n.faults.join(", "))}</div>` : "";
  return `<div class="tiny">${esc(bits.join(" · "))||"—"}</div>${pts}${f}
    ${n.text?`<div class="tiny" style="margin-top:4px">«${esc(n.text)}»</div>`:""}`;
}

/* ---------- 11. Stats matrix -------------------------------------------- */
function vStats(){
  const trials = DB.trials.slice().sort((a,b)=>(a.dateStart||"").localeCompare(b.dateStart||""));
  const map = {};                       // dogId -> trialId -> points
  trials.forEach(t=>t.entries.forEach(e=>{
    const r = t.results[e.id]; if(!r) return;
    (map[e.dogId] = map[e.dogId]||{})[t.id] = pointsFor(t,r);
  }));
  const dogIds = Object.keys(map).sort((a,b)=>dogName(a).localeCompare(dogName(b),"el"));
  if(!dogIds.length) return `<div class="empty"><h2>Χωρίς αποτελέσματα ακόμη</h2>
    <p class="muted">Ο πίνακας γεμίζει μόλις βαθμολογηθεί ο πρώτος αγώνας.</p></div>`;
  const rows = dogIds.map(id=>{
    const tot = trials.reduce((s,t)=>s+(map[id][t.id]||0),0);
    return `<tr><td>${esc(dogName(id))}<div class="tiny">${esc((dogById(id)||{}).breed||"")}</div></td>
      ${trials.map(t=>{const v=map[id][t.id];
        return `<td class="n ${v?"":"z"} num">${v!==undefined?v:"·"}</td>`;}).join("")}
      <td class="tot n num">${tot}</td></tr>`;
  }).join("");
  const totRow = `<tr><td><b>Σύνολο</b></td>${trials.map(t=>{
      const s = dogIds.reduce((a,id)=>a+(map[id][t.id]||0),0);
      return `<td class="tot n num">${s}</td>`;}).join("")}
      <td class="tot n num">${dogIds.reduce((a,id)=>a+trials.reduce((s,t)=>s+(map[id][t.id]||0),0),0)}</td></tr>`;
  return `
  <div class="row" style="margin-bottom:10px"><h1 class="grow">Στατιστικά σεζόν</h1>
    <button class="b-sm" data-act="xlsStats">Excel</button>
    <button class="b-sm" data-act="print">Εκτύπωση</button></div>
  <div class="note">Σκύλοι στις γραμμές, αγώνες στις στήλες. Το κελί δείχνει τους βαθμούς που πήρε ο σκύλος
    στον συγκεκριμένο αγώνα (βασικοί βαθμοί × συντελεστής αγώνα).</div>
  <div class="card"><div class="scroll"><table class="matrix">
    <thead><tr><th style="min-width:150px">Σκύλος</th>
      ${trials.map(t=>`<th class="v">${esc(t.title)} — ${fmtDate(t.dateStart)}</th>`).join("")}
      <th class="v">ΣΥΝΟΛΟ</th></tr></thead>
    <tbody>${rows}${totRow}</tbody></table></div></div>`;
}

/* ---------- 14. Exports -------------------------------------------------- */
function xmlEsc(s){ return esc(s); }
function cell(v, formula, type){
  if(formula) return `<Cell ss:Formula="${xmlEsc(formula)}"><Data ss:Type="Number"></Data></Cell>`;
  const t = type || (typeof v === "number" ? "Number" : "String");
  return `<Cell><Data ss:Type="${t}">${xmlEsc(v??"")}</Data></Cell>`;
}
function row(cells){ return `<Row>${cells.join("")}</Row>`; }
function sheet(name, rows){ return `<Worksheet ss:Name="${xmlEsc(name)}"><Table>${rows.join("")}</Table></Worksheet>`; }
function workbook(sheets){
  return `<?xml version="1.0" encoding="UTF-8"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Styles><Style ss:ID="h"><Font ss:Bold="1"/></Style></Styles>
${sheets.join("")}</Workbook>`;
}
function paramSheet(){
  const keys = Object.keys(DB.settings.points).filter(k=>k!=="-");
  return sheet("Παραμετροι", [row([cell("Κλειδι"),cell("Βασικοι βαθμοι")])]
    .concat(keys.map(k=>row([cell(k),cell(DB.settings.points[k])]))));
}
function flatData(trials){
  const rows = [row([cell("Σκυλος"),cell("Φυλη"),cell("Αγωνας"),cell("Ημερομηνια"),cell("Ειδος"),
                     cell("Βαθμολογια"),cell("Τιτλος"),cell("Κλειδι"),cell("Συντελεστης"),cell("Βαθμοι")])];
  trials.forEach(t=>t.entries.forEach(e=>{
    const r = t.results[e.id]; if(!r) return;
    const d = dogById(e.dogId)||{};
    rows.push(row([cell(d.name||""),cell(d.breed||""),cell(t.title),cell(t.dateStart||""),cell(t.type),
      cell(r.qual||"-"),cell(r.award||"-"),
      cell(null,'=IF(RC[-1]<>"-",RC[-1],RC[-2])'),
      cell(coefficient(t)),
      cell(null,'=IFERROR(VLOOKUP(RC[-2],Παραμετροι!R2C1:R40C2,2,FALSE)*RC[-1],0)')]));
  }));
  return sheet("Δεδομενα", rows);
}
function statsSheet(trials){
  const dogIds = [];
  trials.forEach(t=>t.entries.forEach(e=>{ if(t.results[e.id] && !dogIds.includes(e.dogId)) dogIds.push(e.dogId); }));
  const head = row([cell("Σκυλος")].concat(trials.map(t=>cell(t.title))).concat([cell("ΣΥΝΟΛΟ")]));
  const rows = dogIds.map(id=>{
    const cells = [cell(dogName(id))];
    trials.forEach(()=>cells.push(cell(null,'=SUMIFS(Δεδομενα!C10,Δεδομενα!C1,RC1,Δεδομενα!C3,R1C)')));
    cells.push(cell(null,`=SUM(RC[-${trials.length}]:RC[-1])`));
    return row(cells);
  });
  return sheet("Στατιστικα", [head].concat(rows));
}
function bracesSheet(t){
  const rows = [row([cell("Τερεν"),cell("Ζευγος"),cell("Σκυλος δεξια"),cell("Σκυλος αριστερα"),
                     cell("Κυναγωγος δεξια"),cell("Κυναγωγος αριστερα"),cell("Κριτες")])];
  t.days.forEach(day=>day.terrains.forEach(tr=>(tr.braces||[]).forEach(b=>{
    const ea=t.entries.find(e=>e.id===b.a), eb=t.entries.find(e=>e.id===b.b);
    rows.push(row([cell(tr.name),cell(b.no),cell(ea?dogName(ea.dogId):""),cell(eb?dogName(eb.dogId):"ΜΟΝΟΣ"),
      cell(ea?perName(ea.handlerId):""),cell(eb?perName(eb.handlerId):""),
      cell(tr.judgeIds.map(j=>(judById(j)||{}).name).join(", "))]));
  })));
  return sheet("Ζευγη", rows);
}
function exportTrialXls(t){
  download(`KOAD_${t.title.replace(/\s+/g,"_")}.xls`, "application/vnd.ms-excel",
    workbook([bracesSheet(t), flatData([t]), paramSheet(), statsSheet([t])]));
  toast("Το αρχείο Excel κατέβηκε");
}
function exportStatsXls(){
  const trials = DB.trials.slice().sort((a,b)=>(a.dateStart||"").localeCompare(b.dateStart||""));
  download("KOAD_Statistika.xls","application/vnd.ms-excel",
    workbook([flatData(trials), paramSheet(), statsSheet(trials)]));
  toast("Το αρχείο Excel κατέβηκε");
}
function exportTrialCsv(t){
  const lines = [["Τερέν","Ζεύγος","Δεξιά","Αριστερά","Κυναγωγός Δ","Κυναγωγός Α"].join(";")];
  t.days.forEach(day=>day.terrains.forEach(tr=>(tr.braces||[]).forEach(b=>{
    const ea=t.entries.find(e=>e.id===b.a), eb=t.entries.find(e=>e.id===b.b);
    lines.push([tr.name,b.no,ea?dogName(ea.dogId):"",eb?dogName(eb.dogId):"ΜΟΝΟΣ",
      ea?perName(ea.handlerId):"",eb?perName(eb.handlerId):""].join(";"));
  })));
  download(`KOAD_${t.title.replace(/\s+/g,"_")}.csv`,"text/csv","\uFEFF"+lines.join("\n"));
}
function exportTrialDoc(t){
  const rows = [];
  t.days.forEach(day=>day.terrains.forEach(tr=>(tr.braces||[]).forEach(b=>[b.a,b.b].forEach(id=>{
    const e = t.entries.find(x=>x.id===id); if(!e) return;
    const r = t.results[e.id]||{};
    rows.push(`<tr><td>${esc(tr.name)}</td><td>${b.no}</td><td>${esc(dogName(e.dogId))}</td>
      <td>${esc(perName(e.handlerId))}</td><td>${esc(r.qual||"-")}</td><td>${esc(r.award||"-")}</td>
      <td>${pointsFor(t,r)}</td></tr>`);
  }))));
  const html = `<html><head><meta charset="utf-8"></head><body style="font-family:Calibri">
    <h2>ΚΥΠΡΙΑΚΟΣ ΟΜΙΛΟΣ ΑΓΓΛΙΚΩΝ ΔΕΙΚΤΩΝ</h2>
    <h3>${esc(t.title)}</h3>
    <p>${esc(t.type)} · ${fmtDate(t.dateStart)} · ${esc(t.place||"")} · Θήραμα: ${esc(t.game||"")}</p>
    <table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse;font-size:11pt">
    <tr><th>Τερέν</th><th>Ζεύγος</th><th>Σκύλος</th><th>Κυναγωγός</th><th>Βαθμολογία</th><th>Τίτλος</th><th>Βάθμοι</th></tr>
    ${rows.join("")}</table>
    <p style="font-size:9pt">Η σειρά είναι ενδεικτική (Άρθρο 16).</p></body></html>`;
  download(`KOAD_${t.title.replace(/\s+/g,"_")}.doc`,"application/msword",html);
}

/* ---------- 15. Actions -------------------------------------------------- */
document.addEventListener("click", ev=>{
  const el2 = ev.target.closest("[data-nav],[data-tab],[data-day],[data-act],[data-open],[data-dog],[data-editdog],[data-editperson],[data-editjudge],[data-editterrain],[data-editentry],[data-note],[data-res],[data-bstat],[data-trailer],[data-untrailer],[data-recall],[data-sms],[data-copy],[data-wa],[data-smsdone],[data-set],[data-tj],[data-nstep],[data-nwidth],[data-nfault],[data-delpt]");
  if(!el2) return;
  const d = el2.dataset;
  const t = trialById(S.trialId);

  if(d.nav){ S.view=d.nav; S.trialId=null; render(); return; }
  if(d.tab){ S.tab=d.tab; render(); return; }
  if(d.day!==undefined && d.day!==""){ S.day=+d.day; render(); return; }
  if(d.open){ S.view="trial"; S.trialId=d.open; S.tab="entries"; S.day=0; render(); return; }
  if(d.dog){ S.view="dog"; S.dogId=d.dog; render(); return; }
  if(d.editdog){ dlgDog(dogById(d.editdog)); return; }
  if(d.editperson){ dlgPerson(perById(d.editperson)); return; }
  if(d.editjudge){ dlgJudge(judById(d.editjudge)); return; }
  if(d.editterrain){ dlgTerrain(t, t.days[S.day].terrains.find(x=>x.id===d.editterrain)); return; }
  if(d.editentry){ dlgEntry(t, t.entries.find(x=>x.id===d.editentry)); return; }
  if(d.note){ dlgNote(t, d.note); return; }

  if(d.set === "smsModeFull"){ DB.settings.smsMode = "full"; save(); render(); return; }
  if(d.set === "smsModeOwn"){  DB.settings.smsMode = "own";  save(); render(); return; }
  if(d.set){ DB.settings[d.set] = !DB.settings[d.set]; save(); render(); return; }
  if(d.tj){ el2.classList.toggle("on"); return; }
  if(d.nwidth){ document.querySelectorAll("[data-nwidth]").forEach(b=>b.classList.remove("on"));
    el2.classList.add("on"); window._note.width = d.nwidth; return; }
  if(d.nfault){ el2.classList.toggle("on");
    const f = window._note.faults || (window._note.faults=[]);
    const i = f.indexOf(d.nfault); i>=0 ? f.splice(i,1) : f.push(d.nfault); return; }
  if(d.nstep){ const [k,delta] = d.nstep.split("|");
    const max = k==="whites" ? 9 : 5;
    window._note[k] = Math.max(0, Math.min(max, (window._note[k]||0) + (+delta)));
    el("v_"+k).textContent = window._note[k]; return; }
  if(d.delpt){ window._note.points.splice(+d.delpt,1); redrawPoints(); return; }

  if(d.bstat){ const [tid,bid] = d.bstat.split("|");
    const tr = t.days[S.day].terrains.find(x=>x.id===tid);
    const b = tr.braces.find(x=>x.id===bid);
    if(b){ b.status = b.status==="ΕΚΚΡΕΜΕΙ" ? "ΤΡΕΧΕΙ" : b.status==="ΤΡΕΧΕΙ" ? "ΟΛΟΚΛΗΡΩΘΗΚΕ" : "ΕΚΚΡΕΜΕΙ";
      save(); render(); }
    return; }

  if(d.trailer){ const [tid,bid] = d.trailer.split("|"); dlgTrailer(t, tid, bid); return; }

  if(d.untrailer){ const [tid,bid] = d.untrailer.split("|");
    const tr = t.days[S.day].terrains.find(x=>x.id===tid);
    const b = tr.braces.find(x=>x.id===bid);
    if(b){ b.b = null; b.solo = true; b.trailer = false; save(); render(); }
    return; }

  if(d.recall){                                  // Άρθρο 30 — επανάκληση
    const [tid,eid] = d.recall.split("|");
    const tr = t.days[S.day].terrains.find(x=>x.id===tid);
    if(!tr) return;
    if(!confirmAct("Επανάκληση του σκύλου; Θα προστεθεί νέα διαδρομή στο τέλος του τερέν.")) return;
    tr.braces.push({id:uid(), no:tr.braces.length+1, a:eid, b:null, solo:true,
                    recall:true, status:"ΕΚΚΡΕΜΕΙ"});
    save(); render(); toast("Προστέθηκε επανάκληση");
    return; }

  if(d.sms!==undefined && el2.hasAttribute("data-sms")){
    const x = smsQueue(t)[+d.sms];
    location.href = `sms:${x.phone}?&body=${encodeURIComponent(x.body)}`;
    t.sms[x.entry.id] = "ΕΣΤΑΛΗ"; save(); setTimeout(render,600); return; }
  if(d.copy!==undefined && el2.hasAttribute("data-copy")){
    const x = smsQueue(t)[+d.copy];
    navigator.clipboard.writeText(x.body).then(()=>toast("Αντιγράφηκε")); return; }
  if(d.wa!==undefined && el2.hasAttribute("data-wa")){
    const x = smsQueue(t)[+d.wa];
    window.open(`https://wa.me/${x.phone.replace(/\D/g,"")}?text=${encodeURIComponent(x.body)}`,"_blank"); return; }
  if(d.smsdone){ t.sms[d.smsdone] = t.sms[d.smsdone]==="ΕΣΤΑΛΗ" ? "" : "ΕΣΤΑΛΗ"; save(); render(); return; }

  ACT[d.act] && ACT[d.act](el2, t);
});

document.addEventListener("change", ev=>{
  const t = trialById(S.trialId);
  const r = ev.target.dataset.res;
  if(r && t){ const [eid,f] = r.split("|");
    t.results[eid] = t.results[eid] || {qual:"-",award:"-"};
    t.results[eid][f] = ev.target.value; save(); render(); return; }
  const p = ev.target.dataset.pt;
  if(p && p.includes("|") && window._note){ const [i,f] = p.split("|");
    window._note.points[+i][f] = ev.target.value; return; }
  if(ev.target.id==="e_dog"){                       // οίστρος applies to bitches only
    const dg = dogById(ev.target.value) || {};
    const rowEl = el("e_seasonRow"); if(rowEl) rowEl.style.display = dg.sex==="Θ" ? "flex" : "none";
    const h = el("e_handler"); if(h && !h.value && dg.ownerId) h.value = dg.ownerId;
    return; }
  if(ev.target.id==="d_owner"){                     // prefill owner details in the dog screen
    const p = perById(ev.target.value) || {};
    el("d_ownerName").value = p.name || ""; el("d_ownerPhone").value = p.phone || "";
    return; }
  if(ev.target.dataset.jfilter!==undefined){ S.judgeFilter = ev.target.value; render(); return; }
});

function redrawPoints(){
  el("ptList").innerHTML = (window._note.points||[]).map((p,i)=>ptRow(p,i)).join("")||`<div class="muted">Κανένας πόντος.</div>`;
}

const ACT = {
  close: ()=>closeDlg(),
  print: ()=>window.print(),
  newTrial: ()=>dlgTrial(),
  newDog: ()=>dlgDog(),
  newPerson: ()=>dlgPerson(),
  newJudge: ()=>dlgJudge(),
  addTerrain: (e,t)=>dlgTerrain(t),
  addEntry: (e,t)=>{ if(!DB.dogs.length) return toast("Προσθέστε πρώτα σκύλο («+ Νέος σκύλος») ή εισαγάγετε αρχείο"); dlgEntry(t); },
  addPoint: ()=>{ (window._note.points = window._note.points||[]).push({}); redrawPoints(); },

  saveTrial: (btn)=>{
    const id = btn.dataset.id;
    const nDays = Math.max(1, +el("t_days").value || 1);
    let t = id ? trialById(id) : null;
    const base = {
      title: el("t_title").value.trim() || "Αγώνας",
      type: el("t_type").value,
      format: el("t_type").value==="Μεγάλης Έρευνας" ? "ΖΕΥΓΗ" : el("t_format").value,
      game: el("t_game").value.trim(),
      wild: el("t_wild").value==="1",
      award: el("t_award").value,
      place: el("t_place").value.trim(),
      dateStart: el("t_d1").value
    };
    if(!t){
      t = {id:uid(), ...base, status:"ΔΗΛΩΣΕΙΣ", entries:[], results:{}, notes:{}, sms:{}, days:[]};
      DB.trials.push(t);
    } else Object.assign(t, base);
    while(t.days.length < nDays){
      const dt = new Date(base.dateStart); dt.setDate(dt.getDate()+t.days.length);
      t.days.push({date: dt.toISOString().slice(0,10), terrains:[], draw:null});
    }
    t.days.length = nDays;
    save(); closeDlg(); S.view="trial"; S.trialId=t.id; S.day=0; render();
  },
  delTrial: (btn)=>{ if(!confirmAct("Οριστική διαγραφή του αγώνα και των αποτελεσμάτων του;")) return;
    DB.trials = DB.trials.filter(x=>x.id!==btn.dataset.id); save(); closeDlg(); S.view="trials"; render(); },

  saveDog: (btn)=>{
    const id = btn.dataset.id;
    const o = {name:el("d_name").value.trim(), breed:el("d_breed").value, sex:el("d_sex").value,
      reg:el("d_reg").value.trim(), chip:el("d_chip").value.trim(), book:el("d_book").value.trim(),
      dob:el("d_dob").value, kennel:el("d_kennel").value.trim(),
      cy:el("d_cy").value==="1"};
    if(!o.name) return toast("Το όνομα του σκύλου είναι υποχρεωτικό");
    /* owner is created or updated from the same screen */
    let ownerId = el("d_owner").value;
    const on = el("d_ownerName").value.trim(), op = el("d_ownerPhone").value.trim();
    if(ownerId){ const p = perById(ownerId); if(p){ if(on) p.name = on; if(op) p.phone = op; } }
    else if(on){ ownerId = ensurePerson(on, op); }
    o.ownerId = ownerId || "";
    if(id) Object.assign(dogById(id), o); else DB.dogs.push({id:uid(), ...o});
    save(); closeDlg(); render();
  },
  delDog: (btn)=>{ if(!confirmAct("Διαγραφή σκύλου από το μητρώο;")) return;
    DB.dogs = DB.dogs.filter(x=>x.id!==btn.dataset.id); save(); closeDlg(); render(); },

  savePerson: (btn)=>{
    const id = btn.dataset.id;
    const o = {name:el("p_name").value.trim(), phone:el("p_phone").value.trim(), member:el("p_member").value.trim()};
    if(!o.name) return toast("Το ονοματεπώνυμο είναι υποχρεωτικό");
    if(id) Object.assign(perById(id), o); else DB.people.push({id:uid(), ...o});
    save(); closeDlg(); render();
  },
  saveJudge: (btn)=>{
    const id = btn.dataset.id;
    const o = {name:el("j_name").value.trim(), licence:el("j_lic").value,
               me:el("j_me").value==="1", personId:el("j_person").value};
    if(!o.name) return toast("Το ονοματεπώνυμο είναι υποχρεωτικό");
    if(id) Object.assign(judById(id), o); else DB.judges.push({id:uid(), ...o});
    save(); closeDlg(); render();
  },
  saveTerrain: (btn, t)=>{
    const id = btn.dataset.id;
    const judgeIds = [...document.querySelectorAll("[data-tj].on")].map(b=>b.dataset.tj);
    const o = {name:el("tr_name").value.trim(), breedGroup:el("tr_bg").value, judgeIds};
    const day = t.days[S.day];
    if(id) Object.assign(day.terrains.find(x=>x.id===id), o);
    else day.terrains.push({id:uid(), entryIds:[], braces:[], ...o});
    save(); closeDlg(); render();
  },
  delTerrain: (btn, t)=>{ if(!confirmAct("Διαγραφή τερέν;")) return;
    const day = t.days[S.day];
    day.terrains = day.terrains.filter(x=>x.id!==btn.dataset.id); save(); closeDlg(); render(); },

  saveEntry: (btn, t)=>{

    const o = {dogId:el("e_dog").value, handlerId:el("e_handler").value, status:el("e_status").value,
               paid:el("e_paid").value==="1",
               season: dg.sex === "Θ" && el("e_season").value === "1"};
    if(id) Object.assign(t.entries.find(x=>x.id===id), o); else t.entries.push({id:uid(), ...o});

  },
  delEntry: (btn, t)=>{ t.entries = t.entries.filter(x=>x.id!==btn.dataset.id); save(); closeDlg(); render(); },

  saveNote: (btn, t)=>{
    const i = btn.dataset.id.lastIndexOf("|");

    const seed = (el("seedIn")||{}).value || "";
    const mode = (el("drawMode")||{}).value || "ΚΛΗΡΩΣΗ";
    const r = runDraw(t, S.day, seed.trim(), mode);
    if(r.error){ alert(r.error); return; }
    save(); S.tab="braces"; render();
    if(r.warn && r.warn.length) setTimeout(()=>alert("Προσοχή:\n\n"+r.warn.join("\n")), 400);
    else toast("Η κλήρωση ολοκληρώθηκε");
  },

  smsAll: (btn, t)=>{
    const q = smsQueue(t).filter(x=>t.sms[x.entry.id]!=="ΕΣΤΑΛΗ" && x.phone);
    if(!q.length) return toast("Δεν εκκρεμούν μηνύματα");
    const x = q[0];
    location.href = `sms:${x.phone}?&body=${encodeURIComponent(x.body)}`;
    t.sms[x.entry.id] = "ΕΣΤΑΛΗ"; save(); setTimeout(render,600);

    if(!e){ e = {id:uid(), dogId, handlerId:el("tl_handler").value||"", status:"ΣΥΜΠΛΗΡΩΜΑΤΙΚΟΣ",
                 paid:false, season:false}; t.entries.push(e); }
    else if(el("tl_handler").value) e.handlerId = el("tl_handler").value;
    b.b = e.id; b.solo = false; b.trailer = true;
    save(); closeDlg(); render(); toast("Ο trailer προστέθηκε");
  },
  xlsTrial: (b,t)=>exportTrialXls(t),
  csvTrial: (b,t)=>exportTrialCsv(t),
  docTrial: (b,t)=>exportTrialDoc(t),
  xlsStats: ()=>exportStatsXls(),

  saveSms: ()=>{ DB.settings.sms = el("smsTpl").value;
    DB.settings.smsFoot = el("smsFoot").value; save(); toast("Αποθηκεύτηκε"); },
  savePoints: ()=>{ document.querySelectorAll("[data-pt]").forEach(i=>{
      if(i.dataset.pt && i.type==="number") DB.settings.points[i.dataset.pt] = +i.value||0; });
    save(); toast("Ο πίνακας βαθμών αποθηκεύτηκε"); },
  resetPoints: ()=>{ DB.settings.points = {...DEFAULT_POINTS}; save(); render(); toast("Επαναφορά κανονισμού"); },

  backup: ()=>download(`KOAD_${today()}.json`,"application/json",JSON.stringify(DB,null,1)),
  backupReg: ()=>download(`KOAD_mitroo_${today()}.json`,"application/json",
    JSON.stringify({v:1, people:DB.people, judges:DB.judges, dogs:DB.dogs, trials:[], settings:DB.settings},null,1)),
  restore: ()=>{
    const i = document.createElement("input"); i.type="file"; i.accept=".json,application/json";
    i.onchange = () => { const f=i.files[0]; if(!f) return;
